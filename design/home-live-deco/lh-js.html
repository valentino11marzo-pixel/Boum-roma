<script>
/* ══════════════════════════════════════════════════════════════════════════
   BOOM · LA HOME — la regia del sito live, rieseguita.

   Gli organi sono quelli che la pagina live ha già (bagliore del mouse,
   filo del progresso, storia pinnata) più i Solari dove un numero merita
   la meccanica: DAYS nel titolo e i canoni delle tre case. Ogni movimento
   insegna qualcosa; fuori vista tutto si ferma; reduced-motion mostra
   stati completi.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var R = document.documentElement;
  var ridotto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  var BS = window.BoomSolari;
  R.classList.add('vivo');

  /* ── il marchio del piede: clonato dalla testata, una fonte sola ─────── */
  (function () {
    var vero = document.querySelector('.nav .logo-mark');
    var slot = document.getElementById('logoPiede');
    if (!vero || !slot) return;
    var c = vero.cloneNode(true);
    c.removeAttribute('class'); c.setAttribute('aria-hidden', 'true');
    slot.replaceWith(c);
  })();

  /* ── testata + filo del progresso: un solo ascoltatore ───────────────── */
  (function () {
    var nav = document.getElementById('nav');
    var filo = document.getElementById('scrollProgress');
    var atteso = false;
    function guarda() {
      atteso = false;
      var h = document.scrollingElement || document.documentElement;
      if (nav) nav.classList.toggle('scrolled', h.scrollTop > 24);
      if (filo) {
        var tot = h.scrollHeight - innerHeight;
        filo.style.transform = 'scaleX(' + (tot > 0 ? h.scrollTop / tot : 0) + ')';
      }
    }
    addEventListener('scroll', function () {
      if (!atteso) { atteso = true; requestAnimationFrame(guarda); }
    }, { passive: true });
    guarda();
  })();

  /* ── il bagliore del mouse (come sul live, solo su puntatore fine) ───── */
  (function () {
    var glow = document.getElementById('mouseGlow');
    if (!glow || !fine || ridotto) return;
    var t;
    document.addEventListener('mousemove', function (e) {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
      glow.classList.add('active');
      clearTimeout(t);
      t = setTimeout(function () { glow.classList.remove('active'); }, 1500);
    }, { passive: true });
    document.addEventListener('mouseleave', function () { glow.classList.remove('active'); });
  })();

  /* ── la tenda del telefono ───────────────────────────────────────────── */
  (function () {
    var apri = document.getElementById('apri');
    var tenda = document.getElementById('tenda');
    if (!apri || !tenda) return;
    function chiudi() {
      R.classList.remove('aperto');
      apri.setAttribute('aria-expanded', 'false');
      apri.setAttribute('aria-label', 'Open menu');
      document.body.style.overflow = '';
    }
    apri.addEventListener('click', function () {
      var ap = !R.classList.contains('aperto');
      R.classList.toggle('aperto', ap);
      apri.setAttribute('aria-expanded', ap ? 'true' : 'false');
      apri.setAttribute('aria-label', ap ? 'Close menu' : 'Open menu');
      document.body.style.overflow = ap ? 'hidden' : '';
    });
    [].forEach.call(tenda.querySelectorAll('a'), function (a) { a.addEventListener('click', chiudi); });
    addEventListener('keydown', function (e) { if (e.key === 'Escape') chiudi(); });
  })();

  /* ── le entrate: una volta sola, con rete di sicurezza ───────────────── */
  (function () {
    var voci = [].slice.call(document.querySelectorAll('.sale'));
    if (ridotto || !('IntersectionObserver' in window)) {
      voci.forEach(function (v) { v.classList.add('dentro'); }); return;
    }
    var occhio = new IntersectionObserver(function (righe) {
      righe.forEach(function (r, i) {
        if (!r.isIntersecting) return;
        var el = r.target; occhio.unobserve(el);
        setTimeout(function () { el.classList.add('dentro'); }, i * 70);
      });
    }, { rootMargin: '0px 0px -10% 0px', threshold: .06 });
    voci.forEach(function (v) { occhio.observe(v); });
    setTimeout(function () { voci.forEach(function (v) { v.classList.add('dentro'); }); }, 4500);
  })();

  /* ── i contatori: i numeri del sito, che salgono davanti a chi legge ─── */
  function conta(el) {
    var fine_ = +el.dataset.fine, suff = el.dataset.suff || '';
    if (ridotto) { el.textContent = fine_ + suff; return; }
    var t0 = 0;
    function su(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / 1100);
      el.textContent = Math.round(fine_ * (1 - Math.pow(1 - p, 3))) + suff;
      if (p < 1) requestAnimationFrame(su);
    }
    requestAnimationFrame(su);
  }
  (function () {
    var gruppi = ['heroStats', 'pfBanco', 'aboutNum'];
    if (!('IntersectionObserver' in window)) {
      gruppi.forEach(function (id) {
        var g = document.getElementById(id); if (!g) return;
        [].forEach.call(g.querySelectorAll('[data-fine]'), function (el) {
          el.textContent = el.dataset.fine + (el.dataset.suff || '');
        });
      });
      return;
    }
    gruppi.forEach(function (id) {
      var g = document.getElementById(id); if (!g) return;
      new IntersectionObserver(function (r, io) {
        if (!r[0].isIntersecting) return;
        io.disconnect();
        [].forEach.call(g.querySelectorAll('[data-fine]'), conta);
        /* le spunte del property finding si incidono in fila */
        if (id === 'pfBanco') {
          [].forEach.call(document.querySelectorAll('#pfLista .pf-voce'), function (v, i) {
            setTimeout(function () { v.classList.add('vista'); }, 200 + i * 140);
          });
        }
      }, { threshold: .3 }).observe(g);
    });
    /* le spunte degli altri aiuti: subito viste quando entrano */
    [].forEach.call(document.querySelectorAll('.aiuto-lista .pf-voce'), function (v, i) {
      new IntersectionObserver(function (r, io) {
        if (!r[0].isIntersecting) return;
        io.disconnect();
        setTimeout(function () { v.classList.add('vista'); }, i % 6 * 110);
      }, { threshold: .5 }).observe(v);
    });
  })();

  /* ── DAYS sui Solari: il titolo del sito, con l'organo meccanico ─────── */
  (function () {
    var host = document.getElementById('flapDays');
    if (!host || !BS) return;
    var b = new BS.Board(host, 5, ' ABCDEFGHIJKLMNOPQRSTUVWXYZ');
    if (ridotto) { b.show('DAYS'); return; }
    setTimeout(function () { b.show('DAYS', 110, true); }, 500);
    /* la promessa si stringe da sola: giorni, anzi ore — ed è vera (48h) */
    var giro = ['HOURS', 'DAYS'], i = 0;
    setInterval(function () {
      if (document.hidden) return;
      b.update(giro[i % 2]);
      host.setAttribute('aria-label', giro[i % 2].toLowerCase());
      i++;
    }, 6500);
  })();

  /* ── i canoni delle case sui Solari, al primo sguardo ────────────────── */
  (function () {
    var voci = [].slice.call(document.querySelectorAll('.flap-prezzo'));
    if (!voci.length || !BS) return;
    voci.forEach(function (host) {
      var testo = host.dataset.p || '';
      var b = new BS.Board(host, testo.length, ' €,.0123456789');
      if (ridotto || !('IntersectionObserver' in window)) { b.show(testo); return; }
      new IntersectionObserver(function (r, io) {
        if (!r[0].isIntersecting) return;
        io.disconnect();
        b.show(testo, 40, true);
      }, { threshold: .4 }).observe(host);
    });
  })();

  /* ── la storia pinnata: lo scroll è il tempo, come sul sito live ─────── */
  (function () {
    var wrap = document.getElementById('come');
    var dev = document.getElementById('dev');
    var passi = [].slice.call(document.querySelectorAll('.how-step'));
    var tacche = [].slice.call(document.querySelectorAll('#howTrack span'));
    if (!wrap || !dev || !passi.length) return;
    var corrente = 0;
    function stato(i) {
      if (i === corrente) return;
      corrente = i;
      dev.dataset.step = i;
      passi.forEach(function (s, k) { s.classList.toggle('on', k === i); });
      tacche.forEach(function (t, k) { t.classList.toggle('done', k <= i); });
    }
    tacche[0].classList.add('done');
    var atteso = false;
    function guarda() {
      atteso = false;
      var r = wrap.getBoundingClientRect();
      var corsa = r.height - innerHeight;
      if (corsa <= 0) return;
      var p = Math.min(.999, Math.max(0, -r.top / corsa));
      stato(Math.floor(p * 4));
    }
    addEventListener('scroll', function () {
      if (!atteso) { atteso = true; requestAnimationFrame(guarda); }
    }, { passive: true });
    guarda();
  })();
})();
</script>
