<script>
/* ══════════════════════════════════════════════════════════════════════════
   BOOM · UNO — la regia.

   Tre cose si muovono, e tutte e tre dicono qualcosa di vero:

   1. IL MURO — i Solari girano sulle case libere adesso, lette dal catalogo
      alla compilazione. Girano una volta, all'entrata in campo, poi fermi.

   2. IL TEATRO — lo strumento del Radar resta in scena e lo scroll lo fa
      passare per quattro battute (orario → pesa → veto → soglia). I numeri
      sono di produzione; il ciclo illustrato è dichiarato tale nel piede.

   3. IL FILO — la barra in alto dice quanto della pagina è già stato letto.

   Fuori vista tutto si ferma. Reduced-motion mostra stati completi.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var R = document.documentElement;
  var ridotto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  var BS = window.BoomSolari;
  var DRUM = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789€.,:·+/';
  R.classList.add('vivo');

  var CASE = 'CASE_JSON';

  /* ── il marchio del piede: clonato dalla testata, una fonte sola ─────── */
  (function () {
    var vero = document.querySelector('.barra .logo-mark');
    var slot = document.getElementById('logoPiede');
    if (!vero || !slot) return;
    var c = vero.cloneNode(true);
    c.removeAttribute('class'); c.setAttribute('aria-hidden', 'true');
    slot.replaceWith(c);
  })();

  /* ── testata posata + filo del tempo: un solo ascoltatore di scroll ──── */
  (function () {
    var barra = document.getElementById('barra');
    var filo = document.getElementById('filoTempo');
    var atteso = false;
    function guarda() {
      atteso = false;
      var h = document.scrollingElement || document.documentElement;
      if (barra) barra.classList.toggle('posata', h.scrollTop > 10);
      if (filo) {
        var tot = h.scrollHeight - innerHeight;
        filo.style.transform = 'scaleX(' + (tot > 0 ? h.scrollTop / tot : 0) + ')';
      }
    }
    addEventListener('scroll', function () {
      if (!atteso) { atteso = true; requestAnimationFrame(guarda); }
    }, { passive: true });
    guarda();
  })();

  /* ── la tenda del telefono ───────────────────────────────────────────── */
  (function () {
    var apri = document.getElementById('apri');
    var tenda = document.getElementById('tenda');
    if (!apri || !tenda) return;
    function chiudi() {
      R.classList.remove('aperto');
      apri.setAttribute('aria-expanded', 'false');
      apri.setAttribute('aria-label', 'Open menu');
      document.body.style.overflow = '';
    }
    apri.addEventListener('click', function () {
      var ap = !R.classList.contains('aperto');
      R.classList.toggle('aperto', ap);
      apri.setAttribute('aria-expanded', ap ? 'true' : 'false');
      apri.setAttribute('aria-label', ap ? 'Close menu' : 'Open menu');
      document.body.style.overflow = ap ? 'hidden' : '';
    });
    [].forEach.call(tenda.querySelectorAll('a'), function (a) { a.addEventListener('click', chiudi); });
    addEventListener('keydown', function (e) { if (e.key === 'Escape') chiudi(); });
  })();

  /* ── la spina: il capitolo in corso resta segnato ────────────────────── */
  (function () {
    var voci = [].slice.call(document.querySelectorAll('.spina a'));
    if (!voci.length || !('IntersectionObserver' in window)) return;
    var mappa = {};
    voci.forEach(function (a) { mappa[a.getAttribute('href').slice(1)] = a; });
    var occhio = new IntersectionObserver(function (righe) {
      righe.forEach(function (r) {
        if (!r.isIntersecting) return;
        voci.forEach(function (a) { a.classList.remove('qui'); });
        var a = mappa[r.target.id]; if (a) a.classList.add('qui');
      });
    }, { rootMargin: '-38% 0px -55% 0px' });
    Object.keys(mappa).forEach(function (id) {
      var s = document.getElementById(id); if (s) occhio.observe(s);
    });
  })();

  /* ── le entrate: una volta sola, con rete di sicurezza ───────────────── */
  (function () {
    var voci = [].slice.call(document.querySelectorAll('.sale'));
    if (ridotto || !('IntersectionObserver' in window)) {
      voci.forEach(function (v) { v.classList.add('dentro'); }); return;
    }
    var occhio = new IntersectionObserver(function (righe) {
      righe.forEach(function (r, i) {
        if (!r.isIntersecting) return;
        var el = r.target; occhio.unobserve(el);
        setTimeout(function () { el.classList.add('dentro'); }, i * 70);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: .08 });
    voci.forEach(function (v) { occhio.observe(v); });
    setTimeout(function () { voci.forEach(function (v) { v.classList.add('dentro'); }); }, 4500);
  })();

  /* ── le domande ──────────────────────────────────────────────────────── */
  [].forEach.call(document.querySelectorAll('.domanda-t'), function (b) {
    b.addEventListener('click', function () {
      var d = b.closest('.domanda');
      var ap = !d.classList.contains('aperta');
      [].forEach.call(document.querySelectorAll('.domanda'), function (x) {
        x.classList.remove('aperta');
        x.querySelector('.domanda-t').setAttribute('aria-expanded', 'false');
      });
      if (ap) { d.classList.add('aperta'); b.setAttribute('aria-expanded', 'true'); }
    });
  });

  function oraRoma() {
    try {
      return new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Rome',
        hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date());
    } catch (e) { return new Date().toTimeString().slice(0, 5); }
  }

  /* ── i numeri del muro e del piede: dal catalogo ─────────────────────── */
  (function () {
    var tot = document.getElementById('muroTot');
    if (tot) tot.textContent = String(CASE.totale || CASE.righe.length);
    var po = document.getElementById('piedeOra');
    function batti() { if (po) po.textContent = oraRoma(); }
    batti(); if (!ridotto) setInterval(function () { if (!document.hidden) batti(); }, 30000);
  })();

  /* ══ IL MURO ═════════════════════════════════════════════════════════
     Le case libere adesso, a scala monumento. I Solari girano una volta,
     quando il muro entra in campo — ai dati, mai per decorazione. */
  var righe = [], box = document.getElementById('righe');
  var LARGH = { ora:5, zona:13, tipo:3, prezzo:6, stato:5 };

  if (box && BS) CASE.righe.forEach(function (h, i) {
    var a = document.createElement('a');
    a.className = 'riga' + (h.stato === 'NEW' ? ' nuovo' : '');
    a.href = h.url || '/apartments.html';
    a.setAttribute('aria-label', h.nome + ', ' + h.zona + ', ' + h.tipo +
      ', ' + h.prezzo + ' per month');
    a.innerHTML = '<span aria-hidden="true" class="cella c-ora flap-scale"></span>' +
      '<span aria-hidden="true" class="cella c-zona flap-scale"></span>' +
      '<span aria-hidden="true" class="cella c-tipo flap-scale"></span>' +
      '<span aria-hidden="true" class="cella c-prezzo flap-scale"></span>' +
      '<span aria-hidden="true" class="cella c-stato flap-scale"></span>';
    box.appendChild(a);
    righe.push({ el:a, casa:h, celle:{
      ora:   new BS.Board(a.querySelector('.c-ora'),    LARGH.ora,    DRUM),
      zona:  new BS.Board(a.querySelector('.c-zona'),   LARGH.zona,   DRUM),
      tipo:  new BS.Board(a.querySelector('.c-tipo'),   LARGH.tipo,   DRUM),
      prezzo:new BS.Board(a.querySelector('.c-prezzo'), LARGH.prezzo, DRUM),
      stato: new BS.Board(a.querySelector('.c-stato'),  LARGH.stato,  DRUM)
    }});
    a.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      righe[(i + (e.key === 'ArrowDown' ? 1 : righe.length - 1)) % righe.length].el.focus();
    });
  });

  function stampa(sbatti) {
    righe.forEach(function (r, i) {
      var h = r.casa;
      setTimeout(function () {
        r.celle.ora.show(h.ora, 24, sbatti);
        r.celle.zona.show(h.zona, 18, sbatti);
        r.celle.tipo.show(h.tipo, 24, sbatti);
        r.celle.prezzo.show(h.prezzo, 22, sbatti);
        r.celle.stato.show(h.stato, 22, sbatti);
      }, sbatti ? 160 + i * 130 : 0);
    });
  }

  (function () {
    if (!righe.length) return;
    var stampato = false;
    function ora(sbatti) { if (!stampato) { stampato = true; stampa(sbatti); } }
    if (ridotto || !('IntersectionObserver' in window)) { ora(false); return; }
    new IntersectionObserver(function (r, io) {
      if (!r[0].isIntersecting) return;
      io.disconnect(); ora(true);
    }, { threshold: .15 }).observe(box);
    setTimeout(function rete() {
      /* stessa soglia dell'osservatore: se il muro fa solo capolino,
         il giro spetta ancora al primo vero sguardo */
      if (stampato) return;
      var r = box.getBoundingClientRect();
      var visto = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
      if (r.height > 0 && visto / r.height >= 0.15) ora(false);
      else setTimeout(rete, 3000);
    }, 6000);
  })();

  (function () {
    var host = document.getElementById('muroOra');
    if (!host || !BS) return;
    var b = new BS.Board(host, 5, ' 0123456789:');
    b.show(oraRoma());
    if (ridotto) return;
    setInterval(function () { if (!document.hidden) b.update(oraRoma()); }, 20000);
  })();

  /* ══ IL TEATRO ═══════════════════════════════════════════════════════
     Lo strumento sta fermo; lo scroll è il tempo. Ogni battuta a metà
     schermo cambia lo stato del banco. I totali salgono contando, perché
     il conteggio È l'informazione; tutto il resto lo fa il CSS. */
  (function () {
    var banco = document.getElementById('banco');
    var beats = [].slice.call(document.querySelectorAll('.battuta'));
    if (!banco || !beats.length) return;

    /* il nastro dei 96 turni: una tacca per scansione, la piena sull'ora */
    var nastro = document.getElementById('nastro');
    if (nastro) {
      var fr = document.createDocumentFragment();
      for (var i = 0; i < 96; i++) {
        var t = document.createElement('i');
        t.style.setProperty('--i', i);
        fr.appendChild(t);
      }
      nastro.appendChild(fr);
    }

    var NOMI = ['Scan schedule', 'Scoring engine', 'Scoring engine', 'The threshold'];
    var corrente = -1;
    function conta(el, fino) {
      if (!el) return;
      if (ridotto) { el.textContent = String(fino); return; }
      var t0 = 0, da = 0;
      function su(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / 750);
        el.textContent = String(Math.round(da + (fino - da) * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(su);
      }
      requestAnimationFrame(su);
    }
    function stato(i) {
      if (i === corrente) return;
      corrente = i;
      banco.dataset.stato = i;
      var nome = document.getElementById('bancoNome');
      var passo = document.getElementById('bancoPasso');
      if (nome) nome.textContent = NOMI[i];
      if (passo) passo.textContent = (i + 1) + ' / 4';
      if (!ridotto) {
        banco.classList.remove('scansiona');
        void banco.offsetWidth;
        banco.classList.add('scansiona');
      }
      if (i === 1) conta(document.getElementById('tot1'), 100);
      if (i === 2) conta(document.getElementById('tot2'), 50);
    }

    if (!('IntersectionObserver' in window)) { stato(1); return; }
    var occhio = new IntersectionObserver(function (r) {
      r.forEach(function (x) { if (x.isIntersecting) stato(+x.target.dataset.i); });
    }, { rootMargin: '-45% 0px -45% 0px' });
    beats.forEach(function (b) { occhio.observe(b); });
    stato(0);
  })();

  /* ══ IL CERCATORE ════════════════════════════════════════════════════
     ⌘K. Case, servizi e capitoli — le sole cose che qualcuno può volere
     qui. Un numero cerca un prezzo: «1200» dà ciò che costa fino a lì. */
  (function () {
    var box = document.getElementById('cercatore');
    var campo = document.getElementById('cercaInput');
    var lista = document.getElementById('cercaLista');
    var tasto = document.getElementById('apriCerca');
    if (!box || !campo || !lista) return;
    var SERVIZI = [
      { t:'Property Finding', s:'The Radar on your search · 10 days or refunded', p:'€350', u:'/property-finding.html' },
      { t:'Deal Assistance', s:'Contract checked, owner verified, negotiation handled', p:'€249', u:'/deal-assistance.html' },
      { t:'Virtual Viewing', s:'Live video walk-through, you direct the camera', p:'€89', u:'/virtual-viewing.html' },
      { t:'Deposit Recovery', s:'Art. 1590 c.c. · nothing recovered, nothing owed', p:'€99 + 20%', u:'/deposit-recovery.html' },
      { t:'Concierge', s:'Cleaning, repairs, utilities — after the keys', p:'from €60', u:'/concierge.html' }
    ];
    var VAI = [
      { t:'The board', s:'Free in Rome, right now', u:'#muro' },
      { t:'The homes', s:'Filmed by us, all of them', u:'#case' },
      { t:'The Radar', s:'Schedule, weights, threshold — the real numbers', u:'#radar' },
      { t:'How it works', s:'Four moves to the keys', u:'#catena' },
      { t:'Prices', s:'The whole list, on the homepage', u:'#listino' }
    ];
    var voci = [], mira = 0, aperto = false, tornaA = null;

    function raccogli() {
      var out = CASE.righe.concat(CASE.altre || []).map(function (h) {
        return { g:'Homes', t:h.nome, s:[h.zona, h.tipo, h.sqm !== '—' ? h.sqm + ' m²' : '']
          .filter(Boolean).join(' · '), p:h.prezzo + '/mo', u:h.url || '/apartments.html' };
      });
      SERVIZI.forEach(function (x) { out.push({ g:'Services', t:x.t, s:x.s, p:x.p, u:x.u }); });
      VAI.forEach(function (x) { out.push({ g:'Go to', t:x.t, s:x.s, p:'', u:x.u }); });
      return out;
    }
    function cerca(q) {
      q = (q || '').trim().toLowerCase();
      var tutte = raccogli();
      if (!q) return tutte;
      var n = q.replace(/[^\d]/g, '');
      return tutte.filter(function (v) {
        if ((v.t + ' ' + v.s + ' ' + v.p).toLowerCase().indexOf(q) >= 0) return true;
        if (n && n.length >= 3 && v.g === 'Homes') {
          var pr = +String(v.p).replace(/[^\d]/g, '');
          return pr && pr <= +n;
        }
        return false;
      });
    }
    function disegna(q) {
      voci = cerca(q); mira = 0;
      if (!voci.length) {
        lista.innerHTML = '<p class="cercatore-nulla">Nothing with that name yet — tell us ' +
          'what you need and the Radar goes and looks for it.</p>';
        return;
      }
      var html = '', gruppo = '';
      voci.forEach(function (v, i) {
        if (v.g !== gruppo) { gruppo = v.g; html += '<div class="cercatore-gruppo">' + gruppo + '</div>'; }
        html += '<a class="cv' + (i === 0 ? ' mirata' : '') + '" role="option" href="' +
          v.u + '"><span class="cv-t"><b>' + v.t + '</b><span>' + v.s + '</span></span>' +
          (v.p ? '<span class="cv-p">' + v.p + '</span>' : '') + '</a>';
      });
      lista.innerHTML = html;
    }
    function punta(i) {
      var el = [].slice.call(lista.querySelectorAll('.cv'));
      if (!el.length) return;
      mira = (i + el.length) % el.length;
      el.forEach(function (x, k) { x.classList.toggle('mirata', k === mira); });
      el[mira].scrollIntoView({ block:'nearest' });
    }
    function apri() {
      aperto = true; tornaA = document.activeElement;
      box.classList.add('aperto');
      document.body.style.overflow = 'hidden';
      campo.value = ''; disegna('');
      setTimeout(function () { campo.focus(); }, 60);
    }
    function chiudi() {
      aperto = false; box.classList.remove('aperto');
      document.body.style.overflow = '';
      if (tornaA && tornaA.focus) tornaA.focus();
    }
    lista.addEventListener('click', function (e) {
      var a = e.target;
      while (a && a !== lista && !(a.classList && a.classList.contains('cv'))) a = a.parentNode;
      if (a && a !== lista) chiudi();
    });
    if (tasto) {
      tasto.addEventListener('click', apri);
      tasto.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); apri(); }
      });
    }
    box.addEventListener('click', function (e) { if (e.target === box) chiudi(); });
    campo.addEventListener('input', function () { disegna(campo.value); });
    addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); aperto ? chiudi() : apri(); return;
      }
      if (!aperto) return;
      if (e.key === 'Tab') {
        e.preventDefault();
        var giro = [campo].concat([].slice.call(lista.querySelectorAll('.cv')));
        var qui = giro.indexOf(document.activeElement);
        giro[(qui + (e.shiftKey ? giro.length - 1 : 1) + giro.length) % giro.length].focus();
      }
      else if (e.key === 'Escape') { e.preventDefault(); chiudi(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); punta(mira + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); punta(mira - 1); }
      else if (e.key === 'Enter') {
        var el = lista.querySelectorAll('.cv')[mira];
        if (el) { e.preventDefault(); chiudi(); el.click(); }
      }
    });
  })();
})();
</script>
