<title>BOOM — Apartments for Rent in Rome</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Rome's rental market, put on a schedule. Verified apartments filmed in person, and the Radar — a machine that watches the portals every fifteen minutes so you don't have to.">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   BOOM · UNO — un'idea per schermata.

   La critica al POP era giusta: tre oggetti nell'hero, otto blocchi nel
   radar. Chi arriva ha trenta secondi e una soglia d'attenzione corta;
   dargli tutto insieme è dargli niente.

   Qui l'architettura È il rimedio:
   · L'ARRIVO — una frase, nient'altro. Il muro fa capolino sotto il bordo.
   · IL MURO — il tabellone Solari a scala monumento, dati veri, full-bleed.
   · LE CASE — un mosaico: una grande, cinque piccole. Si legge in un colpo.
   · IL RADAR — il pezzo, RECITATO: lo strumento resta fermo (sticky) e lo
     scroll lo fa passare per quattro battute, una verità per battuta.
     Niente più otto riquadri in parallelo: una sequenza.
   · LA VIA, IL LISTINO, LE DOMANDE, LA PORTA — ogni capitolo una riga
     di titolo ≤ 6 parole e UN paragrafo.

   La disciplina Déco resta: lacca nera, ottone brunito, Helvetica Neue 300,
   numeri tabulari. Si muove solo ciò che significa qualcosa.
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  --nero:      #08070A;
  --nero-2:    #0D0C10;
  --nero-3:    #131218;
  --oro:       #D4AF37;
  --oro-alto:  #F3E1A8;
  --oro-cupo:  #7E6524;
  --oro-flap:  #EFE6C8;
  --brunito:   linear-gradient(96deg,#7E6524,#F3E1A8 30%,#D4AF37 58%,#7E6524);
  /* sui piani larghi il brunito stretto brucia da una parte e affoga
     dall'altra: la lastra tiene la luce alta da bordo a bordo */
  --lastra:    linear-gradient(96deg,#B98F27,#F0DC9E 30%,#E0C463 62%,#B58F2A);
  --luce:      #FBF9F4;
  --luce-2:    rgba(251,249,244,.66);
  --luce-3:    rgba(251,249,244,.56);
  --luce-4:    rgba(251,249,244,.34);
  --filo:      rgba(251,249,244,.13);
  --filo-2:    rgba(251,249,244,.07);
  --filo-oro:  rgba(212,175,55,.34);
  --vivo:      #6FE29B;
  --rosso:     #FF6B4A;
  --ease:      cubic-bezier(.16,1,.3,1);
  --testo:     "Helvetica Neue", Helvetica, Inter, Arial, sans-serif;
  --dati:      ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { background:var(--nero); color:var(--luce); font-family:var(--testo);
  font-weight:300; font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; }
img { max-width:100%; display:block; }
a { color:inherit; text-decoration:none; }
button, input { font:inherit; color:inherit; background:none; border:0; }
::selection { background:var(--oro); color:var(--nero); }
:focus-visible { outline:2px solid var(--oro); outline-offset:3px; }
.wrap { width:100%; max-width:1280px; margin:0 auto; padding:0 clamp(18px,3.4vw,48px); }

.salta { position:fixed; top:12px; left:12px; z-index:400; padding:14px 26px;
  background:var(--oro); color:var(--nero); font-size:11px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; transform:translateY(-220%);
  transition:transform .3s var(--ease); }
.salta:focus-visible { transform:none; }

/* ── LA VOCE ─────────────────────────────────────────────────────────── */
.eti { display:inline-block; padding:6px 13px; background:var(--oro); color:var(--nero);
  font-family:var(--dati); font-size:10px; font-weight:600; letter-spacing:.2em;
  text-transform:uppercase; }
.urlo { font-weight:200; font-size:clamp(38px,5.6vw,80px); line-height:1.04;
  letter-spacing:-.045em; text-transform:uppercase; text-wrap:balance; }
.urlo em { font-style:normal; color:var(--oro-alto); }
.grido { font-weight:200; font-size:clamp(28px,4vw,56px); line-height:1.04;
  letter-spacing:-.04em; text-transform:uppercase; text-wrap:balance; }
.grido em { font-style:normal; color:var(--oro-alto); }
.guida { font-size:16.5px; line-height:1.64; color:var(--luce-2); max-width:52ch; }
.sezione { position:relative; padding:clamp(64px,8vw,120px) 0; }

/* ── I BOTTONI ───────────────────────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:11px;
  padding:17px 30px; font-family:var(--dati); font-size:12px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; cursor:pointer;
  transition:transform .3s var(--ease), background .3s ease, box-shadow .3s ease,
    color .3s ease; }
.btn-oro { background:var(--oro); color:var(--nero); }
.btn-oro:hover { background:var(--oro-alto); transform:translateY(-2px); }
.btn-filo { box-shadow:inset 0 0 0 2px var(--filo); }
.btn-filo:hover { box-shadow:inset 0 0 0 2px var(--oro); color:var(--oro-alto);
  transform:translateY(-2px); }
.btn-nero { background:var(--nero); color:var(--luce); }
.btn-nero:hover { background:var(--nero-3); transform:translateY(-2px); }

/* ── IL FILO DEL TEMPO — quanto della pagina è già stato letto ───────── */
.filo-tempo { position:fixed; top:0; left:0; right:0; height:2px; z-index:130;
  background:var(--oro); transform:scaleX(0); transform-origin:left;
  pointer-events:none; }

/* ── LA TESTATA ──────────────────────────────────────────────────────── */
.barra { position:fixed; top:0; left:0; right:0; z-index:100; padding:13px 0;
  transition:background .35s ease, box-shadow .35s ease; }
.barra.posata { background:rgba(8,7,10,.9); backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px); box-shadow:0 1px 0 var(--filo-2); }
.barra-in { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.marchio { display:inline-flex; align-items:center; gap:11px; }
.marchio .logo-mark { width:34px; height:34px; flex:none; }
.marchio span { font-size:15px; font-weight:500; letter-spacing:.28em; text-indent:.28em;
  text-transform:uppercase; }
.menu { display:none; align-items:center; gap:22px; }
@media (min-width:1080px){ .menu { display:flex; } }
.menu a { font-family:var(--dati); font-size:11px; font-weight:500; letter-spacing:.12em;
  text-transform:uppercase; color:var(--luce-3); transition:color .25s ease; }
.menu a:hover { color:var(--luce); }
.menu .cerca { display:inline-flex; align-items:center; gap:9px; padding:9px 14px;
  box-shadow:inset 0 0 0 1px var(--filo); cursor:pointer; }
.menu .cerca kbd { font:inherit; font-size:10px; color:var(--luce-4); }
.menu a.btn-oro { padding:11px 18px; font-size:11px; color:var(--nero); }
.menu a.btn-oro:hover { color:var(--nero); }
.apri { display:inline-flex; flex-direction:column; gap:5px; width:42px; height:42px;
  align-items:center; justify-content:center; cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--filo); }
@media (min-width:1080px){ .apri { display:none; } }
.apri i { width:17px; height:2px; background:var(--luce);
  transition:transform .3s var(--ease), opacity .2s; }
html.aperto .barra { background:rgba(8,7,10,.98); backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px); }
html.aperto .apri i:nth-child(1){ transform:translateY(7px) rotate(45deg); }
html.aperto .apri i:nth-child(2){ opacity:0; }
html.aperto .apri i:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
.tenda { position:fixed; inset:0; z-index:99; padding:92px clamp(18px,3.4vw,48px) 34px;
  background:rgba(8,7,10,.98); backdrop-filter:blur(20px); overflow-y:auto;
  display:flex; flex-direction:column; opacity:0; visibility:hidden;
  transform:translateY(-8px);
  transition:opacity .3s ease, transform .4s var(--ease), visibility .3s; }
html.aperto .tenda { opacity:1; visibility:visible; transform:none; }
.tenda a { padding:16px 2px; font-size:20px; font-weight:250; letter-spacing:-.01em;
  text-transform:uppercase; border-bottom:1px solid var(--filo-2); }
.tenda .btn { margin-top:22px; }

/* ── LA SPINA — i capitoli, sempre sott'occhio ───────────────────────── */
.spina { position:fixed; left:clamp(10px,1.4vw,26px); top:50%; z-index:90;
  transform:translateY(-50%); display:none; flex-direction:column; gap:20px; }
@media (min-width:1320px){ .spina { display:flex; } }
.spina a { display:flex; align-items:center; gap:10px; font-family:var(--dati);
  font-size:9px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--luce-4); transition:color .3s ease; }
.spina a i { font-style:normal; width:18px; height:1px; background:var(--luce-4);
  transition:width .35s var(--ease), background .3s ease; }
.spina a span { opacity:0; transform:translateX(-4px); padding:5px 9px;
  background:var(--nero); box-shadow:inset 0 0 0 1px var(--filo-oro);
  transition:opacity .3s ease, transform .3s var(--ease); }
.spina a:hover span, .spina a.qui span { opacity:1; transform:none; }
.spina a.qui { color:var(--oro-alto); }
.spina a.qui i { width:30px; background:var(--oro); }

/* ══ L'ARRIVO — una frase. Nient'altro. ════════════════════════════════ */
.arrivo { min-height:78svh; display:grid; align-content:center;
  padding:clamp(104px,13svh,150px) 0 clamp(40px,6svh,64px); }
.arrivo .urlo { margin-top:22px; max-width:28ch; }
.urlo br { display:none; }
@media (min-width:1080px){ .urlo br { display:block; } }
.arrivo-sotto { margin-top:24px; max-width:44ch; font-size:17.5px; color:var(--luce-2); }
.arrivo-azioni { margin-top:30px; display:flex; gap:11px; flex-wrap:wrap; }
.arrivo-giu { margin-top:clamp(34px,6svh,64px); display:inline-flex; align-items:center;
  gap:11px; font-family:var(--dati); font-size:10px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; color:var(--luce-3); }
.arrivo-giu i { font-style:normal; width:1px; height:34px; background:var(--oro);
  animation:cala 2.2s var(--ease) infinite; }
@keyframes cala { 0% { transform:scaleY(0); transform-origin:top; }
  45% { transform:scaleY(1); transform-origin:top; }
  55% { transform:scaleY(1); transform-origin:bottom; }
  100% { transform:scaleY(0); transform-origin:bottom; } }

/* ══ IL MURO — il tabellone a scala monumento ══════════════════════════ */
.muro { background:var(--nero-2); border-top:3px solid var(--oro);
  border-bottom:1px solid var(--filo-2); padding:clamp(26px,3.4vw,48px) 0; }
.muro-in { max-width:1500px; margin:0 auto; padding:0 clamp(14px,5vw,84px); }
.muro-cima { display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:0 4px 16px; }
.muro-eti { display:inline-flex; align-items:center; gap:10px; font-family:var(--dati);
  font-size:clamp(10px,1vw,12px); font-weight:600; letter-spacing:.2em;
  text-transform:uppercase; color:var(--oro); }
.muro-eti i { font-style:normal; width:7px; height:7px; background:var(--oro);
  animation:battito 1.8s steps(1) infinite; }
@keyframes battito { 50% { opacity:.2; } }
#muroOra { font-family:var(--dati); font-size:clamp(13px,1.3vw,17px); }
.muro-quadro { background:var(--nero); box-shadow:inset 0 0 0 2px var(--filo-oro); }
.colonne, .riga, .riga-ferma { display:grid; align-items:center;
  grid-template-columns:clamp(72px,8vw,120px) minmax(0,1fr) clamp(52px,5vw,86px)
    clamp(96px,10vw,158px) clamp(72px,7vw,112px);
  gap:clamp(8px,1.6vw,24px); padding:0 clamp(12px,2vw,28px); }
.colonne { padding-top:16px; padding-bottom:11px; font-family:var(--dati);
  font-size:clamp(9px,.9vw,10.5px); font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; color:var(--luce-4); }
.riga { position:relative; width:100%; text-align:left; cursor:pointer;
  font-size:clamp(13px,1.5vw,21px);
  padding-top:clamp(13px,1.5vw,21px); padding-bottom:clamp(13px,1.5vw,21px);
  border-top:1px solid var(--filo-2); transition:background .3s var(--ease); }
.riga::before { content:''; position:absolute; left:0; top:-1px; bottom:0; width:3px;
  background:var(--oro); transform:scaleY(0); transform-origin:top;
  transition:transform .4s var(--ease); }
.riga:hover, .riga:focus-visible { background:rgba(212,175,55,.06); }
.riga:hover::before, .riga:focus-visible::before { transform:scaleY(1); }
.cella { overflow:hidden; }
.c-stato { color:var(--vivo); }
.riga.nuovo .c-stato { color:var(--oro-alto); }
.riga-ferma { font-size:clamp(13px,1.5vw,20px); padding-top:16px; padding-bottom:16px;
  border-top:1px solid var(--filo-2); }
.muro-piede { display:flex; align-items:center; justify-content:space-between; gap:12px;
  flex-wrap:wrap; padding:14px clamp(12px,2vw,28px); border-top:1px solid var(--filo-2);
  font-family:var(--dati); font-size:clamp(9px,.95vw,11px); letter-spacing:.12em;
  text-transform:uppercase; color:var(--luce-3); }
.muro-piede b { color:var(--oro); font-weight:600; }
@media (max-width:880px){
  .colonne, .riga, .riga-ferma {
    grid-template-columns:clamp(58px,15vw,72px) minmax(0,1fr) clamp(84px,22vw,100px);
    gap:10px; }
  .colonne span:nth-child(3), .riga .c-tipo, .riga-ferma span:nth-child(3),
  .colonne span:nth-child(5), .riga .c-stato, .riga-ferma span:nth-child(5) { display:none; }
}

/* ══ 01 · LE CASE — una grande, cinque piccole ═════════════════════════ */
.testata { display:grid; grid-template-columns:1fr; gap:22px; align-items:end; }
@media (min-width:1000px){ .testata { grid-template-columns:minmax(0,1fr) auto;
  gap:clamp(28px,4vw,70px); } }
.testata .grido { margin-top:16px; }
.testata .guida { margin-top:16px; }
.mosaico { margin-top:clamp(30px,4vw,52px); display:grid; grid-template-columns:1fr;
  gap:1px; background:var(--filo-2); }
@media (max-width:679px){ .casa-foto { aspect-ratio:3/2; } }
@media (min-width:680px){ .mosaico { grid-template-columns:repeat(2,1fr); } }
@media (min-width:1080px){ .mosaico { grid-template-columns:repeat(3,1fr); }
  .casa.grande { grid-area:1 / 1 / 3 / 3; }
  .casa .casa-foto { aspect-ratio:auto; flex:1; min-height:230px; } }
.mosaico > * { min-width:0; }
.casa { position:relative; display:flex; flex-direction:column; background:var(--nero);
  transition:background .4s var(--ease); }
.casa:hover { background:var(--nero-2); }
.casa-foto { position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--nero-3); }
.casa.grande .casa-foto { flex:1; aspect-ratio:auto; min-height:340px; }
.casa-foto img { width:100%; height:100%; object-fit:cover;
  transition:transform 1.4s var(--ease); }
.casa:hover .casa-foto img { transform:scale(1.05); }
.casa-n { position:absolute; left:0; top:0; z-index:2; padding:9px 15px;
  background:var(--oro); color:var(--nero); font-family:var(--dati); font-size:11px;
  font-weight:700; letter-spacing:.14em; }
.casa-tag { position:absolute; right:0; top:0; z-index:2; padding:9px 14px;
  background:rgba(8,7,10,.78); backdrop-filter:blur(8px); font-family:var(--dati);
  font-size:9.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--oro-alto); }
.casa-corpo { padding:18px 20px 20px; }
.casa.grande .casa-corpo { padding:22px 24px 24px; }
.casa-zona { font-family:var(--dati); font-size:10px; font-weight:600; letter-spacing:.2em;
  text-transform:uppercase; color:var(--oro); }
.casa-nome { margin-top:9px; font-size:19px; font-weight:250; letter-spacing:-.02em; }
.casa.grande .casa-nome { font-size:clamp(22px,2.2vw,30px); }
.casa-dati { margin-top:9px; font-family:var(--dati); font-size:11.5px; color:var(--luce-3); }
.casa-piede { margin-top:14px; padding-top:13px; border-top:1px solid var(--filo-2);
  display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.casa-prezzo { font-size:24px; font-weight:250; letter-spacing:-.03em; color:var(--oro-alto);
  font-variant-numeric:tabular-nums; }
.casa.grande .casa-prezzo { font-size:clamp(26px,2.4vw,34px); }
.casa-prezzo small { font-size:12px; color:var(--luce-3); }
.casa-vai { font-family:var(--dati); font-size:10px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--luce-4); transition:color .3s ease; }
.casa:hover .casa-vai { color:var(--oro-alto); }

/* ══ 02 · IL RADAR — recitato in quattro battute ═══════════════════════
   Lo strumento resta in scena (sticky); lo scroll è il tempo. Ogni
   battuta ha un titolo ≤ 5 parole, un paragrafo, una riga di fatto. */
.radar { background:var(--nero-2); border-top:3px solid var(--oro); }
.teatro { margin-top:clamp(30px,4vw,56px); display:grid; grid-template-columns:1fr;
  gap:clamp(20px,2.6vw,48px); align-items:start; }
@media (min-width:980px){
  .teatro { grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr); } }
.teatro > * { min-width:0; }
.palco { position:sticky; top:clamp(66px,9vh,92px); z-index:5; }
.banco { position:relative; background:var(--nero);
  box-shadow:inset 0 0 0 2px var(--filo-oro); overflow:hidden;
  height:clamp(430px,62svh,560px); }
@media (max-width:979px){ .banco { height:clamp(400px,54svh,480px); }
  .strato { inset:47px 0 64px; }
  .banco-piede .largo { display:none; } }
.scia { position:absolute; top:0; bottom:0; width:2px; background:var(--oro);
  box-shadow:0 0 22px 4px rgba(212,175,55,.45); opacity:0; left:0; z-index:8; }
.banco.scansiona .scia { animation:scansione 1.05s linear both; }
@keyframes scansione { 0% { left:0; opacity:.9; } 100% { left:100%; opacity:0; } }
.banco-cima { position:absolute; left:0; right:0; top:0; z-index:6; display:flex;
  align-items:center; justify-content:space-between; gap:12px; padding:14px 20px;
  border-bottom:1px solid var(--filo-2); background:var(--nero);
  font-family:var(--dati); font-size:10px; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; color:var(--oro); }
.banco-cima span:last-child { color:var(--luce-4); }
.banco-piede { position:absolute; left:0; right:0; bottom:0; z-index:6; padding:12px 20px;
  border-top:1px solid var(--filo-2); background:var(--nero); font-family:var(--dati);
  font-size:9.5px; line-height:1.6; letter-spacing:.08em; color:var(--luce-3); }
.strato { position:absolute; inset:47px 0 44px; padding:clamp(16px,2vw,26px) 20px;
  display:flex; flex-direction:column; justify-content:center; gap:0;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .5s ease, transform .6s var(--ease); }
.banco[data-stato="0"] .strato-0, .banco[data-stato="1"] .strato-1,
.banco[data-stato="2"] .strato-2, .banco[data-stato="3"] .strato-3 {
  opacity:1; transform:none; pointer-events:auto; }

/* strato 0 — l'orologio della caccia */
.turno-num { display:flex; align-items:baseline; gap:14px; }
.turno-num b { font-size:clamp(64px,7vw,110px); font-weight:200; line-height:.9;
  letter-spacing:-.05em; font-variant-numeric:tabular-nums; color:var(--oro-alto); }
.turno-num span { font-size:15px; color:var(--luce-2); max-width:16ch; line-height:1.4; }
.nastro { margin-top:clamp(18px,2.4vw,30px); display:flex; gap:2px; height:26px;
  align-items:flex-end; }
.nastro i { flex:1; height:12px; background:rgba(251,249,244,.12); }
.nastro i:nth-child(4n+1) { height:22px; background:rgba(212,175,55,.55); }
.banco[data-stato="0"] .nastro i { animation:accende .5s ease both; }
.banco[data-stato="0"] .nastro i:nth-child(n) { animation-delay:calc(var(--i) * 18ms); }
@keyframes accende { from { opacity:0; transform:scaleY(.3); transform-origin:bottom; } }
.turni { margin-top:clamp(16px,2vw,26px); display:grid;
  grid-template-columns:repeat(2,1fr); gap:1px; background:var(--filo-2); }
.turni div { background:var(--nero); padding:11px 13px; }
