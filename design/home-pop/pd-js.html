<script>
/* ══════════════════════════════════════════════════════════════════════════
   BOOM · POP — la regia.

   Due sole cose si muovono, e tutte e due dicono qualcosa di vero:

   1. IL TABELLONE — i Solari girano sulle case libere adesso, lette dal
      catalogo al momento della compilazione. Girano una volta, all'entrata
      in campo, e poi stanno fermi: sono un display, non un'animazione.

   2. IL BANCO — il motore del PFS che gira il suo ciclo. I pesi sono quelli
      veri del codice (budget 50, camere 30, zona 20), la soglia è quella
      vera (60), il veto è quello vero (fuori budget = zero). Il ciclo è
      dichiarato come illustrativo nel piede del riquadro: mostriamo il
      meccanismo, non fingiamo dati in diretta.

   Fuori vista tutto si ferma. Reduced-motion mostra tutto già completo.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var R = document.documentElement;
  var ridotto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  var BS = window.BoomSolari;
  var DRUM = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789€.,:·+/';
  R.classList.add('vivo');

  var CASE = 'CASE_JSON';

  /* ── il marchio del piede: clonato dalla testata, una fonte sola ─────── */
  (function () {
    var vero = document.querySelector('.barra .logo-mark');
    var slot = document.getElementById('logoPiede');
    if (!vero || !slot) return;
    var c = vero.cloneNode(true);
    c.removeAttribute('class'); c.setAttribute('aria-hidden', 'true');
    slot.replaceWith(c);
  })();

  /* ── la testata si posa quando la pagina scorre ──────────────────────── */
  (function () {
    var barra = document.getElementById('barra');
    if (!barra) return;
    var atteso = false;
    function guarda() {
      atteso = false;
      var h = document.scrollingElement || document.documentElement;
      barra.classList.toggle('posata', h.scrollTop > 10);
    }
    addEventListener('scroll', function () {
      if (!atteso) { atteso = true; requestAnimationFrame(guarda); }
    }, { passive: true });
    guarda();
  })();

  /* ── la tenda del telefono ───────────────────────────────────────────── */
  (function () {
    var apri = document.getElementById('apri');
    var tenda = document.getElementById('tenda');
    if (!apri || !tenda) return;
    function chiudi() {
      R.classList.remove('aperto');
      apri.setAttribute('aria-expanded', 'false');
      apri.setAttribute('aria-label', 'Open menu');
      document.body.style.overflow = '';
    }
    apri.addEventListener('click', function () {
      var ap = !R.classList.contains('aperto');
      R.classList.toggle('aperto', ap);
      apri.setAttribute('aria-expanded', ap ? 'true' : 'false');
      apri.setAttribute('aria-label', ap ? 'Close menu' : 'Open menu');
      document.body.style.overflow = ap ? 'hidden' : '';
    });
    [].forEach.call(tenda.querySelectorAll('a'), function (a) { a.addEventListener('click', chiudi); });
    addEventListener('keydown', function (e) { if (e.key === 'Escape') chiudi(); });
  })();

  /* ── le entrate: una volta sola, con rete di sicurezza ───────────────── */
  (function () {
    var voci = [].slice.call(document.querySelectorAll('.sale'));
    if (ridotto || !('IntersectionObserver' in window)) {
      voci.forEach(function (v) { v.classList.add('dentro'); }); return;
    }
    var occhio = new IntersectionObserver(function (righe) {
      righe.forEach(function (r, i) {
        if (!r.isIntersecting) return;
        var el = r.target; occhio.unobserve(el);
        setTimeout(function () { el.classList.add('dentro'); }, i * 70);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: .08 });
    voci.forEach(function (v) { occhio.observe(v); });
    setTimeout(function () { voci.forEach(function (v) { v.classList.add('dentro'); }); }, 4500);
  })();

  /* ── le domande ──────────────────────────────────────────────────────── */
  [].forEach.call(document.querySelectorAll('.domanda-t'), function (b) {
    b.addEventListener('click', function () {
      var d = b.closest('.domanda');
      var ap = !d.classList.contains('aperta');
      [].forEach.call(document.querySelectorAll('.domanda'), function (x) {
        x.classList.remove('aperta');
        x.querySelector('.domanda-t').setAttribute('aria-expanded', 'false');
      });
      if (ap) { d.classList.add('aperta'); b.setAttribute('aria-expanded', 'true'); }
    });
  });

  function oraRoma() {
    try {
      return new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Rome',
        hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date());
    } catch (e) { return new Date().toTimeString().slice(0, 5); }
  }

  /* ── i numeri della fascia: dal catalogo, non da un copywriter ───────── */
  (function () {
    var n = String(CASE.totale || CASE.righe.length);
    ['fTot', 'quadroTot'].forEach(function (id) {
      var el = document.getElementById(id); if (el) el.textContent = n;
    });
    var po = document.getElementById('piedeOra');
    function batti() { if (po) po.textContent = oraRoma(); }
    batti(); if (!ridotto) setInterval(function () { if (!document.hidden) batti(); }, 30000);
  })();

  /* ══ IL TABELLONE ════════════════════════════════════════════════════
     Le case libere adesso, lette una volta sola quando il tabellone entra
     in campo. I Solari girano ai dati, mai per decorazione. */
  var righe = [], scelto = -1, box = document.getElementById('righe');
  var LARGH = { ora:5, zona:13, tipo:3, prezzo:6, stato:5 };

  if (box && BS) CASE.righe.forEach(function (h, i) {
    var a = document.createElement('a');
    a.className = 'riga' + (h.stato === 'NEW' ? ' nuovo' : '');
    a.href = h.url || '/apartments.html';
    a.setAttribute('role', 'listitem');
    a.setAttribute('aria-label', h.nome + ', ' + h.zona + ', ' + h.tipo +
      ', ' + h.prezzo + ' per month');
    a.innerHTML = '<span class="cella c-ora flap-scale"></span>' +
      '<span class="cella c-zona flap-scale"></span>' +
      '<span class="cella c-tipo flap-scale"></span>' +
      '<span class="cella c-prezzo flap-scale"></span>' +
      '<span class="cella c-stato flap-scale"></span>';
    box.appendChild(a);
    righe.push({ el:a, casa:h, celle:{
      ora:   new BS.Board(a.querySelector('.c-ora'),    LARGH.ora,    DRUM),
      zona:  new BS.Board(a.querySelector('.c-zona'),   LARGH.zona,   DRUM),
      tipo:  new BS.Board(a.querySelector('.c-tipo'),   LARGH.tipo,   DRUM),
      prezzo:new BS.Board(a.querySelector('.c-prezzo'), LARGH.prezzo, DRUM),
      stato: new BS.Board(a.querySelector('.c-stato'),  LARGH.stato,  DRUM)
    }});
    function prendi() { segna(i); }
    a.addEventListener('focus', prendi);
    if (fine) a.addEventListener('pointerenter', prendi);
    a.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      righe[(i + (e.key === 'ArrowDown' ? 1 : righe.length - 1)) % righe.length].el.focus();
    });
  });

  function segna(i) {
    if (i === scelto) return;
    scelto = i;
    righe.forEach(function (r, k) { r.el.classList.toggle('scelta', k === i); });
  }

  function stampa(sbatti) {
    righe.forEach(function (r, i) {
      var h = r.casa;
      setTimeout(function () {
        r.celle.ora.show(h.ora, 24, sbatti);
        r.celle.zona.show(h.zona, 18, sbatti);
        r.celle.tipo.show(h.tipo, 24, sbatti);
        r.celle.prezzo.show(h.prezzo, 22, sbatti);
        r.celle.stato.show(h.stato, 22, sbatti);
      }, sbatti ? 160 + i * 130 : 0);
    });
  }

  (function () {
    if (!righe.length) return;
    if (ridotto || !('IntersectionObserver' in window)) { stampa(false); return; }
    new IntersectionObserver(function (r, io) {
      if (!r[0].isIntersecting) return;
      io.disconnect(); stampa(true);
    }, { threshold: .2 }).observe(document.getElementById('righe'));
    setTimeout(function () { if (scelto < 0) stampa(false); }, 6000);
  })();

  (function () {
    var host = document.getElementById('quadroOra');
    if (!host || !BS) return;
    var b = new BS.Board(host, 5, ' 0123456789:');
    b.show(oraRoma());
    if (ridotto) return;
    setInterval(function () { if (!document.hidden) b.update(oraRoma()); }, 20000);
  })();

  /* ══ IL BANCO ════════════════════════════════════════════════════════
     Il motore del PFS che gira davanti a chi legge. Il brief è quello
     scritto nel piede del riquadro: €1.000–1.400, 2 camere, Trastevere /
     Monti / San Lorenzo. I punteggi qui sotto NON sono inventati: escono
     dalle stesse regole che girano in produzione.

       · budget dentro la forbice ........ 50    fuori del 20% ...... VETO
       · budget nella finestra morbida ... 25
       · camere esatte ................... 30    a ±1 .............. 15
       · zona richiesta .................. 20    altrove ............  0
       · soglia di spinta ................ 60

     Il terzo caso è il più onesto dei tre: un appartamento bellissimo,
     nella zona giusta, con le stanze giuste — e comunque zero, perché
     costa più di quanto il cliente ha detto di poter pagare. */
  (function () {
    var banco = document.getElementById('banco');
    if (!banco) return;
    var CICLO = [
      { nome:'Vicolo del Cinque', fonte:'Immobiliare · 06:14',
        riga:'€1,340 / month · 2 bedrooms · 68 m² · Trastevere',
        budget:50, camere:30, zona:20, tot:100, esito:'spinto',
        voce:'Pushed to deck' },
      { nome:'Viale Europa', fonte:'Idealista · 09:02',
        riga:'€960 / month · 3 bedrooms · 95 m² · EUR',
        budget:25, camere:15, zona:0, tot:40, esito:'sotto',
        voce:'Below 60 · dropped' },
      { nome:'Via dei Serpenti', fonte:'Immobiliare · 11:47',
        riga:'€2,100 / month · 2 bedrooms · 74 m² · Monti',
        budget:0, camere:30, zona:20, tot:50, esito:'veto',
        voce:'Veto · over budget' }
    ];
    var TETTO = { budget:50, camere:30, zona:20 };
    var el = {
      nome: document.getElementById('tNome'), fonte: document.getElementById('tFonte'),
      riga: document.getElementById('tRiga'), tot: document.getElementById('tTot'),
      verdetto: document.getElementById('tVerdetto'), passo: document.getElementById('bancoPasso'),
      bar: { budget:document.getElementById('bBudget'), camere:document.getElementById('bCamere'),
             zona:document.getElementById('bZona') },
      num: { budget:document.getElementById('nBudget'), camere:document.getElementById('nCamere'),
             zona:document.getElementById('nZona') }
    };
    var i = -1, contatore = null, vivo = false;

    function mostra(k, anima) {
      var c = CICLO[k]; i = k;
      el.nome.textContent = c.nome;
      el.fonte.textContent = c.fonte;
      el.riga.textContent = c.riga;
      el.passo.textContent = (k + 1) + ' / ' + CICLO.length;
      Object.keys(TETTO).forEach(function (n) {
        el.bar[n].style.width = (c[n] / TETTO[n] * 100) + '%';
        el.bar[n].parentNode.classList.toggle('zero', c[n] === 0);
        el.num[n].textContent = c[n] + '/' + TETTO[n];
      });
      el.verdetto.className = 'verdetto ' + c.esito;
      el.verdetto.textContent = c.voce;
      if (!anima) { el.tot.innerHTML = c.tot + '<em>/100</em>'; return; }
      /* il totale sale, non appare: il conteggio è la sostanza del riquadro */
      var da = 0, t0 = 0;
      function su(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / 750);
        var v = Math.round(da + (c.tot - da) * (1 - Math.pow(1 - p, 3)));
        el.tot.innerHTML = v + '<em>/100</em>';
        if (p < 1 && i === k) requestAnimationFrame(su);
      }
      requestAnimationFrame(su);
    }

    function passa(k) {
      banco.classList.remove('scansiona');
      void banco.offsetWidth;
      banco.classList.add('scansiona');
      setTimeout(function () { mostra(k, true); }, 420);
    }

    if (ridotto || !('IntersectionObserver' in window)) { mostra(0, false); return; }
    mostra(0, false);

    function avvia() {
      if (contatore) return;
      contatore = setInterval(function () {
        if (document.hidden || !vivo) return;
        passa((i + 1) % CICLO.length);
      }, 4200);
    }
    /* soglia zero: sul telefono il riquadro è più alto della finestra e con
       una soglia alta il ciclo si sarebbe fermato proprio mentre lo si legge */
    new IntersectionObserver(function (r) {
      vivo = r[0].isIntersecting;
      if (vivo) { passa(0); avvia(); }
    }, { threshold: 0 }).observe(banco);
  })();

  /* ══ IL CERCATORE ════════════════════════════════════════════════════
     ⌘K. Cerca fra le case del catalogo, i servizi e le sezioni — cioè fra
     le sole cose che qualcuno può volere qui. Un numero cerca un prezzo:
     «1200» dà tutto ciò che costa fino a lì. */
  (function () {
    var box = document.getElementById('cercatore');
    var campo = document.getElementById('cercaInput');
    var lista = document.getElementById('cercaLista');
    var tasto = document.getElementById('apriCerca');
    if (!box || !campo || !lista) return;
    var SERVIZI = [
      { t:'Property Finding', s:'The Radar on your search · options in 10 days or refunded', p:'€350', u:'/property-finding.html' },
      { t:'Deal Assistance', s:'Contract checked, owner verified, negotiation handled', p:'€249', u:'/deal-assistance.html' },
      { t:'Virtual Viewing', s:'Live video walk-through, you direct the camera', p:'€89', u:'/virtual-viewing.html' },
      { t:'Deposit Recovery', s:'Art. 1590 c.c. · nothing recovered, nothing further owed', p:'€99 + 20%', u:'/deal-assistance.html' },
      { t:'Concierge', s:'Cleaning, repairs, utilities — after the keys', p:'from €60', u:'/concierge.html' }
    ];
    var VAI = [
      { t:'The homes', s:'Our catalogue, filmed in person', u:'#case' },
      { t:'The Radar', s:'How we hunt · weights, threshold and rules', u:'#radar' },
      { t:'How it works', s:'Four moves, every price up front', u:'#catena' },
      { t:'Prices', s:'The whole list, on the homepage', u:'#listino' }
    ];
    var voci = [], mira = 0, aperto = false;

    function raccogli() {
      var out = CASE.righe.concat(CASE.altre || []).map(function (h) {
        return { g:'Homes', t:h.nome, s:[h.zona, h.tipo, h.sqm !== '—' ? h.sqm + ' m²' : '']
          .filter(Boolean).join(' · '), p:h.prezzo + '/mo', u:h.url || '/apartments.html' };
      });
      SERVIZI.forEach(function (x) { out.push({ g:'Services', t:x.t, s:x.s, p:x.p, u:x.u }); });
      VAI.forEach(function (x) { out.push({ g:'Go to', t:x.t, s:x.s, p:'', u:x.u }); });
      return out;
    }
    function cerca(q) {
      q = (q || '').trim().toLowerCase();
      var tutte = raccogli();
      if (!q) return tutte;
      var n = q.replace(/[^\d]/g, '');
      return tutte.filter(function (v) {
        if ((v.t + ' ' + v.s + ' ' + v.p).toLowerCase().indexOf(q) >= 0) return true;
        if (n && n.length >= 3 && v.g === 'Homes') {
          var pr = +String(v.p).replace(/[^\d]/g, '');
          return pr && pr <= +n;
        }
        return false;
      });
    }
    function disegna(q) {
      voci = cerca(q); mira = 0;
      if (!voci.length) {
        lista.innerHTML = '<p class="cercatore-nulla">Nothing with that name yet — tell us ' +
          'what you need and the Radar goes and looks for it.</p>';
        return;
      }
      var html = '', gruppo = '';
      voci.forEach(function (v, i) {
        if (v.g !== gruppo) { gruppo = v.g; html += '<div class="cercatore-gruppo">' + gruppo + '</div>'; }
        html += '<a class="cv' + (i === 0 ? ' mirata' : '') + '" role="option" href="' +
          v.u + '"><span class="cv-t"><b>' + v.t + '</b><span>' + v.s + '</span></span>' +
          (v.p ? '<span class="cv-p">' + v.p + '</span>' : '') + '</a>';
      });
      lista.innerHTML = html;
    }
    function punta(i) {
      var el = [].slice.call(lista.querySelectorAll('.cv'));
      if (!el.length) return;
      mira = (i + el.length) % el.length;
      el.forEach(function (x, k) { x.classList.toggle('mirata', k === mira); });
      el[mira].scrollIntoView({ block:'nearest' });
    }
    function apri() {
      aperto = true; box.classList.add('aperto');
      document.body.style.overflow = 'hidden';
      campo.value = ''; disegna('');
      setTimeout(function () { campo.focus(); }, 60);
    }
    function chiudi() { aperto = false; box.classList.remove('aperto'); document.body.style.overflow = ''; }
    if (tasto) {
      tasto.addEventListener('click', apri);
      tasto.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); apri(); }
      });
    }
    box.addEventListener('click', function (e) { if (e.target === box) chiudi(); });
    campo.addEventListener('input', function () { disegna(campo.value); });
    addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); aperto ? chiudi() : apri(); return;
      }
      if (!aperto) return;
      if (e.key === 'Escape') { e.preventDefault(); chiudi(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); punta(mira + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); punta(mira - 1); }
      else if (e.key === 'Enter') {
        var el = lista.querySelectorAll('.cv')[mira];
        if (el) { e.preventDefault(); chiudi(); el.click(); }
      }
    });
  })();
})();
</script>
