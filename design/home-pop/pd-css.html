<title>BOOM — Apartments for Rent in Rome</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   BOOM · POP — Déco ultra tech, alzato di volume.

   Il Déco resta la disciplina (lacca nera, ottone brunito, Helvetica Neue,
   incisione). Cambia la SCALA: qui i numeri sono enormi, i piani d'ottone
   sono pieni e non a filo, i contrasti sono duri. Non è chiassoso: è
   deciso. Un manifesto, non un opuscolo.

   E cambia soprattutto COSA si racconta. Fin qui il PFS era una riga da
   €350 in un listino. È la cosa più innovativa che avete, e qui si apre:
   si mostrano i pesi veri del motore (budget 50, camere 30, zona 20),
   la soglia vera (60), le regole vere (le agenzie non si spingono mai) e
   la verità scomoda — la maggior parte di quello che troviamo non ve lo
   facciamo nemmeno vedere. Vendere dicendo come funziona davvero è più
   forte di qualunque aggettivo.
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  --nero:      #08070A;
  --nero-2:    #0D0C10;
  --nero-3:    #131218;
  --oro:       #D4AF37;
  --oro-alto:  #F3E1A8;
  --oro-cupo:  #7E6524;
  --brunito:   linear-gradient(96deg,#7E6524,#F3E1A8 30%,#D4AF37 58%,#7E6524);
  /* sui piani larghi il brunito stretto brucia da una parte e affoga
     dall'altra: questo tiene la luce alta su tutta la lastra, così il
     nero sopra resta leggibile da bordo a bordo. */
  --lastra:    linear-gradient(96deg,#B98F27,#F0DC9E 30%,#E0C463 62%,#B58F2A);
  --luce:      #FBF9F4;
  --luce-2:    rgba(251,249,244,.66);
  --luce-3:    rgba(251,249,244,.4);
  --luce-4:    rgba(251,249,244,.16);
  --filo:      rgba(251,249,244,.13);
  --filo-2:    rgba(251,249,244,.07);
  --filo-oro:  rgba(212,175,55,.34);
  --vivo:      #6FE29B;
  --rosso:     #FF6B4A;
  --ease:      cubic-bezier(.16,1,.3,1);
  --testo:     "Helvetica Neue", Helvetica, Inter, Arial, sans-serif;
  --dati:      ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { background:var(--nero); color:var(--luce); font-family:var(--testo);
  font-weight:300; font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; }
img { max-width:100%; display:block; }
a { color:inherit; text-decoration:none; }
button, input { font:inherit; color:inherit; background:none; border:0; }
::selection { background:var(--oro); color:var(--nero); }
:focus-visible { outline:2px solid var(--oro); outline-offset:3px; }
.wrap { width:100%; max-width:1360px; margin:0 auto; padding:0 clamp(18px,3.4vw,52px); }

.salta { position:fixed; top:12px; left:12px; z-index:400; padding:14px 26px;
  background:var(--oro); color:var(--nero); font-size:11px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; transform:translateY(-220%);
  transition:transform .3s var(--ease); }
.salta:focus-visible { transform:none; }

/* ── LA VOCE ─────────────────────────────────────────────────────────── */
.eti { display:inline-block; padding:6px 13px; background:var(--oro); color:var(--nero);
  font-family:var(--dati); font-size:10px; font-weight:600; letter-spacing:.2em;
  text-transform:uppercase; }
.eti.vuota { background:none; color:var(--oro); padding:0;
  box-shadow:inset 0 0 0 1px var(--filo-oro); padding:6px 13px; }
.urlo { font-weight:200; font-size:clamp(38px,5.6vw,80px); line-height:.96;
  letter-spacing:-.045em; text-transform:uppercase; text-wrap:balance; }
.urlo em { font-style:normal; color:var(--oro-alto); }
.grido { font-weight:200; font-size:clamp(28px,4.2vw,58px); line-height:1.0;
  letter-spacing:-.04em; text-transform:uppercase; text-wrap:balance; }
.grido em { font-style:normal; color:var(--oro-alto); }
.guida { font-size:17px; line-height:1.62; color:var(--luce-2); max-width:52ch; }
.dato { font-family:var(--dati); font-size:11px; letter-spacing:.1em;
  font-variant-numeric:tabular-nums; color:var(--luce-3); }
.sezione { position:relative; padding:clamp(56px,7vw,110px) 0; }
.riga-forte { border-top:3px solid var(--oro); }
.riga-filo { border-top:1px solid var(--filo); }

/* ── I BOTTONI ───────────────────────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:11px;
  padding:17px 32px; font-family:var(--dati); font-size:12px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; cursor:pointer;
  transition:transform .3s var(--ease), background .3s ease, box-shadow .3s ease; }
.btn-oro { background:var(--oro); color:var(--nero); }
.btn-oro:hover { background:var(--oro-alto); transform:translateY(-2px); }
.btn-filo { box-shadow:inset 0 0 0 2px var(--filo); }
.btn-filo:hover { box-shadow:inset 0 0 0 2px var(--oro); color:var(--oro-alto);
  transform:translateY(-2px); }
.btn-nero { background:var(--nero); color:var(--luce); }
.btn-nero:hover { background:var(--nero-3); transform:translateY(-2px); }

/* ── LA TESTATA ──────────────────────────────────────────────────────── */
.barra { position:fixed; top:0; left:0; right:0; z-index:100; padding:13px 0;
  transition:background .35s ease, box-shadow .35s ease; }
.barra.posata { background:rgba(8,7,10,.9); backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px); box-shadow:0 1px 0 var(--filo-2); }
.barra-in { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.marchio { display:inline-flex; align-items:center; gap:11px; }
.marchio .logo-mark { width:34px; height:34px; flex:none; }
.marchio span { font-size:15px; font-weight:500; letter-spacing:.28em; text-indent:.28em;
  text-transform:uppercase; }
.menu { display:none; align-items:center; gap:22px; }
@media (min-width:1080px){ .menu { display:flex; } }
.menu a { font-family:var(--dati); font-size:11px; font-weight:500; letter-spacing:.12em;
  text-transform:uppercase; color:var(--luce-3); transition:color .25s ease; }
.menu a:hover { color:var(--luce); }
.menu .cerca { display:inline-flex; align-items:center; gap:9px; padding:9px 14px;
  box-shadow:inset 0 0 0 1px var(--filo); cursor:pointer; }
.menu .cerca kbd { font:inherit; font-size:10px; color:var(--luce-4); }
.menu .btn { padding:11px 18px; font-size:11px; }
.apri { display:inline-flex; flex-direction:column; gap:5px; width:42px; height:42px;
  align-items:center; justify-content:center; cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--filo); }
@media (min-width:1080px){ .apri { display:none; } }
.apri i { width:17px; height:2px; background:var(--luce);
  transition:transform .3s var(--ease), opacity .2s; }
html.aperto .apri i:nth-child(1){ transform:translateY(7px) rotate(45deg); }
html.aperto .apri i:nth-child(2){ opacity:0; }
html.aperto .apri i:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
.tenda { position:fixed; inset:0; z-index:99; padding:92px clamp(18px,3.4vw,52px) 34px;
  background:rgba(8,7,10,.98); backdrop-filter:blur(20px); overflow-y:auto;
  display:flex; flex-direction:column; opacity:0; visibility:hidden;
  transform:translateY(-8px);
  transition:opacity .3s ease, transform .4s var(--ease), visibility .3s; }
html.aperto .tenda { opacity:1; visibility:visible; transform:none; }
.tenda a { padding:16px 2px; font-size:20px; font-weight:250; letter-spacing:-.01em;
  text-transform:uppercase; border-bottom:1px solid var(--filo-2); }
.tenda .btn { margin-top:22px; }

/* ══ 1 · IL MANIFESTO ══════════════════════════════════════════════════ */
.scena { position:relative; padding:clamp(104px,14vh,168px) 0 0; overflow:hidden; }
.scena-in { display:grid; grid-template-columns:1fr; gap:clamp(24px,3vw,50px);
  align-items:end; }
@media (min-width:1080px){
  .scena-in { grid-template-columns:minmax(0,1.06fr) minmax(480px,.94fr);
    align-items:center; } }
.scena .urlo { margin-top:20px; }
.scena-sotto { margin-top:22px; max-width:40ch; font-size:17px; color:var(--luce-2); }
.scena-azioni { margin-top:28px; display:flex; gap:11px; flex-wrap:wrap; }

/* la fascia dei numeri: piena d'ottone, nera dentro. Questo è il pop. */
.fascia { margin-top:clamp(38px,5vw,64px); background:var(--lastra); color:var(--nero); }
.fascia-in { display:grid; grid-template-columns:repeat(2,1fr); gap:0; }
@media (min-width:820px){ .fascia-in { grid-template-columns:repeat(4,1fr); } }
.fascia-in > div { padding:clamp(18px,2.4vw,30px) clamp(16px,2vw,26px);
  border-left:1px solid rgba(8,7,10,.16); }
.fascia-in > div:first-child { border-left:0; padding-left:0; }
.fascia-in > div:last-child { padding-right:0; }
@media (max-width:819px){ .fascia-in > div:nth-child(3) { border-left:0; padding-left:0; }
  .fascia-in > div:nth-child(n+3) { border-top:1px solid rgba(8,7,10,.16); } }
.fascia b { display:block; font-size:clamp(34px,4.6vw,58px); font-weight:250;
  line-height:.94; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
.fascia small { display:block; margin-top:9px; font-family:var(--dati); font-size:10px;
  font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:rgba(8,7,10,.74); }

/* ── IL TABELLONE ────────────────────────────────────────────────────── */
.quadro { background:var(--nero-2); box-shadow:inset 0 0 0 2px var(--filo-oro); }
.quadro-cima { display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:14px 18px; border-bottom:1px solid var(--filo-2); }
.quadro-eti { display:inline-flex; align-items:center; gap:9px; font-family:var(--dati);
  font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
  color:var(--oro); }
.quadro-eti i { font-style:normal; width:6px; height:6px; background:var(--oro);
  animation:battito 1.8s steps(1) infinite; }
@keyframes battito { 50% { opacity:.2; } }
#quadroOra { font-family:var(--dati); font-size:12px; }
.colonne, .riga { display:grid; grid-template-columns:58px minmax(0,1fr) 50px 78px 68px;
  gap:clamp(8px,1.2vw,16px); align-items:center; padding:0 18px; }
.colonne { padding-top:12px; padding-bottom:9px; font-family:var(--dati); font-size:9px;
  font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--luce-4); }
.riga { position:relative; width:100%; text-align:left; cursor:pointer;
  padding-top:13px; padding-bottom:13px; border-top:1px solid var(--filo-2);
  transition:background .3s var(--ease); }
.riga::before { content:''; position:absolute; left:0; top:-1px; bottom:0; width:3px;
  background:var(--oro); transform:scaleY(0); transform-origin:top;
  transition:transform .4s var(--ease); }
.riga:hover { background:rgba(212,175,55,.06); }
.riga.scelta { background:rgba(212,175,55,.09); }
.riga.scelta::before { transform:scaleY(1); }
.cella { font-size:12px; overflow:hidden; }
.c-stato { color:var(--vivo); }
.riga.nuovo .c-stato { color:var(--oro-alto); }
.quadro-piede { display:flex; align-items:center; justify-content:space-between; gap:12px;
  flex-wrap:wrap; padding:12px 18px; border-top:1px solid var(--filo-2);
  font-family:var(--dati); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--luce-4); }
.quadro-piede b { color:var(--oro); font-weight:600; }
.riga-ferma { display:grid; grid-template-columns:58px minmax(0,1fr) 50px 78px 68px;
  gap:16px; align-items:center; padding:13px 18px; border-top:1px solid var(--filo-2);
  font-size:12px; }
@media (max-width:880px){
  .colonne, .riga, .riga-ferma { grid-template-columns:52px minmax(0,1fr) 76px; gap:10px; }
  .colonne span:nth-child(3), .riga .c-tipo, .riga-ferma span:nth-child(3),
  .colonne span:nth-child(5), .riga .c-stato, .riga-ferma span:nth-child(5) { display:none; }
  .riga .c-zona { padding-right:8px; }
}

/* ══ 2 · LE CASE ═══════════════════════════════════════════════════════ */
.testata { display:grid; grid-template-columns:1fr; gap:22px; align-items:end; }
@media (min-width:1000px){ .testata { grid-template-columns:minmax(0,1fr) auto;
  gap:clamp(28px,4vw,70px); } }
.testata .grido { margin-top:16px; }
.testata .guida { margin-top:16px; }
.case { margin-top:clamp(30px,4vw,52px); display:grid; grid-template-columns:1fr; gap:1px;
  background:var(--filo-2); }
@media (min-width:680px){ .case { grid-template-columns:repeat(2,1fr); } }
@media (min-width:1080px){ .case { grid-template-columns:repeat(3,1fr); } }
.casa { position:relative; display:block; background:var(--nero);
  transition:background .4s var(--ease); }
.casa:hover { background:var(--nero-2); }
.casa-foto { position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--nero-3); }
.casa-foto img { width:100%; height:100%; object-fit:cover;
  transition:transform 1.4s var(--ease); }
.casa:hover .casa-foto img { transform:scale(1.05); }
.casa-foto.senza img { display:none; }
.casa-foto.senza { background:
  repeating-linear-gradient(114deg, rgba(212,175,55,.06) 0 1px, transparent 1px 15px), var(--nero-3); }
.casa-n { position:absolute; left:0; top:0; z-index:2; padding:9px 15px;
  background:var(--oro); color:var(--nero); font-family:var(--dati); font-size:11px;
  font-weight:700; letter-spacing:.14em; }
.casa-tag { position:absolute; right:0; top:0; z-index:2; padding:9px 14px;
  background:rgba(8,7,10,.78); backdrop-filter:blur(8px); font-family:var(--dati);
  font-size:9.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--oro-alto); }
.casa-corpo { padding:20px 20px 22px; }
.casa-zona { font-family:var(--dati); font-size:10px; font-weight:600; letter-spacing:.2em;
  text-transform:uppercase; color:var(--oro); }
.casa-nome { margin-top:10px; font-size:21px; font-weight:250; letter-spacing:-.02em; }
.casa-dati { margin-top:11px; font-family:var(--dati); font-size:11.5px; color:var(--luce-3); }
.casa-piede { margin-top:16px; padding-top:15px; border-top:1px solid var(--filo-2);
  display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.casa-prezzo { font-size:26px; font-weight:250; letter-spacing:-.03em; color:var(--oro-alto);
  font-variant-numeric:tabular-nums; }
.casa-prezzo small { font-size:12px; color:var(--luce-4); }
.casa-vai { font-family:var(--dati); font-size:10px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--luce-4); transition:color .3s ease; }
.casa:hover .casa-vai { color:var(--oro-alto); }
.coda { margin-top:clamp(30px,3.6vw,48px); }

/* ══ 3 · IL RADAR — il PFS, aperto ═════════════════════════════════════ */
.radar { background:var(--nero-2); border-top:3px solid var(--oro); }
.radar-orari { margin-top:clamp(28px,3.4vw,46px); display:grid; grid-template-columns:1fr;
  gap:1px; background:var(--filo-2); }
@media (min-width:700px){ .radar-orari { grid-template-columns:repeat(2,1fr); } }
@media (min-width:1080px){ .radar-orari { grid-template-columns:repeat(4,1fr); } }
.orario { background:var(--nero-2); padding:20px 20px 22px; }
.orario b { display:block; font-family:var(--dati); font-size:20px; font-weight:600;
  letter-spacing:-.01em; color:var(--oro-alto); font-variant-numeric:tabular-nums; }
.orario span { display:block; margin-top:9px; font-size:13.5px; line-height:1.6;
  color:var(--luce-2); }
.orario small { display:block; margin-top:9px; font-family:var(--dati); font-size:9.5px;
  font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--luce-4); }

/* IL MOTORE — i pesi veri, esposti. Il pezzo forte. */
.motore { margin-top:clamp(30px,4vw,56px); display:grid; grid-template-columns:1fr;
  gap:clamp(22px,2.6vw,42px); align-items:start; }
@media (min-width:980px){ .motore { grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); }
  .banco { position:sticky; top:88px; } }
.banco { position:relative; background:var(--nero); box-shadow:inset 0 0 0 2px var(--filo-oro);
  overflow:hidden; }
.banco-cima { display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px; border-bottom:1px solid var(--filo-2); font-family:var(--dati);
  font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
  color:var(--oro); }
.banco-cima span:last-child { color:var(--luce-4); }
/* la lama che scorre: una scansione, non un loop decorativo */
.scia { position:absolute; top:0; bottom:0; width:2px; background:var(--oro);
  box-shadow:0 0 22px 4px rgba(212,175,55,.45); opacity:0; left:0; }
.banco.scansiona .scia { animation:scansione 1.15s linear both; }
@keyframes scansione { 0% { left:0; opacity:.9; } 100% { left:100%; opacity:0; } }
.trovato { padding:22px 20px 24px; }
.trovato-cima { display:flex; align-items:baseline; justify-content:space-between;
  gap:14px; flex-wrap:wrap; }
.trovato-nome { font-size:clamp(19px,2.1vw,25px); font-weight:250; letter-spacing:-.022em; }
.trovato-fonte { font-family:var(--dati); font-size:10px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--luce-4); }
.trovato-riga { margin-top:8px; font-family:var(--dati); font-size:12px; color:var(--luce-3); }
.pesi { margin-top:22px; display:grid; gap:14px; }
.peso { display:grid; grid-template-columns:104px minmax(0,1fr) 58px; gap:14px;
  align-items:center; }
.peso small { font-family:var(--dati); font-size:10px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--luce-3); }
.peso-barra { position:relative; height:10px; background:rgba(251,249,244,.07); }
.peso-barra i { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--brunito);
  transition:width .8s var(--ease); }
.peso-barra.zero i { background:rgba(251,249,244,.14); }
.peso b { font-family:var(--dati); font-size:14px; font-weight:600; text-align:right;
  font-variant-numeric:tabular-nums; }
.somma { margin-top:22px; padding-top:20px; border-top:1px solid var(--filo-2);
  display:flex; align-items:flex-end; justify-content:space-between; gap:18px;
  flex-wrap:wrap; }
.somma-tot small { display:block; font-family:var(--dati); font-size:10px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--luce-4); margin-bottom:6px; }
.somma-tot b { font-size:clamp(48px,6vw,84px); font-weight:200; line-height:.9;
  letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
.somma-tot b em { font-style:normal; font-size:.34em; color:var(--luce-4); }
.verdetto { padding:12px 20px; font-family:var(--dati); font-size:12px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; }
.verdetto.spinto { background:var(--vivo); color:var(--nero); }
.verdetto.sotto  { background:rgba(251,249,244,.12); color:var(--luce-2); }
.verdetto.veto   { background:var(--rosso); color:var(--nero); }
.banco-piede { padding:14px 20px; border-top:1px solid var(--filo-2);
  font-family:var(--dati); font-size:10px; line-height:1.7; letter-spacing:.08em;
  color:var(--luce-3); }

/* le regole scomode, dette in faccia */
.regole { display:grid; gap:1px; background:var(--filo-2); }
.regola { background:var(--nero-2); padding:20px 20px 22px; }
.regola b { display:block; font-size:15px; font-weight:500; letter-spacing:-.006em; }
.regola p { margin-top:9px; font-size:13.5px; line-height:1.66; color:var(--luce-2); }
.regola i { display:block; margin-top:11px; font-family:var(--dati); font-size:10px;
  font-weight:600; letter-spacing:.14em; text-transform:uppercase; font-style:normal;
  color:var(--oro); }
.radar-chiusa { margin-top:clamp(28px,3.4vw,46px); display:grid; grid-template-columns:1fr;
  gap:20px; align-items:center; background:var(--lastra); color:var(--nero);
