<title>BOOM — Studio sfondi: cinque direzioni</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --oro:#FFD700; --oro-l:#F5E28A; --nero:#030303; --line:rgba(255,255,255,.08);
  --line-oro:rgba(255,215,0,.22); --t1:#FAFAF8; --t2:rgba(250,250,248,.62);
  --t3:rgba(250,250,248,.4);
  --display:'Helvetica Neue',Helvetica,'Inter',-apple-system,Arial,sans-serif;
  --sans:'Inter','Helvetica Neue',-apple-system,BlinkMacSystemFont,sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { background:var(--nero); color:var(--t1); font:300 15px/1.6 var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased; }
#tela { position:fixed; inset:0; width:100%; height:100%; }
.velo { position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 108%, rgba(3,3,3,.92), transparent 42%); }

/* l'hero di prova: il contenuto vero sopra lo sfondo in esame */
.palco { position:fixed; inset:0; display:grid; place-items:center; padding:24px; }
.voce { max-width:760px; text-align:center; transform:translateY(-4vh); }
.occhio { display:inline-flex; align-items:center; gap:9px; padding:8px 15px;
  box-shadow:inset 0 0 0 1px var(--line-oro); border-radius:100px;
  font-size:10px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  color:var(--oro); }
.occhio b { width:6px; height:6px; border-radius:50%; background:#5CFFAE;
  animation:batti 2.2s ease infinite; }
@keyframes batti { 50% { opacity:.3; } }
h1 { margin-top:22px; font-family:var(--display); font-weight:200;
  font-size:clamp(37px,7.2vw,64px); line-height:1.07; letter-spacing:-.02em; }
h1 .hl { color:var(--oro); }
h1 .flap { display:inline-block; padding:.04em .18em; margin:0 .06em;
  background:#101012; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),
    inset 0 -1.2em 0 rgba(0,0,0,.3); border-radius:.12em; color:var(--oro);
  letter-spacing:.14em; }
.sotto { margin-top:16px; font-size:clamp(14px,1.6vw,16.5px); color:var(--t2); }
.azioni { margin-top:26px; display:flex; gap:12px; justify-content:center;
  flex-wrap:wrap; }
.btn { display:inline-block; padding:15px 28px; font-size:11px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; text-decoration:none;
  border-radius:100px; }
.btn-oro { background:var(--oro); color:#000; }
.btn-filo { color:var(--t2); box-shadow:inset 0 0 0 1px var(--line); }

/* la regia: le cinque direzioni */
.regia { position:fixed; left:0; right:0; bottom:0; z-index:10;
  padding:14px clamp(12px,3vw,28px) calc(14px + env(safe-area-inset-bottom));
  display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; background:linear-gradient(transparent, rgba(3,3,3,.88) 40%); }
.regia::-webkit-scrollbar { display:none; }
.scelta { flex:none; display:flex; flex-direction:column; gap:2px;
  padding:11px 16px 10px; background:rgba(10,10,12,.82);
  box-shadow:inset 0 0 0 1px var(--line); border-radius:14px; color:var(--t2);
  font:inherit; cursor:pointer; text-align:left; transition:.25s;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.scelta b { font-size:10px; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; color:var(--t3); transition:.25s; }
.scelta span { font-size:12.5px; color:var(--t2); white-space:nowrap; }
.scelta.on { box-shadow:inset 0 0 0 1px var(--oro); color:var(--t1); }
.scelta.on b { color:var(--oro); }
.titolo-studio { position:fixed; top:0; left:0; right:0; z-index:10;
  display:flex; justify-content:space-between; align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) clamp(14px,3vw,28px) 12px;
  background:linear-gradient(rgba(3,3,3,.8), transparent); }
.titolo-studio b { font-family:var(--display); font-weight:300; font-size:15px;
  letter-spacing:.4em; }
.titolo-studio span { font-size:9.5px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--t3); }
</style>

<canvas id="tela"></canvas>
<div class="velo"></div>

<div class="palco">
  <div class="voce">
    <span class="occhio"><b></b>Premium Rentals in Rome</span>
    <h1>GET YOUR <span class="hl">ROME</span> APARTMENT<br>
      IN <span class="flap">DAYS</span>, NOT WEEKS.</h1>
    <p class="sotto">Video-verified. Transparent pricing. Real support.</p>
    <div class="azioni"><a class="btn btn-oro">View Apartments</a>
      <a class="btn btn-filo">How It Works</a></div>
  </div>
</div>

<div class="titolo-studio"><b>BOOM</b><span id="nomeVia">Studio sfondi</span></div>
<div class="regia" id="regia"></div>

<script>
(function () {
  'use strict';
  var tela = document.getElementById('tela');
  var ctx = tela.getContext('2d');
  var ridotto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, DPR, MIN;
  function misura() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
    tela.width = W; tela.height = H; MIN = Math.min(W, H);
  }
  misura();
  addEventListener('resize', function () { misura(); if (attiva) attiva.su(); });

  var ORO = '255,215,0', LATTE = '250,248,240';
  /* un pennello morbido pre-disegnato: i glow senza shadowBlur */
  function alone(r, colore, forza) {
    var c = document.createElement('canvas'); c.width = c.height = r * 2;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, 'rgba(' + colore + ',' + forza + ')');
    gr.addColorStop(1, 'rgba(' + colore + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
    return c;
  }

  /* ══ 01 · IL BATTITO — il radar centrale, da orologeria ═══════════════ */
  function Battito() {
    var glow;
    this.su = function () { glow = alone(MIN * .5, ORO, .10); };
    this.dip = function (t) {
      ctx.clearRect(0, 0, W, H);
      var cx = W * .5, cy = H * .44;
      /* il respiro del cuore */
      var respiro = .9 + .1 * Math.sin(t * .0009);
      ctx.globalAlpha = respiro;
      ctx.drawImage(glow, cx - MIN * .5, cy - MIN * .5);
      ctx.globalAlpha = 1;
      /* tre ghiere ferme: la struttura, come una lunetta d'orologio */
      for (var i = 1; i <= 3; i++) {
        var rg = MIN * .16 * i;
        ctx.strokeStyle = 'rgba(' + ORO + ',' + (0.10 - i * .02) + ')';
        ctx.lineWidth = DPR;
        ctx.beginPath(); ctx.arc(cx, cy, rg, 0, 6.29); ctx.stroke();
        /* le tacche cardinali sulla ghiera */
        for (var k = 0; k < 12; k++) {
          var a = k * Math.PI / 6;
          var lung = (k % 3 === 0 ? 7 : 3.5) * DPR;
          ctx.strokeStyle = 'rgba(' + ORO + ',' + (k % 3 === 0 ? .22 : .1) + ')';
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * rg, cy + Math.sin(a) * rg);
          ctx.lineTo(cx + Math.cos(a) * (rg - lung), cy + Math.sin(a) * (rg - lung));
          ctx.stroke();
        }
        /* la luce che percorre la ghiera — il riflesso sulla lunetta */
        var la = (ridotto ? 0 : t * .00022) * (i % 2 ? 1 : -1) + i * 2.1;
        var grd = ctx.createLinearGradient(
          cx + Math.cos(la) * rg, cy + Math.sin(la) * rg,
          cx + Math.cos(la + 1.2) * rg, cy + Math.sin(la + 1.2) * rg);
        grd.addColorStop(0, 'rgba(' + ORO + ',0)');
        grd.addColorStop(.5, 'rgba(' + ORO + ',.34)');
        grd.addColorStop(1, 'rgba(' + ORO + ',0)');
        ctx.strokeStyle = grd; ctx.lineWidth = 1.4 * DPR;
        ctx.beginPath(); ctx.arc(cx, cy, rg, la - .5, la + 1.7); ctx.stroke();
      }
      /* i battiti: anelli che nascono e si spengono planando */
      if (!ridotto) for (var b = 0; b < 3; b++) {
        var p = ((t * .00016) + b / 3) % 1;
        var e = 1 - Math.pow(1 - p, 2.2);
        var rr = MIN * (.05 + e * .58);
        ctx.strokeStyle = 'rgba(' + ORO + ',' + (.30 * (1 - p)) + ')';
        ctx.lineWidth = (1.8 - p) * DPR;
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.29); ctx.stroke();
      }
      /* il cuore */
      var cb = .55 + .45 * Math.sin(t * .0018);
      ctx.fillStyle = 'rgba(255,244,200,' + (.5 + cb * .4) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, 2.2 * DPR, 0, 6.29); ctx.fill();
    };
  }

  /* ══ 02 · L'ONDA SOLARI — il tabellone infinito che respira ═══════════ */
  function Onda() {
    var CEL, GAP, cols, rows, brilli;
    this.su = function () {
      CEL = Math.round((innerWidth < 640 ? 30 : 40) * DPR);
      GAP = Math.round(7 * DPR);
      cols = Math.ceil(W / (CEL + GAP)) + 1;
      rows = Math.ceil(H / (CEL * .72 + GAP)) + 1;
      brilli = [];
      for (var i = 0; i < 14; i++) brilli.push({
        c: Math.floor(Math.random() * cols),
        r: Math.floor(Math.random() * rows),
        fase: Math.random() * 20000 });
    };
    this.dip = function (t) {
      ctx.clearRect(0, 0, W, H);
      var ch = CEL * .72;
      /* il fronte d'onda: attraversa il campo in diagonale */
      var fronte = ridotto ? -1 : ((t * .00012) % 1.6) * (W + H) - H * .3;
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
        var x = c * (CEL + GAP), y = r * (ch + GAP);
        var d = Math.abs((x + y * .8) - fronte);
        var vicino = Math.max(0, 1 - d / (MIN * .22));
        var forza = .028 + vicino * vicino * .12;
        ctx.fillStyle = 'rgba(' + LATTE + ',' + forza + ')';
        ctx.beginPath();
        ctx.roundRect(x, y, CEL, ch, 3 * DPR);
        ctx.fill();
        /* la linea del flap a metà cella */
        if (vicino > .12) {
          ctx.fillStyle = 'rgba(3,3,3,.5)';
          ctx.fillRect(x, y + ch * .48, CEL, DPR);
        }
      }
      /* i brilli: qualche cella d'oro, come lettere che girano */
      brilli.forEach(function (b) {
        var p = ((t + b.fase) % 9000) / 9000;
        if (p > .2) return;
        var a = Math.sin(p / .2 * Math.PI);
        ctx.fillStyle = 'rgba(' + ORO + ',' + (a * .5) + ')';
        ctx.beginPath();
        ctx.roundRect(b.c * (CEL + GAP), b.r * (ch + GAP), CEL, ch, 3 * DPR);
        ctx.fill();
      });
    };
  }

  /* ══ 03 · LA VOLTA — il Pantheon dal basso, la luce dell'oculo ════════ */
  function Volta() {
    var cx, cy;
    this.su = function () { cx = W * .5; cy = H * .40; };
    this.dip = function (t) {
      ctx.clearRect(0, 0, W, H);
      /* i cassettoni: cinque anelli di trapezi in prospettiva */
      for (var anello = 0; anello < 5; anello++) {
        var r0 = MIN * (.13 + anello * .105);
        var r1 = MIN * (.13 + (anello + .78) * .105);
        var n = 28;
        for (var i = 0; i < n; i++) {
          var a0 = (i / n) * 6.283 + anello * .06;
          var a1 = ((i + .82) / n) * 6.283 + anello * .06;
          ctx.strokeStyle = 'rgba(' + ORO + ',' + (.10 - anello * .014) + ')';
          ctx.lineWidth = DPR;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0 * .92);
          ctx.lineTo(cx + Math.cos(a1) * r0, cy + Math.sin(a1) * r0 * .92);
          ctx.lineTo(cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1 * .92);
          ctx.lineTo(cx + Math.cos(a0) * r1, cy + Math.sin(a0) * r1 * .92);
          ctx.closePath(); ctx.stroke();
        }
      }
      /* l'oculo */
      ctx.strokeStyle = 'rgba(' + ORO + ',.30)'; ctx.lineWidth = 1.4 * DPR;
      ctx.beginPath(); ctx.arc(cx, cy, MIN * .085, 0, 6.29, false);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,248,220,.05)';
      ctx.beginPath(); ctx.arc(cx, cy, MIN * .085, 0, 6.29); ctx.fill();
      /* il raggio di sole: ruota con il giorno */
      var ang = ridotto ? .8 : (t * .00005) % 6.283;
      var lx = Math.cos(ang), ly = Math.sin(ang) * .92;
      var g = ctx.createLinearGradient(cx, cy,
        cx + lx * MIN * .62, cy + ly * MIN * .62);
      g.addColorStop(0, 'rgba(255,244,200,.15)');
      g.addColorStop(1, 'rgba(255,244,200,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang - .22) * MIN * .085,
                 cy + Math.sin(ang - .22) * MIN * .085 * .92);
      ctx.lineTo(cx + Math.cos(ang - .3) * MIN * .62,
                 cy + Math.sin(ang - .3) * MIN * .62 * .92);
      ctx.lineTo(cx + Math.cos(ang + .3) * MIN * .62,
                 cy + Math.sin(ang + .3) * MIN * .62 * .92);
      ctx.lineTo(cx + Math.cos(ang + .22) * MIN * .085,
                 cy + Math.sin(ang + .22) * MIN * .085 * .92);
      ctx.closePath(); ctx.fill();
    };
  }

  /* ══ 04 · TRAIETTORIE — lunghe esposizioni di voli che atterrano ══════ */
  function Rotte() {
    var vie, stelle;
    function nuova(i) {
      var lato = Math.random();
      return {
        x0: -W * .1, y0: H * (.1 + Math.random() * .5),
        cx: W * (.3 + Math.random() * .3), cy: H * (Math.random() * .5),
        x1: W * (.65 + Math.random() * .3), y1: H * (.35 + Math.random() * .45),
        via: performance.now() + (ridotto ? 0 : i * 2600),
        durata: 6800 + Math.random() * 2200 };
    }
    this.su = function () {
      vie = [0, 1, 2].map(function (i) { return nuova(i); });
      stelle = [];
      for (var i = 0; i < 26; i++) stelle.push({
        x: Math.random() * W, y: Math.random() * H * .8,
        r: (Math.random() * .9 + .5) * DPR, fase: Math.random() * 7 });
    };
    this.dip = function (t) {
      ctx.clearRect(0, 0, W, H);
      stelle.forEach(function (s) {
        var b = .1 + .1 * Math.sin(t * .001 + s.fase);
        ctx.fillStyle = 'rgba(' + LATTE + ',' + b + ')';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.29); ctx.fill();
      });
      vie.forEach(function (v, vi) {
        var p = ridotto ? .8 : (t - v.via) / v.durata;
        if (p < 0) return;
        if (p > 1.35) { vie[vi] = nuova(0); vie[vi].via = t + 400; return; }
        var e = Math.min(1, 1 - Math.pow(1 - Math.min(p, 1), 2.4));
        var sve = Math.max(0, (p - 1) / .35);           /* la dissolvenza */
        function qx(tt) { return (1-tt)*(1-tt)*v.x0 + 2*(1-tt)*tt*v.cx + tt*tt*v.x1; }
        function qy(tt) { return (1-tt)*(1-tt)*v.y0 + 2*(1-tt)*tt*v.cy + tt*tt*v.y1; }
        /* la scia intera, sfumata dalla coda alla testa */
        var passi = 60;
        for (var k = 1; k <= passi; k++) {
          var t0 = (k - 1) / passi * e, t1 = k / passi * e;
          var forza = (k / passi) * .5 * (1 - sve);
          ctx.strokeStyle = 'rgba(' + ORO + ',' + forza + ')';
          ctx.lineWidth = (0.6 + (k / passi) * 1.3) * DPR;
          ctx.beginPath();
          ctx.moveTo(qx(t0), qy(t0)); ctx.lineTo(qx(t1), qy(t1));
          ctx.stroke();
        }
        if (p < 1) {
          ctx.fillStyle = 'rgba(255,251,235,.95)';
          ctx.beginPath(); ctx.arc(qx(e), qy(e), 1.8 * DPR, 0, 6.29); ctx.fill();
        } else if (sve < 1) {
          /* l'atterraggio: il bloom sull'arrivo */
          ctx.strokeStyle = 'rgba(' + ORO + ',' + (.5 * (1 - sve)) + ')';
          ctx.lineWidth = 1.2 * DPR;
          ctx.beginPath();
          ctx.arc(v.x1, v.y1, (2 + sve * 26) * DPR, 0, 6.29); ctx.stroke();
        }
      });
    };
  }

  /* ══ 05 · IL TESSUTO — la seta nera e oro, in movimento lentissimo ════ */
  function Tessuto() {
    var b1, b2, b3;
    this.su = function () {
      b1 = alone(MIN * .62, ORO, .13);
      b2 = alone(MIN * .5, '255,236,150', .08);
      b3 = alone(MIN * .45, '250,248,240', .05);
    };
    this.dip = function (t) {
      ctx.clearRect(0, 0, W, H);
      var tt = ridotto ? 0 : t;
      var x1 = W * .62 + Math.sin(tt * .00006) * W * .16,
          y1 = H * .3 + Math.cos(tt * .00008) * H * .12;
      var x2 = W * .25 + Math.cos(tt * .00005) * W * .14,
          y2 = H * .62 + Math.sin(tt * .00007) * H * .14;
      var x3 = W * .5 + Math.sin(tt * .00004 + 2) * W * .2,
          y3 = H * .15 + Math.cos(tt * .00006 + 1) * H * .1;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(b1, x1 - MIN * .62, y1 - MIN * .62);
      ctx.drawImage(b2, x2 - MIN * .5, y2 - MIN * .5);
      ctx.drawImage(b3, x3 - MIN * .45, y3 - MIN * .45);
      ctx.globalCompositeOperation = 'source-over';
      /* il filo d'orizzonte: una sola linea, tesa e viva */
      var oy = H * .78;
      var g = ctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, 'rgba(' + ORO + ',0)');
      g.addColorStop(.5, 'rgba(' + ORO + ',.28)');
      g.addColorStop(1, 'rgba(' + ORO + ',0)');
      ctx.strokeStyle = g; ctx.lineWidth = DPR;
      ctx.beginPath();
      for (var x = 0; x <= W; x += 6 * DPR) {
        var y = oy + Math.sin(x * .002 / DPR + tt * .0006) * 5 * DPR;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    };
  }

  /* ── la regia ────────────────────────────────────────────────────────── */
  var VIE = [
    { id: 'battito', nome: '01', dida: 'Il battito — radar centrale', fac: Battito },
    { id: 'onda', nome: '02', dida: 'L\'onda Solari', fac: Onda },
    { id: 'volta', nome: '03', dida: 'La volta del Pantheon', fac: Volta },
    { id: 'rotte', nome: '04', dida: 'Traiettorie', fac: Rotte },
    { id: 'tessuto', nome: '05', dida: 'Il tessuto nero-oro', fac: Tessuto },
  ];
  var attiva = null, girando = false;
  var regia = document.getElementById('regia');
  var nomeVia = document.getElementById('nomeVia');
  VIE.forEach(function (v, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'scelta';
    b.innerHTML = '<b>' + v.nome + '</b><span>' + v.dida + '</span>';
    b.addEventListener('click', function () { scegli(i); });
    regia.appendChild(b); v.el = b;
  });
  function scegli(i) {
    VIE.forEach(function (v) { v.el.classList.remove('on'); });
    VIE[i].el.classList.add('on');
    nomeVia.textContent = VIE[i].dida;
    attiva = new VIE[i].fac(); attiva.su();
    try { history.replaceState(null, '', '#' + VIE[i].id); } catch (e) {}
    if (ridotto) attiva.dip(0);
  }
  addEventListener('keydown', function (e) {
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= VIE.length) scegli(n - 1);
  });
  function giro(t) {
    if (!girando) return;
    if (attiva && !ridotto) attiva.dip(t);
    requestAnimationFrame(giro);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) girando = false;
    else if (!girando && !ridotto) { girando = true; requestAnimationFrame(giro); }
  });
  var da = location.hash.replace('#', '');
  var idx = Math.max(0, VIE.findIndex(function (v) { return v.id === da; }));
  scegli(idx);
  if (!ridotto) { girando = true; requestAnimationFrame(giro); }
})();
</script>
