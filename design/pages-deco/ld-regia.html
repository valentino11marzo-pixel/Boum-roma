<!-- I MOTORI CONDIVISI. Fino al 31/08/2026 questi quattro tag esistevano
     SOLO dentro apartment-detail.html (aggiunti a mano sul costruito): una
     ricostruzione con costruisci-ld.py li avrebbe persi tutti, e la pagina
     sarebbe caduta sui ripieghi senza che nessuno se ne accorgesse. Il
     template emette cio che la pagina viva usa davvero. -->
<script src="/js/boom-geo.js"></script>
<script src="/js/dispo-engine.js"></script>
<script src="/js/tempi-engine.js"></script>
<script src="/js/mappa-engine.js"></script>
<script>
/* LA REGIA DELLA CASA — una casa alla volta, dal catalogo vero.
   Parte al load: il motore Solari è concatenato DOPO questo script. */
(function () {
  'use strict';
  function via() {
  var CASE = 'CASE_JSON';
  /* sito = le API vere partono davvero; artefatto = PREVIEW in console */
  var VERO = 'MODO_QUI' === 'sito';
  var BS = window.BoomSolari;
  var ridotto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function euro(n) { return '€' + Math.round(n).toLocaleString('en-US'); }
  function per(sel) { return document.querySelector(sel); }

  /* quale casa: quella del server (/listing/:id), dell'indirizzo (#id=)
     o del percorso — e se il catalogo fotografato non la conosce ma il
     server ha mandato il documento (casa pubblicata dal bot DOPO la
     build), si costruisce da quello. Mai un annuncio nuovo orfano. */
  function statoDa(s2, d2) {
    var oggi = new Date().toISOString().slice(0, 10), eti, lib;
    if (s2 === 'available') {
      if (d2 && d2 > oggi) {
        var dt = new Date(d2 + 'T12:00:00');
        eti = 'Free from ' + dt.getDate() + ' '
          + dt.toLocaleDateString('en-GB', { month: 'short' });
        if (dt.getFullYear() !== new Date().getFullYear())
          eti += ' ' + dt.getFullYear();
      } else eti = 'Available now';
      lib = true;
    } else if (s2 === 'waitlist') { eti = 'Waitlist open'; lib = false; }
    else if (s2 === 'reserved') { eti = 'Reserved'; lib = false; }
    else { eti = 'Rented'; lib = false; }
    return { eti: eti, lib: lib };
  }
  function casaDaListing(d, ideNuovo) {
    function n(v) {
      var x = parseFloat(String(v == null ? '' : v).replace(',', '.'));
      return isFinite(x) && x > 0 ? x : null;
    }
    function t(v) {
      return String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
    }
    var img = (Array.isArray(d.images) ? d.images : []).filter(Boolean);
    var cover = img[0] || d.coverImage || d.image || '';
    var rawDal = String(d.availableDate || d.availableFrom || '').trim();
    var dal = (rawDal.match(/^\d{4}-\d{2}-\d{2}/) || [])[0] || null;
    /* la data testo libero passa dal motore CONDIVISO: mai "Available
       now" per un regex che legge solo ISO */
    if (!dal && rawDal && window.BOOM_DISPO) {
      try {
        var paD = BOOM_DISPO.parseAvailability(rawDal, new Date());
        if (paD && paD.kind === 'date') dal = paD.iso;
      } catch (e) {}
    }
    var st = statoDa(String(d.status || 'available').toLowerCase(), dal);
    return {
      id: ideNuovo,
      nome: t(d.name) || 'Apartment',
      zona: (t(d.zone || d.neighborhood) || 'Roma').split('/')[0],
      indirizzo: t(d.address),
      prezzo: n(d.price) || 0,
      mq: n(d.sqm != null ? d.sqm : d.size),
      letti: n(d.bedrooms != null ? d.bedrooms : d.beds),
      bagni: n(d.bathrooms),
      piano: d.floor != null && t(d.floor) !== '' ? t(d.floor) : null,
      tipo: d.type ? t(d.type) : null,
      arredata: ['yes', 'true', 'si', 'sì']
        .indexOf(String(d.furnished || '').toLowerCase()) >= 0,
      stato: st.eti, libera: st.lib, dal: dal,
      racconto: t(d.description),
      dentro: (Array.isArray(d.features) ? d.features
        : Array.isArray(d.tags) ? d.tags : []).filter(Boolean).map(t),
      cauzioneMesi: n(d.depositMonths) || 1,
      lat: d.lat ? parseFloat(d.lat)
        : d.geo && d.geo.lat ? parseFloat(d.geo.lat) : null,
      lng: d.lng ? parseFloat(d.lng)
        : d.geo && d.geo.lng ? parseFloat(d.geo.lng) : null,
      prec: (function () {
        try { return window.BOOM_GEO
          ? BOOM_GEO.pinPrecision(d).level : null; } catch (e) { return null; }
      })(),
      cover: cover,
      varianti: Array.isArray(d.imagesVariants) ? d.imagesVariants : null,
      foto: img.slice(0, 8).length ? img.slice(0, 8)
        : (cover ? [cover] : []),
      video: String(d.videoUrl || d.youtubeUrl || '').trim() || null,
      fotoCurate: !!d.photosEnhancedAt
    };
  }
  var ide = window.__LISTING_ID
    || (location.hash.match(/id=([^&]+)/) || [])[1]
    || (location.search.match(/[?&]id=([^&]+)/) || [])[1]
    || (location.pathname.match(/\/listing\/([^\/?#]+)/) || [])[1];
  var c = CASE.filter(function (x) { return x.id === ide; })[0];
  if (!c && ide && window.__LISTING) c = casaDaListing(window.__LISTING, ide);
  c = c || CASE[0];

  /* ── la scena: la foto grande e il rullino ──────────────────────────── */
  var telaio = document.getElementById('telaio');
  var rullino = document.getElementById('rullino');
  var immagini = c.foto && c.foto.length ? c.foto : [c.cover];
  immagini = immagini.filter(Boolean);
  var img = document.createElement('img');
  img.alt = c.nome + ', ' + c.zona + ' — apartment for rent in Rome with BOOM';
  img.decoding = 'async';
  /* l'elemento LCP della pagina: la rete lo tratta da protagonista */
  img.setAttribute('fetchpriority', 'high');
  telaio.insertBefore(img, telaio.firstChild);
  /* le varianti della pipeline enhance (w480/w960): allineate per src,
     mai per solo indice — se gli array driftano, resta il master */
  function variante(i) {
    var v = c.varianti && c.varianti[i];
    return (v && v.src === immagini[i]) ? v : null;
  }
  function mostra(i) {
    img.classList.remove('qui');
    var v = variante(i);
    if (v && (v.w480 || v.w960)) {
      img.onload = function () { img.classList.add('qui'); img.onload = null; };
      img.sizes = '100vw';
      img.srcset = [v.w480 ? v.w480 + ' 480w' : '',
        v.w960 ? v.w960 + ' 960w' : '', immagini[i] + ' 1920w']
        .filter(Boolean).join(', ');
      img.src = immagini[i];
      if (img.complete && img.naturalWidth) {
        img.classList.add('qui'); img.onload = null;
      }
    } else {
      var pre = new Image();
      pre.onload = function () { img.removeAttribute('srcset');
        img.src = pre.src; img.classList.add('qui'); };
      pre.src = immagini[i];
    }
    [].slice.call(rullino.children).forEach(function (b, k) {
      b.classList.toggle('qui', k === i); });
  }
  immagini.forEach(function (u, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'Photo ' + (i + 1) + ' of ' + immagini.length);
    var t = document.createElement('img');
    var vt = variante(i);
    t.src = (vt && vt.w480) || u;   /* il rullino non scarica mai 1920px */
    t.alt = ''; t.loading = 'lazy'; t.decoding = 'async';
    b.appendChild(t);
    b.addEventListener('click', function () { mostra(i); });
    rullino.appendChild(b);
  });
  if (immagini.length < 2) rullino.style.display = 'none';

  /* ── sfogliare: frecce, tastiera, contatore ──────────────────────────
     Mancavano: su una pagina casa la foto successiva e il gesto piu
     ripetuto che ci sia. */
  (function () {
    var prec = document.getElementById('foPrec'),
        succ = document.getElementById('foSucc'),
        conta = document.getElementById('contaFoto');
    if (!prec || !succ) return;
    if (immagini.length < 2) {
      prec.style.display = succ.style.display = 'none';
      if (conta) conta.style.display = 'none'; return;
    }
    var qui = 0;
    function vai(d) {
      qui = (qui + d + immagini.length) % immagini.length;
      mostra(qui);
      try { new Image().src = immagini[(qui + 1) % immagini.length];
        new Image().src = immagini[(qui - 1 + immagini.length) % immagini.length];
      } catch (e) {}
      if (conta) conta.textContent = (qui + 1) + ' / ' + immagini.length;
      var b = rullino.children[qui]; if (b && b.scrollIntoView)
        b.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
    }
    prec.addEventListener('click', function () { vai(-1); });
    succ.addEventListener('click', function () { vai(1); });
    /* il gesto piu' ripetuto: lo swipe sul telaio (il pattern della
       lente, riusato) — e la prossima foto si precarica da sola */
    (function () {
      var x0 = null;
      telaio.addEventListener('touchstart', function (e) {
        x0 = e.touches[0].clientX; }, { passive: true });
      telaio.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 40) vai(dx < 0 ? 1 : -1);
      }, { passive: true });
    })();
    [].slice.call(rullino.children).forEach(function (b, k) {
      b.addEventListener('click', function () {
        qui = k; if (conta) conta.textContent = (k + 1) + ' / ' + immagini.length;
      });
    });
    addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      var l = document.getElementById('lente');
      if (l && !l.hidden) return;   /* la lente ha le sue frecce */
      if (e.key === 'ArrowLeft') { e.preventDefault(); vai(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); vai(1); }
    });
    if (conta) conta.textContent = '1 / ' + immagini.length;
  })();
  mostra(0);

  /* ── l'anagrafica ───────────────────────────────────────────────────── */
  per('#nomeCasa').textContent = c.nome;
  per('#doveCasa').textContent = [c.zona, c.indirizzo].filter(Boolean).join(' · ');
  per('#briZona').textContent = c.zona;
  per('#briZona').setAttribute('href', '/apartments.html#zona=' + encodeURIComponent(c.zona));
  document.title = c.nome + ' — ' + c.zona + ', Rome | BOOM';
  var st = per('#statoCasa');
  /* lo stato e l'informazione piu volatile della pagina: si vede che e viva */
  function scriviStato() {
    st.textContent = c.stato;
    st.className = 'stato-grande ' + (/^Free from/i.test(c.stato) ? 'dopo'
      : c.libera ? 'libera'
      : /wait/i.test(c.stato) ? 'attesa' : 'presa');
  }
  scriviStato();
  var rifaiDurata = function () {}, rifaiPresa = function () {},
      rifaiPorte = function () {};
  /* la chiave dei preferiti e la stessa delle altre due pagine:
     il segnaposto sopravvive al replace di navigazione del builder */
  per('#cuoreCasa').dataset.u = 'CHIAVE_CASA' + c.id;
  per('#applicaNome').textContent = c.nome;
  /* WhatsApp arriva gia' col contesto: mai un «ciao» muto — l'operatore
     sa di quale casa si parla e la pipeline aggancia il listing */
  (function () {
    var wa = document.querySelector('.chiedi-wa');
    if (!wa) return;
    var msg = 'Hi! I\u2019m asking about \u201c' + c.nome + '\u201d ('
      + c.zona + ') \u2014 ' + location.origin + '/listing/'
      + encodeURIComponent(c.id);
    wa.href = 'https://wa.me/393313251961?text=' + encodeURIComponent(msg);
    wa.addEventListener('click', function () {
      if (window.boomTrack) boomTrack('whatsapp_click', { item_id: c.id || '' });
    });
  })();
  /* se la casa non e libera, la CTA non finge: si entra in lista */
  /* una casa libera DA una data: la data sta nel gesto, non solo nel badge */
  if (c.libera && c.dal) {
    var oggiIso = new Date().toISOString().slice(0, 10);
    if (c.dal > oggiIso) {
      var bF = document.querySelector('#modApplica button[type="submit"]');
      if (bF) {
        var dF = new Date(c.dal + 'T12:00:00');
        bF.textContent = 'Apply \u00b7 move in '
          + dF.getDate() + ' ' + dF.toLocaleDateString('en-GB', { month: 'short' });
      }
    }
  }
  if (!c.libera) {
    var bAp = document.querySelector('#modApplica button[type="submit"]');
    if (bAp) bAp.textContent = 'Join the waitlist';
    var sAp = document.getElementById('applicaSotto');
    if (sAp) sAp.textContent = 'This home is taken for now. Join the '
      + 'waitlist and you hear first — from a person — the moment it frees up.';
  }

  /* il canone sui Solari, come ovunque nel sito */
  var canone = per('#canoneCasa');
  var mostraCanone = (function () {
    var bo = null, largo = 0;
    return function (subito) {
      var t = euro(c.prezzo);
      canone.dataset.p = t;
      canone.setAttribute('aria-label', t + ' per month');
      if (!BS) { canone.textContent = t; return; }
      if (!bo || t.length !== largo) {
        canone.innerHTML = ''; largo = t.length;
        bo = new BS.Board(canone, largo, ' €,.0123456789');
      }
      (ridotto || subito) ? bo.show(t) : bo.show(t, 60, true);
    };
  })();
  setTimeout(function () { mostraCanone(false); }, 500);

  /* ── i fatti ────────────────────────────────────────────────────────── */
  var FATTI = [
    [c.mq ? c.mq + ' m²' : null, 'Size'],
    [c.letti === 0 ? 'Studio' : (c.letti ? c.letti + ' bed' : null), 'Bedrooms'],
    [c.bagni ? c.bagni : null, 'Bathrooms'],
    [c.piano ? c.piano : null, 'Floor'],
    [c.arredata ? 'Furnished' : (c.tipo || null), c.arredata ? 'Interior' : 'Type'],
  ].filter(function (f) { return f[0]; });
  per('#fatti').innerHTML = FATTI.map(function (f) {
    return '<div class="fatto"><b>' + f[0] + '</b><span>' + f[1] + '</span></div>';
  }).join('');

  /* ── LA PELLICOLA ────────────────────────────────────────────────────
     Il video esiste per due case su ventisei. Dove c'e si guarda; dove
     non c'e la pagina lo dice e offre la visita dal vivo — mai un
     riquadro vuoto che finge. Il distintivo sulle foto si accende solo
     per le case passate davvero dalla pipeline di /api/photos/enhance. */
  (function () {
    var pel = document.getElementById('pellicola');
    if (!pel) return;
    var n = immagini.length;
    /* un badge solo: due dicevano quasi la stessa cosa e il secondo
       confondeva. La cura delle foto e mezza riga, non un cartello. */
    var dett = n + ' photo' + (n === 1 ? '' : 's')
      + ' of this exact flat — nothing borrowed, nothing rendered'
      + (c.fotoCurate ? ', ordered room by room so the first one is the '
        + 'one you care about.' : '.');
    pel.innerHTML = '<div class="pel-fila uno">'
      + '<div class="pel-v"><svg viewBox="0 0 24 24" aria-hidden="true">'
      + '<path d="M12 3l7 2.8v5.4c0 4.1-3 7.1-7 8.3-4-1.2-7-4.2-7-8.3V5.8z"/>'
      + '<path d="M8.6 11.6l2.3 2.3 4.3-4.9"/></svg><span><b>Walked and '
      + 'photographed by us</b><span>' + dett + '</span></span></div></div>';

    if (c.video) {
      var id = (c.video.match(/(?:shorts\/|v=|youtu\.be\/|embed\/)([\w-]{6,})/)
                || [])[1];
      if (id) {
        var box = document.createElement('div');
        box.className = 'pel-video';
        box.innerHTML = '<button type="button" class="pel-play">'
          + '<i aria-hidden="true"></i><b>Watch the walkthrough</b>'
          + '<span>Filmed inside this flat · loads only when you press</span>'
          + '</button>';
        box.querySelector('.pel-play').addEventListener('click', function () {
          box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/'
            + id + '?autoplay=1&rel=0&modestbranding=1" title="Video tour of '
            + (c.nome || 'this apartment') + '" allow="accelerometer; '
            + 'autoplay; encrypted-media; picture-in-picture" '
            + 'allowfullscreen></iframe>';
        });
        pel.appendChild(box);
      }
    }
    /* la visita video gratis non e un upsell da riquadro: sta con i
       servizi, nelle porticine in fondo — e nelle FAQ, come sempre */
  })();

  /* ── il racconto e ciò che c'è dentro ───────────────────────────────── */
  per('#raccontoCasa').textContent = c.racconto
    || 'Walked and checked by us. Ask for the full walkthrough — we filmed it.';
  per('#dentroCasa').innerHTML = (c.dentro || []).slice(0, 10)
    .map(function (x) { return '<span>' + x + '</span>'; }).join('');

  /* ── IL DENARO IN CHIARO ────────────────────────────────────────────
     Regole dichiarate, aritmetica visibile: la cauzione e N mensilita,
     l'onorario il 10% del canone ANNUO (quindi non cambia con la durata,
     e per questo il giorno uno resta uguale mentre il soggiorno no). */
  /* la cifra grande e il giorno uno INTERO: canone + deposito + onorario.
     Nessuna voce a margine — il deposito e un pagamento vero, e torna,
     ed e scritto in verde sulla sua riga. Un numero, una storia. */
  var cauzione, onorario, totale;
  function contiSoldi() {
    var mesi = c.cauzioneMesi || 1;
    cauzione = c.prezzo * mesi;
    onorario = Math.round(c.prezzo * 12 * .10);
    totale = c.prezzo + cauzione + onorario;
    per('#voceCanone').textContent = euro(c.prezzo);
    per('#voceOnorario').textContent = euro(onorario);
    per('#voceCauzione').textContent = euro(cauzione);
    per('#chiaviOnorario').textContent = euro(onorario);
  }
  contiSoldi();

  /* il totale gira sui Solari: e la cifra che conta piu di ogni altra */
  var mostraTotale = function () {};
  (function () {
    var host = document.getElementById('totFlap');
    if (!host) return;
    var quadro = null, largo = 0;
    function scrivi(subito) {
      var testo = euro(totale);
      if (!BS || !BS.Board) { host.textContent = testo; return; }
      if (!quadro || testo.length !== largo) {
        host.innerHTML = ''; largo = testo.length;
        quadro = new BS.Board(host, largo, ' €,.0123456789');
      }
      (ridotto || subito) ? quadro.show(testo) : quadro.show(testo, 46, true);
    }
    mostraTotale = scrivi;
    if (ridotto || !('IntersectionObserver' in window)) scrivi(true);
    else new IntersectionObserver(function (v, io) {
      if (!v[0].isIntersecting) return;
      io.disconnect(); scrivi(false);
    }, { threshold: .35 }).observe(host);
  })();

  /* la durata: il giorno uno non cambia, il soggiorno si — ed e la
     domanda che arriva ogni volta in chat */
  (function () {
    var tasti = [].slice.call(document.querySelectorAll('.durata-tasti button'));
    if (!tasti.length) return;
    var mScelto = 12;
    function conta(m) {
      mScelto = m;
      var canoni = c.prezzo * m;
      per('#durCanoni').textContent = euro(canoni) + '  ';
      per('#durOnorario').textContent = euro(onorario);
      per('#durTotale').textContent = euro(canoni + onorario);
      per('#durNota').innerHTML = 'Your <b>' + euro(cauzione) + '</b> deposit '
        + 'is not counted here: you pay it on day one and it comes back at '
        + 'the end. Utilities and the registration tax are paid to the '
        + 'providers and to the State, never to us.';
      tasti.forEach(function (t) {
        t.classList.toggle('on', Number(t.dataset.m) === m); });
      /* chi ha scelto la durata qui non deve ridirla nell'apply */
      document.dispatchEvent(new CustomEvent('boom:durata', { detail: m }));
    }
    tasti.forEach(function (t) {
      t.addEventListener('click', function () { conta(Number(t.dataset.m)); });
    });
    conta(12);
    rifaiDurata = function () { conta(mScelto); };
  })();

  /* ── QUELLO CHE CI CHIEDERESTI SU WHATSAPP ──────────────────────────
     Dieci risposte, ognuna vera per quello che il sito e i documenti gia
     dicono. Le cifre vengono dalla casa aperta, non da un testo fisso. */
  function scriviChiedi() {
    var lista = document.getElementById('chiediLista');
    if (!lista) return;
    var D = [
      ['Can I see it without flying to Rome?',
       'Yes — and for our homes it costs nothing: a BOOM agent walks this '
       + 'exact flat on live video with you asking the questions. Book a '
       + 'slot on WhatsApp. (The paid €89 Virtual Viewing is for homes on '
       + 'OTHER portals — this one is ours.)'],
      ['What exactly do I pay on day one?',
       '<em>' + euro(totale) + '</em>: first month ' + euro(c.prezzo)
       + ', deposit ' + euro(cauzione) + ' and the agency fee '
       + euro(onorario) + '. Nothing else is charged by us, ever.'],
      ['Is the deposit really coming back?',
       'It is held, not spent, and returned after the final walkthrough. '
       + 'The flat is filmed at move-in and at move-out, so the state of it '
       + 'is a recording and not an argument.'],
      ['How do I pay — and to whom?',
       'Through BOOM on Stripe, with a receipt for each line. Never a bank '
       + 'transfer to a private person. The counterparty is <em>Egidi '
       + 'Immobiliare S.r.l.</em>, a licensed agency — BOOM® is its EU trade '
       + 'mark 019317594.'],
      ['What kind of contract is it?',
       'A registered lease under L. 431/98 — typically transitional '
       + '(art. 5 c. 1); some homes offer a rent-controlled option, and the '
       + 'listing says so. In English and Italian, explained line by line '
       + 'before you sign. Registration with the Agenzia delle Entrate is '
       + 'handled by us.'],
      ['Do I have to be in Rome to sign?',
       'No. You sign from your phone with a private link, and the landlord '
       + 'countersigns after you. The keys are the only thing that needs you '
       + 'in the city.'],
      ['Do I need an Italian guarantor?',
       'Not by default. We look at your situation — employed, self-employed, '
       + 'student, relocating — and tell you what this particular landlord '
       + 'asks for before you apply, not after.'],
      ['How fast can I actually move in?',
       'As little as <em>48 hours</em> from a signed pre-agreement, if the '
       + 'flat is free. This one'
       + (c.dal ? ' is available from <em>' + new Date(c.dal + 'T12:00:00')
            .toLocaleDateString('en-GB', { day: 'numeric', month: 'long',
              year: 'numeric' })
            + '</em>.' : ' is available now.')],
      ['Can I hold it while I decide?',
       'Yes — a <em>€300</em> hold takes it off the market for 48 hours, one '
       + 'tap, fully refundable. It is the only way to stop someone else '
       + 'taking it while you think.'],
      ['What is not included in the figures above?',
       'Utilities (electricity, gas, water, internet) and the registration '
       + 'tax. Both are paid to the providers and to the State — we never '
       + 'touch them, and we never mark them up.']
    ];
    /* domande tutte VISIBILI (regola GEO: il FAQPage afferma solo cio'
       che la pagina mostra), risposte richiudibili — la prima aperta */
    lista.innerHTML = D.map(function (q, i2) {
      return '<details class="chiedi-v"' + (i2 === 0 ? ' open' : '')
        + '><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>';
    }).join('');
    /* per i motori: le STESSE dieci risposte — mai due verita */
    try {
      var ld = { '@context': 'https://schema.org', '@type': 'FAQPage',
        mainEntity: D.map(function (q) { return { '@type': 'Question',
          name: q[0], acceptedAnswer: { '@type': 'Answer',
            text: q[1].replace(/<[^>]+>/g, '') } }; }) };
      var sc = document.getElementById('faqLd');
      if (!sc) {
        sc = document.createElement('script');
        sc.type = 'application/ld+json'; sc.id = 'faqLd';
        document.head.appendChild(sc);

  }
  scriviChiedi();

  /* ── L'APPLY ─────────────────────────────────────────────────────────
     Raccoglie il corpo ESATTO di /api/apply-lead — la porta del pipeline
     vero — piu le due cose che alla console servono per creare il
     pre-accordo senza richiamare nessuno: quanti firmano e per quanto.
     Dichiarato PREVIEW: la richiesta si vede in console, non parte. */
  (function () {
    var f = document.getElementById('modApplica');
    if (!f) return;
    var eti = [].slice.call(document.querySelectorAll('.passi .passo-eti'));
    var gruppi = [].slice.call(f.querySelectorAll('.ap-gruppo'));
    function pieno(g) {
      return [].slice.call(g.querySelectorAll('input, select')).some(
        function (x) { return String(x.value || '').trim(); });
    }
    function stato() {
      gruppi.forEach(function (g, i) {
        var e = eti[i]; if (!e) return;
        e.classList.toggle('fatto', pieno(g));
        e.classList.toggle('ora', !pieno(g)
          && (i === 0 || pieno(gruppi[i - 1])));
      });
    }
    f.addEventListener('input', stato); f.addEventListener('change', stato);
    /* la durata scelta nel conto arriva gia compilata qui */
    document.addEventListener('boom:durata', function (e) {
      var m = f.querySelector('#apMesi');
      if (m) { m.value = String(e.detail); stato(); }
    });
    if (c.dal) { var q = f.querySelector('#apQuando'); if (q) q.value = c.dal; }
    stato();

    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!f.querySelector('#apNome').value.trim()
          || !f.querySelector('#apMail').value.trim()) {
        (f.querySelector('#apNome').value.trim()
          ? f.querySelector('#apMail') : f.querySelector('#apNome')).focus();
        return;
      }
      var d = new FormData(f);
      /* il corpo di /api/apply-lead, campo per campo */
      var corpo = {
        name: d.get('nome'), email: d.get('email'), phone: d.get('telefono'),
        listingId: c.id, listingName: c.nome, listingPrice: c.prezzo,
        zone: c.zona, kind: c.libera ? 'apply' : 'waitlist',
        waitlist: !c.libera,
        income: d.get('reddito'), guarantor: d.get('garante'),
        household: d.get('chi'), occupation: d.get('occupazione'),
        moveIn: d.get('quando'), durationMonths: Number(d.get('mesi')) || null,
        /* in piu, per il pre-accordo: quante firme ci saranno */
        signers: Number(d.get('firmatari')) || 1,
        company: d.get('company')          /* esca per i robot */
      };
      if (VERO) {
        /* la porta vera del pipeline: parte e non blocca, come dal vivo */
        try { fetch('/api/apply-lead', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(corpo) }); } catch (err) {}
      } else console.info('[PREVIEW] POST /api/apply-lead →', corpo);
      if (window.boomTrack) boomTrack('apply_submit',
        { item_id: c.id || '', intent: c.libera ? 'apply' : 'waitlist' });
      f.style.display = 'none';
      var sotto = document.getElementById('applicaSotto');
      if (sotto) sotto.style.display = 'none';
      var fatto = document.getElementById('applicaFatto');
      if (fatto) {
        fatto.classList.add('si');
        fatto.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    });
  })();

  /* ── LA LENTE: la foto a tutto schermo ─────────────────────────────── */
  (function () {
    var lente = document.getElementById('lente');
    if (!lente || !immagini.length) return;
    var foto = document.getElementById('lenteFoto'),
        conta = document.getElementById('lenteConta');
    var qui = 0, aperta = false;
    function apri(i) {
      qui = (i + immagini.length) % immagini.length;
      foto.src = immagini[qui];
      foto.alt = c.nome + ' — photo ' + (qui + 1) + ' of ' + immagini.length;
      if (conta) conta.textContent = (qui + 1) + ' / ' + immagini.length;
      lente.hidden = false; aperta = true;
      document.documentElement.style.overflow = 'hidden';
    }
    function chiudi() {
      lente.hidden = true; aperta = false;
      document.documentElement.style.overflow = '';
    }
    telaio.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;  /* frecce e cuore sono loro */
      var k = 0;
      [].slice.call(rullino.children).forEach(function (b, i) {
        if (b.classList.contains('qui')) k = i; });
      apri(k);
    });
    document.getElementById('lenteX').addEventListener('click', chiudi);
    document.getElementById('lentePrec').addEventListener('click',
      function () { apri(qui - 1); });
    document.getElementById('lenteSucc').addEventListener('click',
      function () { apri(qui + 1); });
    lente.addEventListener('click', function (e) {
      if (e.target === lente) chiudi(); });
    addEventListener('keydown', function (e) {
      if (!aperta) return;
      if (e.key === 'Escape') chiudi();
      if (e.key === 'ArrowLeft') apri(qui - 1);
      if (e.key === 'ArrowRight') apri(qui + 1);
    });
    var x0 = null;
    lente.addEventListener('touchstart', function (e) {
      x0 = e.touches[0].clientX; }, { passive: true });
    lente.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) apri(qui + (dx < 0 ? 1 : -1));
    }, { passive: true });
    if (immagini.length < 2) {
      document.getElementById('lentePrec').style.display = 'none';
      document.getElementById('lenteSucc').style.display = 'none';
    }
  })();

  /* ── IL POSTO: il blocco vero, i vicini, i tuoi luoghi ──────────────── */
  (function () {
    var sez = document.getElementById('posto');
    if (!sez) return;
    if (!c.lat || !c.lng) { sez.style.display = 'none'; return; }

    /* i tasti diretti del blocco. Street View solo dove il pin e una
       strada vera (regola boom-geo): su un centroide di zona aprirebbe
       una via qualunque e sembrerebbe casa tua. Directions sempre:
       portano dove sappiamo portare. */
    (function () {
      var az = document.getElementById('bloccoAzioni');
      if (!az) return;
      var lvl = c.prec || (function () {
        try { return window.BOOM_GEO
          ? BOOM_GEO.pinPrecision(c).level : 'zone'; } catch (e) { return 'zone'; }
      })();
      az.hidden = false;
      var cc = document.getElementById('blkCoords');
      if (cc) cc.textContent = lvl === 'exact'
        ? '\u25c8 ' + c.lat.toFixed(4) + '\u00b0 N \u00b7 ' + c.lng.toFixed(4) + '\u00b0 E'
        : '\u2248 ' + (lvl === 'street'
            ? 'The right street \u2014 not the number'
            : 'Approximate position in ' + (c.zona || 'Rome'));
      var sv = document.getElementById('blkSv');
      if (sv && (lvl === 'exact' || lvl === 'street')) {
        sv.hidden = false;
        sv.textContent = lvl === 'exact'
          ? '\u27f2 Street View \u00b7 the exact entrance'
          : '\u27f2 Street View \u00b7 this street';
        sv.href = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='
          + c.lat + ',' + c.lng;
      }
      var dr = document.getElementById('blkDir');
      if (dr) dr.href = 'https://www.google.com/maps/dir/?api=1&destination='
        + c.lat + ',' + c.lng;
    })();
    var RAD = Math.PI / 180;
    function km(a1, o1, a2, o2) {
      var R = 6371, dy = (a2 - a1) * RAD, dx = (o2 - o1) * RAD;
      var q = Math.pow(Math.sin(dy / 2), 2) + Math.cos(a1 * RAD)
        * Math.cos(a2 * RAD) * Math.pow(Math.sin(dx / 2), 2);
      /* onesto: linea d'aria ×1.3 per le strade vere, non un percorso */
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(q))) * 1.3;
    }
    /* il tempo VERO viene dalla griglia GTFS del Pendolare (BOOM_TEMPI,
       doc publicGeo/tempi-roma): rete e orari di Roma Mobilità, non la
       linea d'aria. Dove la griglia non copre resta la stima di prima,
       DICHIARATA dal ≈ — mai un numero inventato. */
    /* IL GRADO DI VERITA' DI OGNI NUMERO vive nel motore condiviso
       (js/mappa-engine.js), non qui: la stessa camminata calcolata con due
       velocita' diverse — 4,7 km/h qui e 4,8 nello Skyline e nel Pendolare
       — dava due risposte diverse alla stessa domanda. Ora e' una sola. */
    function tempo(d, veri) {
      if (window.BOOM_MAPPA) {
        var t = BOOM_MAPPA.tempo(d, veri);
        if (!t) return '';
        return t.fonte === 'piedi' ? t.min + ' min walk'
             : t.fonte === 'rete'  ? t.min + ' min'
             : '≈' + t.min + ' min';
      }
      /* motore assente: si dice solo cio che e MISURATO, altrimenti
         NIENTE — mai un'altra unita di misura al posto dei minuti. */
      return veri != null ? veri + ' min' : '';
    }
    /* i vicini fissi: stazioni e atenei veri, i 4 piu vicini a QUESTA
       porta. Lo slug in coda è la chiave della griglia (tempi-engine). */
    var POSTI = [
      ['Termini', 'Trains + Metro A/B', 41.9009, 12.5018, 'termini'],
      ['Colosseo', 'The ancient centre', 41.8902, 12.4924, 'colosseo'],
      ['Vatican', 'St Peter\'s & museums', 41.9022, 12.4534, 'vaticano'],
      ['Sapienza', 'Main campus', 41.9038, 12.5135, 'sapienza'],
      ['LUISS', 'Viale Romania campus', 41.9269, 12.4917, 'luiss'],
      ['Roma Tre', 'Ostiense campus', 41.8564, 12.4790, 'romatre'],
      ['John Cabot', 'Trastevere campus', 41.8937, 12.4664, 'johncabot']
    ];
    function dipingiVicini(minuti) {
      document.getElementById('vicini').innerHTML = POSTI.map(function (p) {
        var d = km(c.lat, c.lng, p[2], p[3]);
        var m = minuti && p[4] in minuti ? minuti[p[4]] : null;
        return { d: d, h: '<div class="vicino"><b>' + p[0] + '</b><span>'
          + p[1] + '</span><i>' + tempo(d, m) + '</i></div>' };
      }).sort(function (a, b) { return a.d - b.d; }).slice(0, 4)
        .map(function (x) { return x.h; }).join('');
    }
    dipingiVicini(null);
    /* la griglia arriva DOPO il primo paint (regola Safari: nulla di
       atteso sul boot) e ridipinge solo se copre QUESTA porta */
    if (window.BOOM_TEMPI) setTimeout(function () {
      fetch('https://firestore.googleapis.com/v1/projects/'
          + 'boom-property-dashboards/databases/(default)/documents/'
          + 'publicGeo/tempi-roma')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (doc) {
          var dati = doc && BOOM_TEMPI.daDoc(doc);
          var minuti = dati && BOOM_TEMPI.verso(dati, c.lat, c.lng);
          if (minuti) dipingiVicini(minuti);
        }).catch(function () { /* niente rete: resta la stima ≈ */ });
    }, 400);

    /* la mappa del blocco: solo se la chiami, e se non arriva lo dice */
    var via = document.getElementById('bloccoVia'),
        box = document.getElementById('blocco3d');
    var mappaB = null, spenta = false, carico = false, satellite = false;
    function stileSat() {
      return { version: 8, sources: { sat: { type: 'raster', tileSize: 256,
        maxzoom: 19,
        attribution: 'Imagery © Esri, Maxar, Earthstar Geographics',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] } },
        layers: [{ id: 'sat', type: 'raster', source: 'sat' }] };
    }
    function ripiegoB() {
      /* vettoriale muto → satellite puro; muto anche lui → carta onesta */
      if (carico || spenta || satellite || !mappaB) return;
      satellite = true;
      try { mappaB.setStyle(stileSat()); } catch (e) { spengo(); return; }
      setTimeout(function () { if (!carico) spengo(); }, 8000);
    }
    function spengo() {
      if (spenta) return; spenta = true;
      box.innerHTML = '<div class="blocco-spento"><b>The map engine could '
        + 'not be reached from here.</b><span>No fake map in its place — '
        + 'see the exact spot on Google Maps instead.</span>'
        + '<a class="btn btn-primary" target="_blank" rel="noopener" '
        + 'href="https://maps.google.com/?q=' + c.lat + ',' + c.lng + '">'
        + 'Open in Google Maps ↗</a></div>';
    }
    function accendi() {
      var telo = document.createElement('div');
      telo.id = 'bloccoMappa'; box.innerHTML = ''; box.appendChild(telo);
      try {
        mappaB = new maplibregl.Map({ container: 'bloccoMappa',
          style: 'https://tiles.openfreemap.org/styles/liberty',
          center: [c.lng, c.lat], zoom: 15.7, pitch: 55, bearing: -17,
          antialias: true, attributionControl: { compact: true },
          cooperativeGestures: {
            windowsHelpText: 'Use Ctrl + scroll to zoom the map',
            macHelpText: 'Use ⌘ + scroll to zoom the map',
            mobileHelpText: 'Use two fingers to move the map' } });
      } catch (e) { spengo(); return; }
      mappaB.addControl(new maplibregl.NavigationControl(
        { visualizePitch: true }), 'bottom-right');
      mappaB.on('error', function (e) {
        if (e && e.error && !e.tile
            && !(mappaB.isStyleLoaded && mappaB.isStyleLoaded())
            && /style|Failed to fetch/i.test(String(e.error.message || '')))
          ripiegoB();
      });
      function guardiaB(giri) {
        if (carico || spenta || satellite || !mappaB) return;
        if (mappaB.isStyleLoaded && mappaB.isStyleLoaded() && giri < 3)
          return void setTimeout(function () { guardiaB(giri + 1); }, 5000);
        ripiegoB();
      }
      setTimeout(function () { guardiaB(0); }, 9000);
      mappaB.on('load', function () {
        carico = true;
        try {
          var f = null, st2 = mappaB.getStyle();
          (st2.layers || []).forEach(function (l) {
            if (!f && l['source-layer'] === 'building') f = l.source; });
          if (f) mappaB.addLayer({ id: 'blocco-3d', type: 'fill-extrusion',
            source: f, 'source-layer': 'building', minzoom: 13, paint: {
              'fill-extrusion-color': '#C8BDA5',
              'fill-extrusion-height':
                ['coalesce', ['get', 'render_height'], 12],
              'fill-extrusion-base':
                ['coalesce', ['get', 'render_min_height'], 0],
              'fill-extrusion-opacity': .9 } });
        } catch (e) {}
        /* gli anelli del passo: 5/10/15 minuti a 4.8 km/h */
        [400, 800, 1200].forEach(function (r, i) {
          var co = [], dLat = r / 111320,
              dLng = r / (111320 * Math.cos(c.lat * RAD));
          for (var k = 0; k <= 72; k++) {
            var a = k / 72 * 2 * Math.PI;
            co.push([c.lng + dLng * Math.cos(a),
                     c.lat + dLat * Math.sin(a)]);
          }
          try {
            mappaB.addSource('anello' + i, { type: 'geojson', data: {
              type: 'Feature', properties: {},
              geometry: { type: 'LineString', coordinates: co } } });
            mappaB.addLayer({ id: 'anello' + i, type: 'line',
              source: 'anello' + i, paint: { 'line-color': '#FFD700',
                'line-width': 1.2, 'line-opacity': .55 - i * .14,
                'line-dasharray': [1, 2] } });
          } catch (e) {}
        });
        if (!document.querySelector('#bloccoMappa .blocco-pin')) {
          var el = document.createElement('div');
          el.className = 'blocco-pin';
          el.innerHTML = '<span>' + euro(c.prezzo) + '</span>';
          new maplibregl.Marker({ element: el, anchor: 'bottom' })
            .setLngLat([c.lng, c.lat]).addTo(mappaB);
        }
      });
    }
    via.addEventListener('click', function () {
      if (window.maplibregl) return accendi();
      via.querySelector('b').textContent = 'Waking the map engine…';
      var css = document.createElement('link'); css.rel = 'stylesheet';
      css.href =
        'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css';
      document.head.appendChild(css);
      var js = document.createElement('script');
      js.src =
        'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.min.js';
      js.onload = function () { try { accendi(); } catch (e) { spengo(); } };
      js.onerror = spengo;
      document.head.appendChild(js);
      setTimeout(function () { if (!mappaB) spengo(); }, 12000);
    });

    /* i tuoi luoghi: scritti una volta, ogni casa risponde. Stessa chiave
       del sito live (boom:pois): quello che salvi qui vale anche la. */
    var CHIAVE = 'boom:pois';
    function letti() {
      try { return JSON.parse(localStorage.getItem(CHIAVE) || '[]'); }
      catch (e) { return []; }
    }
    function serba(a) {
      try { localStorage.setItem(CHIAVE, JSON.stringify(a.slice(0, 4))); }
      catch (e) {}
    }
    var righe = document.getElementById('luogoRighe'),
        cerca = document.getElementById('luogoQ'),
        sug = document.getElementById('luogoSug');
    function righeGiu() {
      var a = letti();
      righe.innerHTML = a.length ? a.map(function (p, i) {
        return '<div class="luogo"><b>' + p.name + '</b><i>'
          + tempo(km(c.lat, c.lng, p.lat, p.lng)) + '</i>'
          + '<button type="button" data-i="' + i + '" aria-label="Remove '
          + p.name + '">✕</button></div>';
      }).join('') : '<p class="luoghi-vuota">Nothing saved yet — type your '
        + 'office or campus above, once.</p>';
    }
    righe.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-i]'); if (!b) return;
      var a = letti(); a.splice(+b.dataset.i, 1); serba(a); righeGiu();
    });
    var attesa = null;
    cerca.addEventListener('input', function () {
      clearTimeout(attesa);
      var q = cerca.value.trim();
      if (q.length < 3) { sug.innerHTML = ''; return; }
      attesa = setTimeout(function () {
        fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(q)
            + '&lat=41.893&lon=12.483&limit=4&lang=en&zoom=12')
          .then(function (r) { return r.json(); })
          .then(function (j) {
            sug.innerHTML = (j.features || []).slice(0, 4)
              .map(function (ft) {
                var p = ft.properties || {};
                var nome = p.name || p.street || 'Place';
                var dove = [p.suburb || p.district, p.city]
                  .filter(Boolean).join(', ');
                return '<button type="button" data-lat="'
                  + ft.geometry.coordinates[1] + '" data-lng="'
                  + ft.geometry.coordinates[0] + '" data-n="'
                  + String(nome).replace(/"/g, '') + '"><b>' + nome
                  + '</b><span>' + dove + '</span></button>';
              }).join('')
              || '<p class="luoghi-vuota">Nothing found — try the street '
              + 'or the campus name.</p>';
          })
          .catch(function () {
            /* niente rete da qui: lo diciamo, non lo nascondiamo */
            sug.innerHTML = '<p class="luoghi-vuota">The place search '
              + 'needs the live site — it can\'t run from this '
              + 'preview.</p>';
          });
      }, 320);
    });
    sug.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-n]'); if (!b) return;
      var a = letti();
      if (!a.some(function (p) { return p.name === b.dataset.n; })) {
        a.unshift({ name: b.dataset.n, lat: +b.dataset.lat,
          lng: +b.dataset.lng });
        serba(a);
      }
      sug.innerHTML = ''; cerca.value = ''; righeGiu();
    });
    righeGiu();
  })();

    });
  })();

  /* ── le porticine: il video live di QUESTA casa, coi suoi dati ──────── */
  (function () {
    var pv = document.getElementById('portaVideo');
    if (!pv) return;
    rifaiPorte = function () {
      var vivo = c.libera || /wait/i.test(c.stato);
      pv.style.display = vivo ? '' : 'none';
      pv.href = 'https://wa.me/393313251961?text=' + encodeURIComponent(
        'Hi! I\'d like a live video viewing of "' + c.nome
        + '" — when is the next slot?');
    };
    rifaiPorte();
  })();

  /* ── L'IDRANTE: la pagina resta viva sui dati del bot ─────────────────
     Il builder fotografa il catalogo, ma Firestore cambia in ogni
     momento — il bot aggiorna deposito, prezzo, stato. In modalita sito
     la pagina rilegge il SUO documento e, se i numeri sono cambiati,
     riscrive stato, denaro, durata, FAQ, presa e porticine da sola.
     Una verita sola: quella vera. Se la rete manca, restano i numeri
     del builder — mai una pagina rotta. */
  function digest(nume, testo) {
    var cambia = false;
    var p2 = nume('price');
    if (p2 && p2 !== c.prezzo) { c.prezzo = p2; cambia = true; }
    var m2 = nume('depositMonths');
    if (m2 && m2 !== c.cauzioneMesi) {
      c.cauzioneMesi = m2; cambia = true;
    }
    var s2 = testo('status').toLowerCase();
    if (s2) {
      var d2 = (testo('availableDate')
        .match(/^\d{4}-\d{2}-\d{2}/) || [])[0] || c.dal;
      var st2 = statoDa(s2, d2);
      if (st2.eti !== c.stato || st2.lib !== c.libera || d2 !== c.dal) {
        c.stato = st2.eti; c.libera = st2.lib; c.dal = d2; cambia = true;
      }
    }
    if (!cambia) return;
    scriviStato(); contiSoldi(); mostraTotale(true); mostraCanone(true);
    rifaiDurata(); scriviChiedi(); rifaiPresa(); rifaiPorte();
  }
  /* prima sorsata: il documento gia iniettato dal server — zero rete */
  if (VERO && window.__LISTING && window.__LISTING_ID === c.id)
    (function (d) {
      digest(function (k) {
        var n = parseFloat(d[k]);
        return isFinite(n) && n > 0 ? n : null;
      }, function (k) { return d[k] == null ? '' : String(d[k]); });
    })(window.__LISTING);
  /* seconda: la rilettura viva, come sempre */
  if (VERO) setTimeout(function () {
    fetch('https://firestore.googleapis.com/v1/projects/'
        + 'boom-property-dashboards/databases/(default)/documents/listings/'
        + encodeURIComponent(c.id))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.fields) return;
        var f = j.fields;
        digest(function (k) {
          var v = f[k]; if (!v) return null;
          var n = parseFloat(v.integerValue || v.doubleValue
            || v.stringValue);
          return isFinite(n) && n > 0 ? n : null;
        }, function (k) {
          var v = f[k]; return v ? String(v.stringValue || '') : '';
        });
      })
      .catch(function () { /* niente rete: restano i numeri del builder */ });
  }, 600);

  /* ── le altre case: tre, della stessa mano ──────────────────────────── */
  var altre = CASE.filter(function (x) {
    return x.id !== c.id && x.cover;
  }).sort(function (a, b) {
    /* prima quelle libere, poi quelle della stessa zona */
    var pa = (a.libera ? 0 : 2) + (a.zona === c.zona ? 0 : 1);
    var pb = (b.libera ? 0 : 2) + (b.zona === c.zona ? 0 : 1);
    return pa - pb;
  }).slice(0, 3);
  document.getElementById('altre').innerHTML = altre.map(function (a) {
    var dati = [a.zona, a.mq ? a.mq + ' m²' : '',
      a.letti === 0 ? 'Studio' : (a.letti ? a.letti + ' bed' : '')]
      .filter(Boolean).join(' <i>·</i> ');
    return '<a class="casa-p" href="' + '/listing/' + a.id + '">'
      + '<div class="home-foto"><img loading="lazy" decoding="async" src="'
      + a.cover + '" alt="' + a.nome + ', ' + a.zona + '">'
      + '<span class="casa-stato ' + (a.libera ? 'si' : '') + '">'
      + a.stato + '</span></div>'
      + '<div class="corpo"><div class="riga1"><span class="nome">'
      + a.nome + '</span><span class="canone"><span class="flap-prezzo '
      + 'flap-scale" data-p="' + euro(a.prezzo) + '" aria-label="'
      + euro(a.prezzo) + ' per month"></span><small>/mo</small></span></div>'
      + '<div class="riga2">' + dati + '</div></div></a>';
  }).join('');

  /* ── Hold e Apply chiedono le stesse tre cose a due form scollegati:
     compilarne uno riempie l'altro, e il successo dell'apply offre il
     gesto d'oro (solo se la casa e' libera — mai un hold su una presa) */
  (function () {
    var coppie = [['prNome', 'apNome'], ['prMail', 'apMail'], ['prTel', 'apTel']];
    coppie.forEach(function (cp) {
      var a = document.getElementById(cp[0]), b = document.getElementById(cp[1]);
      if (!a || !b) return;
      function specchia(da, a2) {
        da.addEventListener('input', function () {
          if (!a2.value || a2.dataset.eco === '1') {
            a2.value = da.value; a2.dataset.eco = '1';
          }
        });
      }
      specchia(a, b); specchia(b, a);
    });
    var fh = document.getElementById('fattoHold');
    if (fh && c.libera && document.getElementById('presaCasa'))
      fh.style.display = '';
  })();

  /* ── la barra di decisione (mobile) + la rotaia (desktop) ── */
  (function () {
    var bar = document.getElementById('decisione');
    if (bar) {
      per('#decPrezzo').textContent = euro(c.prezzo) + '/mo';
      per('#decStato').textContent = c.stato;
      var vaiB = document.getElementById('decVai');
      if (!c.libera && vaiB) vaiB.textContent = 'Waitlist';
      bar.hidden = false;
      var applica = document.getElementById('applica');
      var soglia = 520;
      var giu = false;
      function stagione() {
        var vicino = false;
        if (applica) {
          var r2 = applica.getBoundingClientRect();
          vicino = r2.top < innerHeight && r2.bottom > 0;
        }
        var ora = scrollY > soglia && !vicino;
        if (ora !== giu) { giu = ora; bar.classList.toggle('viva', ora); }
      }
      addEventListener('scroll', stagione, { passive: true });
      stagione();
    }
    var rotaia = document.getElementById('rotaia');
    if (rotaia && 'IntersectionObserver' in window) {
      var voci = [].slice.call(rotaia.querySelectorAll('a'));
      var io2 = new IntersectionObserver(function (rr) {
        rr.forEach(function (x) {
          if (!x.isIntersecting) return;
          var id = '#' + x.target.id;
          voci.forEach(function (v) {
            v.classList.toggle('qui', v.getAttribute('href') === id); });
        });
      }, { rootMargin: '-30% 0px -60% 0px' });
      ['casa', 'denaro', 'posto', 'chiedi', 'applica'].forEach(function (id) {
        var el = document.getElementById(id); if (el) io2.observe(el);
      });
    }
    /* se la casa non ha racconto ne' dote, la sezione non finge */
    var sezCasa = document.getElementById('casa');
    if (sezCasa && !c.racconto && !(c.dentro || []).length)
      sezCasa.style.display = 'none';
  })();

  /* cambiando casa dall'indirizzo, la pagina si rifà */
  addEventListener('hashchange', function () {
    if (/id=/.test(location.hash)) location.reload();
  });
  }
  if (document.readyState === 'complete') via();
  else addEventListener('load', via);
})();
</script>
