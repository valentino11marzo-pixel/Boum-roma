<!-- I MOTORI CONDIVISI. Fino al 31/08/2026 questi quattro tag esistevano
     SOLO dentro apartment-detail.html (aggiunti a mano sul costruito): una
     ricostruzione con costruisci-ld.py li avrebbe persi tutti, e la pagina
     sarebbe caduta sui ripieghi senza che nessuno se ne accorgesse. Il
     template emette cio che la pagina viva usa davvero. E dal 15/10/2026
     anche js/listing-facts.js: la regola delle camere che camereDi legge
     (senza, la scheda ricostruita non rileggerebbe mai le camere). -->
<script src="/js/boom-geo.js"></script>
<script src="/js/dispo-engine.js"></script>
<script src="/js/tempi-engine.js"></script>
<script src="/js/mappa-engine.js"></script>
<script src="/js/listing-facts.js"></script>
<script>
/* LA REGIA DELLA CASA — una casa alla volta, dal catalogo vero.
   Parte al load: il motore Solari è concatenato DOPO questo script. */
(function () {
  'use strict';
  function via() {
  var CASE = 'CASE_JSON';
  /* sito = le API vere partono davvero; artefatto = PREVIEW in console */
  var VERO = 'MODO_QUI' === 'sito';
  var BS = window.BoomSolari;
  var ridotto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function euro(n) { return '€' + Math.round(n).toLocaleString('en-US'); }
  function per(sel) { return document.querySelector(sel); }

  /* quale casa: quella del server (/listing/:id), dell'indirizzo (#id=)
     o del percorso — e se il catalogo fotografato non la conosce ma il
     server ha mandato il documento (casa pubblicata dal bot DOPO la
     build), si costruisce da quello. Mai un annuncio nuovo orfano. */
  /* LA CORSIA (dispo-engine): «Waitlist open» diceva a chi guarda una
     casa bloccata di mettersi in coda a tempo indeterminato, mentre la
     data di rilascio era lì sul documento. Ora la scheda dice il giorno
     in cui entri e il bottone diventa un BLOCCO, non una candidatura.
     `campi` porta availableFrom/availableDate GREZZI: solo il primo (che
     scrive il contratto alla firma) può rendere prenotabile un affittato. */
  function statoDa(s2, d2, campi) {
    /* FUORI MERCATO: nascosta, bozza, archiviata, fuori mercato — la stessa
       lista di api/listing.js e della sitemap. La corsia non le conosce
       (cade su «now»): un vecchio link o una condivisione WhatsApp
       invitava a fare APPLY su una casa che non si affitta. Niente Apply,
       niente hold: si chiede. */
    if (/hidden|draft|archived|off_market/.test(String(s2 || '')))
      return { eti: 'Not on the market', lib: false, lane: 'closed',
        cta: 'Ask about this home', spiega: '', iso: null, chiedi: false,
        fuori: true };
    if (window.BOOM_DISPO && BOOM_DISPO.laneCopy) {
      try {
        var mL = BOOM_DISPO.marketLane({
          status: s2,
          availableFrom: (campi && campi.af) || '',
          availableDate: (campi && campi.ad) || ''
        });
        var lc = BOOM_DISPO.laneCopy(mL);
        /* iso = la data della CORSIA (solo su una prenotabile con data
           certa), non `dal`: su un'affittata `dal` può essere il residuo
           di availableDate mentre la corsia legge il contratto */
        return { eti: lc.eti || lc.short, lib: lc.lane === 'now',
          lane: lc.lane, cta: lc.cta, spiega: lc.long,
          iso: mL.iso || null, chiedi: !!mL.dateUnreadable };
      } catch (e) { /* fallback storico */ }
    }
    var oggi = new Date().toISOString().slice(0, 10), eti, lib;
    if (s2 === 'available') {
      if (d2 && d2 > oggi) {
        var dt = new Date(d2 + 'T12:00:00');
        eti = 'Free from ' + dt.getDate() + ' '
          + dt.toLocaleDateString('en-GB', { month: 'short' });
        if (dt.getFullYear() !== new Date().getFullYear())
          eti += ' ' + dt.getFullYear();
      } else eti = 'Available now';
      lib = true;
    } else if (s2 === 'waitlist') { eti = 'Waitlist open'; lib = false; }
    else if (s2 === 'reserved') { eti = 'Reserved'; lib = false; }
    else { eti = 'Rented'; lib = false; }
    return { eti: eti, lib: lib, lane: lib ? 'now' : 'closed' };
  }
  /* LE CAMERE: UNA regola, quella di js/listing-facts.js (bedroomsOf), che
     questa pagina carica qui sopra. Prima leggeva `bedrooms ?? beds` col
     parseFloat (0 spariva, «Living, 1 bedroom…» non si leggeva): ora il
     campo strutturato vince, il testo libero vale solo se manca, e senza
     il motore non si stampa un numero indovinato. Senza il motore (il
     file non è arrivato: 503, rete) la risposta è undefined = NON LO SO, e
     chi legge lascia il dato che c'è: un null qui cancellava le camere
     giuste della build. */
  function camereDi(d) {
    var F = window.BOOM_FACTS;
    if (!F || !F.bedroomsOf) return undefined;
    try { return F.bedroomsOf(d || {}); }
    catch (e) { return undefined; }
  }
  function casaDaListing(d, ideNuovo) {
    function n(v) {
      var x = parseFloat(String(v == null ? '' : v).replace(',', '.'));
      return isFinite(x) && x > 0 ? x : null;
    }
    function t(v) {
      return String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
    }
    var img = (Array.isArray(d.images) ? d.images : []).filter(Boolean);
    var cover = img[0] || d.coverImage || d.image || '';
    var rawDal = String(d.availableDate || d.availableFrom || '').trim();
    var dal = (rawDal.match(/^\d{4}-\d{2}-\d{2}/) || [])[0] || null;
    /* la data testo libero passa dal motore CONDIVISO: mai "Available
       now" per un regex che legge solo ISO */
    if (!dal && rawDal && window.BOOM_DISPO) {
      try {
        var paD = BOOM_DISPO.parseAvailability(rawDal, new Date());
        if (paD && paD.kind === 'date') dal = paD.iso;
      } catch (e) {}
    }
    var st = statoDa(String(d.status || 'available').toLowerCase(), dal,
      { af: t(d.availableFrom), ad: t(d.availableDate) });
    return {
      id: ideNuovo,
      lane: st.lane, ctaLane: st.cta, spiegaLane: st.spiega,
      laneIso: st.iso || null, laneChiedi: !!st.chiedi, fuori: !!st.fuori,
      nome: t(d.name) || 'Apartment',
      zona: (t(d.zone || d.neighborhood) || 'Roma').split('/')[0],
      indirizzo: t(d.address),
      prezzo: n(d.price) || 0,
      mq: n(d.sqm != null ? d.sqm : d.size),
      letti: camereDi(d),
      bagni: n(d.bathrooms),
      piano: d.floor != null && t(d.floor) !== '' ? t(d.floor) : null,
      tipo: d.type ? t(d.type) : null,
      arredata: ['yes', 'true', 'si', 'sì']
        .indexOf(String(d.furnished || '').toLowerCase()) >= 0,
      stato: st.eti, libera: st.lib, dal: dal,
      racconto: t(d.description),
      dentro: (Array.isArray(d.features) ? d.features
        : Array.isArray(d.tags) ? d.tags : []).filter(Boolean).map(t),
      cauzioneMesi: n(d.depositMonths) || 1,
      lat: d.lat ? parseFloat(d.lat)
        : d.geo && d.geo.lat ? parseFloat(d.geo.lat) : null,
      lng: d.lng ? parseFloat(d.lng)
        : d.geo && d.geo.lng ? parseFloat(d.geo.lng) : null,
      prec: (function () {
        try { return window.BOOM_GEO
          ? BOOM_GEO.pinPrecision(d).level : null; } catch (e) { return null; }
      })(),
      cover: cover,
      varianti: Array.isArray(d.imagesVariants) ? d.imagesVariants : null,
      foto: img.slice(0, 8).length ? img.slice(0, 8)
        : (cover ? [cover] : []),
      video: String(d.videoUrl || d.youtubeUrl || '').trim() || null,
      fotoCurate: !!d.photosEnhancedAt
    };
  }
  var ide = window.__LISTING_ID
    || (location.hash.match(/id=([^&]+)/) || [])[1]
    || (location.search.match(/[?&]id=([^&]+)/) || [])[1]
    || (location.pathname.match(/\/listing\/([^\/?#]+)/) || [])[1];
  var c = CASE.filter(function (x) { return x.id === ide; })[0];
  if (!c && ide && window.__LISTING) c = casaDaListing(window.__LISTING, ide);
  /* UNA CASA CHIESTA E SCONOSCIUTA. Sul ripiego 503 del server (Firestore
     giù) una casa pubblicata DOPO la build non è nel CASE e non c'è
     __LISTING: prima si rendeva CASE[0] («Bilocale Trastevere») sotto
     l'URL di un'altra casa, e APPLY e hold mandavano il SUO listingId —
     lead attribuiti alla casa sbagliata. Ora la pagina lo dice, offre di
     riprovare e WhatsApp, e nessun modulo può partire. CASE[0] resta solo
     per il template nudo, senza id. */
  if (!c && ide) { casaIrraggiungibile(); return; }
  c = c || CASE[0];
  function casaIrraggiungibile() {
    document.title = 'This home is temporarily unavailable — BOOM Rome';
    per('#nomeCasa').textContent = 'This home is temporarily unavailable';
    var dv = per('#doveCasa');
    if (dv) {
      dv.textContent = '';
      var rip = document.createElement('a');
      rip.id = 'riprovaCasa';
      rip.textContent = 'Retry';
      /* Retry porta dove la casa PUÒ esistere. Su /listing/<id> la pagina
         è del server (SSR): ricaricare è giusto, il guasto era momentaneo.
         Sulla rotta statica /apartment-detail?id=<id> — dove atterra anche
         chi annulla l'hold su Stripe (cancel_url di reserve-checkout) — non
         c'è né SSR né __LISTING: una casa nata dopo la build lì non esiste
         MAI, e ricaricare era un vicolo cieco. Si va alla rotta del server. */
      if (/^\/listing\//.test(location.pathname)) {
        rip.href = location.href;
        rip.addEventListener('click', function (e) {
          e.preventDefault(); location.reload(); });
      } else {
        var idChiaro = ide;
        try { idChiaro = decodeURIComponent(ide); } catch (e) {}
        rip.href = '/listing/' + encodeURIComponent(idChiaro);
      }
      var wa = document.createElement('a');
      wa.href = 'https://wa.me/393313251961?text=' + encodeURIComponent(
        'Hi! I\u2019m asking about the home at ' + location.origin
        + '/listing/' + ide);
      wa.target = '_blank'; wa.rel = 'noopener';
      wa.textContent = 'WhatsApp BOOM';
      dv.appendChild(rip);
      dv.appendChild(document.createTextNode(' \u00b7 '));
      dv.appendChild(wa);
    }
    var stI = per('#statoCasa');
    if (stI) { stI.textContent = 'Unavailable'; stI.className = 'stato-grande presa'; }
    var cn = per('#canoneCasa');
    if (cn) { cn.textContent = ''; cn.dataset.p = ''; }
    var bz = per('#briZona');
    if (bz) { bz.textContent = 'Rome'; bz.setAttribute('href', '/apartments'); }
    /* niente modulo che possa partire: APPLY e hold spariscono, e un
       submit nativo (senza i listener della regia) non va da nessuna parte */
    ['applica', 'presaCasa', 'portaVideo'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    ['modApplica', 'presaForma'].forEach(function (id) {
      var fm = document.getElementById(id);
      if (fm) fm.addEventListener('submit', function (e) { e.preventDefault(); });
    });
    /* le sezioni che parlano di QUESTA casa (racconto, soldi, posto, FAQ
       con le sue cifre): senza la casa resterebbero trattini e mappe vuote */
    ['casa', 'denaro', 'posto', 'chiedi'].forEach(function (id) {
      var sz = document.getElementById(id);
      if (sz) sz.style.display = 'none';
    });
    /* la rotaia (desktop) puntava a cinque sezioni ora nascoste, e «Three
       more, walked the same way» restava sopra una griglia vuota (le altre
       case non si disegnano: il return è prima): via entrambe */
    var rt = document.getElementById('rotaia');
    if (rt) rt.style.display = 'none';
    var al = document.getElementById('altre');
    var alW = al && al.closest ? al.closest('.sale') : null;
    if (alW) alW.style.display = 'none';
  }

  /* ── la scena: la foto grande e il rullino ──────────────────────────── */
  var telaio = document.getElementById('telaio');
  var rullino = document.getElementById('rullino');
  var immagini = c.foto && c.foto.length ? c.foto : [c.cover];
  immagini = immagini.filter(Boolean);
  var img = document.createElement('img');
  img.alt = c.nome + ', ' + c.zona + ' — apartment for rent in Rome with BOOM';
  img.decoding = 'async';
  /* l'elemento LCP della pagina: la rete lo tratta da protagonista */
  img.setAttribute('fetchpriority', 'high');
  telaio.insertBefore(img, telaio.firstChild);
  /* le varianti della pipeline enhance (w480/w960): allineate per src,
     mai per solo indice — se gli array driftano, resta il master */
  function variante(i) {
    var v = c.varianti && c.varianti[i];
    return (v && v.src === immagini[i]) ? v : null;
  }
  function mostra(i) {
    img.classList.remove('qui');
    var v = variante(i);
    if (v && (v.w480 || v.w960)) {
      img.onload = function () { img.classList.add('qui'); img.onload = null; };
      img.sizes = '100vw';
      img.srcset = [v.w480 ? v.w480 + ' 480w' : '',
        v.w960 ? v.w960 + ' 960w' : '', immagini[i] + ' 1920w']
        .filter(Boolean).join(', ');
      img.src = immagini[i];
      if (img.complete && img.naturalWidth) {
        img.classList.add('qui'); img.onload = null;
      }
    } else {
      var pre = new Image();
      pre.onload = function () { img.removeAttribute('srcset');
        img.src = pre.src; img.classList.add('qui'); };
      pre.src = immagini[i];
    }
    [].slice.call(rullino.children).forEach(function (b, k) {
      b.classList.toggle('qui', k === i); });
  }
  immagini.forEach(function (u, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'Photo ' + (i + 1) + ' of ' + immagini.length);
    var t = document.createElement('img');
    var vt = variante(i);
    t.src = (vt && vt.w480) || u;   /* il rullino non scarica mai 1920px */
    t.alt = ''; t.loading = 'lazy'; t.decoding = 'async';
    b.appendChild(t);
    b.addEventListener('click', function () { mostra(i); });
    rullino.appendChild(b);
  });
  if (immagini.length < 2) rullino.style.display = 'none';

  /* ── sfogliare: frecce, tastiera, contatore ──────────────────────────
     Mancavano: su una pagina casa la foto successiva e il gesto piu
     ripetuto che ci sia. */
  (function () {
    var prec = document.getElementById('foPrec'),
        succ = document.getElementById('foSucc'),
        conta = document.getElementById('contaFoto');
    if (!prec || !succ) return;
    if (immagini.length < 2) {
      prec.style.display = succ.style.display = 'none';
      if (conta) conta.style.display = 'none'; return;
    }
    var qui = 0;
    function vai(d) {
      qui = (qui + d + immagini.length) % immagini.length;
      mostra(qui);
      try { new Image().src = immagini[(qui + 1) % immagini.length];
        new Image().src = immagini[(qui - 1 + immagini.length) % immagini.length];
      } catch (e) {}
      if (conta) conta.textContent = (qui + 1) + ' / ' + immagini.length;
      var b = rullino.children[qui]; if (b && b.scrollIntoView)
        b.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
    }
    prec.addEventListener('click', function () { vai(-1); });
    succ.addEventListener('click', function () { vai(1); });
    /* il gesto piu' ripetuto: lo swipe sul telaio (il pattern della
       lente, riusato) — e la prossima foto si precarica da sola */
    (function () {
      var x0 = null;
      telaio.addEventListener('touchstart', function (e) {
        x0 = e.touches[0].clientX; }, { passive: true });
      telaio.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 40) vai(dx < 0 ? 1 : -1);
      }, { passive: true });
    })();
    [].slice.call(rullino.children).forEach(function (b, k) {
      b.addEventListener('click', function () {
        qui = k; if (conta) conta.textContent = (k + 1) + ' / ' + immagini.length;
      });
    });
    addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      var l = document.getElementById('lente');
      if (l && !l.hidden) return;   /* la lente ha le sue frecce */
      if (e.key === 'ArrowLeft') { e.preventDefault(); vai(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); vai(1); }
    });
    if (conta) conta.textContent = '1 / ' + immagini.length;
  })();
  mostra(0);

  /* ── l'anagrafica ───────────────────────────────────────────────────── */
  /* il nome è una FUNZIONE: l'idrante la richiama quando il documento
     vero porta un nome diverso dalla fotografia di build (i nomi dalla
     via, 15/10/2026) — H1, titolo, modulo, foto e WhatsApp dicono lo
     stesso nome. Il server l'H1 lo scrive già dal documento: senza questa
     rilettura il client lo riportava al nome della build. */
  var rifaiChiedi = function () {};
  function scriviNome() {
    per('#nomeCasa').textContent = c.nome;
    document.title = c.nome + ' — ' + c.zona + ', Rome | BOOM';
    var apN = document.getElementById('applicaNome');
    if (apN) apN.textContent = c.nome;
    img.alt = c.nome + ', ' + c.zona + ' — apartment for rent in Rome with BOOM';
    rifaiChiedi();
  }
  per('#nomeCasa').textContent = c.nome;
  per('#doveCasa').textContent = [c.zona, c.indirizzo].filter(Boolean).join(' · ');
  per('#briZona').textContent = c.zona;
  per('#briZona').setAttribute('href', '/apartments.html#zona=' + encodeURIComponent(c.zona));
  document.title = c.nome + ' — ' + c.zona + ', Rome | BOOM';
  var st = per('#statoCasa');
  /* lo stato e l'informazione piu volatile della pagina: si vede che e viva */
  function scriviStato() {
    st.textContent = c.stato;
    st.className = 'stato-grande ' + (/^Free from/i.test(c.stato) ? 'dopo'
      : c.libera ? 'libera'
      : /wait/i.test(c.stato) ? 'attesa' : 'presa');
  }
  scriviStato();
  var rifaiDurata = function () {}, rifaiPresa = function () {},
      rifaiPorte = function () {}, rifaiCta = function () {};
  /* la chiave dei preferiti e la stessa delle altre due pagine:
     il segnaposto sopravvive al replace di navigazione del builder */
  per('#cuoreCasa').dataset.u = 'CHIAVE_CASA' + c.id;
  per('#applicaNome').textContent = c.nome;
  /* WhatsApp arriva gia' col contesto: mai un «ciao» muto — l'operatore
     sa di quale casa si parla e la pipeline aggancia il listing */
  (function () {
    var wa = document.querySelector('.chiedi-wa');
    if (!wa) return;
    rifaiChiedi = function () {
      var msg = 'Hi! I\u2019m asking about \u201c' + c.nome + '\u201d ('
        + c.zona + ') \u2014 ' + location.origin + '/listing/'
        + encodeURIComponent(c.id);
      wa.href = 'https://wa.me/393313251961?text=' + encodeURIComponent(msg);
    };
    rifaiChiedi();
    wa.addEventListener('click', function () {
      if (window.boomTrack) boomTrack('whatsapp_click', { item_id: c.id || '' });
    });
  })();
  /* se la casa non e libera, la CTA non finge: si entra in lista */
  /* una casa libera DA una data: la data sta nel gesto, non solo nel badge */
  /* IL PRE-BLOCCO. Su una casa occupata il vecchio testo chiedeva di
     «mettersi in lista» e di aspettare «il momento in cui si libera» —
     un'attesa senza data, che è il modo più sicuro di perdere qualcuno
     che sta programmando un trasferimento. Sedici case su ventisei di
     questo catalogo hanno invece una data di rilascio NOTA: chi guarda
     deve leggere il giorno in cui entra e poter bloccare adesso. Le
     parole vengono da laneCopy, le stesse della card e del JSON-LD.
     È una FUNZIONE (rifaiCta) perché l'idrante la richiama quando il
     documento vero cambia lo stato: una casa fotografata libera e poi
     archiviata non deve continuare a dire «Send application». */
  (function () {
    var bAp = document.querySelector('#modApplica button[type="submit"]');
    var sAp = document.getElementById('applicaSotto');
    var ctaBase = bAp ? bAp.textContent : '';
    var sottoBase = sAp ? sAp.textContent : '';
    rifaiCta = function () {
      if (bAp) bAp.textContent = ctaBase;
      if (sAp) sAp.textContent = sottoBase;
      if (c.libera && c.dal) {
        var oggiIso = new Date().toISOString().slice(0, 10);
        if (c.dal > oggiIso && bAp) {
          var dF = new Date(c.dal + 'T12:00:00');
          bAp.textContent = 'Apply \u00b7 move in '
            + dF.getDate() + ' ' + dF.toLocaleDateString('en-GB', { month: 'short' });
        }
      }
      if (!c.libera) {
        var chiuso = c.lane === 'closed';
        if (bAp) bAp.textContent = c.ctaLane || (chiuso ? 'Ask about this home'
          : 'Reserve ahead');
        if (sAp) {
          sAp.textContent = c.fuori
            ? 'This home is not on the market right now. Tell us what you '
              + 'need and we send you the closest matches — from a person, '
              + 'not a robot.'
            : chiuso
            ? 'This home is rented right now. Tell us what you need and we '
              + 'send you the closest matches — from a person, not a robot.'
            /* solo fatti che il sistema può mantenere: la data viene dalla
               locazione in corso, e chi prenota lo sa per primo se cambia.
               Nessuna promessa sui costi — l'hold ha le sue regole, e una
               riga di marketing non può contraddire il prodotto. */
            : (c.spiegaLane ? c.spiegaLane + ' ' : '')
              + 'You reserve it now and sign closer to the date. The date '
              + 'comes from the current tenancy — if it moves, you are the '
              + 'first to know, from a person.';
        }
      }
      /* la barra di decisione (mobile) segue lo stesso stato */
      var dS = document.getElementById('decStato');
      var dV = document.getElementById('decVai');
      if (dS) dS.textContent = c.stato;
      if (dV) dV.textContent = c.libera ? 'Apply' : (c.fuori ? 'Ask' : 'Waitlist');
    };
    rifaiCta();
  })();

  /* il canone sui Solari, come ovunque nel sito */
  var canone = per('#canoneCasa');
  var mostraCanone = (function () {
    var bo = null, largo = 0;
    return function (subito) {
      var t = euro(c.prezzo);
      canone.dataset.p = t;
      canone.setAttribute('aria-label', t + ' per month');
      if (!BS) { canone.textContent = t; return; }
      if (!bo || t.length !== largo) {
        canone.innerHTML = ''; largo = t.length;
        bo = new BS.Board(canone, largo, ' €,.0123456789');

    var box = per('#fatti');

  (function () {

    var tw = pel.querySelector('.timbro-walk');
    if (tw && 'IntersectionObserver' in window) {

          var fr = document.createElement('iframe');

  /* ── IL DENARO IN CHIARO ────────────────────────────────────────────
     Regole dichiarate, aritmetica visibile: la cauzione e N mensilita,
     l'onorario il 10% del canone ANNUO più IVA 22% — è ciò che la proposta
     addebita davvero (api/preagreement/create.js; js/listing-facts.js per
     le superfici server) — quindi non cambia con la durata,
     e per questo il giorno uno resta uguale mentre il soggiorno no). */
  /* la cifra grande e il giorno uno INTERO: canone + deposito + onorario.
     Nessuna voce a margine — il deposito e un pagamento vero, e torna,
     ed e scritto in verde sulla sua riga. Un numero, una storia. */
  var cauzione, onorario, totale;
  /* LE MENSILITÀ DI DEPOSITO: il documento le dichiara solo a volte, e
     senza la pagina mostra UNA mensilità di default. Quel numero è una
     nostra ipotesi, non un fatto della casa: si dice che lo conferma la
     proposta, invece di presentarlo come scritto. */
  function cauzioneDichiarata() {
    if (c.cauzioneDich) return true;
    var L = (window.__LISTING && window.__LISTING_ID === c.id) ? window.__LISTING : null;
    var m = L ? parseFloat(L.depositMonths) : NaN;
    return isFinite(m) && m > 0;
  }
  function contiSoldi() {
    var mesi = c.cauzioneMesi || 1;
    cauzione = c.prezzo * mesi;
    onorario = Math.round(c.prezzo * 12 * .10 * 1.22);
    totale = c.prezzo + cauzione + onorario;
    per('#voceCanone').textContent = euro(c.prezzo);
    per('#voceOnorario').textContent = euro(onorario);
    per('#voceCauzione').textContent = euro(cauzione);
    per('#chiaviOnorario').textContent = euro(onorario);
    var cn = document.getElementById('cauzioneNota');
    if (cn) cn.textContent = cauzioneDichiarata()
      ? 'returned at the end, after the move-out check against the signed '
        + 'check-in report'
      : 'one month shown, confirmed in your pre-agreement — returned at '
        + 'the end, after the move-out check';
  }
  contiSoldi();

  /* LE UTENZE: «non incluse» era scritto per ogni casa, anche per quelle
     che l'operatore ha etichettato «All inclusive». Si legge l'etichetta
     (js/listing-facts.js, la stessa regola del server), mai la
     descrizione: il documento del server se c'è, altrimenti le voci della
     fotografia di build. */
  function bollette() {
    var F = window.BOOM_FACTS;
    if (!F || !F.billsIncluded) return false;
    var doc = (window.__LISTING && window.__LISTING_ID === c.id)
      ? window.__LISTING : { features: c.dentro || [] };
    try { return F.billsIncluded(doc); } catch (e) { return false; }
  }
  (function () {
    var cf = document.getElementById('chiaviFuori');
    if (!cf || !bollette()) return;
    var link = cf.querySelector('a');

    cf.innerHTML = '<b>Bills:</b> this home is listed with bills included '

  /* il totale gira sui Solari: e la cifra che conta piu di ogni altra */
  var mostraTotale = function () {};
  (function () {
    var host = document.getElementById('totFlap');
    if (!host) return;

    function scrivi(subito) {

      if (!quadro || testo.length !== largo) {
        host.innerHTML = ''; largo = testo.length;
        quadro = new BS.Board(host, largo, ' €,.0123456789');
      }
      (ridotto || subito) ? quadro.show(testo) : quadro.show(testo, 46, true);
    }
    mostraTotale = scrivi;
    if (ridotto || !('IntersectionObserver' in window)) scrivi(true);
    else new IntersectionObserver(function (v, io) {
      if (!v[0].isIntersecting) return;
      io.disconnect(); scrivi(false);
    }, { threshold: .35 }).observe(host);
  })();

  /* la durata: il giorno uno non cambia, il soggiorno si — ed e la
     domanda che arriva ogni volta in chat */
  (function () {
    var tasti = [].slice.call(document.querySelectorAll('.durata-tasti button'));
    if (!tasti.length) return;

        t.classList.toggle('on', Number(t.dataset.m) === m); });

      document.dispatchEvent(new CustomEvent('boom:durata', { detail: m }));
    }
    tasti.forEach(function (t) {

    rifaiDurata = function () { conta(mScelto); };

  /* ── QUELLO CHE CI CHIEDERESTI SU WHATSAPP ──────────────────────────
     Dieci risposte, ognuna vera per quello che il sito e i documenti gia
     dicono. Le cifre vengono dalla casa aperta, non da un testo fisso. */
  /* «Quando entro?» segue la CORSIA, non `dal`. Prima un'affittata senza
     data diceva «This one is available now» sotto il badge «Rented» — e la
     stessa frase finiva nel FAQPage (#faqLd) che i motori leggono. La
     corsia viene dal motore (casaDaListing/digest); per la fotografia di
     build, che non la porta, si deduce dal badge, e nel dubbio mai «now». */
  function corsiaCasa() {
    if (c.lane) return c.lane;
    var s = String(c.stato || '');
    var oggi = new Date().toISOString().slice(0, 10);
    if (/^Free from/i.test(s) || (c.libera && c.dal && c.dal > oggi)) return 'ahead';
    if (c.libera) return 'now';
    if (/wait|reserve ahead/i.test(s)) return 'ahead';
    return 'closed';
  }
  function quandoEntri() {
    var oggi = new Date().toISOString().slice(0, 10);
    function giorno(iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB',
        { day: 'numeric', month: 'long', year: 'numeric' });
    }
    var lane = corsiaCasa();
    if (c.fuori) return ' is not on the market right now.';
    if (lane === 'closed') return ' is rented right now.';
    if (lane === 'ahead') {
      /* la data della corsia; per la fotografia di build, `dal` solo se
         ancora futura (un residuo passato non è una data di rilascio) */
      var iso = c.laneIso || (!c.lane && c.dal && c.dal > oggi ? c.dal : null);
      return iso
        ? ' is free from <em>' + giorno(iso) + '</em> and can be reserved today.'
        : ' can be reserved ahead — ask us for the release date.';
    }
    if (c.laneChiedi || /^Ask us/i.test(String(c.stato || '')))
      return ': ask us for the exact move-in date.';
    return c.dal && c.dal > oggi
      ? ' is available from <em>' + giorno(c.dal) + '</em>.'
      : ' is available now.';
  }
  function scriviChiedi() {
    var lista = document.getElementById('chiediLista');
    if (!lista) return;
    var D = [
      ['Can I see it without flying to Rome?',
       'Yes — and for our homes it costs nothing: a BOOM agent walks this '
       + 'exact flat on live video with you asking the questions. Book a '
       + 'slot on WhatsApp. (The paid €89 Virtual Viewing is for homes on '
       + 'OTHER portals — this one is ours.)'],
      ['What exactly do I pay on day one?',
       '<em>' + euro(totale) + '</em>: first month ' + euro(c.prezzo)
       + ', deposit ' + euro(cauzione) + ' and the agency fee '
       + euro(onorario) + ' (10% of a year\'s rent + 22% VAT). Nothing else is charged by us.'
       + (cauzioneDichiarata() ? ''
         : ' The deposit is shown as one month; your pre-agreement confirms it.')],
      ['Is the deposit really coming back?',
       'It is paid to the landlord under the lease and returned at the end '

      ['How do I pay — and to whom?',
       'Through BOOM on Stripe, with a receipt for each line. Never a bank '

      ['What kind of contract is it?',
       'Italy\'s official standard-form lease, registered under L. 431/98 — '

      ['Do I have to be in Rome to sign?',
       'No. You sign from your phone with a private link, and the landlord '
       + 'countersigns after you. The keys are the only thing that needs you '
       + 'in the city.'],
      ['Do I need an Italian guarantor?',
       'Not by default. We look at your situation — employed, self-employed, '
       + 'student, relocating — and tell you what this particular landlord '
       + 'asks for before you apply, not after.'],
      ['How fast can I actually move in?',
       'As little as <em>48 hours</em> from a signed pre-agreement, if the '
       + 'flat is free. This one' + quandoEntri()],
      ['Can I hold it while I decide?',
       'Yes — a <em>€300</em> hold takes it off the market for 48 hours, one '
       + 'tap, fully refundable. It is the only way to stop someone else '
       + 'taking it while you think.'],
      bollette() ? ['Are the bills included?',
       'This home is listed with bills included — the pre-agreement lists '
       + 'exactly which bills, before you pay anything. Any registration '
       + 'tax or stamp duty is split as the lease states (none under the '
       + 'landlord\'s cedolare secca option).']
      : ['What is not included in the figures above?',
       'Utilities (electricity, gas, water, internet), paid to the '
       + 'providers; your share of condominium charges, where the lease '
       + 'puts it on you; and any registration tax or stamp duty the lease '
       + 'assigns to you (none under the landlord\'s cedolare secca option). '
       + 'We never mark any of them up.']
    ];
    /* domande tutte VISIBILI (regola GEO: il FAQPage afferma solo cio'
       che la pagina mostra), risposte richiudibili — la prima aperta */
    lista.innerHTML = D.map(function (q, i2) {
      return '<details class="chiedi-v"' + (i2 === 0 ? ' open' : '')
        + '><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>';
    }).join('');
    /* per i motori: le STESSE dieci risposte — mai due verita */
    try {
      var ld = { '@context': 'https://schema.org', '@type': 'FAQPage',
        mainEntity: D.map(function (q) { return { '@type': 'Question',
          name: q[0], acceptedAnswer: { '@type': 'Answer',
            text: q[1].replace(/<[^>]+>/g, '') } }; }) };
      var sc = document.getElementById('faqLd');
      if (!sc) {
        sc = document.createElement('script');
        sc.type = 'application/ld+json'; sc.id = 'faqLd';
        document.head.appendChild(sc);
      }
      sc.textContent = JSON.stringify(ld);
    } catch (err) {}
  }
  scriviChiedi();

  /* ── L'APPLY ─────────────────────────────────────────────────────────
     Raccoglie il corpo ESATTO di /api/apply-lead — la porta del pipeline
     vero — piu le due cose che alla console servono per creare il
     pre-accordo senza richiamare nessuno: quanti firmano e per quanto.
     Dichiarato PREVIEW: la richiesta si vede in console, non parte. */
  (function () {
    var f = document.getElementById('modApplica');
    if (!f) return;
    var eti = [].slice.call(document.querySelectorAll('.passi .passo-eti'));
    var gruppi = [].slice.call(f.querySelectorAll('.ap-gruppo'));
    function pieno(g) {
      return [].slice.call(g.querySelectorAll('input, select')).some(
        function (x) { return String(x.value || '').trim(); });
    }
    function stato() {
      gruppi.forEach(function (g, i) {
        var e = eti[i]; if (!e) return;
        e.classList.toggle('fatto', pieno(g));
        e.classList.toggle('ora', !pieno(g)
          && (i === 0 || pieno(gruppi[i - 1])));
      });
    }
    f.addEventListener('input', stato); f.addEventListener('change', stato);
    /* la durata scelta nel conto arriva gia compilata qui */
    document.addEventListener('boom:durata', function (e) {
      var m = f.querySelector('#apMesi');
      if (m) { m.value = String(e.detail); stato(); }
    });
    var apQ = f.querySelector('#apQuando');
    if (apQ) { /* niente passato: il min che il campo di discovery ha già */
      try { apQ.min = new Date().toISOString().slice(0, 10); } catch (e) {}
      if (c.dal) apQ.value = c.dal;
    }
    stato();

    var errore = f.querySelector('#apErrore');
    var invia = f.querySelector('button[type="submit"]');
    /* UNA candidatura anche se si riprova. Il server salva il lead e poi
       aspetta l'SMTP: un timeout o una rete caduta DOPO il salvataggio
       mostrava l'errore, e il nuovo tentativo creava un secondo lead (con
       email e Telegram doppi). La chiave è una per pagina, la stessa a
       ogni tentativo; il server la accetta con /^[\w-]{8,64}$/ e scrive
       `apply_<requestId>` una volta sola. */
    var apReq = (function () {
      try {
        if (window.crypto && typeof crypto.randomUUID === 'function')
          return crypto.randomUUID();
      } catch (err) { /* contesto non sicuro: si ripiega */ }
      return Date.now().toString(36) + '-'
        + Math.random().toString(36).slice(2, 12);
    })();
    function dici(t) {
      if (!errore) return;
      errore.textContent = t || '';
      errore.hidden = !t;
    }
    var inVolo = false;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if (inVolo) return;
      dici('');
      var nomeV = f.querySelector('#apNome').value.trim(),
          mailV = f.querySelector('#apMail').value.trim(),
          telV = (f.querySelector('#apTel') || { value: '' }).value.trim();
      if (!nomeV) { f.querySelector('#apNome').focus(); return; }
      /* la STESSA regola del server (api/apply-lead.js): un'email con «@»
         e «.», oppure un telefono con almeno 6 cifre. Prima il form
         diceva «Sent» anche quando il server rispondeva 400 */
      var okMail = mailV.indexOf('@') >= 0 && mailV.indexOf('.') >= 0;
      var okTel = telV.replace(/\D/g, '').length >= 6;
      if (!okMail && !okTel) {
        dici('Check your email address (or add a WhatsApp number) so we can reply.');
        f.querySelector('#apMail').focus();
        return;
      }
      var d = new FormData(f);
      /* il corpo di /api/apply-lead, campo per campo */
      var corpo = {
        name: d.get('nome'), email: d.get('email'), phone: d.get('telefono'),
        listingId: c.id, listingName: c.nome, listingPrice: c.prezzo,
        zone: c.zona,
        /* una casa con data di rilascio NOTA non è una lista d'attesa: è
           una PRENOTAZIONE (intent 'reserve', con la data già nel corpo).
           La lista vera resta per l'affittata senza data — così in
           pipeline l'operatore distingue «la vuole dal 1 settembre» da
           «gli piacerebbe, ma è occupata». */
        kind: c.libera ? 'apply' : (c.lane === 'ahead' ? 'reserve' : 'waitlist'),
        waitlist: !c.libera && c.lane !== 'ahead',
        income: d.get('reddito'), guarantor: d.get('garante'),
        household: d.get('chi'), occupation: d.get('occupazione'),
        moveIn: d.get('quando'), durationMonths: Number(d.get('mesi')) || null,
        /* in piu, per il pre-accordo: quante firme ci saranno */
        signers: Number(d.get('firmatari')) || 1,
        requestId: apReq,                 /* idempotenza: un lead per pagina */
        company: d.get('company')          /* esca per i robot */
      };
      function fatto() {
        f.style.display = 'none';
        var sotto = document.getElementById('applicaSotto');
        if (sotto) sotto.style.display = 'none';
        var ok = document.getElementById('applicaFatto');
        if (ok) {
          ok.classList.add('si');
          ok.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
      if (window.boomTrack) boomTrack('apply_submit',
        { item_id: c.id || '', intent: c.libera ? 'apply' : 'waitlist' });
      if (!VERO) {
        console.info('[PREVIEW] POST /api/apply-lead →', corpo);
        fatto();
        return;
      }
      /* «Sent» SOLO dopo che il server ha salvato il lead: prima la
         richiesta partiva e la pagina diceva «Sent» comunque — anche su
         un 400, un 429 o una rete caduta. keepalive: un tap e via non
         uccide la richiesta in volo. */
      inVolo = true;
      if (invia) invia.disabled = true;
      var KO = 'We couldn\'t send your application — please try again, '
        + 'or message us on WhatsApp: +39 331 325 1961.';
      (async function () {
        try {
          const res = await fetch('/api/apply-lead', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },

  /* ── L'IDRANTE: la pagina resta viva sui dati del bot ─────────────────
     Il builder fotografa il catalogo, ma Firestore cambia in ogni

  function digest(nume, testo, grezzo) {
    var cambia = false;
    /* IL NOME E LE CAMERE (15/10/2026): la fotografia di build li porta
       cotti, l'operatore li cambia su Firestore (i nomi dalla via, la

       uno che dice qualcosa che non si legge toglie il numero: meglio
       tacere che stampare quello vecchio. */

    var n2 = String(grezzo('name') == null ? '' : grezzo('name'))
      .replace(/\s+/g, ' ').trim();

      var l2 = camereDi({ bedrooms: grezzo('bedrooms'), beds: grezzo('beds') });
      /* undefined = il motore delle camere non c'è: non si sa, e il dato
         della build resta — un'assenza non cancella un fatto */
      if (l2 !== undefined && l2 !== c.letti) { c.letti = l2; lettiNuovi = true; }
    }
    if (nomeNuovo) { scriviNome(); rifaiPorte(); }
    if (lettiNuovi) scriviFatti();
    var p2 = nume('price');
    if (p2 && p2 !== c.prezzo) { c.prezzo = p2; cambia = true; }
    var m2 = nume('depositMonths');
    if (m2 && m2 !== c.cauzioneMesi) {

    /* il documento DICHIARA le mensilità: la nota «confermato nella

    if (m2 && !c.cauzioneDich) { c.cauzioneDich = true; cambia = true; }

    if (s2) {

      var st2 = statoDa(s2, d2, { af: af2, ad: ad2 });
      /* la corsia conta anche quando il badge non cambia: la fotografia
         di build non la porta, e la FAQ «quando entro» la legge */
      var corsiaNuova = st2.lane !== c.lane
        || (st2.iso || null) !== (c.laneIso || null)
        || !!st2.chiedi !== !!c.laneChiedi
        || !!st2.fuori !== !!c.fuori;
      if (st2.eti !== c.stato || st2.lib !== c.libera || d2 !== c.dal || corsiaNuova) {
        c.stato = st2.eti; c.libera = st2.lib; c.dal = d2;
        c.lane = st2.lane; c.ctaLane = st2.cta; c.spiegaLane = st2.spiega;
        c.laneIso = st2.iso || null; c.laneChiedi = !!st2.chiedi;
        c.fuori = !!st2.fuori;
        cambia = true;
      }
    }
    if (!cambia) return;
    scriviStato(); contiSoldi(); mostraTotale(true); mostraCanone(true);
    rifaiDurata(); scriviChiedi(); rifaiPresa(); rifaiPorte(); rifaiCta();
  }
  /* prima sorsata: il documento gia iniettato dal server — zero rete */
  if (VERO && window.__LISTING && window.__LISTING_ID === c.id)
    (function (d) {
      digest(function (k) {
        var n = parseFloat(d[k]);
        return isFinite(n) && n > 0 ? n : null;
      }, function (k) { return d[k] == null ? '' : String(d[k]); },
      function (k) { return d[k] == null ? null : d[k]; });
    })(window.__LISTING);
  /* seconda: la rilettura viva, come sempre — e con lei le tre «altre
     case» in fondo (rileggiAltre, qui sotto: una richiesta sola) */
  if (VERO) setTimeout(function () {
    rileggiAltre();
    fetch('https://firestore.googleapis.com/v1/projects/'
        + 'boom-property-dashboards/databases/(default)/documents/listings/'
        + encodeURIComponent(c.id))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.fields) return;
        var f = j.fields;
        digest(function (k) {
          var v = f[k]; if (!v) return null;
          var n = parseFloat(v.integerValue || v.doubleValue
            || v.stringValue);
          return isFinite(n) && n > 0 ? n : null;
        }, function (k) {
          var v = f[k]; return v ? String(v.stringValue || '') : '';
        }, function (k) {
          var v = f[k]; if (!v) return null;
          return v.stringValue != null ? v.stringValue
            : v.integerValue != null ? v.integerValue
            : v.doubleValue != null ? v.doubleValue : null;
        });
      })
      .catch(function () { /* niente rete: restano i numeri del builder */ });
  }, 600);

  /* ── le altre case: tre, della stessa mano ──────────────────────────── */
  var altre = CASE.filter(function (x) {
    return x.id !== c.id && x.cover;
  }).sort(function (a, b) {
    /* prima quelle libere, poi quelle della stessa zona */
    var pa = (a.libera ? 0 : 2) + (a.zona === c.zona ? 0 : 1);
    var pb = (b.libera ? 0 : 2) + (b.zona === c.zona ? 0 : 1);
    return pa - pb;
  }).slice(0, 3);
  /* nomi, zone e stati vengono dal documento (e la rilettura qui sotto li
     riscrive): nel markup entrano come testo */
  function escA(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
               '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  var boxAltre = document.getElementById('altre');
  boxAltre.innerHTML = altre.map(function (a) {
    var dati = [a.zona, a.mq ? a.mq + ' m²' : '',
      a.letti === 0 ? 'Studio' : (a.letti ? a.letti + ' bed' : '')]
      .filter(Boolean).map(escA).join(' <i>·</i> ');
    /* il canone nasce come TESTO (si legge anche senza Solari), poi
       montaPrezzo lo mette sul tabellone: prima il nodo nasceva VUOTO e il
       montaggio degli organi era già passato (via() parte al load), quindi
       le tre carte in fondo non mostravano nessun prezzo */
    /* '/listing/' resta una stringa a sé: nell'artefatto costruisci-ld.py
       la cambia in '#id=' (lì una casa si apre per frammento) */
    return '<a class="casa-p" href="' + '/listing/' + escA(encodeURIComponent(a.id)) + '">'
      + '<div class="home-foto"><img loading="lazy" decoding="async" src="'
      + escA(a.cover) + '" alt="' + escA(a.nome + ', ' + a.zona) + '">'
      + '<span class="casa-stato ' + (a.libera ? 'si' : '') + '">'
      + escA(a.stato) + '</span></div>'
      + '<div class="corpo"><div class="riga1"><span class="nome">'
      + escA(a.nome) + '</span><span class="canone"><span class="flap-prezzo '
      + 'flap-scale" data-p="' + escA(euro(a.prezzo)) + '" aria-label="'
      + escA(euro(a.prezzo)) + ' per month">' + escA(euro(a.prezzo))
      + '</span><small>/mo</small></span></div>'
      + '<div class="riga2">' + dati + '</div></div></a>';
  }).join('');
  /* il prezzo sul Solari, come __solariPrezzo della vetrina */
  function montaPrezzo(host) {
    var testo = host.dataset.p || '';
    if (!BS) { host.textContent = testo; return; }
    var b = new BS.Board(host, testo.length, ' €,.0123456789');
    if (ridotto || !('IntersectionObserver' in window)) { b.show(testo); return; }
    new IntersectionObserver(function (r, io) {
      if (!r[0].isIntersecting) return;
      io.disconnect();
      b.show(testo, 40, true);
    }, { threshold: .4 }).observe(host);
  }
  var altreCarte = [].map.call(boxAltre.querySelectorAll('.casa-p'),
    function (el, i) { return { id: altre[i].id, el: el }; });
  altreCarte.forEach(function (x) {
    var fp = x.el.querySelector('.flap-prezzo');
    if (fp) montaPrezzo(fp);
  });
  /* LA RILETTURA DELLE ALTRE (15/10/2026). Le tre carte in fondo erano la
     fotografia di build — nome, camere, stato e prezzo del giorno del
     deploy — mentre la casa aperta sopra si rilegge da Firestore: una
     pagina con due verità. Ora i loro documenti si rileggono insieme alla
     casa, in UNA richiesta (documents:batchGet anonimo, la stessa lettura
     pubblica dei listings, text/plain per non chiedere un preflight): nome
     e camere con le STESSE rinomina e scriviCamere della vetrina (copie
     identiche, pinnate da tests/catalogo/vetrina.mjs), lo stato con
     statoDa (la stessa corsia della casa aperta), il prezzo rimontato sul
     Solari. Una rilettura fallita, o un documento che manca, non tocca
     niente: restano le carte della build. */
  function rinomina(card, nome) {
    var el = card.querySelector('.nome');
    if (!el || !nome) return false;
    var prima = el.textContent.replace(/\s+/g, ' ').trim();
    if (prima === nome) return false;
    el.textContent = nome;
    var img = card.querySelector('.home-foto img');
    var alt = img ? img.getAttribute('alt') || '' : '';
    if (img && alt.indexOf(prima + ', ') === 0)
      img.setAttribute('alt', nome + alt.slice(prima.length));
    var cerca = card.dataset.cerca, pl = prima.toLowerCase();
    if (cerca == null || (cerca !== pl && cerca.indexOf(pl + ' ') !== 0)) return false;
    card.dataset.cerca = nome.toLowerCase() + cerca.slice(pl.length);
    return true;
  }
  function scriviCamere(card, n) {
    var cambia = false, dl = n == null ? '' : String(n);
    if (card.dataset.letti !== undefined && card.dataset.letti !== dl) {
      card.dataset.letti = dl; cambia = true;
    }
    var r2 = card.querySelector('.riga2');
    if (!r2) return cambia;
    var voce = n === 0 ? 'Studio' : n ? n + ' bed' : '', vecchia = null;
    [].forEach.call(r2.childNodes, function (x) {
      if (x.nodeType === 3 && /^\s*(\d+ bed|Studio)\s*$/.test(x.nodeValue)) vecchia = x;
    });
    if (vecchia) {
      if (vecchia.nodeValue.trim() === voce) return cambia;
      if (voce) { vecchia.nodeValue = ' ' + voce; return cambia; }
      /* il documento dice qualcosa che non si legge: via la voce e il suo
         separatore, mai un numero vecchio accanto a un nome nuovo */
      var sep = vecchia.previousSibling;
      if (sep && sep.nodeType === 1 && sep.tagName === 'I') r2.removeChild(sep);
      r2.removeChild(vecchia);
    } else if (voce) {
      var i = document.createElement('i');
      i.textContent = '·';
      r2.appendChild(document.createTextNode(' '));
      r2.appendChild(i);
      r2.appendChild(document.createTextNode(' ' + voce));
    }
    return cambia;
  }
  function ritoccaAltra(card, f) {
    function v(k) {
      var x = f[k]; if (!x) return null;
      return x.stringValue != null ? x.stringValue
        : x.integerValue != null ? x.integerValue
        : x.doubleValue != null ? x.doubleValue : null;
    }
    rinomina(card, String(v('name') == null ? '' : v('name'))
      .replace(/\s+/g, ' ').trim());
    /* un documento che TACE sulle camere lascia la build; senza il motore
       (undefined) non si sa, e nemmeno */
    if (v('bedrooms') != null || v('beds') != null) {
      var n = camereDi({ bedrooms: v('bedrooms'), beds: v('beds') });
      if (n !== undefined) scriviCamere(card, n);
    }
    var s2 = String(v('status') || '').toLowerCase();
    if (s2) {
      var af = String(v('availableFrom') || '').trim();
      var ad = String(v('availableDate') || '').trim();
      var st2 = statoDa(s2, ((af || ad).match(/^\d{4}-\d{2}-\d{2}/) || [])[0] || null,
        { af: af, ad: ad });
      var eti = card.querySelector('.casa-stato');
      if (eti && eti.textContent !== st2.eti) {
        eti.textContent = st2.eti;
        eti.className = 'casa-stato' + (st2.lib ? ' si' : '');
      }
    }
    var p = parseFloat(v('price'));
    var fp = card.querySelector('.flap-prezzo');
    if (fp && isFinite(p) && p > 0 && fp.dataset.p !== euro(p)) {
      fp.dataset.p = euro(p);
      fp.setAttribute('aria-label', euro(p) + ' per month');
      montaPrezzo(fp);
    }
  }
  function rileggiAltre() {
    if (!altreCarte.length || !window.fetch) return;
    var DOC = 'projects/boom-property-dashboards/databases/(default)/documents/listings/';
    fetch('https://firestore.googleapis.com/v1/projects/'
        + 'boom-property-dashboards/databases/(default)/documents:batchGet', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        documents: altreCarte.map(function (x) { return DOC + x.id; }),
        mask: { fieldPaths: ['name', 'status', 'price', 'bedrooms', 'beds',
          'availableFrom', 'availableDate'] } })
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (lista) {
        if (!Array.isArray(lista)) return;
        var per = {};
        lista.forEach(function (x) {
          if (x && x.found && x.found.name)
            per[String(x.found.name).split('/').pop()] = x.found.fields || {};
        });
        altreCarte.forEach(function (x) {
          if (per[x.id]) ritoccaAltra(x.el, per[x.id]);
        });
      })
      .catch(function () { /* niente rete: restano le carte della build */ });
  }

  /* ── Hold e Apply chiedono le stesse tre cose a due form scollegati:
     compilarne uno riempie l'altro, e il successo dell'apply offre il
     gesto d'oro (solo se la casa e' libera — mai un hold su una presa) */
  (function () {
    var coppie = [['prNome', 'apNome'], ['prMail', 'apMail'], ['prTel', 'apTel']];
    coppie.forEach(function (cp) {
      var a = document.getElementById(cp[0]), b = document.getElementById(cp[1]);
      if (!a || !b) return;
      function specchia(da, a2) {
        da.addEventListener('input', function () {
          if (!a2.value || a2.dataset.eco === '1') {
            a2.value = da.value; a2.dataset.eco = '1';
          }
        });
      }
      specchia(a, b); specchia(b, a);
    });
    var fh = document.getElementById('fattoHold');
    if (fh && c.libera && document.getElementById('presaCasa'))
      fh.style.display = '';
  })();

  /* ── la barra di decisione (mobile) + la rotaia (desktop) ── */
  (function () {
    var bar = document.getElementById('decisione');
    if (bar) {
      per('#decPrezzo').textContent = euro(c.prezzo) + '/mo';
      per('#decStato').textContent = c.stato;
      var vaiB = document.getElementById('decVai');
      if (!c.libera && vaiB) vaiB.textContent = c.fuori ? 'Ask' : 'Waitlist';
      bar.hidden = false;
      var applica = document.getElementById('applica');
      var soglia = 520;
      var giu = false;
      function stagione() {
        var vicino = false;
        if (applica) {
          var r2 = applica.getBoundingClientRect();
          vicino = r2.top < innerHeight && r2.bottom > 0;
        }
        var ora = scrollY > soglia && !vicino;
        if (ora !== giu) { giu = ora; bar.classList.toggle('viva', ora); }
      }
      addEventListener('scroll', stagione, { passive: true });
      stagione();
    }
    var rotaia = document.getElementById('rotaia');
    if (rotaia && 'IntersectionObserver' in window) {
      var voci = [].slice.call(rotaia.querySelectorAll('a'));
      var io2 = new IntersectionObserver(function (rr) {
        rr.forEach(function (x) {
          if (!x.isIntersecting) return;
          var id = '#' + x.target.id;
          voci.forEach(function (v) {
            v.classList.toggle('qui', v.getAttribute('href') === id); });
        });
      }, { rootMargin: '-30% 0px -60% 0px' });
      ['casa', 'denaro', 'posto', 'chiedi', 'applica'].forEach(function (id) {
        var el = document.getElementById(id); if (el) io2.observe(el);
      });
    }
    /* se la casa non ha racconto ne' dote, la sezione non finge */
    var sezCasa = document.getElementById('casa');
    if (sezCasa && !c.racconto && !(c.dentro || []).length)
      sezCasa.style.display = 'none';
  })();

  /* cambiando casa dall'indirizzo, la pagina si rifà */
  addEventListener('hashchange', function () {
    if (/id=/.test(location.hash)) location.reload();
  });
  }
  if (document.readyState === 'complete') via();
  else addEventListener('load', via);
})();
</script>
