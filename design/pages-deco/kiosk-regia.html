<script src="/js/dispo-engine.js"></script>
<script>
(function () {
  'use strict';
  var BS = window.BoomSolari;
  var DRUM = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789€.,:·+/';
  var CASE = 'CASE_JSON';
  var PER = 6, GIRO = 14000;

  /* ══ PARTENZE / ARRIVI (STUDIO_AVIATION S4) ═══════════════════════════
     Il dato c'era già: la colonna `ora` porta NOW (si entra adesso) oppure
     la data di rilascio. Prima i due flussi erano mischiati; ora il
     tabellone li separa come uno scalo vero — DEPARTURES = boarding,
     ARRIVALS = in atterraggio, stato SOON in oro. La fotografia di build
     è lo scheletro; l'idrante (in coda) la sostituisce col catalogo VERO. */
  function buildPages(part, arr) {
    var pages = [];
    for (var pi = 0; pi < Math.ceil(part.length / PER); pi++) pages.push({
      lato:'DEPARTURES', nota:'Boarding now',
      rows:part.slice(pi * PER, pi * PER + PER) });
    for (var ai = 0; ai < Math.ceil(arr.length / PER); ai++) pages.push({
      lato:'ARRIVALS', nota:'Free soon · reserve ahead',
      rows:arr.slice(ai * PER, ai * PER + PER) });
    /* mai una pagina fantasma: un lato vuoto non entra nel giro, e a
       catalogo vuoto resta lo scheletro delle partenze */
    if (!pages.length) pages.push({ lato:'DEPARTURES', nota:'Boarding now', rows:[] });
    return pages;
  }
  var PAGES = buildPages(
    CASE.filter(function (h) { return h.ora === 'NOW'; }),
    CASE.filter(function (h) { return h.ora !== 'NOW'; })
      .map(function (h) { return { ora:h.ora, zona:h.zona, tipo:h.tipo,
        prezzo:h.prezzo, stato:'SOON', presto:true }; }));

  var pagine = PAGES.length;
  var box = document.getElementById('righe');
  var nav = document.getElementById('pagine');
  var righe = [];
  for (var i = 0; i < Math.min(PER, CASE.length); i++) {
    var d = document.createElement('div');
    d.className = 'riga';
    d.innerHTML = '<span class="cella c-ora flap-scale"></span>' +
      '<span class="cella c-zona flap-scale"></span>' +
      '<span class="cella c-tipo flap-scale"></span>' +
      '<span class="cella c-prezzo flap-scale"></span>' +
      '<span class="cella c-stato flap-scale"></span>';
    box.appendChild(d);
    righe.push({ el:d, celle:{
      ora:   new BS.Board(d.querySelector('.c-ora'),    5,  DRUM),
      zona:  new BS.Board(d.querySelector('.c-zona'),   13, DRUM),
      tipo:  new BS.Board(d.querySelector('.c-tipo'),   3,  DRUM),
      prezzo:new BS.Board(d.querySelector('.c-prezzo'), 6,  DRUM),
      stato: new BS.Board(d.querySelector('.c-stato'),  5,  DRUM)
    }});
  }
  function dipingiNav(attiva) {
    nav.textContent = '';
    for (var k = 0; k < pagine; k++) {
      var t = document.createElement('i');
      if (k === (attiva || 0)) t.className = 'qui';
      nav.appendChild(t);
    }
  }
  dipingiNav(0);
  /* il lato del tabellone: DEPARTURES ⇄ ARRIVALS, ante vere */
  var latoEl = document.getElementById('lato');
  var latoNotaEl = document.getElementById('latoNota');
  var lato = latoEl ? new BS.Board(latoEl, 10, DRUM) : null;
  if (lato) lato.show(PAGES[0].lato, 40, true);

  var pagina = 0;
  function mostra(p, sbatti) {
    pagina = p;
    [].forEach.call(nav.children, function (x, k) {
      x.classList.toggle('qui', k === p);
    });
    if (lato) lato.update(PAGES[p].lato);
    if (latoNotaEl) latoNotaEl.textContent = PAGES[p].nota;
    righe.forEach(function (r, i) {
      var h = PAGES[p].rows[i];
      r.el.classList.toggle('nuovo', !!h && h.stato === 'NEW');
      r.el.classList.toggle('presto', !!h && !!h.presto);
      var mostraR = function () {
        r.celle.ora.update(h ? h.ora : '');
        r.celle.zona.update(h ? h.zona : '');
        r.celle.tipo.update(h ? h.tipo : '');
        r.celle.prezzo.update(h ? h.prezzo : '');
        r.celle.stato.update(h ? h.stato : '');
      };
      if (sbatti) setTimeout(mostraR, i * 140); else mostraR();
    });
  }
  /* prima stampa col giro completo */
  righe.forEach(function (r, i) {
    var h = PAGES[0].rows[i];
    setTimeout(function () {
      if (!h) return;
      r.celle.ora.show(h.ora, 24, true);
      r.celle.zona.show(h.zona, 18, true);
      r.celle.tipo.show(h.tipo, 24, true);
      r.celle.prezzo.show(h.prezzo, 22, true);
      r.celle.stato.show(h.stato, 22, true);
      r.el.classList.toggle('nuovo', h.stato === 'NEW');
      r.el.classList.toggle('presto', !!h.presto);
    }, 400 + i * 160);
  });
  /* la rotazione legge `pagine` a ogni giro: l'idrante può cambiarle */
  setInterval(function () {
    if (document.hidden || pagine < 2) return;
    mostra((pagina + 1) % pagine, true);
  }, GIRO);

  /* ══ L'IDRANTE (S4-full) — il tabellone legge il catalogo VERO ════════
     Stessa porta della vetrina (REST pubblico su `listings`) e STESSO
     motore delle corsie (BOOM_DISPO.marketLane): partenze = lane 'now',
     arrivi = lane 'ahead' con l'ETA del MOTORE — mai un parser locale
     (il parser povero della build è il difetto storico della vetrina).
     La regola 1 di dispo-engine vale anche in vetrina fisica: una data
     ILLEGGIBILE non dice mai NOW — dice ASK. Le corsie 'closed' non
     salgono sul tabellone. Fail-open: rete giù o motore assente → resta
     la fotografia di build, il kiosk non è mai nero. */
  /* LE CAMERE — la STESSA regola di js/listing-facts.js (bedroomsOf), in
     copia come in vetrina e in home: il campo strutturato `bedrooms`
     (intero 0–10, 0 = monolocale) vince, il testo libero `beds` vale solo
     se manca, e solo per 1–10; altrimenti null. Prima qui si leggeva solo
     `parseInt(bedrooms)`: un monolocale non diceva niente. Parità pinnata
     da tests/catalogo/vetrina.mjs. */
  function camereDi(l) {
    l = l || {};
    var b = l.bedrooms;
    if (b !== null && b !== undefined && String(b).trim() !== '') {
      var n = Number(String(b).trim());
      if (Number.isInteger(n) && n >= 0 && n <= 10) return n;
    }
    var m = String(l.beds == null ? '' : l.beds).match(/\d+/);
    if (m) {
      var k = parseInt(m[0], 10);
      if (k >= 1 && k <= 10) return k;
    }
    return null;
  }
  function laneRows(docs) {
    var D = window.BOOM_DISPO;
    if (!D || !D.marketLane) return null;
    var MESI = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var part = [], arr = [];
    docs.forEach(function (doc) {
      var f = doc.fields || {};
      function v(k) {
        var x = f[k]; if (!x) return null;
        return x.stringValue != null ? x.stringValue
          : x.integerValue != null ? x.integerValue
          : x.doubleValue != null ? x.doubleValue : null;
      }
      var m;
      try {
        m = D.marketLane({
          status: String(v('status') || '').toLowerCase(),
          availableFrom: String(v('availableFrom') || ''),
          availableDate: String(v('availableDate') || '')
        });
      } catch (e) { return; }
      if (!m || m.lane === 'closed') return;
      var p = Math.round(parseFloat(v('price')));
      var beds = camereDi({ bedrooms: v('bedrooms'), beds: v('beds') });
      var riga = {
        zona: String(v('zone') || v('name') || 'ROMA').toUpperCase().slice(0, 13),
        /* la grammatica del tabellone di build: STU, 2BR */
        tipo: beds === 0 ? 'STU' : beds ? beds + 'BR' : '',
        prezzo: isFinite(p) && p > 0 ? '€' + p.toLocaleString('en-GB') : ''
      };
      if (m.lane === 'ahead') {
        riga.ora = m.iso
          ? String(+m.iso.slice(8, 10)) + MESI[+m.iso.slice(5, 7) - 1] : '';
        riga.stato = 'SOON'; riga.presto = true; riga._d = m.daysOut;
        arr.push(riga);
      } else if (m.dateUnreadable) {
        riga.ora = ''; riga.stato = 'ASK'; riga.presto = true;
        part.push(riga);
      } else {
        riga.ora = 'NOW'; riga.stato = 'FREE';
        part.push(riga);
      }
    });
    /* gli arrivi in ordine di ETA: è un tabellone arrivi, atterra prima
       chi atterra prima; senza data in coda */
    arr.sort(function (a, b) {
      return (a._d == null ? 9e9 : a._d) - (b._d == null ? 9e9 : b._d);
    });
    return { part: part, arr: arr };
  }
  function idrante() {
    fetch('https://firestore.googleapis.com/v1/projects/'
        + 'boom-property-dashboards/databases/(default)/documents/'
        + 'listings?pageSize=300')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.documents) return;
        var rows = laneRows(j.documents);
        if (!rows || (!rows.part.length && !rows.arr.length)) return;
        PAGES = buildPages(rows.part, rows.arr);
        pagine = PAGES.length;
        dipingiNav(0);
        mostra(0, true);
      })
      .catch(function () {});
  }
  setTimeout(idrante, 2500);
  setInterval(function () { if (!document.hidden) idrante(); }, 300000);
  /* l'orologio */
  function oraRoma() {
    try {
      return new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Rome',
        hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date());
    } catch (e) { return new Date().toTimeString().slice(0, 5); }
  }
  var oro = new BS.Board(document.getElementById('ora'), 5, ' 0123456789:');
  oro.show(oraRoma());
  setInterval(function () { if (!document.hidden) oro.update(oraRoma()); }, 20000);
  /* ogni tanto un fremito, come i tabelloni veri */
  setInterval(function () {
    if (document.hidden) return;
    var r = righe[Math.floor(Math.random() * righe.length)];
    var quali = ['zona','prezzo','stato'];
    r.celle[quali[Math.floor(Math.random() * 3)]].flutter();
  }, 9000);
})();
</script>
