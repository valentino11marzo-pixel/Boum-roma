<script>
/* L'IDRANTE DELLA VETRINA — home e discovery erano FOTOGRAFIE: il bot
   cambia prezzo o stato su Firestore e le card restavano al giorno della
   build. Ora ogni card con data-id rilegge il SUO documento vero (una
   sola list REST, lettura pubblica) e riscrive stato, data e prezzo dove
   sono cambiati — la stessa disciplina dell'idrante del detail. Se la
   rete manca o la CSP blocca (anteprima artefatto), restano i numeri
   della build: mai una pagina rotta.
   E L'INNESTO: un annuncio che Firestore ha e la build no (il wizard
   pubblica di sera, il deploy arriva quando arriva) aveva la pagina
   /listing/:id viva ma NON stava in vetrina né nel conto — pubblicato e
   invisibile. Ora la sua carta si COSTRUISCE qui, con la stessa
   grammatica del builder (stessi data-attribute, stessa regola di
   ingresso: nome, prezzo, foto di casa nostra, stato noto), si appende
   al muro e si registra nel setaccio via window.__muroInnesta. */
(function () {
  'use strict';
  /* le card della HOME non portano data-id: l'id vive nell'href
     /listing/<id>. Senza questa normalizzazione l'idrante della home
     usciva a mani vuote da sempre (0 card trovate) e prezzo/contatori
     restavano quelli della build. */
  var carte = [].filter.call(document.querySelectorAll('.casa-p'), function (c) {
    if (!c.dataset.id) {
      var m = (c.getAttribute('href') || '').match(/\/listing\/([^/?#]+)/);
      if (m) c.dataset.id = decodeURIComponent(m[1]);
    }
    return !!c.dataset.id;
  });
  var muro = document.getElementById('muro');
  if (!carte.length) return;
  function euro(n) { return '€' + Math.round(n).toLocaleString('en-US'); }
  /* LA CORSIA, non lo stato grezzo. «Waitlist open» era un'attesa
     indefinita per case che la data di rilascio ce l'hanno tutte: ora il
     badge la DICE (Free from 1 Sep 2027) — la stessa frase che scrive la
     scheda, perché viene dalla stessa laneCopy. Il motore manca solo
     dove manca la rete: allora restano le parole della build. */
  function stato(st, dal, campi) {
    if (window.BOOM_DISPO && BOOM_DISPO.laneCopy) {
      try {
        /* i campi VERI, mai la data già derivata: `availableFrom` è
           quello che scrive il contratto alla firma, ed è l'unico che
           autorizza una casa affittata a farsi prenotare (regola C).
           Passargli `dal` la aprirebbe su un testo qualsiasi. */
        var c = BOOM_DISPO.laneCopy({
          status: st,
          availableFrom: (campi && campi.af) || '',
          availableDate: (campi && campi.ad) || ''
        });
        return { t: c.short, c: c.tone };
      } catch (e) { /* si ricade sulle regole storiche qui sotto */ }
    }
    var oggi = new Date().toISOString().slice(0, 10);
    if (st === 'available') {
      if (dal && dal > oggi) {
        var d = new Date(dal + 'T12:00:00');
        var eti = 'Free from ' + d.getDate() + ' '
          + d.toLocaleDateString('en-GB', { month: 'short' });
        if (d.getFullYear() !== new Date().getFullYear())
          eti += ' ' + d.getFullYear();
        return { t: eti, c: 'poi' };
      }
      return { t: 'Available now', c: 'si' };
    }
    if (st === 'waitlist') return { t: 'Waitlist open', c: 'fila' };
    if (st === 'reserved') return { t: 'Reserved', c: '' };
    return { t: 'Rented', c: '' };
  }
  /* i contatori della build — «9 available now», «updated 31 Jul» —
     restavano CONGELATI mentre l'idrante cambiava le card sotto: un
     tabellone che dice LIVE con la data di un mese fa insegna a non
     credergli. Si riconta dal catalogo appena letto, con lo STESSO
     verdetto dei badge; il gate è sul contenuto (si riscrive solo ciò
     che porta già quella grammatica), così l'eyebrow della home — che
     condivide questo file e parla d'altro — non si tocca. */
  function contatori(per) {
    var vivi = 0;
    Object.keys(per).forEach(function (k) {
      var d = per[k];
      if (d.st && stato(d.st, d.dal, d).c === 'si') vivi++;
    });
    if (!vivi) return; /* zero = niente riscritture: fail-open sulla build */
    var parole = vivi + ' home' + (vivi === 1 ? '' : 's') + ' available now';
    [].forEach.call(document.querySelectorAll(
      '.hero-eyebrow, .board-piede span, .zone-piede span'), function (el) {
      if (el.textContent.indexOf('available now') < 0) return;
      [].forEach.call(el.childNodes, function (n) {
        if (n.nodeType === 3 && /\d+\s+homes? available now/.test(n.nodeValue)) {
          n.nodeValue = n.nodeValue.replace(/\d+\s+homes? available now/, parole);
        } else if (n.nodeType === 1 && n.tagName === 'B') {
          var t = n.textContent.trim();
          if (/^\d+$/.test(t)) {
            n.textContent = String(vivi);
            var s = n.nextSibling;
            if (s && s.nodeType === 3) s.nodeValue = s.nodeValue
              .replace(/\bhomes?\b/, vivi === 1 ? 'home' : 'homes');
          } else if (/^\d{1,2} [A-Z][a-z]{2}$/.test(t)) {
            var o = new Date();
            n.textContent = o.getDate() + ' '
              + o.toLocaleDateString('en-GB', { month: 'short' });
          }
        }
      });
    });
  }
  setTimeout(function () {
    fetch('https://firestore.googleapis.com/v1/projects/'
        + 'boom-property-dashboards/databases/(default)/documents/'
        + 'listings?pageSize=300')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.documents) return;
        var per = {}, interi = {};
        j.documents.forEach(function (doc) {
          var f = doc.fields || {};
          function v(k) {
            var x = f[k]; if (!x) return null;
            return x.stringValue != null ? x.stringValue
              : x.integerValue != null ? x.integerValue
              : x.doubleValue != null ? x.doubleValue : null;
          }
          interi[doc.name.split('/').pop()] = f;
          var p = parseFloat(v('price'));
          /* la data passa dal motore CONDIVISO (dispo-engine): una data
             testo libero non diventa mai "Available now" per un regex
             che legge solo ISO — il difetto storico della vetrina */
          var raw = String(v('availableDate') || '').trim();
          var af = String(v('availableFrom') || '').trim();
          /* la lettura della data passa dal motore su ENTRAMBI i campi,
             con la stessa precedenza del resto del sito (il contratto
             batte il testo libero) */
          var dal = ((af || raw).match(/^\d{4}-\d{2}-\d{2}/) || [])[0] || '';
          if (!dal && (af || raw) && window.BOOM_DISPO) {
            try {
              var pa = BOOM_DISPO.resolve({ availableFrom: af, availableDate: raw });
              if (pa && pa.kind === 'date') dal = pa.iso;
            } catch (e) {}
          }
          per[doc.name.split('/').pop()] = {
            st: String(v('status') || '').toLowerCase(),
            dal: dal, cieca: !!((af || raw) && !dal),
            af: af, ad: raw,
            p: isFinite(p) && p > 0 ? Math.round(p) : null
          };
        });
        [].forEach.call(carte, function (card) {
          var d = per[card.dataset.id];
          if (!d || !d.st) return;
          /* data illeggibile: il badge della BUILD la legge con un parser
             python più povero del motore e finisce per scrivere
             «Available now» su una stringa che nessuno sa leggere. Qui il
             motore ha l'ultima parola e dice «Ask us for the date» — la
             regola 1 di dispo-engine, applicata anche alla vetrina. */
          var s = stato(d.st, d.dal, d);
          var eti = card.querySelector('.casa-stato');
          if (eti && eti.textContent.trim() !== s.t) {
            eti.textContent = s.t;
            eti.className = 'casa-stato' + (s.c ? ' ' + s.c : '');
          }
          /* gli attributi che i filtri leggono: la griglia non deve
             setacciare su numeri vecchi */
          if (card.dataset.dal !== undefined) card.dataset.dal = d.dal;
          if (d.p) {
            if (card.dataset.prezzo !== undefined
                && card.dataset.prezzo !== String(d.p))
              card.dataset.prezzo = String(d.p);
            var fp = card.querySelector('.flap-prezzo');
            if (fp && fp.dataset.p !== euro(d.p)) {
              fp.dataset.p = euro(d.p);
              /* rimontare il Solari, MAI riscriverlo come testo: la
                 stringa piatta cancellava il tabellone della build */
              if (window.__solariPrezzo) window.__solariPrezzo(fp);
              else fp.textContent = euro(d.p);
            }
          }
        });
        contatori(per);
        innesta(per, interi);
      })
      .catch(function () { /* niente rete: restano i numeri della build */ });
  }, 900);

  /* ── L'INNESTO — la carta per chi è nato dopo la build ─────────────── */
  var DOTE = { 'ac': 'A/C', 'wifi': 'Wi-Fi', 'wi-fi': 'Wi-Fi',
    'washing_machine': 'Washer', 'double_glazing': 'Double glazing',
    'dishwasher': 'Dishwasher', 'balcony': 'Balcony',
    'elevator': 'Elevator', 'doorman': 'Doorman', 'parking': 'Parking' };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
               '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function testo(x) {
    if (!x) return null;
    return x.stringValue != null ? x.stringValue
      : x.integerValue != null ? x.integerValue
      : x.doubleValue != null ? x.doubleValue
      : x.timestampValue != null ? x.timestampValue
      : x.booleanValue != null ? String(x.booleanValue) : null;
  }
  function lista(f, k) {
    var a = (f[k] && f[k].arrayValue && f[k].arrayValue.values) || [];
    return a.map(testo).filter(function (x) { return x != null; });
  }
  function intero(x) {
    var m = String(x == null ? '' : x).match(/\d+/);
    return m ? parseInt(m[0], 10) : null;
  }
  /* stessa regola del builder: solo foto di casa nostra, mai un .heic */
  function fotoDi(f) {
    var iv = (f.imagesVariants && f.imagesVariants.arrayValue
      && f.imagesVariants.arrayValue.values) || [];
    var m0 = (iv[0] && iv[0].mapValue && iv[0].mapValue.fields) || {};
    var u = String(testo(m0.w960) || testo(m0.src)
      || lista(f, 'images')[0] || testo(f.image) || '');
    if (!(u.indexOf('/') === 0 || u.indexOf('firebasestorage') >= 0)) return '';
    if (/\.heic(\?|$)/i.test(u)) return '';
    return u;
  }
  function innesta(per, interi) {
    if (!muro) return;
    var have = {};
    [].forEach.call(document.querySelectorAll('.casa-p[data-id]'),
      function (c) { have[c.dataset.id] = 1; });
    var salv;
    try { salv = JSON.parse(localStorage.getItem('boomSalvate') || '[]'); }
    catch (e) { salv = []; }
    var oggi = new Date(), nuove = [];
    Object.keys(interi).forEach(function (id) {
      if (have[id]) return;
      var f = interi[id], d = per[id] || {};
      /* la regola di ingresso del builder: senza nome, prezzo o foto la
         carta non nasce, e uno stato ignoto (draft, …) resta fuori */
      if (['available', 'reserved', 'rented', 'waitlist']
          .indexOf(d.st) < 0) return;
      var nome = String(testo(f.name) || '').replace(/\s+/g, ' ').trim();
      if (!nome || !d.p) return;
      var foto = fotoDi(f);
      if (!foto) return;
      var zona = (String(testo(f.zone) || 'Roma').replace(/\s+/g, ' ')
        .split('/')[0].trim()) || 'Roma';
      var letti = intero(testo(f.bedrooms) != null ? testo(f.bedrooms)
        : testo(f.beds));
      var mq = intero(testo(f.sqm) != null ? testo(f.sqm)
        : testo(f.size)) || 0;
      var arred = /^(yes|true|si|sì)$/i
        .test(String(testo(f.furnished) || '').trim());
      var video = !!String(testo(f.videoUrl) || testo(f.youtubeUrl)
        || '').trim();
      var quando = String(testo(f.createdAt) || '').slice(0, 10)
        || oggi.toISOString().slice(0, 10);
      var grezzi = lista(f, 'features');
      if (!grezzi.length) grezzi = lista(f, 'tags');
      var dote = [];
      grezzi.forEach(function (x) {
        var k = String(x).replace(/\s+/g, ' ').trim().toLowerCase();
        if (DOTE[k] && dote.indexOf(DOTE[k]) < 0) dote.push(DOTE[k]);
      });
      var vivo = d.st === 'available' || d.st === 'waitlist';
      var giorni = (oggi - new Date(quando + 'T12:00:00')) / 864e5;
      var chip = (video && vivo) ? { t: 'VERIFIED', c: 'verde' }
        : (giorni < 21 && vivo) ? { t: 'NEW', c: '' } : null;
      var s = stato(d.st, d.dal, d);
      var a = document.createElement('a');
      a.className = 'casa-p';
      a.href = '/listing/' + encodeURIComponent(id);
      a.dataset.zona = zona; a.dataset.prezzo = String(d.p);
      a.dataset.letti = String(letti || 0); a.dataset.mq = String(mq);
      a.dataset.quando = quando; a.dataset.dal = d.dal || '';
      a.dataset.bagni = String(intero(testo(f.bathrooms)) || 0);
      a.dataset.arredata = arred ? '1' : '0';
      a.dataset.video = video ? '1' : '0';
      a.dataset.dote = '|' + dote.join('|') + '|';
      a.dataset.chiave = '/listing/' + id;
      a.dataset.cerca = [nome, zona, String(testo(f.address) || ''),
        String(testo(f.type) || '')].join(' ').toLowerCase();
      a.dataset.id = id;
      a.dataset.cauzione = String(intero(testo(f.depositMonths)) || 1);
      a.dataset.piano = String(testo(f.floor) == null ? ''
        : testo(f.floor)).replace(/[\s"]+/g, ' ').trim().slice(0, 12);
      var pezzi = ['<span class="home-zona" role="link" tabindex="0" '
        + 'data-href="#zona=' + esc(encodeURIComponent(zona)) + '">'
        + esc(zona) + '</span>'];
      if (mq) pezzi.push(mq + ' m²');
      if (letti === 0) pezzi.push('Studio');
      else if (letti) pezzi.push(letti + ' bed');
      a.innerHTML =
        '<div class="home-foto">'
        + '<img loading="lazy" decoding="async" src="' + esc(foto)
        + '" alt="' + esc(nome + ', ' + zona
          + ' — apartment for rent in Rome with BOOM') + '">'
        + (chip ? '<span class="casa-chip ' + chip.c + '">' + chip.t
          + '</span>' : '')
        + '<span class="casa-stato ' + s.c + '">' + esc(s.t) + '</span>'
        + '<button type="button" class="home-cuore" data-u="'
        + esc('/listing/' + id) + '" aria-label="Save this home">♥</button>'
        + '<button type="button" class="home-para" data-id="' + esc(id)
        + '" aria-label="Compare this home">⇄</button>'
        + '</div><div class="corpo">'
        + '<div class="riga1"><span class="nome">' + esc(nome) + '</span>'
        /* vuoto come nel builder: il testo lo monta il Solari qui sotto —
           il testo piatto era la carta "senza design" del prezzo */
        + '<span class="canone"><span class="flap-prezzo flap-scale" '
        + 'data-p="' + esc(euro(d.p)) + '" aria-label="' + esc(euro(d.p))
        + ' per month"></span><small>/mo</small>'
        + '</span></div>'
        + '<div class="riga2">' + pezzi.join(' <i>·</i> ') + '</div>'
        + '</div>';
      /* cuore e zona si agganciano qui: i binding per-carta della build
         sono già passati (il paragone è delegato sul muro, gratis) */
      var cuore = a.querySelector('.home-cuore');
      cuore.classList.toggle('si', salv.indexOf(a.dataset.chiave) >= 0);
      cuore.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        var mem;
        try { mem = JSON.parse(localStorage.getItem('boomSalvate') || '[]'); }
        catch (err) { mem = []; }
        var k = mem.indexOf(a.dataset.chiave);
        if (k >= 0) mem.splice(k, 1); else mem.push(a.dataset.chiave);
        cuore.classList.toggle('si', k < 0);
        try { localStorage.setItem('boomSalvate', JSON.stringify(mem)); }
        catch (err) {}
      });
      var zs = a.querySelector('.home-zona');
      function vaiZona(e) {
        e.preventDefault(); e.stopPropagation();
        location.href = zs.dataset.href;
      }
      zs.addEventListener('click', vaiZona);
      zs.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') vaiZona(e);
      });
      muro.appendChild(a);
      /* il Solari del prezzo, come sulle carte di build (dopo l'append:
         l'IntersectionObserver vuole un nodo nel documento) */
      var fpN = a.querySelector('.flap-prezzo');
      if (window.__solariPrezzo) window.__solariPrezzo(fpN);
      else fpN.textContent = fpN.dataset.p;
      nuove.push(a);
    });
    if (!nuove.length) return;
    /* la regia parte su load, questo fetch a +900ms: chi arriva prima
       non è garantito. Si riprova finché il setaccio non c'è; se non
       arriva mai (pagina rotta) le carte restano comunque link vivi. */
    (function consegna(giri) {
      if (window.__muroInnesta) { window.__muroInnesta(nuove); return; }
      if (giri > 40) return;
      setTimeout(function () { consegna(giri + 1); }, 250);
    })(0);
  }
})();
</script>
