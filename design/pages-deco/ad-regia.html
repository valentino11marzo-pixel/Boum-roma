<script>
/* LA REGIA DELLA DISCOVERY — il tabellone è il filtro.
   Parte al load: il motore Solari è concatenato DOPO questo script. */
(function () {
  'use strict';
  function via() {
  var ridotto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BS = window.BoomSolari;

  /* ── lo stato della ricerca ─────────────────────────────────────────── */
  var stato = { zona: '', budget: 0, chi: '', dal: null, ordine: 'nuove',
    q: '', letti: '', bagni: '', arredata: false, video: false,
    salvate: false, dote: [] };
  function salvate() {
    try { return JSON.parse(localStorage.getItem('boomSalvate') || '[]'); }
    catch (e) { return []; }
  }
  var carte = [].slice.call(document.querySelectorAll('#muro .casa-p'));
  var muro = document.getElementById('muro');
  var vuoto = document.getElementById('vuoto');
  var conto = document.getElementById('conto');
  var contoZona = document.getElementById('contoZona');

  function iso(d) { return d.toISOString().slice(0, 10); }
  function passa(c) {
    if (stato.zona && (c.dataset.zona || '').toLowerCase() !== stato.zona) return false;
    if (stato.budget && +c.dataset.prezzo > stato.budget) return false;
    if (stato.q && (c.dataset.cerca || '').indexOf(stato.q) < 0) return false;
    if (stato.letti !== '') {
      var l = +(c.dataset.letti || 0);
      if (stato.letti === '0' ? l !== 0 : l < +stato.letti) return false;
    }
    if (stato.bagni !== '' && +(c.dataset.bagni || 0) < +stato.bagni) return false;
    if (stato.arredata && c.dataset.arredata !== '1') return false;
    if (stato.video && c.dataset.video !== '1') return false;
    if (stato.salvate && salvate().indexOf(c.dataset.chiave) < 0) return false;
    for (var i = 0; i < stato.dote.length; i++)
      if ((c.dataset.dote || '').indexOf('|' + stato.dote[i] + '|') < 0) return false;
    /* chi atterra: famiglia e coinquilini vogliono almeno due camere */
    if ((stato.chi === 'family' || stato.chi === 'flatmates')
        && +(c.dataset.letti || 0) < 2) return false;
    /* la data: mostriamo solo ciò che è libero entro il tuo atterraggio */
    if (stato.dal && c.dataset.dal && c.dataset.dal > stato.dal) return false;
    return true;
  }
  function ordina() {
    var vive = carte.filter(function (c) { return !c.classList.contains('via'); });
    vive.sort(function (a, b) {
      if (stato.ordine === 'prezzo') return +a.dataset.prezzo - +b.dataset.prezzo;
      if (stato.ordine === 'grandi') return +b.dataset.mq - +a.dataset.mq;
      return b.dataset.quando.localeCompare(a.dataset.quando);
    });
    vive.forEach(function (c) { muro.appendChild(c); });
  }
  /* lo stato dei filtri vive nell'URL: refresh e back non azzerano la
     ricerca, e «bilocali a Trastevere sotto 1.500» si condivide su
     WhatsApp — il giro lista→casa→lista E' il loop della discovery */
  function scriviHash() {
    var pz = [];
    if (stato.dal) pz.push('dal=' + stato.dal);
    if (stato.budget) pz.push('budget=' + stato.budget);
    if (stato.chi) pz.push('chi=' + encodeURIComponent(stato.chi));
    if (stato.zona) pz.push('zona=' + encodeURIComponent(stato.zona));
    try {
      history.replaceState(null, '', pz.length ? '#' + pz.join('&')
        : location.pathname + location.search);
    } catch (e) {}
  }
  /* il badge della stecca vive in un altro closure: il conto dei filtri
     vivi si espone qui, dove lo stato abita */
  window.__filtriVivi = function () {
    return (stato.dal ? 1 : 0) + (stato.budget ? 1 : 0)
      + (stato.chi ? 1 : 0) + (stato.zona ? 1 : 0);
  };
  /* lo zero nasce quasi sempre da UN vincolo: prima la via gratuita
     (togli quello), poi la macchina a pagamento */
  function vieUscita() {
    var box = document.getElementById('vuotoVie');
    if (!box) return;
    var VIE = [['dal', 'the move-in date'], ['budget', 'the budget cap'],
               ['chi', "who's moving"], ['zona', 'the zone']];
    var righe = [];
    VIE.forEach(function (v) {
      var k = v[0];
      if (!stato[k]) return;
      var salvo = stato[k];
      stato[k] = (k === 'budget') ? 0 : (k === 'dal' ? null : '');
      var n = 0; carte.forEach(function (c) { if (passa(c)) n++; });
      stato[k] = salvo;
      if (n > 0) righe.push({ k: k, eti: v[1], n: n });
    });
    box.innerHTML = righe.length
      ? '<b>One filter away:</b>' + righe.map(function (x) {
          return '<button type="button" data-k="' + x.k + '">Without '
            + x.eti + ' \u2192 ' + x.n + ' home'
            + (x.n === 1 ? '' : 's') + '</button>';
        }).join('')
      : '';
  }
  function aggiorna() {
    var n = 0;
    carte.forEach(function (c) {
      var ok = passa(c);
      c.classList.toggle('via', !ok);
      if (ok) n++;
    });
    ordina();
    conto.textContent = n;
    contoZona.textContent = stato.zona
      ? ' in ' + stato.zona.replace(/\b\w/g, function (x) { return x.toUpperCase(); })
      : '';
    vuoto.classList.toggle('si', n === 0);
    /* la cascata recita all'INGRESSO; ai filtri la lista risponde
       secca — il movimento ripetuto non porta informazione nuova */
    if (!muro.classList.contains('dentro'))
      requestAnimationFrame(function () { muro.classList.add('dentro'); });
    scriviHash();
    if (n === 0) vieUscita();
  }

  /* ── IL TABELLONE DELLE ZONE: righe Solari che filtrano ────────────── */
  (function () {
    var casa = document.getElementById('zoneRighe');
    if (!casa || !BS) return;
    var ZONE = 'ZONE_JSON';
    var LZ = Math.min(14, Math.max.apply(null,
      ZONE.map(function (z) { return z.z.length; })));
    var organi = [];
    ZONE.forEach(function (z) {
      var riga = document.createElement('button');
      riga.type = 'button'; riga.className = 'zona-riga';
      riga.setAttribute('aria-pressed', 'false');
      riga.dataset.zona = z.z.toLowerCase();
      var n1 = document.createElement('span'); n1.className = 'zona-nome';
      var q = document.createElement('span'); q.className = 'zona-quante';
      var d = document.createElement('span');
      d.className = 'zona-da ' + (z.si ? 'si' : 'no');
      riga.appendChild(n1); riga.appendChild(q); riga.appendChild(d);
      riga.setAttribute('aria-label', z.z + ', ' + z.n
        + (z.n === 1 ? ' home' : ' homes') + ', from ' + z.da);
      casa.appendChild(riga);
      organi.push({
        z: new BS.Board(n1, LZ, ' ABCDEFGHIJKLMNOPQRSTUVWXYZ\''),
        q: new BS.Board(q, 2, ' 0123456789'),
        d: new BS.Board(d, 6, ' €,.0123456789'),
        dati: z, el: riga });
      riga.addEventListener('click', function () {
        var mia = z.z.toLowerCase();
        stato.zona = (stato.zona === mia) ? '' : mia;
        organi.forEach(function (o) {
          var on = o.dati.z.toLowerCase() === stato.zona;
          o.el.classList.toggle('on', on);
          o.el.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        if (!ridotto && o_flutter(z)) { /* il colpo di flap alla scelta */ }
        aggiorna();
      });
    });
    function o_flutter(z) {
      var o = organi.filter(function (x) { return x.dati === z; })[0];
      if (o && o.d.flutter) o.d.flutter();
      return true;
    }
    function accendi() {
      organi.forEach(function (o, i) {
        setTimeout(function () {
          var nome = o.dati.z.toUpperCase().slice(0, LZ);
          if (ridotto) { o.z.show(nome); o.q.show(String(o.dati.n));
            o.d.show(o.dati.da); return; }
          o.z.show(nome, 55, true);
          o.q.show(String(o.dati.n), 45, true);
          o.d.show(o.dati.da, 60, true);
        }, ridotto ? 0 : i * 150);
      });
    }
    setTimeout(accendi, 600);
    var tutte = document.getElementById('zoneTutte');
    if (tutte) tutte.addEventListener('click', function () {
      stato.zona = '';
      organi.forEach(function (o) { o.el.classList.remove('on');
        o.el.setAttribute('aria-pressed', 'false'); });
      aggiorna();
    });
    if (!ridotto) setInterval(function () {
      if (document.hidden || !organi.length) return;
      var o = organi[Math.floor(Math.random() * organi.length)];
      var quale = ['z', 'q', 'd'][Math.floor(Math.random() * 3)];
      if (o[quale].flutter) o[quale].flutter();
    }, 14000);
  })();

  /* ── IL SETACCIO: i filtri veri ─────────────────────────────────────── */
  (function () {
    var q = document.getElementById('fq');
    var attesa;
    q.addEventListener('input', function () {
      clearTimeout(attesa);
      attesa = setTimeout(function () {
        stato.q = q.value.trim().toLowerCase(); aggiorna();
      }, 160);
    });
    [].slice.call(document.querySelectorAll('.gruppo button')).forEach(function (b) {
      b.addEventListener('click', function () {
        var f = b.dataset.f, v = b.dataset.v;
        if (f === 'dote') {
          var k = stato.dote.indexOf(v);
          k < 0 ? stato.dote.push(v) : stato.dote.splice(k, 1);
          b.classList.toggle('on', k < 0);
        } else if (f === 'arredata' || f === 'video' || f === 'salvate') {
          stato[f] = !stato[f];
          b.classList.toggle('on', stato[f]);
        } else {
          stato[f] = v;
          b.parentNode.querySelectorAll('button').forEach(function (x) {
            x.classList.toggle('on', x === b && v !== ''); });
        }
        aggiorna();
      });
    });
    document.getElementById('pulisci').addEventListener('click', function () {
      stato.q = ''; stato.letti = ''; stato.bagni = ''; stato.zona = '';
      stato.arredata = false; stato.video = false; stato.salvate = false;
      stato.dote = []; stato.budget = 0; stato.chi = ''; stato.dal = null;
      q.value = '';
      document.querySelectorAll('.gruppo button, .zona-riga')
        .forEach(function (x) { x.classList.remove('on');
          if (x.classList.contains('zona-riga'))
            x.setAttribute('aria-pressed', 'false'); });
      var bud = document.getElementById('quantoBudget');
      var chi = document.getElementById('chiAtterra');
      bud.value = ''; chi.value = '';
      bud.classList.remove('scelto'); chi.classList.remove('scelto');
      if (window.__quandoVeste) window.__quandoVeste();
      aggiorna();
    });
    /* quante ne hai messe da parte */
    function conteggio() {
      var n = salvate().length;
      document.getElementById('quanteSalvate').textContent = n ? ' ' + n : '';
    }
    conteggio();
    addEventListener('storage', conteggio);
    document.addEventListener('click', function (e) {
      if (e.target.closest('.home-cuore')) setTimeout(function () {
        conteggio(); if (stato.salvate) aggiorna(); }, 60);
    });
  })();

  /* ── SALVA QUESTA RICERCA — la forma vera di /api/search/save ───────── */
  (function () {
    var velo = document.getElementById('serbaVelo');
    var forma = document.getElementById('serbaForma');
    function criteri() {
      return { q: stato.q, budgetMax: stato.budget || null,
        moveIn: stato.dal, beds: stato.letti === '' ? null : +stato.letti,
        baths: stato.bagni === '' ? null : +stato.bagni,
        furnished: stato.arredata, video: stato.video,
        zones: stato.zona ? [stato.zona] : [], feats: stato.dote.slice() };
    }
    function sunto() {
      var c = criteri(), p = [];
      if (c.zones.length) p.push(c.zones[0].replace(/\b\w/g,
        function (x) { return x.toUpperCase(); }));
      if (c.beds !== null) p.push(c.beds === 0 ? 'studio' : c.beds + '+ beds');
      if (c.baths !== null) p.push(c.baths + '+ baths');
      if (c.budgetMax) p.push('up to €' + c.budgetMax.toLocaleString('en-US'));
      if (c.furnished) p.push('furnished');
      if (c.video) p.push('video-verified');
      if (c.feats.length) p.push(c.feats.join(', '));
      if (c.moveIn) p.push('from ' + c.moveIn);
      return p.length ? p.join(' · ') : 'Any home in Rome';
    }
    document.getElementById('serba').addEventListener('click', function () {
      document.getElementById('serbaSunto').textContent = sunto();
      document.getElementById('serbaNome').value = sunto().slice(0, 40);
      velo.hidden = false;
      setTimeout(function () { document.getElementById('serbaMail').focus(); }, 60);
    });
    function chiudi() { velo.hidden = true; }
    document.getElementById('serbaChiudi').addEventListener('click', chiudi);
    velo.addEventListener('click', function (e) {
      if (e.target === velo) chiudi(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !velo.hidden) chiudi(); });
    forma.addEventListener('submit', function (e) {
      e.preventDefault();
      /* la richiesta che il sito vero manda — qui dichiarata, non spedita */
      var corpo = { email: document.getElementById('serbaMail').value.trim(),
        label: document.getElementById('serbaNome').value.trim(),
        criteria: criteri(),
        resultCount: +document.getElementById('conto').textContent,
        company: document.getElementById('serbaEsca').value };
      if (window.console) console.log('POST /api/search/save', corpo);
      forma.innerHTML = '<p class="serba-nota" style="font-size:13px;'
        + 'color:var(--gold);margin-top:0">Saved — PREVIEW. On the live site '
        + 'you would now get an email the moment a matching home appears.</p>';
      setTimeout(chiudi, 2200);
    });
  })();

  /* ── L'ORDINE ───────────────────────────────────────────────────────── */
  [].slice.call(document.querySelectorAll('.muro-ordine button'))
    .forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('.muro-ordine button')
          .forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        stato.ordine = b.dataset.o;
        aggiorna();
      });
    });

  /* ── IL CHECK-IN: budget, chi, e la data col picker di SISTEMA ──────── */
  var bud = document.getElementById('quantoBudget');
  var chi = document.getElementById('chiAtterra');
  bud.addEventListener('change', function () {
    stato.budget = +bud.value || 0;
    bud.classList.toggle('scelto', !!bud.value);
    aggiorna();
  });
  chi.addEventListener('change', function () {
    stato.chi = chi.value;
    chi.classList.toggle('scelto', !!chi.value);
    aggiorna();
  });

  (function () {
    var forma = document.getElementById('atterro');
    var btn = document.getElementById('quandoBtn');
    var campo = document.getElementById('quandoData');
    var testo = document.getElementById('quandoTesto');
    if (!forma || !campo) return;
    var oggi = new Date(); oggi.setHours(12, 0, 0, 0);
    /* il picker è quello di SISTEMA — la ruota iPhone, il calendario del
       browser: il campo nativo veste i panni BOOM e porta gratis il
       minimo (niente passato) e il Clear (= Any date) */
    campo.min = iso(oggi);
    function bella(d) {
      return d.toLocaleDateString('en-GB',
        { weekday: 'short', day: 'numeric', month: 'short' });
    }
    /* UNA scrittura per la veste: testo, oro e campo seguono stato.dal,
       chiunque l'abbia mosso (picker, hash, pulisci, vie d'uscita) */
    function veste() {
      if (stato.dal) {
        testo.textContent = bella(new Date(stato.dal + 'T12:00:00'));
        btn.classList.add('scelta');
      } else {
        testo.textContent = 'Any date';
        btn.classList.remove('scelta');
      }
      if (campo.value !== (stato.dal || '')) campo.value = stato.dal || '';
    }
    window.__quandoVeste = veste;
    /* su touch il tap apre da solo la ruota; col mouse il click su un
       campo invisibile darebbe solo il focus: si chiede il picker */
    if (matchMedia('(pointer:fine)').matches)
      campo.addEventListener('click', function () {
        try { if (campo.showPicker) campo.showPicker(); } catch (e) {}
      });
    campo.addEventListener('change', function () {
      stato.dal = campo.value || null;
      veste(); aggiorna();
    });
    forma.addEventListener('submit', function (e) {
      e.preventDefault();
      /* un filtro mostra i risultati: non decide lui quale casa aprire */
      var muro = document.getElementById('muro');
      if (muro) muro.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });

    /* ── ciò che arrivi dalla home viaggia con te ─────────────────────── */
    function leggiHash() {
    var h = location.hash.replace('#', '');
    if (h) h.split('&').forEach(function (p) {
      var k = p.split('=')[0], v = decodeURIComponent(p.split('=')[1] || '');
      if (k === 'dal' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
        stato.dal = v; veste();
      }
      if (k === 'budget') { bud.value = v; stato.budget = +v || 0;
        bud.classList.toggle('scelto', !!v); }
      if (k === 'chi') { chi.value = v; stato.chi = v;
        chi.classList.toggle('scelto', !!v); }
      if (k === 'zona') {
        stato.zona = v.toLowerCase();
        setTimeout(function () {
          document.querySelectorAll('.zona-riga').forEach(function (r) {
            var on = r.dataset.zona === stato.zona;
            r.classList.toggle('on', on);
            r.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
        }, 80);
      }
    });
  }
  leggiHash();
  /* le vie d'uscita del vuoto: un tap toglie QUEL filtro — i comandi dei
     controlli vivono qui, nello stesso closure del picker */
  (function () {
    var box = document.getElementById('vuotoVie');
    if (!box) return;
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-k]'); if (!b) return;
      var k = b.dataset.k;
      if (k === 'budget') { stato.budget = 0; bud.value = '';
        bud.classList.remove('scelto'); }
      if (k === 'chi') { stato.chi = ''; chi.value = '';
        chi.classList.remove('scelto'); }
      if (k === 'dal') { stato.dal = null; veste(); }
      if (k === 'zona') { stato.zona = '';
        document.querySelectorAll('.zona-riga.on').forEach(function (z) {
          z.classList.remove('on'); z.setAttribute('aria-pressed', 'false');
        }); }
      aggiorna();
    });
  })();
  /* le zone sulle carte cambiano l'hash della stessa pagina: si riascolta */
  addEventListener('hashchange', function () { leggiHash(); aggiorna(); });
  })();

  aggiorna();
  }
  if (document.readyState === 'complete') via();
  else addEventListener('load', via);
})();
</script>

<script>
/* LA STECCA, IL FOGLIO, LA VISTA, IL PARAGONE — il secondo atto della
   discovery. Non tocca lo stato dei filtri: lo osserva (il conto cambia
   a ogni aggiorna) e ci si sincronizza sopra. */
(function () {
  'use strict';
  var per = function (s, c) { return (c || document).querySelector(s); };
  var tutti = function (s, c) {
    return [].slice.call((c || document).querySelectorAll(s)); };
  var muro = per('#muro'); if (!muro) return;
  var nav = per('.nav');

  /* ── la stecca si appende sotto la barra: misura vera, non magia ── */
  function quota() {
    var h = nav ? nav.offsetHeight : 76;
    document.documentElement.style.setProperty('--stecca-top', (h - 1) + 'px');
  }
  quota();
  addEventListener('resize', quota);
  addEventListener('scroll', function () { requestAnimationFrame(quota); },
    { passive: true });

  /* ── la scheda di una casa, letta dalla sua carta: una verita sola ── */
  function eu(n) { return '€' + Math.round(n).toLocaleString('en-US'); }
  function scheda(id) {
    var c = tutti('.casa-p', muro).filter(function (x) {
      return x.dataset.id === id; })[0];
    if (!c) return null;
    var img = per('img', c), st = per('.casa-stato', c);
    var p = +c.dataset.prezzo || 0, mesi = +c.dataset.cauzione || 1;
    /* la STESSA aritmetica della pagina casa: onorario 10% del canone
       annuo, deposito = mesi di cauzione — mai due versioni dei soldi */
    var fee = Math.round(p * 12 * .10);
    return { id: id, href: c.getAttribute('href'),
      nome: (per('.nome', c) || {}).textContent || '',
      zona: c.dataset.zona || '', foto: img ? img.src : '',
      prezzo: p, cauzione: mesi * p, mesi: mesi, fee: fee,
      giornouno: p + mesi * p + fee,
      letti: +c.dataset.letti || 0, bagni: +c.dataset.bagni || 0,
      mq: +c.dataset.mq || 0, piano: c.dataset.piano || '',
      arredata: c.dataset.arredata === '1', video: c.dataset.video === '1',
      stato: st ? st.textContent : '',
      dote: (c.dataset.dote || '').split('|').filter(Boolean) };
  }
  function visibili() {
    return tutti('.casa-p', muro).filter(function (c) {
      return !c.classList.contains('via'); });
  }

  /* ── la sincronia: parte da sola ogni volta che il conto cambia ── */
  var sky = per('#skyCarta');
  function sincronia() {
    var vis = visibili();
    if (sky) {
      if (vis.length > 6) muro.insertBefore(sky, vis[6]);
      else muro.appendChild(sky);
      sky.style.display = vis.length ? '' : 'none';
    }
    /* il badge conta TUTTO cio' che filtra — anche zona, data, budget e
       chi: una stecca che dichiara «nessun filtro» su una lista filtrata
       insegna a non fidarsi della stecca */
    var acc = tutti('#foglioVelo .gruppo button.on').filter(function (b) {
      return b.dataset.v !== ''; }).length
      + (window.__filtriVivi ? window.__filtriVivi() : 0);
    var fc = per('#filtriConta');
    if (fc) { fc.hidden = !acc; fc.textContent = acc; }
    var fg = per('#foglioConto'), ct = per('#conto');
    if (fg && ct) fg.textContent = ct.textContent + ' home' +
      (ct.textContent === '1' ? '' : 's');
    if (window.BoomCielo) window.BoomCielo.tieni(vis.map(function (c) {
      return c.dataset.id; }));
  }
  var conto = per('#conto');
  if (conto) new MutationObserver(sincronia)
    .observe(conto, { childList: true });
  sincronia();

  /* ── il foglio dei filtri ── */
  var foglio = per('#foglioVelo');
  var apriF = per('#apriFiltri');
  if (apriF) apriF.addEventListener('click', function () {
    foglio.hidden = false; });
  [per('#foglioChiudi'), per('#foglioFatto')].forEach(function (b) {
    if (b) b.addEventListener('click', function () { foglio.hidden = true; });
  });
  if (foglio) foglio.addEventListener('click', function (e) {
    if (e.target === foglio) foglio.hidden = true; });

  /* ── la vista: griglia ⇄ skyline ── */
  var cieloBox = per('#vistaCielo'), vg = per('#vGriglia'), vc = per('#vCielo');
  var contoRiga = per('.muro-conto'), vuoto = per('#vuoto');
  function vista(mappa) {
    if (!cieloBox) return;
    if (mappa && window.BoomCielo && BoomCielo.apri) BoomCielo.apri();
    cieloBox.hidden = !mappa;
    muro.style.display = mappa ? 'none' : '';
    if (contoRiga) contoRiga.style.display = mappa ? 'none' : '';
    if (vuoto) vuoto.style.display = mappa ? 'none' : '';
    if (vg) vg.classList.toggle('on', !mappa);
    if (vc) { vc.classList.toggle('on', mappa); vc.classList.remove('pulsa'); }
    if (mappa) sincronia();
  }
  if (vg) vg.addEventListener('click', function () { vista(false); });
  if (vc) vc.addEventListener('click', function () { vista(true); });
  if (sky) sky.addEventListener('click', function () {
    vista(true);
    try { cieloBox.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    catch (e) {}
  });

  /* ── il paragone ── */
  var PARA = [];
  var tray = per('#paraTray'), fotine = per('#paraFotine'),
      dice = per('#paraDice'), apriP = per('#paraApri'),
      svuota = per('#paraSvuota'), velaP = per('#paraVelo'),
      tavola = per('#paraTavola');
  function paraSegna() {
    tutti('.home-para', muro).forEach(function (b) {
      b.classList.toggle('on', PARA.indexOf(b.dataset.id) >= 0); });
    if (!tray) return;
    tray.hidden = !PARA.length;
    fotine.innerHTML = PARA.map(function (id) {
      var sc = scheda(id);
      return sc && sc.foto ? '<img src="' + sc.foto + '" alt="">'
                           : '<span></span>';
    }).join('');
    apriP.disabled = PARA.length < 2;
    apriP.textContent = 'Compare' +
      (PARA.length > 1 ? ' ' + PARA.length : '');
    dice.textContent = PARA.length < 2 ? 'Pick another home to compare'
      : PARA.length + ' homes side by side';
  }
  muro.addEventListener('click', function (e) {
    var carta = e.target.closest('a.casa-p');
    if (carta && window.boomTrack)
      boomTrack('card_open', { item_id: carta.dataset.id || '' });
  });
  muro.addEventListener('click', function (e) {
    var b = e.target.closest('.home-para'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var id = b.dataset.id, k = PARA.indexOf(id);
    if (k >= 0) PARA.splice(k, 1);
    else if (PARA.length >= 3) {
      if (dice) dice.textContent = 'Three is the limit — remove one first.';
      if (tray) tray.hidden = false;
      return;
    } else PARA.push(id);
    paraSegna();
  });
  function segno(v) { return v ? '<b>✓</b>' : '—'; }
  function tabella() {
    var ss = PARA.map(scheda).filter(Boolean);
    function fila(eti, f) {
      return '<tr><th scope="row">' + eti + '</th>' + ss.map(function (x) {
        return '<td>' + f(x) + '</td>'; }).join('') + '</tr>';
    }
    tavola.innerHTML =
      '<tr><th></th>' + ss.map(function (x) {
        return '<td class="pt-capo">' +
          (x.foto ? '<img src="' + x.foto + '" alt="">' : '') +
          '<button type="button" class="pt-x" data-id="' + x.id +
          '" aria-label="Remove from comparison">✕</button>' +
          '<b>' + x.nome + '</b><span>' + x.zona + '</span></td>';
      }).join('') + '</tr>' +
      fila('Monthly rent', function (x) {
        return '<b>' + eu(x.prezzo) + '</b>/mo'; }) +
      fila('Day one, all-in', function (x) {
        return '<b>' + eu(x.giornouno) + '</b>'; }) +
      fila('of which deposit', function (x) {
        return '<span class="verde">' + eu(x.cauzione) +
          '</span> · comes back'; }) +
      fila('Agency fee', function (x) { return eu(x.fee); }) +
      fila('Status', function (x) { return x.stato || '—'; }) +
      fila('Beds', function (x) {
        return x.letti === 0 ? 'Studio' : x.letti; }) +
      fila('Baths', function (x) { return x.bagni || '—'; }) +
      fila('Size', function (x) {
        return x.mq ? x.mq + ' m²' : '—'; }) +
      fila('Floor', function (x) { return x.piano || '—'; }) +
      fila('Furnished', function (x) { return segno(x.arredata); }) +
      fila('Video tour', function (x) { return segno(x.video); }) +
      fila('Features', function (x) {
        return x.dote.length ? x.dote.join(', ') : '—'; }) +
      fila('', function (x) {
        return '<a class="btn btn-primary" href="' + x.href +
          '">See this home</a>'; });
  }
  if (apriP) apriP.addEventListener('click', function () {
    if (PARA.length < 2) return;
    tabella(); velaP.hidden = false;
  });
  if (svuota) svuota.addEventListener('click', function () {
    PARA = []; paraSegna(); });
  if (per('#paraChiudi')) per('#paraChiudi')
    .addEventListener('click', function () { velaP.hidden = true; });
  if (velaP) velaP.addEventListener('click', function (e) {
    if (e.target === velaP) velaP.hidden = true; });
  if (tavola) tavola.addEventListener('click', function (e) {
    var b = e.target.closest('.pt-x'); if (!b) return;
    var k = PARA.indexOf(b.dataset.id);
    if (k >= 0) PARA.splice(k, 1);
    paraSegna();
    if (PARA.length < 2) velaP.hidden = true; else tabella();
  });
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (foglio) foglio.hidden = true;
    if (velaP) velaP.hidden = true;
  });
})();
</script>
