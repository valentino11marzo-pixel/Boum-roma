<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metodo 3D · banco di prova</title>
<!-- Banco di prova della scena: stessa tela, stesso fondo notte → BOOM, stesse velature e stessi
     pin della pagina (egidi/index.html), uno slider per T. Parametri: ?T=2.48&layout=desktop|mobile|poster
     &w=1440&h=828&dpr=1&ui=1 (velature, etichette e pin) &conserva=1 (preserveDrawingBuffer, per gli
     screenshot). Espone window.__h = { pronto, imposta(T), info(), poster(T, n) }. -->
<style>
@font-face{font-family:'JetBrains Mono';src:url(../../egidi/fonts/jetbrains-mono.woff2) format('woff2');font-weight:100 800;font-display:block}
:root{--notte:#111D36;--notte-2:#1B2A45;--luce:#F2EFE8;--nebbia:#C5CEDE;--accento-chiaro:#96C0FE;--accento:#173FA4;--ink:#0D1626;--oro:#FFD700;--boom:#060607;--t:0;--mono:'JetBrains Mono',ui-monospace,monospace}
html,body{margin:0;height:100%;background:#000;color:var(--luce);font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#palco{position:absolute;left:0;top:0;overflow:hidden;--fondo:color-mix(in oklab,var(--notte),var(--boom) calc(var(--t) * 100%));background:var(--fondo)}
#tela{position:absolute;inset:0;width:100%;height:100%;display:block}
.velo{position:absolute;inset:0;pointer-events:none}
.desktop .velo{background:linear-gradient(90deg,color-mix(in oklab,var(--fondo) 92%,transparent) 0,color-mix(in oklab,var(--fondo) 92%,transparent) 30%,color-mix(in oklab,var(--fondo) 85%,transparent) 38%,transparent 56%)}
.mobile .velo{background:linear-gradient(180deg,transparent 0,transparent 46%,color-mix(in oklab,var(--fondo) 88%,transparent) 58%,var(--fondo) 68%)}
.noui .velo,.noui .eti,.noui .pin,.noui .tag,.noui .mirino{display:none!important}
.eti{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:grid;gap:2px;padding:5px 8px;border-radius:3px;background:rgba(17,29,54,.84);color:var(--luce);font:500 11px/1.25 var(--mono);letter-spacing:.06em;text-align:center;white-space:nowrap;opacity:0}
.eti b{font-weight:700;letter-spacing:.12em;text-transform:uppercase}.eti i{font-style:normal;color:var(--accento-chiaro)}.eti.on{opacity:1}
.pin{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:3px;background:var(--luce);color:var(--ink);font:600 11.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;box-shadow:0 12px 30px -12px rgba(0,0,0,.6);opacity:0}
.pin::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accento)}
.pin.on{opacity:1}.pin[data-pin=noncombacia]{background:var(--nebbia)}.pin.boom{background:#FFD700;color:#060607}.pin.boom::before{background:#060607}
.tag{position:absolute;right:20px;bottom:16px;font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--nebbia);background:rgba(17,29,54,.7);padding:6px 9px;border-radius:3px}
.mobile .tag{top:80px;bottom:auto;right:12px}
.mirino{position:absolute;left:44%;right:5%;top:12%;bottom:12%;opacity:0}.mirino.on{opacity:1}
.mobile .mirino{left:6%;right:6%;top:14%;bottom:48%}
.mirino i{position:absolute;width:18px;height:18px;border:0 solid var(--luce)}
.mirino i:nth-child(1){left:0;top:0;border-left-width:2px;border-top-width:2px}.mirino i:nth-child(2){right:0;top:0;border-right-width:2px;border-top-width:2px}
.mirino i:nth-child(3){left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}.mirino i:nth-child(4){right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.mirino span{position:absolute;right:0;top:-24px;font:500 11px/1 var(--mono);letter-spacing:.14em}
#comandi{position:fixed;left:12px;bottom:12px;z-index:9;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:6px;font:12px var(--mono)}
#comandi input{width:420px}
.shot #comandi{display:none}
</style>
</head>
<body>
<div id="palco"><canvas id="tela"></canvas><div class="velo"></div><div id="eti"></div>
<span class="pin" data-pin="noncombacia">Non combacia</span><span class="pin" data-pin="rogito">Rogito</span><span class="pin boom" data-pin="boom">Oppure la affitta BOOM</span>
<div class="mirino" id="mirino"><i></i><i></i><i></i><i></i><span>FOTO 1/3</span></div>
<p class="tag">Illustrazione · appartamento tipo, non in vendita</p></div>
<div id="comandi"><span id="tv">T 0.00</span><input id="slider" type="range" min="0" max="5" step="0.005" value="0"><span id="inf"></span></div>
<script type="module">
const q = new URLSearchParams(location.search), num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);
const W = num('w', innerWidth), Hh = num('h', innerHeight), dpr = num('dpr', Math.min(devicePixelRatio || 1, 1.5));
const layout = q.get('layout') || (W >= 1024 ? 'desktop' : 'mobile'), ui = q.get('ui') !== '0' && layout !== 'poster';
const palco = document.getElementById('palco'), tela = document.getElementById('tela');
palco.style.width = W + 'px'; palco.style.height = Hh + 'px';
document.body.classList.add(layout); if (!ui) document.body.classList.add('noui'); if (q.has('shot')) document.body.classList.add('shot');
const TOK = { notte: '#111D36', notte2: '#1B2A45', luce: '#F2EFE8', nebbia: '#C5CEDE', accentoChiaro: '#96C0FE', accento: '#173FA4', oro: '#FFD700', boom: '#060607' };
const cl = (x) => Math.max(0, Math.min(1, x)), seg = (t, a, b) => cl((t - a) / (b - a)), liscio = (x) => x * x * x * (x * (x * 6 - 15) + 10);
let M, S, T = num('T', 0);
const pronto = (async () => {
  await document.fonts.load('500 11px "JetBrains Mono"');
  M = await import(q.get('bundle') || '../../egidi/js/metodo3d.js');
  S = await M.monta(tela, { token: TOK, layout, profilo: q.get('profilo') || 'pieno', dpr, larghezza: W, altezza: Hh, esigente: false, conserva: q.get('conserva') === '1' });
  S.dimensiona(W, Hh, dpr, layout);
  const box = document.getElementById('eti');
  for (const s of M.PIANTA.stanze) {
    const el = document.createElement('span'); el.className = 'eti'; el.dataset.id = s.id; el.dataset.cx = s.cx; el.dataset.netta = s.netta;
    el.innerHTML = `<b>${s.nome}</b><span>${s.netta.toFixed(2).replace('.', ',')} m²</span>` + (layout === 'mobile' || !s.w ? '' : `<i>${s.w.toFixed(2).replace('.', ',')} × ${s.d.toFixed(2).replace('.', ',')}</i>`);
    box.appendChild(el);
  }
  imposta(T);
  return true;
})();
function imposta(t) {
  T = t; S.imposta(t);
  palco.style.setProperty('--t', liscio(seg(t, 4.0, 4.35)).toFixed(3));
  document.getElementById('tv').textContent = 'T ' + t.toFixed(3); document.getElementById('slider').value = t;
  if (!ui) return;
  const rx = M.rilievoX(t), mob = layout === 'mobile';
  for (const el of document.querySelectorAll('.eti')) {
    const acc = t < 1.05 && rx >= +el.dataset.cx && !(mob && +el.dataset.netta < 6), p = acc ? S.proietta(el.dataset.id) : null;
    el.classList.toggle('on', !!(acc && p && p.visibile && t < 0.97));
    if (p) el.style.transform = `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0) translate(-50%,-50%)`;
  }
  const giu = mob ? Hh * 0.56 : Hh - 12;
  for (const el of document.querySelectorAll('.pin')) {
    const id = el.dataset.pin; let on = id === 'noncombacia' ? t >= 1.60 && t < 1.72 : id === 'rogito' ? t >= 3.60 && t < 4.05 : t >= 4.35;
    const p = on ? S.proietta(id) : null; on = on && p && p.visibile;
    if (on) el.style.transform = `translate3d(${p.x.toFixed(1)}px,${Math.max(12, Math.min(giu, p.y)).toFixed(1)}px,0) translate(-50%,-100%)`;
    el.classList.toggle('on', !!on);
  }
  let s = -1; M.SCATTI.forEach((w, i) => { if (t >= w[0] && t <= w[1]) s = i; });
  const mir = document.getElementById('mirino'); mir.classList.toggle('on', s >= 0); if (s >= 0) mir.lastChild.textContent = 'FOTO ' + (s + 1) + '/3';
  const i = S.info(); document.getElementById('inf').textContent = `prog ${i.programs} · calls ${i.calls} · tris ${i.tris} · dpr ${i.dpr}`;
}
// il poster del ripiego: fondo opaco della posa, la tela, e nel disegno le etichette e i pin che
// in modalita' poster la pagina non ha (per questo si disegnano qui, sulla tela 2D)
function chip(g, x, y, testo, fondo, inchiostro, puntino, scala) {
  g.font = `600 ${Math.round(11.5 * scala)}px "JetBrains Mono"`; if ('letterSpacing' in g) g.letterSpacing = (0.1 * 11.5 * scala).toFixed(1) + 'px';
  const tw = g.measureText(testo).width, pad = 11 * scala, dot = 7 * scala, gap = 8 * scala, w = pad * 2 + dot + gap + tw, h = 25 * scala;
  const x0 = Math.round(x - w / 2), y0 = Math.round(y - h);
  g.save(); g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 24 * scala; g.shadowOffsetY = 10 * scala;
  g.fillStyle = fondo; g.beginPath(); g.roundRect(x0, y0, w, h, 3 * scala); g.fill(); g.restore();
  g.fillStyle = puntino; g.beginPath(); g.arc(x0 + pad + dot / 2, y0 + h / 2, dot / 2, 0, 6.283); g.fill();
  g.fillStyle = inchiostro; g.textBaseline = 'middle'; g.fillText(testo, x0 + pad + dot + gap, y0 + h / 2 + 0.5);
}
function etichetta(g, x, y, righe, scala) {
  const f = [`700 ${Math.round(11 * scala)}px "JetBrains Mono"`, `500 ${Math.round(11 * scala)}px "JetBrains Mono"`, `500 ${Math.round(11 * scala)}px "JetBrains Mono"`];
  const sp = [0.12, 0.06, 0.06]; let w = 0;
  righe.forEach((r, i) => { g.font = f[i]; if ('letterSpacing' in g) g.letterSpacing = (sp[i] * 11 * scala).toFixed(1) + 'px'; w = Math.max(w, g.measureText(r).width); });
  const lh = 14 * scala, pw = w + 16 * scala, ph = righe.length * lh + 8 * scala, x0 = x - pw / 2, y0 = y - ph / 2;
  g.fillStyle = 'rgba(17,29,54,.84)'; g.beginPath(); g.roundRect(x0, y0, pw, ph, 3 * scala); g.fill();
  righe.forEach((r, i) => { g.font = f[i]; if ('letterSpacing' in g) g.letterSpacing = (sp[i] * 11 * scala).toFixed(1) + 'px'; g.fillStyle = i === 2 ? TOK.accentoChiaro : TOK.luce; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(i === 0 ? r.toUpperCase() : r, x, y0 + 4 * scala + lh * (i + 0.5)); });
  g.textAlign = 'left';
}
function poster(t, n, qualita = 0.8) {
  imposta(t);
  const c = document.createElement('canvas'); c.width = Math.round(W * dpr); c.height = Math.round(Hh * dpr);
  const g = c.getContext('2d'), sc = 1.55 * dpr;
  g.fillStyle = n === 5 ? TOK.boom : TOK.notte; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(tela, 0, 0, c.width, c.height);
  const P = (id) => { const p = S.proietta(id); return { x: p.x * dpr, y: p.y * dpr, visibile: p.visibile }; };
  if (n === 1) for (const s of M.PIANTA.stanze) { const p = P(s.id); const r = [s.nome, s.netta.toFixed(2).replace('.', ',') + ' m²']; if (s.w) r.push(s.w.toFixed(2).replace('.', ',') + ' × ' + s.d.toFixed(2).replace('.', ',')); etichetta(g, p.x, p.y, r, sc * 0.92); }
  if (n === 2) { const p = P('noncombacia'); chip(g, p.x, p.y, 'NON COMBACIA', TOK.nebbia, '#0D1626', TOK.accento, sc); }
  if (n === 4) { const p = P('rogito'); chip(g, p.x, Math.max(40, p.y), 'ROGITO', TOK.luce, '#0D1626', TOK.accento, sc); }
  if (n === 5) { const p = P('boom'); chip(g, p.x, Math.max(40, p.y), 'OPPURE LA AFFITTA BOOM', '#FFD700', '#060607', '#060607', sc); }
  const urls = []; let url = '';
  for (let qq = qualita; qq >= 0.5; qq -= 0.04) { url = c.toDataURL('image/webp', +qq.toFixed(2)); urls.push([qq, url.length]); if ((url.length - 23) * 0.75 <= 90000) return { url, q: +qq.toFixed(2) }; }
  return { url, q: 0.5 };
}
window.__h = { pronto, imposta: (t) => imposta(t), info: () => S.info(), poster, proietta: (id) => S.proietta(id), scena: () => S };
document.getElementById('slider').addEventListener('input', (e) => { pronto.then(() => imposta(parseFloat(e.target.value))); });
</script>
</body>
</html>
