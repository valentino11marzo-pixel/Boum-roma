/* ══ SOLARI 4.0 — la cella a palette, precisione tipografica ══════════
   · metà esattamente al 50%: nessun pixel del glifo sottratto
   · cerniera DIPINTA sopra (overlay) con perni laterali
   · glifo centrato otticamente sul cap-height (runtime, --gs)
   · larghezza cella calibrata sul glifo più largo del rullo (--cw) */
.fc2 {
  --ch: 1.26em; --cw: 0.84em; --gs: 0px;
  position:relative; display:inline-block;
  width:var(--cw); height:var(--ch);
  margin-right:0.07em; vertical-align:-0.20em;
  border-radius:0.085em; background:#040404;
  box-shadow:inset 0 0 0 1px rgba(239,235,223,0.05), 0 0.08em 0.3em rgba(0,0,0,0.6);
  perspective:3em; color:var(--oro-flap);
}
.fc2 i { position:absolute; left:0; width:100%; height:50%; overflow:hidden; font-style:normal; }
.fc2 i b { position:absolute; left:0; width:100%; height:var(--ch); line-height:var(--ch);
  text-align:center; font-weight:inherit; transform:translateY(var(--gs)); }
.fc2 .st { top:0; border-radius:0.085em 0.085em 0 0; background:linear-gradient(180deg,#17171A,#0E0E10); z-index:1; }
.fc2 .sb { bottom:0; border-radius:0 0 0.085em 0.085em; background:linear-gradient(180deg,#09090B,#111114); z-index:1; }
.fc2 .st b { top:0; }
.fc2 .sb b { top:-100%; }
.fc2 .lt { top:0; border-radius:0.085em 0.085em 0 0; background:linear-gradient(180deg,#17171A,#0E0E10);
  transform-origin:center bottom; z-index:4; display:none; }
.fc2 .lt b { top:0; }
.fc2 .lb { bottom:0; border-radius:0 0 0.085em 0.085em; background:linear-gradient(180deg,#09090B,#111114);
  transform-origin:center top; transform:rotateX(88deg); z-index:3; display:none; }
.fc2 .lb b { top:-100%; }
.fc2 s { position:absolute; left:0; right:0; top:50%; height:0.035em; min-height:1px;
  margin-top:calc(0.035em / -2);
  background:linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0.5));
  z-index:6; text-decoration:none; }
.fc2 s::before, .fc2 s::after { content:''; position:absolute; top:50%; width:0.055em; height:0.16em;
  transform:translateY(-50%); background:linear-gradient(180deg,#000,#1A1A1A); border-radius:0.02em; }

@keyframes flTop { 0% { transform:rotateX(0); filter:brightness(1); }
  100% { transform:rotateX(-88deg); filter:brightness(0.45); } }

<script>
/* ══════════════════════════════════════════════════════════════════════════
   BOOM SOLARI — il motore a palette (Gino Valle, 1962), meccanica v3:
   due mezze celle statiche + due ante 3D guidate da animationend, rulli
   corti (mai teletrasporti), retargeting a metà giro, failsafe per la
   scheda nascosta. Qui esporta soltanto: la regia è del Terminale.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  function Cell(host) {
    var el = document.createElement('span');
    el.className = 'fc2';
    el.innerHTML = '<i class="st"><b></b></i><i class="sb"><b></b></i><i class="lt"><b></b></i><i class="lb"><b></b></i><s></s>';
    host.appendChild(el);
    this.st = el.children[0].firstChild;
    this.sb = el.children[1].firstChild;
    this.ltEl = el.children[2]; this.lt = this.ltEl.firstChild;
    this.lbEl = el.children[3]; this.lb = this.lbEl.firstChild;
    this.cur = ' '; this.busy = false; this.pending = ' '; this.turns = 0;
    this.set(' ');
  }
  Cell.prototype.set = function (c) {
    this.cur = c; this.pending = c;
    this.st.textContent = c; this.sb.textContent = c;
  };
  Cell.prototype.next = function (drum) {
    var i = drum.indexOf(this.cur); if (i < 0) i = 0;
    var j = drum.indexOf(this.pending); if (j < 0) j = 0;
    var d = (j - i + drum.length) % drum.length;
    if (d === 0) return null;
    if (d > 5) return drum[(j - 4 + drum.length) % drum.length];
    return drum[(i + 1) % drum.length];
  };
  Cell.prototype.step = function (nc, done) {
    var self = this, fired = false;
    function finishTop() {
      if (fired) return; fired = true;
      self.ltEl.onanimationend = null;
      self.ltEl.style.display = 'none'; self.ltEl.style.animation = '';
      var fired2 = false;
      function finishBot() {
        if (fired2) return; fired2 = true;
        self.lbEl.onanimationend = null;
        self.sb.textContent = nc;
        self.lbEl.style.display = 'none'; self.lbEl.style.animation = '';
        self.cur = nc; done();
      }
      self.lbEl.style.display = 'block';
      self.lbEl.style.animation = 'flBot 150ms cubic-bezier(.3,1.35,.6,1) forwards';
      self.lbEl.onanimationend = finishBot;
      setTimeout(finishBot, 400);
    }
    this.st.textContent = nc;
    this.lt.textContent = this.cur;
    this.lb.textContent = nc;
    this.ltEl.style.display = 'block';
    this.ltEl.style.animation = 'flTop 90ms cubic-bezier(.55,0,.85,.36) forwards';
    this.ltEl.onanimationend = finishTop;
    setTimeout(finishTop, 300);
  };
  Cell.prototype.go = function (target, drum, fullTurn) {
    this.pending = target;
    if (fullTurn && !this.busy) this.turns = 1;
    if (this.busy) return;
    var self = this;
    this.busy = true;
    (function run() {
      var nc = self.next(drum);
      if (nc === null && self.turns > 0) {
        self.turns = 0;
        var i = drum.indexOf(self.cur);
        nc = drum[(i + 1) % drum.length];
        self.pending = drum[i];
        self.step(nc, run);
        return;
      }
      if (nc === null) { self.busy = false; return; }
      self.step(nc, run);
    })();
  };

  var measurer = document.createElement('canvas').getContext('2d');
  function calibrate(host, drum) {
    var cs = getComputedStyle(host);
    var fs = parseFloat(cs.fontSize);
    measurer.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    var chPx = 1.26 * fs;
    var m = measurer.measureText('H');
    var fa = m.fontBoundingBoxAscent !== undefined ? m.fontBoundingBoxAscent : m.actualBoundingBoxAscent * 1.25;
    var fd = m.fontBoundingBoxDescent !== undefined ? m.fontBoundingBoxDescent : m.actualBoundingBoxAscent * 0.25;
    var baseline = (chPx + fa - fd) / 2;
    var shift = chPx / 2 - (baseline - m.actualBoundingBoxAscent / 2);
    var maxW = 0;
    for (var i = 0; i < drum.length; i++) {
      var w = measurer.measureText(drum[i]).width;
      if (w > maxW) maxW = w;
    }
    host.style.setProperty('--gs', shift.toFixed(2) + 'px');
    host.style.setProperty('--cw', ((maxW + fs * 0.24) / fs).toFixed(4) + 'em');
  }

  function Board(host, len, drum) {
    host.textContent = '';
    host.classList.add('flap-scale');
    calibrate(host, drum);
    this.cells = [];
    this.drum = drum;
    for (var i = 0; i < len; i++) this.cells.push(new Cell(host));
  }
  Board.prototype.show = function (word, stagger, spin) {
    var self = this;
    this.cells.forEach(function (c, i) {
      var ch = word[i] || ' ';
      if (!spin) { c.set(ch); return; }
      setTimeout(function () { c.go(ch, self.drum); },
        i * (stagger || 90) + Math.random() * 26);
    });
  };
  Board.prototype.update = function (word) {   /* flippa solo le celle cambiate */
    var self = this;
    this.cells.forEach(function (c, i) {
      var ch = word[i] || ' ';
      if (c.cur !== ch || c.pending !== ch) c.go(ch, self.drum);
    });
  };
  Board.prototype.flutter = function () {
    var c = this.cells[Math.floor(Math.random() * this.cells.length)];
    if (c && !c.busy && c.cur !== ' ') c.go(c.cur, this.drum, true);
  };

  window.BoomSolari = { Cell: Cell, Board: Board, calibrate: calibrate };
})();
</script>

<script>
(function () {

  var BS = window.BoomSolari;
  var DRUM = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789€.,:·+/';
  var CASE = [{"ora": "31JAN", "zona": "CENTRO", "tipo": "3BR", "prezzo": "€1,500", "stato": "LIST"}, {"ora": "NOW", "zona": "PIGNETO", "tipo": "2BR", "prezzo": "€1,600", "stato": "NEW"}, {"ora": "1JAN", "zona": "PIGNETO", "tipo": "3BR", "prezzo": "€2,000", "stato": "LIST"}, {"ora": "NOW", "zona": "PIGNETO", "tipo": "2BR", "prezzo": "€1,500", "stato": "NEW"}, {"ora": "NOW", "zona": "PONTE MILVIO", "tipo": "1BR", "prezzo": "€1,250", "stato": "FREE"}, {"ora": "NOW", "zona": "TRASTEVERE", "tipo": "1BR", "prezzo": "€1,200", "stato": "FREE"}, {"ora": "NOW", "zona": "TRIESTE", "tipo": "1BR", "prezzo": "€1,200", "stato": "FREE"}, {"ora": "NOW", "zona": "TRIESTE", "tipo": "1BR", "prezzo": "€2,000", "stato": "FREE"}, {"ora": "NOW", "zona": "PONTE MILVIO", "tipo": "1BR", "prezzo": "€1,200", "stato": "FREE"}, {"ora": "NOW", "zona": "PRATI", "tipo": "1BR", "prezzo": "€2,000", "stato": "LIST"}, {"ora": "NOW", "zona": "PARIOLI", "tipo": "1BR", "prezzo": "€1,000", "stato": "LIST"}, {"ora": "NOW", "zona": "AFRICANO", "tipo": "1BR", "prezzo": "€900", "stato": "FREE"}, {"ora": "NOW", "zona": "PIGNETO", "tipo": "2BR", "prezzo": "€1,700", "stato": "LIST"}, {"ora": "1SEP", "zona": "VITTORIO VENE", "tipo": "1BR", "prezzo": "€1,300", "stato": "LIST"}, {"ora": "NOW", "zona": "PRATI", "tipo": "1BR", "prezzo": "€1,500", "stato": "FREE"}, {"ora": "NOW", "zona": "CONCA D'ORO", "tipo": "1BR", "prezzo": "€1,750", "stato": "LIST"}, {"ora": "NOW", "zona": "CENTRO STORIC", "tipo": "1BR", "prezzo": "€1,800", "stato": "LIST"}, {"ora": "1SEP", "zona": "CENTRO STORIC", "tipo": "1BR", "prezzo": "€2,300", "stato": "LIST"}];
  var PER = 6, GIRO = 14000;

  /* ══ PARTENZE / ARRIVI (STUDIO_AVIATION S4) ═══════════════════════════
     Il dato c'era già: la colonna `ora` porta NOW (si entra adesso) oppure
     la data di rilascio. Prima i due flussi erano mischiati; ora il
     tabellone li separa come uno scalo vero — DEPARTURES = boarding,
     ARRIVALS = in atterraggio, stato SOON in oro. Nessun dato inventato:
     è la stessa fotografia di build, organizzata. */
  var PART = CASE.filter(function (h) { return h.ora === 'NOW'; });
  var ARR  = CASE.filter(function (h) { return h.ora !== 'NOW'; })
    .map(function (h) { return { ora:h.ora, zona:h.zona, tipo:h.tipo,
      prezzo:h.prezzo, stato:'SOON', presto:true }; });
  var PAGES = [];
  var np = Math.max(1, Math.ceil(PART.length / PER));
  for (var pi = 0; pi < np; pi++) PAGES.push({
    lato:'DEPARTURES', nota:'Boarding now',
    rows:PART.slice(pi * PER, pi * PER + PER) });
  for (var ai = 0; ai < Math.ceil(ARR.length / PER); ai++) PAGES.push({
    lato:'ARRIVALS', nota:'Free soon · reserve ahead',
    rows:ARR.slice(ai * PER, ai * PER + PER) });

  var pagine = PAGES.length;
  var box = document.getElementById('righe');
  var nav = document.getElementById('pagine');
  var righe = [];
  for (var i = 0; i < Math.min(PER, CASE.length); i++) {
    var d = document.createElement('div');
    d.className = 'riga';
    d.innerHTML = '<span class="cella c-ora flap-scale"></span>' +
      '<span class="cella c-zona flap-scale"></span>' +
      '<span class="cella c-tipo flap-scale"></span>' +
      '<span class="cella c-prezzo flap-scale"></span>' +
      '<span class="cella c-stato flap-scale"></span>';
    box.appendChild(d);
    righe.push({ el:d, celle:{
      ora:   new BS.Board(d.querySelector('.c-ora'),    5,  DRUM),
      zona:  new BS.Board(d.querySelector('.c-zona'),   13, DRUM),
      tipo:  new BS.Board(d.querySelector('.c-tipo'),   3,  DRUM),
      prezzo:new BS.Board(d.querySelector('.c-prezzo'), 6,  DRUM),
      stato: new BS.Board(d.querySelector('.c-stato'),  5,  DRUM)
    }});
  }
  for (var k = 0; k < pagine; k++) {
    var t = document.createElement('i');
    if (k === 0) t.className = 'qui';
    nav.appendChild(t);
  }
  /* il lato del tabellone: DEPARTURES ⇄ ARRIVALS, ante vere */
  var latoEl = document.getElementById('lato');
  var latoNotaEl = document.getElementById('latoNota');
  var lato = latoEl ? new BS.Board(latoEl, 10, DRUM) : null;
  if (lato) lato.show(PAGES[0].lato, 40, true);

  var pagina = 0;
  function mostra(p, sbatti) {
    pagina = p;
    [].forEach.call(nav.children, function (x, k) {
      x.classList.toggle('qui', k === p);
    });
    if (lato) lato.update(PAGES[p].lato);
    if (latoNotaEl) latoNotaEl.textContent = PAGES[p].nota;
    righe.forEach(function (r, i) {
      var h = PAGES[p].rows[i];
      r.el.classList.toggle('nuovo', !!h && h.stato === 'NEW');
      r.el.classList.toggle('presto', !!h && !!h.presto);
      var mostraR = function () {
        r.celle.ora.update(h ? h.ora : '');
        r.celle.zona.update(h ? h.zona : '');
        r.celle.tipo.update(h ? h.tipo : '');
        r.celle.prezzo.update(h ? h.prezzo : '');
        r.celle.stato.update(h ? h.stato : '');
      };
      if (sbatti) setTimeout(mostraR, i * 140); else mostraR();
    });
  }
  /* prima stampa col giro completo */
  righe.forEach(function (r, i) {
    var h = PAGES[0].rows[i];
    setTimeout(function () {
      if (!h) return;
      r.celle.ora.show(h.ora, 24, true);
      r.celle.zona.show(h.zona, 18, true);
      r.celle.tipo.show(h.tipo, 24, true);
      r.celle.prezzo.show(h.prezzo, 22, true);
      r.celle.stato.show(h.stato, 22, true);
      r.el.classList.toggle('nuovo', h.stato === 'NEW');
      r.el.classList.toggle('presto', !!h.presto);
    }, 400 + i * 160);
  });
  if (pagine > 1) setInterval(function () {
    if (document.hidden) return;
    mostra((pagina + 1) % pagine, true);
  }, GIRO);
  /* l'orologio */
  function oraRoma() {
    try {
      return new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Rome',
        hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date());
    } catch (e) { return new Date().toTimeString().slice(0, 5); }
  }
  var oro = new BS.Board(document.getElementById('ora'), 5, ' 0123456789:');
  oro.show(oraRoma());
  setInterval(function () { if (!document.hidden) oro.update(oraRoma()); }, 20000);
  /* ogni tanto un fremito, come i tabelloni veri */
  setInterval(function () {
    if (document.hidden) return;
    var r = righe[Math.floor(Math.random() * righe.length)];
    var quali = ['zona','prezzo','stato'];
    r.celle[quali[Math.floor(Math.random() * 3)]].flutter();
  }, 9000);
})();
</script>
