<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08080A">
<title>Your rent · BOOM</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#08080A;--card:#0F0F12;--line:rgba(255,255,255,.09);--text:#fff;--muted:#8E8E93;--gold:#D4AF37;--red:#FF4D5A;--ok:#3DDC84}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:300;letter-spacing:6px;font-size:15px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;min-width:44px;min-height:44px;padding:0 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:#000;font-weight:600}
.eyebrow{margin:0 0 6px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
h1{margin:0 0 4px;font-weight:300;font-size:30px;letter-spacing:.5px}
.where{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.amount{font-size:44px;font-weight:200;letter-spacing:1px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.parts{margin:0 0 6px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.period{margin:0 0 6px;color:var(--muted);font-size:13px;line-height:1.5}
.due{margin:0;font-size:14px;color:var(--muted)}
.due.is-late{color:#FF8F97}
.lab{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
h2.lab{font-weight:400}
.free{color:var(--ok);letter-spacing:1px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:var(--gold);color:#000;font:inherit;font-size:16px;font-weight:600;letter-spacing:.3px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:none;border:1px solid rgba(255,255,255,.22);color:var(--text);font-weight:500}
.btn[disabled]{opacity:.5;cursor:wait}
.hint{margin:9px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.kv{margin:0;font-size:14px}
.kv .row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.kv .row:first-child{border-top:0}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0}
.kv .v{overflow-wrap:anywhere;font-variant-numeric:tabular-nums;line-height:1.45}
.kv .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.3px}
.copy{flex:none;background:none;border:1px solid var(--line);color:var(--gold);border-radius:999px;font:inherit;font-size:12px;min-height:32px;padding:5px 12px;cursor:pointer}
input[type=date],input[type=text]{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#141417;color:var(--text);font:inherit;font-size:16px;color-scheme:dark}
.field{margin-bottom:14px}
.proof{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.proof label{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border:1px dashed rgba(255,255,255,.25);border-radius:14px;cursor:pointer;font-size:14px}
.proof label:focus-within{outline:2px solid #fff;outline-offset:2px}
.proof input{position:absolute;opacity:0;width:1px;height:1px}
.proof img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.proof .pdf{font-size:13px;color:var(--muted)}
.err{color:#FF8F97;font-size:13px;margin:10px 0 0;min-height:1em}
.status{text-align:center;padding:30px 18px}
.status .tick{width:62px;height:62px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:rgba(212,175,55,.14);color:var(--gold);font-size:28px}
.status.is-paid .tick{background:rgba(61,220,132,.14);color:var(--ok)}
.status h2{font-weight:300;margin:0 0 8px}
.status p{color:var(--muted);margin:0 0 6px;line-height:1.5}
.status ul{list-style:none;margin:10px 0 0;padding:0;color:var(--muted);font-size:13px;line-height:1.6}
.note{border-color:rgba(212,175,55,.35)}
.note p{margin:0;font-size:13px;line-height:1.5;color:#F2D58A}
.link{display:inline-block;margin-top:10px;color:var(--gold);font-size:14px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
.foot a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">BOOM</span><span class="lang" role="group" aria-label="Language"><button type="button" data-lang="it" aria-pressed="false">IT</button><button type="button" data-lang="en" aria-pressed="true">EN</button></span></div>

  // Le parole della pagina, nelle due lingue. L'inglese è la lingua di casa

      or: 'oppure', bankH: 'Paga con bonifico', free: 'gratis', beneficiary: 'Beneficiario', iban: 'IBAN', bic: 'BIC / SWIFT', causale: 'Causale', copy: 'Copia', copied: 'Copiato', copyOf: function (k) { return 'Copia ' + k; },

      already: 'Ho già fatto il bonifico', reportH: 'Segnala il bonifico che hai fatto', when: 'Quando hai fatto il bonifico', proof: 'Ricevuta del bonifico', proofAdd: 'Foto o PDF della ricevuta', proofChange: 'Cambia ricevuta',

  (function () {

  function t(k) { return T[lang][k]; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render() {
    if (state === 'invalid') { app.innerHTML = '<p class="eyebrow">' + esc(t('eyebrow')) + '</p><h1>BOOM</h1><p class="where">' + esc(t('invalid')) + '</p>'; return; }
    if (state === 'offline') { app.innerHTML = '<p class="eyebrow">' + esc(t('eyebrow')) + '</p><h1>BOOM</h1><p class="where">' + esc(t('fail')) + '</p><button type="button" class="btn" id="rl" aria-label="' + esc(t('retry')) + '">↻ ' + esc(t('retry')) + '</button>'; document.getElementById('rl').onclick = function () { location.reload(); }; return; }
    if (!rata) { app.innerHTML = '<p class="where">' + esc(t('loading')) + '</p>'; return; }
    var r = rata, html = head();
    if (r.state === 'paid') {
      var pp = [T[lang].paidP(day(r.paidDate))];
      if (r.paidByCard) pp.push(t('paidCard'));
      app.innerHTML = html + status('is-paid', '✓', t('paidH'), pp, r.receiptUrl ? '<a class="link" href="' + esc(r.receiptUrl) + '" target="_blank" rel="noopener">' + esc(t('receipt')) + '</a>' : '');
      return;
    }
    if (r.state === 'reported') {
      var ps = [T[lang].repP(day(r.reportedDate))];
      if (after && after.proofFailed) ps.push(t('proofFailed')); else ps.push(r.hasProof || (after && after.proof) ? t('repProof') : t('repNoProof'));
      var list = r.reports && r.reports.length > 1 ? '<ul>' + r.reports.map(function (x) { return '<li>' + esc(day(x.date)) + (x.hasProof ? ' · ' + esc(t('withProof')) : '') + '</li>'; }).join('') + '</ul>' : '';
      if (list) list = '<p>' + esc(t('reports')) + '</p>' + list;
      html += status('', '✓', t('repH'), ps, list + (!r.hasProof && !(after && after.proof) ? '<a class="link" href="' + esc(waLink()) + '" target="_blank" rel="noopener">' + esc(t('wa')) + '</a>' : ''));
      if (form && r.canReportMore) { html += bankCard() + reportForm(); app.innerHTML = html; bindAll(); return; }
      if (r.canReportMore) html += '<button type="button" class="btn ghost" id="more">' + esc(t('more')) + '</button><div style="height:10px"></div>';
      if (r.canWithdraw) html += '<button type="button" class="btn ghost" id="wd">' + esc(t('withdraw')) + '</button>';
      html += '<p class="err" id="err" role="alert"></p>';
      app.innerHTML = html;
      var more = document.getElementById('more'); if (more) more.onclick = function () { form = true; after = null; render(); };
      var wd = document.getElementById('wd'); if (wd) wd.onclick = withdraw;
      return;
    }
    if (r.state === 'processing') { app.innerHTML = html + status('', '…', t('procH'), [t('procP')]); return; }
    if (r.state === 'review') { app.innerHTML = html + status('', '?', t('reviewH'), [t('reviewP')], '<a class="link" href="' + WA + '" target="_blank" rel="noopener">' + esc(t('wa')) + '</a>'); return; }
    if (!r.canPay) { app.innerHTML = html + status('', '?', t('otherH'), [t('otherP')], '<a class="link" href="' + WA + '" target="_blank" rel="noopener">' + esc(t('wa')) + '</a>'); return; }
    // Di ritorno da Stripe ma il pagamento non risulta ancora: niente carta
    // né bonifico (sarebbe un secondo pagamento), solo "aggiorna".
    if (ret === 'success') {
      app.innerHTML = html + status('', '…', t('backH'), [t('backP')], '<button type="button" class="btn ghost" id="rf" style="margin-top:12px">' + esc(t('refresh')) + '</button>');
      document.getElementById('rf').onclick = function () { ret = ''; try { history.replaceState(null, '', location.pathname + '?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(token) + '&lang=' + lang); } catch (_) {} load(); };
      return;
    }
    var late = r.state === 'overdue';
    if (ret === 'cancel') html += '<div class="card note" role="status"><p>' + esc(t('cancelled')) + '</p></div>';
    var per = r.periodFrom && r.periodTo ? (r.prorated ? T[lang].prorated(day(r.periodFrom), day(r.periodTo)) : T[lang].period(day(r.periodFrom), day(r.periodTo))) : '';
    html += '<div class="card"><div class="amount">' + eur(r.amount) + '</div>' + (r.parts ? '<p class="parts">' + esc(T[lang].parts(eur(r.parts.rent), eur(r.parts.oneri))) + '</p>' : '') +
      (per ? '<p class="period">' + esc(per) + '</p>' : '') +
      (r.dueDate ? '<p class="due' + (late ? ' is-late' : '') + '">' + esc((late ? t('late') : t('due')) + ' ' + day(r.dueDate)) + '</p>' : '') + '</div>';
    var card = r.card || {};
    // La carta solo se il contratto la consente: spenta, la pagina parla
    // solo del bonifico (nessun cenno alla carta).
    if (payUrl && card.available) {
      var fee = card.fee > 0;
      html += '<a class="btn" id="card" href="' + esc(payUrl + '&lang=' + lang) + '">' + esc(t('card')) + '</a><p class="hint">' +
        esc((fee ? T[lang].cardFee(eur(r.amount), eur(card.fee)) + ' ' : card.feeMode === 'absorbed' ? t('cardNoFee') + ' ' : '') + t('cardHint') +
          (card.onBehalfOf ? ' ' + T[lang].onBehalf(card.onBehalfOf) : '')) + '</p>';
      html += '<div class="or">' + esc(t('or')) + '</div>';
    }
    html += bankCard();
    if (!form) {
      html += '<button type="button" class="btn ghost" id="bank">' + esc(t('already')) + '</button>';
      app.innerHTML = html; bindCopy();
      document.getElementById('bank').onclick = function () { form = true; render(); var d = document.getElementById('dt'); if (d) d.focus(); };
      return;
    }
    html += reportForm();
    app.innerHTML = html;
    bindAll();
  }
  function bindCopy() { [].forEach.call(app.querySelectorAll('[data-copy]'), function (btn) { btn.onclick = function () { copy(btn); }; }); }
  function bindAll() { bindCopy(); bindForm(); }
  function copy(btn) {
    var v = btn.getAttribute('data-copy'), done = function () { btn.textContent = t('copied'); setTimeout(function () { btn.textContent = t('copy'); }, 1600); };
    try { navigator.clipboard.writeText(v).then(done, function () { window.prompt('', v); }); } catch (_) { window.prompt('', v); }
  }
  function fail(msg) { var er = document.getElementById('err'); if (er) er.textContent = msg; }
  // La foto si riduce SUL TELEFONO (1600px, JPEG); un PDF sale com'è fino a 3 MB.
  function readProof(file) {
    if (file.type === 'application/pdf') {
      if (file.size > 3 * 1024 * 1024) { proof = null; render(); fail(t('proofBig')); return; }
      var fr = new FileReader();
      fr.onload = function () { proof = { base64: String(fr.result).split(',')[1], type: 'application/pdf', name: file.name }; render(); };
      fr.onerror = function () { proof = null; render(); fail(t('proofBad')); };
      fr.readAsDataURL(file); return;
    }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(url);
      proof = { base64: data.split(',')[1], type: 'image/jpeg', name: (file.name || 'ricevuta').replace(/\.[^.]+$/, '') + '.jpg', preview: data };
      render();
    };
    img.onerror = function () { URL.revokeObjectURL(url); proof = null; render(); fail(t('proofBad')); };
    img.src = url;
  }
  function submit(e) {
    e.preventDefault();
    var f = e.target, btn = document.getElementById('send');
    btn.disabled = true; btn.textContent = t('sending'); fail('');
    api({ op: 'report', date: draft.date || today(), note: draft.note, company: f.company.value, proof: proof ? { base64: proof.base64, type: proof.type, name: proof.name } : null })
      .then(function (j) {
        if (j.ok) { after = { proof: !!j.proof, proofFailed: !!j.proofFailed }; proof = null; form = false; draft = { date: '', note: '' }; return load(); }
        btn.disabled = false; btn.textContent = t('report');
        fail(j.status === 429 ? t('rate') : j.error === 'bad_proof' ? t('proofBad') : j.error === 'bad_date' ? t('badDate') : j.error === 'too_many_reports' ? t('tooMany')
          : j.error === 'card_completed' ? t('cardDone') : j.error === 'state_changed' ? t('changed') : j.error === 'invalid_link' ? t('invalid') : t('fail'));
      }, function () { btn.disabled = false; btn.textContent = t('report'); fail(t('fail')); });
  }
  function withdraw() {
    var btn = document.getElementById('wd'); btn.disabled = true;
    api({ op: 'withdraw' }).then(function (j) {
      if (j.ok) { after = null; form = false; return load(); }
      btn.disabled = false; fail(j.error === 'state_changed' ? t('changed') : t('fail'));
    }, function () { btn.disabled = false; fail(t('fail')); });
  }
  function load() {
    return api({ op: 'lookup' }).then(function (j) {
      if (!j.ok) { state = j.status === 404 ? 'invalid' : 'offline'; render(); return; }
      rata = j.rata; payUrl = j.payUrl || ''; state = 'ok'; render();
      window.scrollTo(0, 0);
    }, function () { state = 'offline'; render(); });
  }
  [].forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.onclick = function () { setLang(b.getAttribute('data-lang')); }; });
  setLang(lang);
  if (!id || !token) { state = 'invalid'; render(); return; }
  load();
})();
</script>
