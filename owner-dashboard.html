/* ═══════════════════════════════════════════════════════════════════
   L'AREA PROPRIETARIO — /owner. Studio: STUDIO_AREA_PROPRIETARIO.md.
   Una domanda in testa («devo fare qualcosa?»), poi cosa è cambiato, i
   soldi, le case, la cassaforte dei documenti. Tutto REALE: una chiamata a
   /api/owners/vault che applica js/owner-vault-engine.js; ?demo=1 = la
   stessa pagina sullo stesso motore con dati d'esempio dichiarati.
   Il "3D" è CSS + SVG (emblemi coniati, carte che si inclinano): zero
   librerie, zero WebGL. Ogni movimento si spegne con reduced-motion.
   ═══════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --void:#050506;--panel:rgba(255,255,255,.022);
  --gold:#D4AF37;--gold-light:#F1DFA0;--gold-deep:#8A6D1D;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.055);--line-gold:rgba(212,175,55,.32);
  --gold-muted:rgba(212,175,55,.12);--gold-faint:rgba(212,175,55,.05);
  --t1:#FFF;--t2:rgba(255,255,255,.74);--t3:rgba(255,255,255,.5);--t4:rgba(255,255,255,.3);
  --green:#4ADE9E;--late:#E5484D;--red:#FF8A80;--warn:#E8B04B;--blue:#9DC3FF;--wa:#25D366;
  --sans:'Helvetica Neue',Helvetica,'Inter',-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.2,1.35,.4,1);
  --safe:env(safe-area-inset-bottom,0px);--r:20px}
html{scroll-behavior:smooth;scroll-padding-top:86px}
body{font-family:var(--sans);background:var(--void);color:var(--t1);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;font-weight:inherit}
a{color:inherit}
::selection{background:rgba(212,175,55,.3)}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── fondo ── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .grid{position:absolute;inset:-2px;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:34px 34px;-webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%);mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%)}
.bg .aur{position:absolute;width:120vmax;height:120vmax;border-radius:50%;filter:blur(90px);opacity:.5}
.bg .aur.a{left:-46vmax;top:-72vmax;background:radial-gradient(circle,rgba(212,175,55,.12),transparent 58%)}
.bg .aur.b{right:-58vmax;bottom:-74vmax;background:radial-gradient(circle,rgba(90,110,150,.10),transparent 58%)}
.bg .vign{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 34%,transparent 50%,rgba(0,0,0,.62) 100%)}
@media(prefers-reduced-motion:no-preference){
  .bg .aur.a{animation:aurA 46s var(--ease) infinite alternate}
  .bg .aur.b{animation:aurB 58s var(--ease) infinite alternate}
  @keyframes aurA{to{transform:translate(9vmax,7vmax) scale(1.12)}}
  @keyframes aurB{to{transform:translate(-8vmax,-6vmax) scale(1.08)}}
}

/* ── testata ── */
header{position:sticky;top:0;z-index:50;background:rgba(5,5,6,.72);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 18px;max-width:1180px;margin:0 auto}
.hl{font-size:9px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:10px;justify-self:center;text-decoration:none}
.brand .mark{filter:drop-shadow(0 0 10px rgba(212,175,55,.35))}
.brand b{font-weight:300;letter-spacing:6px;font-size:14px}
.hact{justify-self:end;display:flex;gap:14px;align-items:center}
.hout{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);transition:color .25s;min-height:34px}
.hout:hover{color:var(--gold)}

/* ── nastro demo ── */
.demo-rib{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:45;display:flex;align-items:center;justify-content:center;gap:10px 14px;flex-wrap:wrap;padding:9px 16px;background:linear-gradient(90deg,rgba(212,175,55,.16),rgba(212,175,55,.08));border-bottom:1px solid var(--line-gold);font-size:11.5px;color:var(--gold-light);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.demo-rib b{font-weight:400;letter-spacing:1.6px;text-transform:uppercase;font-size:9.5px}
.demo-rib a{display:inline-flex;align-items:center;gap:6px;color:#1a1407;background:linear-gradient(180deg,var(--gold-light),var(--gold));border-radius:100px;padding:5px 13px;font-weight:500;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;text-decoration:none}

main{position:relative;z-index:5;max-width:760px;margin:0 auto;padding:22px 16px calc(110px + var(--safe))}

/* ── scheletro di caricamento ── */
.load{padding:8px 0}
.load .lm{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--t3);letter-spacing:.3px;margin-bottom:22px}
.load .lm svg{color:var(--gold)}
.sk{border-radius:14px;background:linear-gradient(100deg,rgba(255,255,255,.03) 30%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 70%);background-size:300% 100%}
.sk.l1{height:12px;width:38%}.sk.l2{height:38px;width:72%;margin-top:14px}.sk.l3{height:56px;margin-top:20px;border-radius:100px}
.sk.b1{height:210px;margin-top:22px;border-radius:var(--r)}.sk.b2{height:150px;margin-top:16px;border-radius:var(--r)}
@media(prefers-reduced-motion:no-preference){.sk{animation:shim 1.6s linear infinite}@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
  .load .lm svg{animation:breath 2.6s var(--ease) infinite}@keyframes breath{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1}}}

/* ── tipografia ── */
.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:400}
h1.big{font-weight:200;font-size:clamp(30px,7.6vw,44px);letter-spacing:-.8px;line-height:1.08;margin:10px 0 0}
h1.big em{font-style:normal;font-weight:300;background:linear-gradient(180deg,#FFF3C4,var(--gold-light) 35%,var(--gold) 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.empty{font-size:13px;color:var(--t3);line-height:1.7}

/* ═══ EMBLEMI — il badge "3D": medaglione coniato, CSS puro ═══ */
.emb{--rx:0deg;--ry:0deg;--mx:32%;--my:18%;flex:none;display:inline-block;width:44px;height:44px;perspective:520px}
.emb-f{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:14px;color:var(--gold-light);
  transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .55s var(--ease);
  background:radial-gradient(130% 95% at var(--mx) var(--my),rgba(255,232,160,.24),transparent 52%),linear-gradient(158deg,#221d12 0%,#0f0d09 52%,#060605 100%);
  box-shadow:inset 0 1px 0 rgba(255,240,200,.34),inset 0 -1px 0 rgba(0,0,0,.7),inset 0 0 0 1px rgba(212,175,55,.6),0 12px 24px -12px rgba(212,175,55,.5),0 3px 9px rgba(0,0,0,.6)}
.emb-f::before{content:"";position:absolute;inset:3.5px;border-radius:10.5px;box-shadow:inset 0 0 0 1px rgba(212,175,55,.2),inset 0 3px 6px rgba(0,0,0,.55);pointer-events:none}
.emb-f::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(112deg,transparent 34%,rgba(255,250,232,.32) 47%,transparent 58%);background-size:260% 100%;background-position:130% 0;mix-blend-mode:screen}
.emb svg{width:50%;height:50%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transform:translateZ(10px);filter:drop-shadow(0 1px 0 rgba(0,0,0,.85)) drop-shadow(0 0 7px rgba(212,175,55,.4))}
.emb.gold .emb-f{color:#2b1f05;background:radial-gradient(120% 90% at var(--mx) var(--my),#FFF7D6 0%,rgba(255,247,214,0) 46%),linear-gradient(158deg,#F7E5A6 0%,#DBB648 36%,#AC8620 70%,#6E520F 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 3px rgba(80,55,0,.6),inset 0 0 0 1px rgba(255,240,190,.5),0 14px 30px -12px rgba(212,175,55,.85),0 3px 9px rgba(0,0,0,.6)}
.emb.gold .emb-f::before{box-shadow:inset 0 0 0 1px rgba(110,82,15,.35),inset 0 2px 4px rgba(90,62,0,.35)}
.emb.gold svg{filter:drop-shadow(0 1px 0 rgba(255,246,214,.75))}
.emb.xl{width:60px;height:60px}.emb.xl .emb-f{border-radius:19px}.emb.xl .emb-f::before{border-radius:15px;inset:4.5px}
.emb.sm{width:34px;height:34px}.emb.sm .emb-f{border-radius:11px}.emb.sm .emb-f::before{inset:3px;border-radius:8.5px}
@media(prefers-reduced-motion:no-preference){
  .rv .emb-f{opacity:0;transform:rotateY(-75deg) scale(.84)}
  .rv.in .emb-f{opacity:1;transform:rotateX(var(--rx)) rotateY(var(--ry));animation:mint .75s var(--spring) backwards}
  .rv.in .emb-f::after{animation:sheen 1.2s var(--ease) .45s backwards}
  @keyframes mint{from{opacity:0;transform:rotateY(-75deg) scale(.84)}to{opacity:1;transform:rotateY(0) scale(1)}}
  @keyframes sheen{from{background-position:130% 0}to{background-position:-40% 0}}
}

/* ═══ HOME — griglia ═══ */
.home{display:flex;flex-direction:column}
.home>.lcol,.home>.rcol{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}.o9{order:9}
.hero{padding:6px 2px 0}
.verdict{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:20px;padding:14px 16px;border-radius:18px;border:1px solid var(--line2);background:var(--panel);transition:transform .15s,border-color .25s}
.verdict .vt{flex:1;min-width:0}
.verdict .vt b{display:block;font-weight:400;font-size:16px;letter-spacing:-.1px}
.verdict .vt small{display:block;font-size:12px;color:var(--t3);margin-top:1px}
.verdict .vgo{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-gold);color:var(--gold)}
.orb{position:relative;flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(140,255,200,.5),rgba(74,222,158,.18) 55%,rgba(74,222,158,.05) 70%);box-shadow:0 0 0 1px rgba(74,222,158,.35),0 0 24px rgba(74,222,158,.25)}
.orb svg{width:18px;height:18px;stroke:#CFFFE6;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:0}
.verdict.act{border-color:var(--line-gold);background:linear-gradient(100deg,rgba(212,175,55,.13),rgba(212,175,55,.03))}
.verdict.act .orb{background:radial-gradient(circle at 35% 30%,#FFF1BE,rgba(212,175,55,.45) 50%,rgba(212,175,55,.08) 72%);box-shadow:0 0 0 1px rgba(212,175,55,.55),0 0 26px rgba(212,175,55,.45)}
.verdict.act .orb b{font-weight:500;font-size:15px;color:#2b1f05}
.verdict.act .vt b{color:var(--gold-light)}
button.verdict:active{transform:scale(.985)}
@media(prefers-reduced-motion:no-preference){
  .orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(74,222,158,.35);animation:ring 3.2s var(--ease) infinite}
  .verdict.act .orb::after{border-color:rgba(212,175,55,.55)}
  @keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  .rv.in .orb svg{animation:draw .7s var(--ease) .35s both}
  @keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
}
.since{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--t3)}
.since .sk2{width:100%;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t4)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:100px;padding:6px 12px;font-size:12px;color:var(--t2);background:rgba(255,255,255,.02);transition:border-color .2s,color .2s,transform .12s}
.chip.new{border-color:var(--line-gold);color:var(--gold-light);background:var(--gold-faint)}
.chip.new::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.9)}
button.chip:hover{border-color:var(--gold);color:var(--gold)}
button.chip:active{transform:scale(.96)}

/* ── il polso dei soldi ── */
.pulse{position:relative;margin-top:18px;padding:20px 18px 16px;border-radius:24px;border:1px solid var(--line2);overflow:hidden;
  background:radial-gradient(120% 80% at 0% 0%,rgba(212,175,55,.12),transparent 55%),linear-gradient(180deg,rgba(255,250,235,.04),rgba(255,255,255,.012));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 40px 80px -50px rgba(0,0,0,.9)}
.pulse::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--gold),rgba(212,175,55,.25),transparent 85%)}
.ptop{display:flex;align-items:flex-start;gap:14px}
.ptop .pk{font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t3)}
.pnum{font-weight:200;font-size:clamp(36px,10vw,52px);letter-spacing:-1.4px;line-height:1.02;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pnum .num{background:linear-gradient(180deg,#FFF6D4,var(--gold-light) 30%,var(--gold) 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pnum small{font-size:13px;letter-spacing:.2px;color:var(--t3);margin-left:4px}
.psub{font-size:12px;color:var(--t3);margin-top:5px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;border-top:1px solid var(--line2)}
.tile{display:flex;flex-direction:column;padding:13px 10px 2px 0}
.tile .v{margin-top:auto!important;padding-top:5px}
.tile+.tile{padding-left:12px;border-left:1px solid var(--line2)}
.tile .k{font-size:8.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--t4);line-height:1.4}
.tile .v{font-size:clamp(16px,4.4vw,21px);font-weight:300;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.15;white-space:nowrap}
.tile .v small{font-size:11px;color:var(--t3);letter-spacing:.2px;margin-left:3px}
.tile.bad .v{color:var(--red)}
.tile .ok{font-size:13px;color:var(--green);display:inline-flex;align-items:center;gap:5px}

/* ── il grafico dei canoni (dataviz: stato = colore, in arrivo = cavo) ── */
.chart{position:relative;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2)}
.chart figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t3)}
.bars{position:relative;display:flex;align-items:flex-end;gap:6px;height:112px;margin-top:14px;padding:0 2px;border-bottom:1px solid var(--line)}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.05);pointer-events:none}
.bars::before{top:0}.bars::after{top:50%}
.bc{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.bc .stk{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:22px;border-radius:4px 4px 0 0;overflow:hidden;transform-origin:bottom}
.bc .s{display:block;min-height:2px}
.bc .s.paid{background:linear-gradient(180deg,#F1DFA0,var(--gold) 40%,#B8962C)}
.bc .s.late{background:var(--late)}
.bc .s.due{box-shadow:inset 0 0 0 1.5px rgba(241,223,160,.55);background:repeating-linear-gradient(45deg,rgba(241,223,160,.07) 0 3px,transparent 3px 6px)}
.bc.cur::after{content:"";position:absolute;bottom:-9px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(212,175,55,.9)}
.bc.on .stk{filter:brightness(1.15) drop-shadow(0 0 8px rgba(212,175,55,.35))}
.axis{display:flex;gap:6px;padding:12px 2px 0}
.axis span{flex:1;text-align:center;font-size:9.5px;letter-spacing:.5px;color:var(--t4);text-transform:uppercase}
.axis span.cur{color:var(--gold);font-weight:400}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:11px;color:var(--t3)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.paid{background:var(--gold)}.legend i.late{background:var(--late)}.legend i.due{box-shadow:inset 0 0 0 1.5px rgba(241,223,160,.6)}
.tip{position:absolute;z-index:6;min-width:150px;padding:10px 12px;border-radius:12px;background:rgba(16,15,12,.96);border:1px solid var(--line-gold);box-shadow:0 18px 40px -12px rgba(0,0,0,.9);font-size:12px;color:var(--t2);pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap}
.tip b{display:block;font-weight:400;color:var(--t1);margin-bottom:4px;text-transform:capitalize}
.tip div{display:flex;align-items:center;gap:7px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tip i.paid{background:var(--gold)}.tip i.late{background:var(--late)}.tip i.due{box-shadow:inset 0 0 0 1.5px rgba(241,223,160,.7)}
.tip span{margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums;color:var(--t1)}
@media(prefers-reduced-motion:no-preference){
  .chart .stk{transform:scaleY(0)}
  .chart.in .stk{transform:scaleY(1);transition:transform .75s var(--ease) calc(var(--i) * 40ms)}
}

/* ── carte di sezione ── */
.card{position:relative;margin-top:18px;padding:20px 18px 18px;border:1px solid var(--line2);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,250,235,.032),rgba(255,255,255,.01) 45%);box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 30px 60px -44px rgba(0,0,0,.85)}
.card::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.55),rgba(212,175,55,.1),transparent 80%)}
.card.need{border-color:var(--line-gold);background:radial-gradient(120% 90% at 0% 0%,rgba(212,175,55,.13),transparent 60%),linear-gradient(180deg,rgba(212,175,55,.05),transparent 70%)}
.sh{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.sh .tx{flex:1;min-width:0}
.sh h2{font-size:11px;letter-spacing:2.8px;text-transform:uppercase;color:var(--t1);font-weight:400;line-height:1.3}
.sh p{font-size:12px;color:var(--t3);margin-top:3px;line-height:1.45}
.sh .cnt{flex:none;font-family:var(--mono);font-size:10px;color:var(--t4);border:1px solid var(--line);border-radius:100px;padding:3px 9px}

/* righe: azioni, scadenze */
.miss{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line2)}
.miss:first-of-type{border-top:none;padding-top:2px}
.miss .bd{flex:1;min-width:0}
.miss b{display:block;font-weight:400;font-size:14px}
.miss small{display:block;font-size:12px;color:var(--t3);line-height:1.55;margin-top:2px}
.where{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);opacity:.85;margin-top:4px}
.ev{display:flex;gap:13px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.ev:first-of-type{border-top:none;padding-top:0}
.dchip{flex:none;width:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:center;padding:6px 0 5px;line-height:1}
.dchip b{display:block;font-weight:300;font-size:19px;font-variant-numeric:tabular-nums;color:var(--t1)}
.dchip small{display:block;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-top:3px}
.dchip.ic{display:grid;place-items:center;height:46px;padding:0;color:var(--t2)}
.ev.gold .dchip{border-color:var(--line-gold);color:var(--gold-light);background:var(--gold-faint)}
.ev.warn .dchip{border-color:rgba(232,176,75,.4)}
.ev.warn .dchip b{color:var(--warn)}
.ev.red .dchip{border-color:rgba(229,72,77,.5);color:var(--red);background:rgba(229,72,77,.08)}
.ev .bd{flex:1;min-width:0;padding-top:2px}
.ev b.t{display:block;font-weight:400;font-size:14px;letter-spacing:.1px}
.ev small{display:block;font-size:12px;color:var(--t3);line-height:1.55;margin-top:2px}

/* bottoni */
.gbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#F6E7B4,var(--gold-light) 30%,var(--gold));color:#1a1407;font-weight:500;border-radius:100px;padding:11px 20px;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;text-decoration:none;min-height:44px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 24px -12px rgba(212,175,55,.8);transition:transform .12s,filter .25s;flex:none}
.gbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.gbtn:hover::after{transform:translateX(120%)}
.gbtn:active,.obtn:active{transform:scale(.96)}
.gbtn:disabled{opacity:.55}
.obtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);color:var(--t2);border-radius:100px;padding:10px 18px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;text-decoration:none;min-height:44px;transition:border-color .2s,color .2s,transform .12s;flex:none}
.obtn:hover{border-color:var(--gold);color:var(--gold)}
.obtn.wa{border-color:rgba(37,211,102,.4);color:#7EE6A6}
.obtn.wa:hover{border-color:var(--wa);color:#A8F0C4}
.obtn:disabled{opacity:.5}

/* ── immobili: carte con un volto ── */
.props{display:grid;gap:14px}
.prop{--tx:0deg;--ty:0deg;display:block;text-align:left;width:100%;border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012));transition:transform .45s var(--ease),border-color .3s,box-shadow .3s;transform:perspective(1000px) rotateX(var(--tx)) rotateY(var(--ty))}
.prop:hover{border-color:var(--line-gold);box-shadow:0 24px 50px -28px rgba(212,175,55,.35)}
.prop:active{transform:perspective(1000px) scale(.985)}
.cov{position:relative;aspect-ratio:16/7.2;overflow:hidden;background:#0b0a08}
.cov img,.cov svg.fac{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.prop:hover .cov img,.prop:hover .cov svg.fac{transform:scale(1.04)}
.cov::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(5,5,6,.75));pointer-events:none}
.cov>.st{position:absolute;top:12px;left:12px;z-index:2}
.cov>.nw{position:absolute;top:12px;right:12px;z-index:2}
.phero .cap .st{margin-bottom:2px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;border-radius:100px;padding:5px 11px;border:1px solid var(--line);color:var(--t2);background:rgba(5,5,6,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.occupied{color:var(--green);border-color:rgba(74,222,158,.4)}
.st.ending,.st.signing{color:var(--gold-light);border-color:var(--line-gold)}
.st.incoming{color:var(--blue);border-color:rgba(157,195,255,.4)}
.st.free{color:var(--t2)}
.nw{display:inline-flex;align-items:center;gap:6px;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:#1a1407;background:linear-gradient(180deg,var(--gold-light),var(--gold));border-radius:100px;padding:4px 9px;font-weight:500;flex:none}
.pb{padding:14px 16px 15px}
.prop .nm{display:block;font-size:16.5px;font-weight:400;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop .sub{font-size:12px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop .facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--t3)}
.prop .facts b{font-weight:400;color:var(--t1);font-variant-numeric:tabular-nums}
.pfoot{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--t3)}
.pfoot .df{display:inline-flex;align-items:center;gap:8px}
.pfoot .red{color:var(--red)}
.pfoot .go{margin-left:auto;color:var(--gold);display:inline-flex;transition:transform .25s var(--ease)}
.prop:hover .pfoot .go{transform:translateX(3px)}

/* anello del fascicolo */
.ring{--p:0;--c:62.83;position:relative;flex:none;width:26px;height:26px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg2{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:calc(var(--c) * (1 - var(--p)));transition:stroke-dashoffset 1.1s var(--ease)}
.ring.full .fg{stroke:var(--green)}
.ring.big{width:74px;height:74px}
.ring.big circle{stroke-width:5}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:19px;font-variant-numeric:tabular-nums}
.ring b small{font-size:11px;color:var(--t3);margin:5px 0 0 1px}

/* ── dettaglio immobile ── */
.back{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:12px;min-height:38px;transition:color .2s}
.back:hover{color:var(--gold)}
.phero{border-radius:22px;overflow:hidden;border:1px solid var(--line2)}
.phero .cov{aspect-ratio:16/8}
.phero .cov::after{background:linear-gradient(180deg,transparent 30%,rgba(5,5,6,.92))}
.phero .cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:2}
.phero h1.big{font-size:clamp(26px,7vw,40px);margin:8px 0 0}
.phero .addr{font-size:12.5px;color:var(--t2);margin-top:4px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line2);border-radius:14px;overflow:hidden;border:1px solid var(--line2)}
.kv div{background:#08080A;padding:11px 13px}
.kv div span{display:block;font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t4)}
.kv div b{display:block;font-weight:400;font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv div b.ok{color:var(--green)}
.kv div b.wait{color:var(--gold-light)}
.prow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line2);font-size:13px}
.prow:first-child{border-top:none}
.prow .mo{flex:1;color:var(--t2);text-transform:capitalize}
.prow .mo small{display:block;font-size:10.5px;color:var(--t4);text-transform:none}
.prow .amt2{font-variant-numeric:tabular-nums;font-weight:400;flex:none}
.pst{display:inline-flex;align-items:center;gap:6px;font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;border-radius:100px;padding:4px 9px;flex:none;border:1px solid var(--line);color:var(--t3)}
.pst::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pst.paid{color:var(--green);border-color:rgba(74,222,158,.35)}
.pst.overdue{color:var(--red);border-color:rgba(229,72,77,.5)}
.pst.reported,.pst.processing,.pst.due{color:var(--gold-light);border-color:var(--line-gold)}
.more{display:block;width:100%;margin-top:8px;padding:11px;border-radius:12px;border:1px dashed var(--line);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);transition:color .2s,border-color .2s}
.more:hover{color:var(--gold);border-color:var(--line-gold)}

/* fascicolo dell'immobile */
.dossier{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.dossier .dt b{display:block;font-weight:400;font-size:15px}
.dossier .dt small{display:block;font-size:12px;color:var(--t3);margin-top:2px;line-height:1.5}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.slot{position:relative;display:flex;flex-direction:column;gap:8px;padding:13px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.02);min-height:104px;transition:border-color .3s,background .3s}
.slot .sl{display:flex;align-items:center;gap:9px;font-size:13px}
.slot .sl svg{color:var(--t3)}
.slot small{font-size:11px;color:var(--t3);line-height:1.45}
.slot.ok{border-color:rgba(74,222,158,.28);background:linear-gradient(180deg,rgba(74,222,158,.06),transparent)}
.slot.ok .sl svg{color:var(--green)}
.slot.urgent{border-color:var(--line-gold);background:var(--gold-faint)}
.slot .gbtn,.slot .obtn{margin-top:auto;min-height:38px;padding:8px 14px;font-size:9.5px;align-self:flex-start}
.slot.just{animation:pop .7s var(--spring)}
@keyframes pop{0%{transform:scale(.94)}100%{transform:scale(1)}}
.spark{position:fixed;z-index:200;width:7px;height:7px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#FFF6D2,var(--gold));box-shadow:0 0 10px rgba(212,175,55,.9)}

/* documenti */
.dsearch-w{position:relative}
.dsearch-w svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t4)}
.dsearch{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:100px;padding:12px 16px 12px 42px;color:var(--t1);font-family:inherit;font-size:16px;font-weight:300;outline:none;transition:border-color .2s}
.dsearch:focus{border-color:var(--line-gold)}
.tabs{display:flex;gap:7px;overflow-x:auto;margin:12px -18px 4px;padding:0 18px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:100px;padding:7px 13px;font-size:11.5px;color:var(--t3);transition:color .2s,border-color .2s,background .2s}
.tab span{font-family:var(--mono);font-size:10px;color:var(--t4)}
.tab[aria-pressed="true"]{color:#1a1407;background:linear-gradient(180deg,var(--gold-light),var(--gold));border-color:transparent}
.tab[aria-pressed="true"] span{color:rgba(26,20,7,.6)}
.tab.new:not([aria-pressed="true"]){border-color:var(--line-gold);color:var(--gold-light)}
.folder{margin-top:16px}
.folder:first-child{margin-top:0}
.fh{display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.fh span{font-family:var(--mono);color:var(--t4);letter-spacing:.5px}
.dlink{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line2);font-size:13.5px;color:var(--t2);text-decoration:none;transition:color .2s,padding .25s var(--ease);min-height:54px}
.dlink:hover{color:var(--t1);padding-left:6px}
.dlink .ic{position:relative;width:36px;height:36px;border-radius:11px;border:1px solid var(--line-gold);background:linear-gradient(160deg,rgba(212,175,55,.12),rgba(212,175,55,.02));display:grid;place-items:center;flex:none;color:var(--gold-light)}
.dlink .tx{flex:1;min-width:0}
.dlink .ic.new::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2.5px #0b0b0a,0 0 10px rgba(212,175,55,.9)}
.dlink small em{font-style:normal;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase;font-size:9.5px;margin-right:6px}
.dlink .tx b{display:block;font-weight:400;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlink small{display:block;font-size:11px;color:var(--t4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlink .go{margin-left:auto;color:var(--t4);flex:none;display:inline-flex;transition:color .2s,transform .25s var(--ease)}
.dlink:hover .go{color:var(--gold);transform:translate(2px,-2px)}
.lockn{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;font-size:12px;color:var(--t3);line-height:1.6}
.lockn svg{color:var(--t4);margin-top:1px}

/* storia */
.hist{position:relative;padding-left:22px}
.hist::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:linear-gradient(180deg,var(--gold),rgba(212,175,55,.15));transform-origin:top}
.hi{position:relative;padding:5px 0 12px}
.hi::before{content:"";position:absolute;left:-22px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--gold),0 0 10px rgba(212,175,55,.35)}
.hi:first-child::before{background:var(--gold)}
.hi b{display:block;font-weight:400;font-size:13.5px}
.hi small{font-size:11px;color:var(--t4);font-variant-numeric:tabular-nums}
.hi .nw{margin-left:8px;vertical-align:2px}
@media(prefers-reduced-motion:no-preference){
  .rv .hist::before{transform:scaleY(0)}
  .rv.in .hist::before{transform:scaleY(1);transition:transform 1.1s var(--ease) .2s}
  .rv .hi{opacity:0;transform:translateX(-6px)}
  .rv.in .hi{opacity:1;transform:none;transition:opacity .5s var(--ease) calc(.25s + var(--i) * 70ms),transform .5s var(--ease) calc(.25s + var(--i) * 70ms)}
}

/* contatto */
.talk{display:flex;align-items:center;gap:14px}
.talk .av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-gold);background:radial-gradient(circle at 35% 30%,rgba(212,175,55,.25),rgba(212,175,55,.04));color:var(--gold)}
.talk p{font-size:13px;color:var(--t2);line-height:1.55}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* fine demo */
.cta-end{margin-top:22px;padding:26px 20px;border-radius:24px;text-align:center;border:1px solid var(--line-gold);background:radial-gradient(100% 120% at 50% 0%,rgba(212,175,55,.18),transparent 65%)}
.cta-end h2{font-weight:200;font-size:clamp(24px,6vw,34px);letter-spacing:-.5px;line-height:1.15;margin-top:12px}
.cta-end p{font-size:13.5px;color:var(--t2);max-width:440px;margin:10px auto 0;line-height:1.65}
.cta-end .contact{justify-content:center}

.adminview{position:sticky;top:64px;z-index:45;margin:0 0 16px;border:1px solid rgba(212,175,55,.5);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.08));border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.55;color:var(--gold-light);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.foot{text-align:center;font-size:10px;letter-spacing:1px;color:var(--t4);margin-top:40px;line-height:1.8}

/* ── dock (telefono) ── */
.dock{position:fixed;left:50%;bottom:calc(12px + var(--safe));z-index:60;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:22px;background:rgba(14,13,11,.78);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 20px 50px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06)}
.dock a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:66px;padding:7px 8px 6px;border-radius:16px;text-decoration:none;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);transition:color .25s,transform .12s}
.dock a svg{width:20px;height:20px}
.dock a[aria-current="true"]{color:var(--gold-light)}
.dock a:active{transform:scale(.92)}
.dock .pill{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;border-radius:16px;background:linear-gradient(180deg,rgba(212,175,55,.2),rgba(212,175,55,.07));box-shadow:inset 0 0 0 1px rgba(212,175,55,.35);transition:transform .45s var(--spring),width .45s var(--spring)}
@media(min-width:761px){.dock{display:none}}

/* ── attivazione ── */
.actbox{max-width:440px;margin:26px auto 0;text-align:left}
.actbox .emb{margin-bottom:16px}
.steps{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--t4)}
.steps span{display:inline-flex;align-items:center;gap:7px}
.steps i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-style:normal;font-family:var(--mono);font-size:10px}
.steps .on{color:var(--gold-light)}
.steps .on i{border-color:var(--gold);color:#1a1407;background:var(--gold)}
.steps .ln{flex:1;height:1px;background:var(--line)}
.fld{display:block;margin-top:14px;position:relative}
.fld span{display:block;font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--t4);margin-bottom:6px}
.fld input{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px 48px 14px 14px;color:var(--t1);font-family:inherit;font-size:16px;font-weight:300;outline:none;transition:border-color .2s}
.fld input:focus{border-color:var(--line-gold)}
.fld input[readonly]{color:var(--t2)}
.eye{position:absolute;right:6px;bottom:6px;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--t3)}
.eye:hover{color:var(--gold)}
.meter{display:flex;gap:5px;margin-top:9px}
.meter i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .3s}
.meter.s1 i:nth-child(-n+1){background:var(--late)}
.meter.s2 i:nth-child(-n+2){background:var(--warn)}
.meter.s3 i:nth-child(-n+3){background:var(--gold)}
.meter.s4 i{background:var(--green)}
.mlab{font-size:11px;color:var(--t3);margin-top:5px;min-height:1.2em}
.msg{margin-top:12px;font-size:12.5px;line-height:1.6;color:var(--t3);min-height:1em}
.msg.err{color:var(--red)}
.gbtn.full{width:100%;margin-top:18px;padding:15px}
.okseal{text-align:center;padding:40px 0}
.okseal p{margin-top:16px;font-size:15px;color:var(--gold-light)}

/* ── entrate ── */
.rv{opacity:0;transform:translateY(10px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.vt-now .rv,.vt-now .rv .emb-f,.vt-now .rv .emb-f::after,.vt-now .chart .stk,.vt-now .ring .fg,.vt-now .hist::before,.vt-now .hi{transition:none!important;animation:none!important}

/* ── desktop ── */
@media(min-width:1100px){
  main{max-width:1180px;padding:34px 42px calc(90px + var(--safe))}
  h1.big{font-size:50px}
  .home{display:grid;grid-template-columns:minmax(0,1fr) 452px;gap:0 32px;align-items:start}
  .home>.lcol,.home>.rcol{display:block}
  .home .hero{padding-top:18px}
  .rcol>.pulse:first-child{margin-top:0}
  .props{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 452px;gap:0 32px;align-items:start}
  .card{padding:24px 22px 22px}
  .phero .cov{aspect-ratio:16/5.6}
  .phero .cap{left:26px;bottom:22px}
  .slots{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tabs{margin:12px -22px 4px;padding:0 22px 4px}
  .cols .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){.hl{visibility:hidden}.demo-rib{flex-wrap:nowrap;justify-content:space-between;padding:8px 16px}.demo-rib .rs{display:none}}
@media(max-width:420px){.miss{flex-wrap:wrap}.miss .gbtn,.miss .obtn{margin-left:0}.tile .k{letter-spacing:1.2px}}

var t=function(k){var o=S[LANG];k.split('.').forEach(function(p){o=o==null?o:o[p]});return o==null?k:o};
var fill=function(s,v){return String(s).replace(/\{(\w+)\}/g,function(_,k){return v&&v[k]!=null?v[k]:''})};
var eur=function(n){var v=Math.round((Number(n)||0)*100)/100;var p=v.toFixed(v%1?2:0).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,LANG==='it'?'.':',');return '€'+p.join(LANG==='it'?',':'.')};
var dmy=function(iso){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');if(!m)return '';return (+m[3])+' '+t('months')[+m[2]-1].slice(0,3)+' '+m[1]};
var monthLabel=function(ym){var m=/^(\d{4})-(\d{2})$/.exec(ym||'');return m?t('months')[+m[2]-1]+' '+m[1]:ym};
var waLink=function(extra){var n=(DATA&&DATA.owner&&DATA.owner.name)||'';return 'https://wa.me/'+WA+'?text='+encodeURIComponent(fill(t('waText'),{name:n})+(extra?' — '+extra:''))};

function loadScripts(list){return new Promise(function(res){var left=list.length;list.forEach(function(src){var s=document.createElement('script');s.src=src;s.async=false;s.onload=s.onerror=function(){if(--left===0)res()};document.head.appendChild(s)})})}
var FB=null;
function firebaseReady(){if(!FB)FB=loadScripts(['https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js','https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js','https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js','/js/firebase-config.js']);return FB}

/* ── rete: ogni chiamata ha un tetto (una promessa appesa è un loader eterno) ── */
function api(path,opts){
  var ctl=('AbortController' in window)?new AbortController():null;
  var tm=setTimeout(function(){if(ctl)ctl.abort()},20000);
  return fetch(path,Object.assign({signal:ctl?ctl.signal:undefined},opts||{})).then(function(r){
    clearTimeout(tm);return r.json().catch(function(){return{}}).then(function(b){b.__status=r.status;return b});
  },function(e){clearTimeout(tm);return{ok:false,error:'network',__status:0}});
}
function authed(path,opts){
  return USER.getIdToken().then(function(tok){
    var o=Object.assign({},opts||{});o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers||{});
    return api(path,o);
  });
}

function countUp(root){
  [].forEach.call(root.querySelectorAll('.num[data-n]:not([data-done])'),function(el){
    el.setAttribute('data-done','1');
    var end=Number(el.getAttribute('data-n'))||0;
    if(RM||INSTANT||document.hidden||end<=0)return;
    var t0=null,D=950;
    var step=function(ts){if(t0==null)t0=ts;var k=Math.min(1,(ts-t0)/D),e=k===1?1:1-Math.pow(2,-10*k);el.textContent=eur(k===1?end:Math.round(end*e));if(k<1)requestAnimationFrame(step)};
    el.textContent=eur(0);requestAnimationFrame(step);
    setTimeout(function(){el.textContent=eur(end)},D+500);
  });
}
function fillRings(root){[].forEach.call(root.querySelectorAll('.ring[data-p]'),function(r){var v=r.getAttribute('data-p');if(RM||INSTANT){r.style.setProperty('--p',v);return}requestAnimationFrame(function(){requestAnimationFrame(function(){r.style.setProperty('--p',v)})})})}
function show(e){
  if(e.classList.contains('in'))return;
  e.classList.add('in');countUp(e);fillRings(e);
  [].forEach.call(e.querySelectorAll('.chart'),function(c){c.classList.add('in')});
}
var IO=null;
function reveal(){
  var els=[].slice.call(document.querySelectorAll('#app .rv'));
  if(IO)IO.disconnect();
  if(!('IntersectionObserver' in window)||RM||document.hidden){els.forEach(show);return}
  IO=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){show(en.target);IO.unobserve(en.target)}})},{threshold:.05});
  var vis=0;
  els.forEach(function(e){
    var r=e.getBoundingClientRect();
    if(r.top<innerHeight&&r.bottom>0){e.style.transitionDelay=INSTANT?'0ms':Math.min(vis++,5)*70+'ms';show(e)}
    else{e.style.transitionDelay='0ms';IO.observe(e)}
  });
}

/* ── il caricamento riuscito si SENTE: scintille + anello che avanza ── */
function burst(el){
  if(RM||!el||!el.animate)return;
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(var i=0;i<18;i++)(function(i){
    var s=document.createElement('span');s.className='spark';s.style.left=cx+'px';s.style.top=cy+'px';document.body.appendChild(s);
    var a=Math.PI*2*i/18+Math.random()*.35,d=44+Math.random()*64,dx=Math.cos(a)*d,dy=Math.sin(a)*d;
    var an=s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(.15)',opacity:0}],{duration:620+Math.random()*260,easing:'cubic-bezier(.16,1,.3,1)'});
    an.onfinish=function(){s.remove()};
  })(i);
}

/* ── il "3D": emblemi e carte seguono il puntatore (solo mouse, mai con reduced-motion) ── */
var TILT=null,TRAF=0;
function untilt(el){if(!el)return;el.style.removeProperty('--tx');el.style.removeProperty('--ty');var e=el.querySelector('.emb');if(e)['--rx','--ry','--mx','--my'].forEach(function(k){e.style.removeProperty(k)})}
if(FINE&&!RM){
  document.addEventListener('pointermove',function(ev){
    var el=ev.target&&ev.target.closest?ev.target.closest('.card,.prop,.pulse,.cta-end,.actbox'):null;
    if(el!==TILT){untilt(TILT);TILT=el}
    if(!el||TRAF)return;
    var x=ev.clientX,y=ev.clientY;
    TRAF=requestAnimationFrame(function(){TRAF=0;if(TILT!==el)return;
      var r=el.getBoundingClientRect(),px=Math.max(0,Math.min(1,(x-r.left)/r.width)),py=Math.max(0,Math.min(1,(y-r.top)/r.height)),e=el.querySelector('.emb');
      if(e){e.style.setProperty('--ry',((px-.5)*24).toFixed(1)+'deg');e.style.setProperty('--rx',(-(py-.5)*20).toFixed(1)+'deg');e.style.setProperty('--mx',Math.round(px*100)+'%');e.style.setProperty('--my',Math.round(py*100)+'%')}
      if(el.classList.contains('prop')){el.style.setProperty('--ty',((px-.5)*6).toFixed(2)+'deg');el.style.setProperty('--tx',(-(py-.5)*5).toFixed(2)+'deg')}
    });
  },{passive:true});
  document.addEventListener('pointerleave',function(){untilt(TILT);TILT=null});
}

function dockSet(id){
  if(id===DOCK_ON)return;DOCK_ON=id;
  var d=$('dock'),pill=$('dpill');if(!pill)return;
  [].forEach.call(d.querySelectorAll('[data-dock]'),function(a){a.setAttribute('aria-current',a.getAttribute('data-dock')===id?'true':'false')});
  var a=d.querySelector('[data-dock="'+id+'"]');if(a){pill.style.width=a.offsetWidth+'px';pill.style.transform='translateX('+(a.offsetLeft-6)+'px)'}
}
function spy(){
  if(VIEW!=='home'||$('dock').hidden)return;
  var cut=innerHeight*.42,on='top';
  ['s-props','s-docs'].forEach(function(id){var el=$(id);if(el&&el.getBoundingClientRect().top<cut)on=id});
  dockSet(on);
}
var SRAF=0;window.addEventListener('scroll',function(){if(!SRAF)SRAF=requestAnimationFrame(function(){SRAF=0;spy()})},{passive:true});
function jump(id){
  if(id==='top'){window.scrollTo({top:0,behavior:RM?'auto':'smooth'});return}
  var el=$(id);if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});

function wire(){
  [].forEach.call(document.querySelectorAll('[data-prop]'),function(b){b.onclick=function(){go('p:'+b.getAttribute('data-prop'))}});
  [].forEach.call(document.querySelectorAll('[data-home]'),function(b){b.onclick=function(){go('home')}});
  [].forEach.call(document.querySelectorAll('[data-jump]'),function(b){b.onclick=function(){jump(b.getAttribute('data-jump'))}});
  [].forEach.call(document.querySelectorAll('[data-dock]'),function(a){a.onclick=function(ev){ev.preventDefault();var id=a.getAttribute('data-dock');dockSet(id);jump(id)}});
  [].forEach.call(document.querySelectorAll('[data-up]'),function(b){b.onclick=function(){var v=b.getAttribute('data-up').split('|');UPL={pid:v[0],slot:v[1],btn:b};
    if(DEMO){demoUpload();return}
    $('upl').value='';$('upl').click()}});
  var s=$('dsearch');if(s)s.oninput=function(){FILTER=s.value;SHOWALL=false;$('dres').innerHTML=docResults()};
  var app=$('app');
  app.onclick=function(ev){
    var tb=ev.target.closest&&ev.target.closest('[data-tab]');
    if(tb){TAB=tb.getAttribute('data-tab');SHOWALL=false;
      [].forEach.call(document.querySelectorAll('.tabs .tab'),function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-tab')===TAB))});
      if($('dres'))$('dres').innerHTML=docResults();
      if(!tb.classList.contains('tab'))jump('s-docs');
      return}
    var mo=ev.target.closest&&ev.target.closest('[data-more]');
    if(mo){SHOWALL=true;if(mo.closest('#dres'))$('dres').innerHTML=docResults();else render(null);return}
    var col=ev.target.closest&&ev.target.closest('.bc');
    if(col){showTip(col);return}
    if(!(ev.target.closest&&ev.target.closest('.chart')))hideTips();
  };
  [].forEach.call(document.querySelectorAll('.bars'),function(b){
    b.onpointerover=function(ev){var c=ev.target.closest('.bc');if(c&&ev.pointerType==='mouse')showTip(c)};
    b.onpointerleave=function(ev){if(ev.pointerType==='mouse')hideTips()};
    b.onfocusin=function(ev){var c=ev.target.closest('.bc');if(c)showTip(c)};
    b.onfocusout=hideTips;
  });
}
function go(v){
  if(VIEW==='home')HOME_Y=window.scrollY;
  try{history.pushState({v:v},'',v==='home'?location.pathname+location.search:'#'+v.replace('p:','immobile/'))}catch(e){}
  transition(v);
}
function transition(v){
  SHOWALL=false;hideTips();
  var y=v==='home'?HOME_Y:0;
  var run=function(){VIEW=v;render(y)};
  if(document.startViewTransition&&!RM){
    INSTANT=true;document.documentElement.classList.add('vt-now');
    var vt;try{vt=document.startViewTransition(run)}catch(e){run();INSTANT=false;document.documentElement.classList.remove('vt-now');return}
    var done=function(){INSTANT=false;document.documentElement.classList.remove('vt-now')};
    (vt.finished||Promise.resolve()).then(done,done);
  }else run();
}
window.addEventListener('popstate',function(){var hh=location.hash;var v=/^#immobile\//.test(hh)?'p:'+decodeURIComponent(hh.slice(10)):'home';if(DATA&&v!==VIEW)transition(v)});

/* ── caricare un documento dove manca (fascicolo dell'immobile) ── */
function toJpeg(file){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var mx=2200,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,mx/Math.max(w,h));
      var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',.86));};
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u;
  });
}
function asDataUrl(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file)})}
function prevDone(pid){var p=(DATA.vault.properties||[]).filter(function(x){return x.id===pid})[0];return p?dossierOf(p).done:0}
$('upl').onchange=function(){
  var f=this.files&&this.files[0];if(!f||!UPL)return;
  var isImg=/^image\//.test(f.type),isPdf=f.type==='application/pdf';
  if(!isImg&&!isPdf){toast(t('upErr'),{type:'error'});return}
  if(isPdf&&f.size>3.2*1024*1024){toast(t('tooBig'),{type:'warning',duration:9000});return}
  var b=UPL.btn,U=UPL;b.disabled=true;b.textContent=t('uploading');
  (isImg?toJpeg(f):asDataUrl(f)).then(function(data){
    return authed('/api/properties/dossier',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({propertyId:U.pid,slot:U.slot,base64:data,name:f.name,contentType:isImg?'image/jpeg':'application/pdf'})});
  }).then(function(r){
    if(r&&r.ok){toast(t('uploaded'),{type:'success'});JUST={pid:U.pid,slot:U.slot,prev:prevDone(U.pid)};return load(true)}
    b.disabled=false;b.textContent=t('upload');toast(r&&r.__status===413?t('tooBig'):t('upErr'),{type:'error',duration:8000});
  }).catch(function(){b.disabled=false;b.textContent=t('upload');toast(t('upErr'),{type:'error'})});
};

}
