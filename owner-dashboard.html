/* ═══════════════════════════════════════════════════════════════════
   L'AREA PROPRIETARIO — /owner. La sorella di /casa: stessa stanza
   (vuoto #050506, oro #D4AF37, Helvetica 300, filo d'oro), un altro
   lettore. Il proprietario apre questa pagina per UNA domanda — «devo
   fare qualcosa?» — e la risposta sta in testa, in una riga. Sotto: i
   soldi, le scadenze, gli immobili, e TUTTI i documenti che ha con noi.
   Tutto REALE: una sola chiamata a /api/owners/vault, che applica le
   regole di js/owner-vault-engine.js. Italiano di default, EN a un tocco.
   ═══════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --void:#050506;--panel:rgba(255,255,255,.022);
  --gold:#D4AF37;--gold-light:#F1DFA0;--gold-deep:#8A6D1D;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.05);--line-gold:rgba(212,175,55,.32);
  --gold-muted:rgba(212,175,55,.12);--gold-faint:rgba(212,175,55,.05);
  --t1:#FFF;--t2:rgba(255,255,255,.72);--t3:rgba(255,255,255,.48);--t4:rgba(255,255,255,.28);
  --green:#4ADE9E;--green-muted:rgba(74,222,158,.12);--red:#FF8A70;--red-muted:rgba(255,138,112,.1);--wa:#25D366;
  --sans:'Helvetica Neue',Helvetica,'Inter',-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);--safe:env(safe-area-inset-bottom,0px);--r:18px}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--void);color:var(--t1);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
::selection{background:rgba(212,175,55,.3)}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .grid{position:absolute;inset:-2px;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:34px 34px;-webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%);mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%)}
.bg .aur{position:absolute;width:120vmax;height:120vmax;border-radius:50%;filter:blur(90px);opacity:.45}
.bg .aur.a{left:-46vmax;top:-72vmax;background:radial-gradient(circle,rgba(212,175,55,.10),transparent 58%)}
.bg .aur.b{right:-58vmax;bottom:-74vmax;background:radial-gradient(circle,rgba(90,110,150,.10),transparent 58%)}
.bg .scan,.bg .vign{position:absolute;inset:0}
.bg .vign{background:radial-gradient(130% 100% at 50% 34%,transparent 50%,rgba(0,0,0,.62) 100%)}
@media(prefers-reduced-motion:no-preference){
  .bg .aur.a{animation:aurA 46s var(--ease) infinite alternate}
  .bg .aur.b{animation:aurB 58s var(--ease) infinite alternate}
  @keyframes aurA{to{transform:translate(9vmax,7vmax) scale(1.12)}}
  @keyframes aurB{to{transform:translate(-8vmax,-6vmax) scale(1.08)}}
}

header{position:sticky;top:0;z-index:50;background:rgba(5,5,6,.72);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:13px 20px;max-width:1180px;margin:0 auto}
.hl{font-size:9px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t4)}
.brand{display:flex;align-items:center;gap:10px;justify-self:center;text-decoration:none}
.brand .mark{filter:drop-shadow(0 0 10px rgba(212,175,55,.35))}
.brand b{font-weight:300;letter-spacing:6px;font-size:14px}
.hact{justify-self:end;display:flex;gap:14px;align-items:center}
.hout{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);transition:.25s;min-height:32px}
.hout:hover{color:var(--gold)}

main{position:relative;z-index:5;max-width:760px;margin:0 auto;padding:26px 18px calc(70px + var(--safe))}
.load{text-align:center;padding:110px 20px;color:var(--t3)}
.load .mark{color:var(--gold)}
@media(prefers-reduced-motion:no-preference){.load svg{animation:breath 2.6s var(--ease) infinite}@keyframes breath{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1}}}

.eyebrow{font-size:10px;letter-spacing:3.2px;text-transform:uppercase;color:var(--gold);font-weight:400}
h1.big{font-weight:200;font-size:clamp(27px,6vw,40px);letter-spacing:-.6px;line-height:1.12;margin:10px 0 8px}
h1.big em{font-style:normal;color:var(--gold);font-weight:300}
.verdict{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--t2)}
.verdict i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--green);box-shadow:0 0 12px rgba(74,222,158,.7)}
.verdict.act i{background:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.85)}
.verdict.act{color:var(--gold-light)}
.adminview{position:sticky;top:62px;z-index:45;margin:0 0 16px;border:1px solid rgba(212,175,55,.5);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.08));border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.55;color:var(--gold-light);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

.tiles{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:22px 0 4px;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line2)}
.tiles::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--gold),rgba(212,175,55,.25),transparent 80%)}
.tile{padding:17px 16px 14px}
.tile:nth-child(2n){border-left:1px solid var(--line2)}
.tile:nth-child(n+3){border-top:1px solid var(--line2)}
.tile .k{font-size:8.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--t4)}
.tile .v{font-size:clamp(19px,4.6vw,26px);font-weight:200;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.4px;line-height:1.15}
.tile .v small{font-size:11px;color:var(--t3);letter-spacing:.3px}
.tile.hero .v{background:linear-gradient(180deg,#FFF3C4,var(--gold-light) 30%,var(--gold) 78%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tile.bad .v{color:var(--red)}

.card{margin-top:16px;padding:20px;border:1px solid var(--line2);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,252,240,.03),rgba(255,255,255,.015));position:relative;overflow:hidden}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.5),rgba(212,175,55,.12),transparent 75%)}
.card h2{display:flex;align-items:baseline;gap:11px;margin-bottom:14px}
.card h2 .no{font-family:var(--mono);font-size:9px;color:var(--gold);border:1px solid var(--line-gold);border-radius:6px;padding:3px 7px;background:var(--gold-faint)}
.card h2 .tt{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--t2);font-weight:300}
.card h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);transform:translateY(-3px)}
.card.need{border-color:var(--line-gold);background:linear-gradient(180deg,var(--gold-faint),transparent 70%)}
.empty{font-size:13px;color:var(--t3);line-height:1.7}

/* azioni ed eventi */
.ev{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line2)}
.ev:first-of-type{border-top:none;padding-top:2px}
.ev .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--t4)}
.ev.gold .dot{background:var(--gold);box-shadow:0 0 9px rgba(212,175,55,.6)}
.ev.warn .dot{background:#E8B04B}
.ev.red .dot{background:var(--red)}
.ev .bd{flex:1;min-width:0}
.ev b{display:block;font-weight:400;font-size:14px;letter-spacing:.1px}
.ev small{display:block;font-size:12px;color:var(--t3);line-height:1.6;margin-top:2px}
.ev .where{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--t4);margin-top:3px}
.ev .when{flex:none;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1a1407;font-weight:500;border-radius:100px;padding:11px 20px;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;text-decoration:none;min-height:42px;transition:.25s var(--ease)}
.gbtn:hover{filter:brightness(1.06)}
.gbtn:disabled{opacity:.55}
.obtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;border:1px solid var(--line);color:var(--t2);border-radius:100px;padding:10px 18px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;text-decoration:none;min-height:42px;transition:.2s}
.obtn:hover{border-color:var(--gold);color:var(--gold)}
.obtn.wa{border-color:rgba(37,211,102,.4);color:#7EE6A6}

/* immobili */
.props{display:grid;gap:12px;margin-top:4px}
.prop{display:block;text-align:left;width:100%;border:1px solid var(--line2);border-radius:16px;padding:16px 17px;background:var(--panel);transition:.25s var(--ease)}
.prop:hover{border-color:var(--line-gold);transform:translateY(-1px)}
.prop .top{display:flex;align-items:center;gap:10px}
.prop .nm{flex:1;min-width:0;font-size:15.5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;border-radius:100px;padding:4px 10px;border:1px solid var(--line);color:var(--t3)}
.st.occupied{color:var(--green);border-color:rgba(74,222,158,.35)}
.st.ending,.st.signing{color:var(--gold);border-color:var(--line-gold)}
.st.incoming{color:#9DC3FF;border-color:rgba(157,195,255,.35)}
.prop .sub{font-size:12px;color:var(--t3);margin-top:4px}
.prop .facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;font-size:12px;color:var(--t2)}
.prop .facts span b{font-weight:400;color:var(--t1);font-variant-numeric:tabular-nums}
.prop .facts .red{color:var(--red)}
.prop .facts .soft{color:var(--gold-light);opacity:.8}
.folder.later .miss{padding:10px 0}

/* dettaglio immobile */
.back{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:14px;min-height:36px}
.back:hover{color:var(--gold)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line2);border-radius:12px;overflow:hidden;border:1px solid var(--line2)}
.kv div{background:var(--void);padding:11px 13px}
.kv div span{display:block;font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t4)}
.kv div b{display:block;font-weight:400;font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv div b.ok{color:var(--green)}
.kv div b.wait{color:var(--gold-light)}
.prow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line2);font-size:13px}
.prow:first-child{border-top:none}
.prow .mo{flex:1;color:var(--t2)}
.prow .mo small{display:block;font-size:10.5px;color:var(--t4)}
.prow .amt2{font-variant-numeric:tabular-nums;font-weight:400;flex:none}
.pst{font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;border-radius:100px;padding:3px 9px;flex:none;border:1px solid var(--line);color:var(--t3)}
.pst.paid{color:var(--green);border-color:rgba(74,222,158,.35)}
.pst.overdue{color:var(--red);border-color:rgba(255,138,112,.4)}
.pst.reported,.pst.processing{color:var(--gold-light);border-color:var(--line-gold)}

/* documenti */
.dsearch{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:100px;padding:11px 16px;color:var(--t1);font-family:inherit;font-size:16px;font-weight:300;outline:none;margin-bottom:6px}
.dsearch:focus{border-color:var(--line-gold)}
.folder{margin-top:14px}
.folder:first-child{margin-top:0}
.fh{display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.fh span{font-family:var(--mono);color:var(--t4);letter-spacing:.5px}
.dlink{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line2);font-size:13.5px;color:var(--t2);text-decoration:none;transition:.2s;min-height:48px}
.dlink:hover{color:var(--gold)}
.dlink .ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-gold);background:var(--gold-faint);display:grid;place-items:center;flex:none;font-size:14px}
.dlink .tx{flex:1;min-width:0}
.dlink .tx b{display:block;font-weight:400;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlink small{display:block;font-size:10.5px;color:var(--t4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlink .go{margin-left:auto;color:var(--t4);flex:none}
.lockn{margin-top:12px;padding:11px 14px;border:1px dashed var(--line);border-radius:12px;font-size:12px;color:var(--t3);line-height:1.6}
.miss{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.miss:first-of-type{border-top:none;padding-top:2px}
.miss .bd{flex:1;min-width:0}
.miss b{display:block;font-weight:400;font-size:13.5px}
.miss small{display:block;font-size:11.5px;color:var(--t3);line-height:1.6;margin-top:2px}
.miss .gbtn,.miss .obtn{margin-top:0;flex:none}

/* storia */
.hist{position:relative;padding-left:18px}
.hist::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,var(--line-gold),var(--line2))}
.hi{position:relative;padding:6px 0 10px}
.hi::before{content:"";position:absolute;left:-18px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--gold)}
.hi b{display:block;font-weight:400;font-size:13.5px}
.hi small{font-size:11px;color:var(--t4);font-variant-numeric:tabular-nums}

.contact{display:flex;flex-wrap:wrap;gap:10px}
.foot{text-align:center;font-size:10px;letter-spacing:1px;color:var(--t4);margin-top:36px;line-height:1.8}

/* attivazione */
.actbox{max-width:440px;margin:40px auto 0}
.fld{display:block;margin-top:14px}
.fld span{display:block;font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--t4);margin-bottom:6px}
.fld input{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--t1);font-family:inherit;font-size:16px;font-weight:300;outline:none}
.fld input:focus{border-color:var(--line-gold)}
.msg{margin-top:12px;font-size:12.5px;line-height:1.6;color:var(--t3);min-height:1em}
.msg.err{color:var(--red)}
.gbtn.full{width:100%;margin-top:18px;padding:15px}

.rv{opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

@media(min-width:1100px){
  .hrow{max-width:1180px}
  main{max-width:1180px;padding:38px 42px calc(90px + var(--safe))}
  h1.big{font-size:46px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile{border-left:1px solid var(--line2)}
  .tile:first-child{border-left:none}
  .tile:nth-child(n+3){border-top:none}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:0 30px;align-items:start}
  .props{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:24px}
}
@media(max-width:460px){.ev{flex-wrap:wrap}.ev .when{order:3;margin-left:21px}.miss{flex-wrap:wrap}.miss .gbtn,.miss .obtn{margin-left:0}}
    </style>

function reveal(){
  var els=[].slice.call(document.querySelectorAll('.rv'));
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}})},{threshold:.08});
  els.forEach(function(e,i){e.style.transitionDelay=((i%5)*50)+'ms';io.observe(e)});
  setTimeout(function(){els.forEach(function(e){if(e.getBoundingClientRect().top<innerHeight)e.classList.add('in')})},60);
}
function wire(){
  [].forEach.call(document.querySelectorAll('[data-prop]'),function(b){b.onclick=function(){go('p:'+b.getAttribute('data-prop'))}});
  [].forEach.call(document.querySelectorAll('[data-home]'),function(b){b.onclick=function(){go('home')}});
  [].forEach.call(document.querySelectorAll('[data-up]'),function(b){b.onclick=function(){var v=b.getAttribute('data-up').split('|');UPL={pid:v[0],slot:v[1],btn:b};$('upl').value='';$('upl').click()}});
  var s=$('dsearch');if(s)s.oninput=function(){FILTER=s.value;$('dres').innerHTML=docResults()};
  reveal();
}
function go(v){VIEW=v;try{history.pushState({v:v},'',v==='home'?location.pathname+location.search:'#'+v.replace('p:','immobile/'))}catch(e){}render()}
window.addEventListener('popstate',function(){var hh=location.hash;VIEW=/^#immobile\//.test(hh)?'p:'+decodeURIComponent(hh.slice(10)):'home';if(DATA)render()});

/* ── caricare un documento dove manca (fascicolo dell'immobile) ── */
function toJpeg(file){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var mx=2200,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,mx/Math.max(w,h));
      var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',.86));};
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u;
  });
}
function asDataUrl(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file)})}
$('upl').onchange=function(){
  var f=this.files&&this.files[0];if(!f||!UPL)return;
  var isImg=/^image\//.test(f.type),isPdf=f.type==='application/pdf';
  if(!isImg&&!isPdf){BoomPortal.toast(t('upErr'),{type:'error'});return}
  if(isPdf&&f.size>3.2*1024*1024){BoomPortal.toast(t('tooBig'),{type:'warning',duration:9000});return}
  var b=UPL.btn;b.disabled=true;b.textContent=t('uploading');
  (isImg?toJpeg(f):asDataUrl(f)).then(function(data){
    return authed('/api/properties/dossier',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({propertyId:UPL.pid,slot:UPL.slot,base64:data,name:f.name,contentType:isImg?'image/jpeg':'application/pdf'})});
  }).then(function(r){
    if(r&&r.ok){BoomPortal.toast(t('uploaded'),{type:'success'});return load()}
    b.disabled=false;b.textContent=t('upload');BoomPortal.toast(r&&r.__status===413?t('tooBig'):t('upErr'),{type:'error',duration:8000});
  }).catch(function(){b.disabled=false;b.textContent=t('upload');BoomPortal.toast(t('upErr'),{type:'error'})});
};

function load(){
  return authed('/api/owners/vault'+(AS?'?ownerId='+encodeURIComponent(AS):''),{method:'GET'}).then(function(r){
    if(!r||!r.ok){showErr();return}
    DATA=r;$('load').style.display='none';$('app').style.display='';$('foot').style.display='';
    document.title=(LANG==='it'?'Area proprietario':'Owner area')+' — BOOM Roma';
    var hh=location.hash;if(/^#immobile\//.test(hh))VIEW='p:'+decodeURIComponent(hh.slice(10));
    render();
  });
}
function showErr(){
  $('load').style.display='none';$('app').style.display='';
  $('app').innerHTML='<section class="card" style="text-align:center"><p class="empty">'+esc(t('err'))+'</p><button class="gbtn" id="retry" type="button">'+esc(t('retry'))+'</button> <a class="obtn wa" target="_blank" rel="noopener" href="https://wa.me/'+WA+'">WhatsApp</a></section>';
  $('retry').onclick=function(){$('app').innerHTML='';$('load').style.display='';load()};
}
function boot(){
  BoomPortal.requireAuth(['landlord','owner','admin'],{loginUrl:'/login'}).then(function(res){
    USER=res.user;PROFILE=res.profile||{};
    // un admin qui senza ?as= non ha un'area sua: torna al portale
    if(PROFILE.role==='admin'&&!AS){location.href='/portal';return}
    if(PROFILE.role!=='admin')AS='';
    $('logout').style.display='';$('logout').onclick=function(){firebase.auth().signOut().then(function(){location.href='/login?next=%2Fowner'})};
    load();
  }).catch(function(){/* requireAuth reindirizza da solo */});
}

setLang(LANG);
$('loadMsg').textContent=t('loading');
try{BoomPortal.registerServiceWorker()}catch(e){}
if(ATTIVA)startActivation();else boot();
})();
</script>
