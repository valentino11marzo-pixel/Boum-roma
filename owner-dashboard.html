<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Area Proprietari — BOOM Rome</title>
  <meta name="description" content="La dashboard del proprietario BOOM: incassi, arretrati, contratto, manutenzioni e fascicolo del tuo immobile.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="application-name" content="BOOM Rome">
  <meta name="apple-mobile-web-app-title" content="BOOM">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#08080A">
  <link rel="canonical" href="https://www.boomrome.com/owner-dashboard">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --gold: #D4AF37; --gold-light: rgba(212,175,55,0.15); --gold-dark: #B8960C;
      --bg: #08080A; --bg-card: #0A0A0A; --bg-elevated: #141414; --bg-input: #1A1A1A;
      --border: rgba(255,255,255,0.08); --text: #FFF; --text-secondary: #999;
      --ok: #35D07F; --warn: #FFB020; --bad: #FF6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); min-height: 100dvh;
      font-family: 'Helvetica Neue', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300; line-height: 1.6; -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    header.top {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: calc(16px + env(safe-area-inset-top)) clamp(18px, 4vw, 44px) 16px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(8,8,10,0.92); z-index: 40;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .logo { text-decoration: none; letter-spacing: 6px; font-size: 16px; }
    .logo em { color: var(--gold); font-style: normal; font-size: 8.5px; letter-spacing: 4px; display: block; margin-top: 2px; }
    .who { text-align: right; font-size: 12px; color: var(--text-secondary); min-width: 0; }
    .who b { display: block; color: var(--text); font-weight: 400; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
    .who button { background: none; border: 0; color: var(--text-secondary); font: inherit; font-size: 11px; letter-spacing: 1px; cursor: pointer; text-decoration: underline; padding: 2px 0; }
    .who button:hover { color: var(--gold); }

    main { max-width: 1080px; margin: 0 auto; padding: clamp(18px, 3.4vw, 34px) clamp(16px, 3.6vw, 40px) 80px; }
    .eyebrow { color: var(--gold); font-size: 10.5px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-size: clamp(24px, 4.4vw, 36px); font-weight: 200; letter-spacing: 0.5px; margin-bottom: 4px; }
    .sub { color: var(--text-secondary); font-size: 13.5px; }

    .banner {
      background: var(--gold-light); border: 1px solid rgba(212,175,55,0.4); color: var(--gold);
      padding: 12px 16px; font-size: 13px; margin: 18px 0 0; display: none;
    }
    .banner.on { display: block; }
    .banner a { color: var(--gold); }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 26px 0 8px; }
    .tile { background: var(--bg-card); border: 1px solid var(--border); padding: 18px 16px; }
    .tile .k { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
    .tile .v { font-size: clamp(20px, 3vw, 27px); font-weight: 200; letter-spacing: 0.5px; }
    .tile .v.ok { color: var(--ok); } .tile .v.bad { color: var(--bad); }
    .tile .n { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

    .prop {
      background: var(--bg-card); border: 1px solid var(--border); margin-top: 22px;
      padding: clamp(18px, 3vw, 28px);
    }
    .prop-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 16px; }
    .prop-head h2 { font-size: 18px; font-weight: 400; letter-spacing: 0.5px; }
    .prop-head .z { color: var(--text-secondary); font-size: 12.5px; }
    .badge { display: inline-block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid var(--border); padding: 3px 9px; color: var(--text-secondary); }
    .badge.rented { border-color: rgba(53,208,127,0.5); color: var(--ok); }
    .badge.free { border-color: rgba(212,175,55,0.5); color: var(--gold); }

    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .col h3 { font-size: 10.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); font-weight: 400; margin-bottom: 10px; }
    .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
    .kv .k { color: var(--text-secondary); }
    .kv .v { text-align: right; font-weight: 400; }
    .kv .v.ok { color: var(--ok); } .kv .v.bad { color: var(--bad); } .kv .v.warn { color: var(--warn); }
    .mini { font-size: 12px; color: var(--text-secondary); margin-top: 8px; line-height: 1.7; }
    .mini a { color: var(--gold); }
    .lights { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .light { font-size: 11px; letter-spacing: 0.5px; border: 1px solid var(--border); padding: 4px 10px; color: var(--text-secondary); }
    .light.on { border-color: rgba(53,208,127,0.45); color: var(--ok); }

    .empty, .pick, .fail {
      text-align: center; border: 1px dashed rgba(255,255,255,0.16); padding: 48px 24px; margin-top: 34px; color: var(--text-secondary);
    }
    .empty .big { font-size: 34px; margin-bottom: 14px; }
    .btn {
      display: inline-block; margin-top: 18px; padding: 13px 26px; background: var(--gold); color: #000;
      border: 0; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase; text-decoration: none;
    }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 400; }
    .pick-row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: var(--bg-card); border: 1px solid var(--border); padding: 14px 18px; margin-top: 10px;
      cursor: pointer; text-align: left; width: 100%; color: var(--text); font: inherit;
    }
    .pick-row:hover { border-color: var(--gold); }
    .pick-row .n { color: var(--text-secondary); font-size: 12px; }

    .note { margin-top: 34px; border-left: 2px solid var(--gold); padding: 4px 0 4px 18px; color: var(--text-secondary); font-size: 13px; }
    .note b { color: var(--text); font-weight: 400; }
    .contact { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; }
    .wa { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(37,211,102,0.5); color: #25D366; padding: 11px 18px; text-decoration: none; font-size: 12.5px; letter-spacing: 1px; }
    #skel { margin-top: 30px; }
  </style>
</head>
<body>
  <header class="top">
    <a class="logo" href="/owner-dashboard">BOOM<em>PROPRIETARI</em></a>
    <div class="who" id="who" hidden>
      <b id="whoName"></b>
      <button id="logout" type="button">Esci</button>
    </div>
  </header>

  <main id="main">
    <div id="app"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/boom-portal.js"></script>
  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var esc = BoomPortal.escapeHtml;
    var eur = function (v) { return '€' + Math.round(v || 0).toLocaleString('it-IT'); };
    var dIT = function (s) {
      if (!s) return '';
      var d = new Date(String(s).slice(0, 10) + 'T00:00');
      return isNaN(d) ? String(s) : d.toLocaleDateString('it-IT');
    };
    var USER = null, ROLE = null;

    BoomPortal.registerServiceWorker();

    // Skeleton subito: la pagina non resta mai nera mentre l'auth lavora
    // (regola Safari: niente await sul percorso di primo render).
    $('app').innerHTML = '<div id="skel">' + BoomPortal.skeleton('40%', '30px') + '<br><br>'
      + BoomPortal.skeleton('100%', '90px') + '<br><br>' + BoomPortal.skeleton('100%', '220px') + '</div>';

    BoomPortal.requireAuth(['owner', 'landlord', 'admin'], { loginUrl: '/login' }).then(function (res) {
      USER = res.user; ROLE = res.profile.role;
      $('who').hidden = false;
      $('whoName').textContent = res.profile.name || res.user.email || '';
      $('logout').onclick = function () {
        firebase.auth().signOut().then(function () { location.href = '/login'; });
      };
      load();
    }).catch(function () { /* requireAuth redirige o mostra recovery da sé */ });

    function apiUrl() {
      var as = new URLSearchParams(location.search).get('as');
      return '/api/owners/summary' + (ROLE === 'admin' && as ? '?ownerId=' + encodeURIComponent(as) : '');
    }

    function load() {
      // fetch col guinzaglio: una risposta che non arriva è una pagina
      // appesa — dopo 15s si mostra l'errore azionabile, mai il limbo.
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var timer = ctl && setTimeout(function () { ctl.abort(); }, 15000);
      USER.getIdToken().then(function (tok) {
        return fetch(apiUrl(), {
          headers: { Authorization: 'Bearer ' + tok },
          signal: ctl ? ctl.signal : undefined,
        });
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (timer) clearTimeout(timer);
        if (!j.ok) throw new Error(j.error || 'errore');
        render(j);
      }).catch(function (e) {
        if (timer) clearTimeout(timer);
        renderFail(e);
      });
    }

    function renderFail(e) {
      $('app').innerHTML =
        '<div class="fail"><div style="font-size:30px;margin-bottom:12px">⚠️</div>' +
        '<div style="color:var(--text);font-size:16px;margin-bottom:8px">Non riesco a caricare i tuoi dati</div>' +
        '<div style="font-size:13px">' + esc(e && e.message === 'forbidden' ? 'Questo profilo non ha una dashboard proprietario.' : 'Rete o server non raggiungibili in questo momento.') + '</div>' +
        '<button class="btn" id="retry" type="button">Riprova</button></div>';
      $('retry').onclick = load;
    }

    function render(j) {
      // ── Admin senza target: il picker dei proprietari (strumento pitch) ──
      if (j.owners) {
        var rows = j.owners.map(function (o) {
          return '<button class="pick-row" type="button" data-oid="' + esc(o.id) + '">' +
            '<span>' + esc(o.name) + '</span><span class="n">' + o.properties + ' immobili →</span></button>';
        }).join('');
        $('app').innerHTML =
          '<div class="eyebrow">Vista amministratore</div>' +
          '<h1>Di quale proprietario?</h1>' +
          '<p class="sub">Apri la dashboard esattamente come la vede il cliente — utile durante il pitch del mandato.</p>' +
          (rows || '<div class="pick">Nessun immobile ha un proprietario assegnato (campo <code>ownerId</code> sulle properties).</div>');
        Array.prototype.forEach.call(document.querySelectorAll('.pick-row'), function (b) {
          b.onclick = function () { location.search = '?as=' + encodeURIComponent(b.getAttribute('data-oid')); };
        });
        return;
      }

      var t = j.totals || {};
      var year = new Date().getFullYear();
      var html = '';

      html += '<div class="eyebrow">Area proprietari</div>';
      html += '<h1>' + (j.owner && j.owner.name ? 'Ciao, ' + esc(String(j.owner.name).split(' ')[0]) : 'I tuoi immobili') + '</h1>';
      html += '<p class="sub">Incassi, contratto, manutenzioni e fascicolo — aggiornati adesso.</p>';

      if (j.viewer && j.viewer.preview) {
        html += '<div class="banner on">👁 Vista amministratore: stai vedendo la dashboard di <b>' + esc(j.owner.name || j.owner.id) + '</b>. <a href="/owner-dashboard">Torna al picker</a></div>';
      }

      if (!j.properties || !j.properties.length) {
        html += '<div class="empty"><div class="big">🏛</div>' +
          '<div style="color:var(--text);font-size:16px;margin-bottom:8px">Nessun immobile associato a questo profilo</div>' +
          'Se hai già un mandato con noi, scrivici e colleghiamo il tuo account.<br>' +
          'Se ancora no: la valutazione è gratuita.' +
          '<div class="contact" style="justify-content:center">' +
          '<a class="btn" href="/valuta">Quanto rende il tuo immobile?</a>' +
          '<a class="wa" href="https://wa.me/393313251961" target="_blank" rel="noopener">💬 WhatsApp</a></div></div>';
        $('app').innerHTML = html;
        return;
      }

      html += '<div class="tiles">' +
        tile('Incassato ' + year, eur(t.paidYtd), t.paidYtd > 0 ? 'ok' : '', (t.activeContracts || 0) + ' contratti attivi') +
        tile('Arretrati', eur(t.arrears), t.arrears > 0 ? 'bad' : 'ok', t.arrears > 0 ? t.lateCount + ' rate scadute — ci stiamo lavorando' : 'nessuna rata scaduta') +
        tile('Immobili', String(t.properties), '', '') +
        tile('Prossima rata', nextTile(j.properties), '', '') +
        '</div>';

      j.properties.forEach(function (p) { html += propCard(p); });

      html += '<div class="note"><b>Il rendiconto PDF</b> ti arriva via email il 1° di ogni mese, automaticamente. Questa pagina è la stessa fotografia, aggiornata al minuto.</div>';
      html += '<div class="contact">' +
        '<a class="wa" href="https://wa.me/393313251961" target="_blank" rel="noopener">💬 Scrivi a Valentino su WhatsApp</a>' +
        '<a class="btn ghost" href="mailto:valentino@boom-rome.com">valentino@boom-rome.com</a></div>';

      $('app').innerHTML = html;
    }

    function tile(k, v, cls, n) {
      return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || '') + '">' + v + '</div>' +
        (n ? '<div class="n">' + esc(n) + '</div>' : '') + '</div>';
    }

    function nextTile(props) {
      var best = null;
      props.forEach(function (p) {
        var n = p.money && p.money.next;
        if (n && (!best || n.dueDate < best.dueDate)) best = n;
      });
      return best ? esc(eur(best.amount)) + ' <small style="font-size:12px;color:var(--text-secondary)">· ' + esc(dIT(best.dueDate)) + '</small>' : '—';
    }

    function propCard(p) {
      var c = p.contract, m = p.money || {};
      var rented = c && c.status === 'active';
      var h = '<section class="prop">';
      // Lo status arriva in inglese dal DB (available/rented/…): al
      // proprietario si parla italiano.
      var stIT = { available: 'Disponibile', rented: 'Affittato', reserved: 'Riservato', maintenance: 'In manutenzione', off_market: 'Fuori mercato' };
      h += '<div class="prop-head"><div><h2>' + esc(p.address || p.name || 'Immobile') + '</h2>' +
        (p.zone ? '<span class="z">' + esc(p.zone) + '</span>' : '') + '</div>' +
        '<span class="badge ' + (rented ? 'rented' : 'free') + '">' + (rented ? 'Affittato' : esc(stIT[String(p.status || '').toLowerCase()] || p.status || 'Disponibile')) + '</span></div>';

      h += '<div class="cols">';

      // ── Contratto ──
      h += '<div class="col"><h3>Contratto</h3>';
      if (c) {
        h += kv('Inquilino', esc(c.tenantName || '—'));
        h += kv('Canone', c.rent ? eur(c.rent) + '/mese' : '—');
        if (c.installmentMonths > 1) h += kv('Cadenza', 'ogni ' + c.installmentMonths + ' mesi');
        h += kv('Dal', dIT(c.startDate));
        h += kv('Al', dIT(c.endDate));
        h += kv('Cedolare 10%', c.cedolareSecca ? 'sì' : 'no');
        if (c.signedPdfUrl) h += '<div class="mini"><a href="' + esc(c.signedPdfUrl) + '" target="_blank" rel="noopener">📄 Contratto firmato (PDF)</a></div>';
      } else {
        h += '<div class="mini">Nessun contratto attivo a sistema per questo immobile.</div>';
      }
      h += '</div>';

      // ── Incassi ──
      h += '<div class="col"><h3>Incassi</h3>';
      h += kv('Incassato quest\'anno', eur(m.paidYtd), m.paidYtd > 0 ? 'ok' : '');
      if (m.next) h += kv('Prossima rata', eur(m.next.amount) + ' · ' + dIT(m.next.dueDate));
      if (m.late && m.late.length) {
        m.late.forEach(function (x) {
          h += kv('Scaduta ' + (x.month || ''), eur(x.amount) + ' · ' + dIT(x.dueDate), 'bad');
        });
        h += '<div class="mini">Sui ritardi ci muoviamo noi: solleciti e recupero sono inclusi nella gestione.</div>';
      }
      if (m.recentPaid && m.recentPaid.length) {
        h += '<div class="mini" style="margin-top:10px">' + m.recentPaid.map(function (x) {
          return '✓ ' + esc(x.month || '') + ' — ' + esc(eur(x.amount)) + (x.paidDate ? ' il ' + esc(dIT(x.paidDate)) : '') + (x.paidVia ? ' (' + esc(x.paidVia) + ')' : '');
        }).join('<br>') + '</div>';
      }
      h += '</div>';

      // ── Casa e carte ──
      h += '<div class="col"><h3>Casa &amp; documenti</h3>';
      if (p.maintenance && p.maintenance.length) {
        p.maintenance.forEach(function (mt) {
          h += kv(esc(mt.title || 'Intervento'), esc(mt.status || 'aperta'), 'warn');
        });
      } else {
        h += '<div class="mini">Nessuna manutenzione aperta. 🔧</div>';
      }
      h += '<div class="mini" style="margin-top:10px">Fascicolo ARPE:</div><div class="lights">' +
        light('Visura', p.dossier.visura) + light('Planimetria', p.dossier.planimetria) +
        light('APE', p.dossier.ape) + light('Delega', p.dossier.delega) + '</div>';
      h += '</div>';

      h += '</div></section>';
      return h;
    }

    function kv(k, v, cls) {
      return '<div class="kv"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
    }
    function light(name, on) {
      return '<span class="light' + (on ? ' on' : '') + '">' + (on ? '✓ ' : '· ') + name + '</span>';
    }
  })();
  </script>
</body>
</html>
