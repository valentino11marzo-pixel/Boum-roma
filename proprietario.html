<!--
  L'ARCHIVIO DEL PROPRIETARIO (/proprietario) — la faccia.

  Una pagina, una domanda: «le mie case sono in ordine?». La risposta è una
  frase sola, poi solo ciò che deve fare LUI, poi le case, poi l'archivio.
  Ogni numero apre la sua prova, ogni documento dice da dove viene, e ciò
  che il sistema non sa esce come «non lo so».

  REGOLE DURE DI QUESTA PAGINA
   1. I dati arrivano SOLO da GET /api/owner/archivio (la proiezione già
      pulita dal server, assertClean) e i file SOLO da /api/owner/file con
      un biglietto da 60 secondi. Nessuna lettura Firestore dal browser:
      le regole la negano comunque al proprietario (22/09/2026).
   2. Il token viene dall'utente che BoomPortal.requireAuth consegna, a
      ogni chiamata (dura un'ora e si rinnova da solo).
   3. Nessuna formattazione della macchina: importi e date passano dai
      formattatori deterministici del motore (window.BOOM_OWNER), le parole
      dal suo STRINGS — una copia sola per pagina, email e test.
   4. Nessuna analytics: l'indirizzo in modalità «vedi come» porta l'uid
      del proprietario, e non deve uscire di casa.
   5. Il puntino d'oro «respira» SOLO su un «in ordine» verificato; tutto il
      movimento sta dentro prefers-reduced-motion: no-preference.
  Test: node tests/owner/ui.mjs · node tests/safari/boot.mjs
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --void:#050506;--panel:rgba(255,255,255,.022);--panel2:rgba(255,255,255,.04);
  --gold:#D4AF37;--gold-light:#F1DFA0;--gold-deep:#8A6D1D;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.05);--line-gold:rgba(212,175,55,.32);
  --gold-muted:rgba(212,175,55,.12);--gold-faint:rgba(212,175,55,.05);
  --t1:#FFF;--t2:rgba(255,255,255,.72);--t3:rgba(255,255,255,.5);--t4:rgba(255,255,255,.25);
  --green:#4ADE9E;--green-muted:rgba(74,222,158,.12);--wa:#25D366;--red:#FF8A70;--amber:#F2B558;
  --sans:'Helvetica Neue',Helvetica,'Inter',-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);--safe:env(safe-area-inset-bottom,0px);--r:18px;
  --hh:56px}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:var(--sans);background:var(--void);color:var(--t1);font-weight:300;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:tabular-nums;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font-family:inherit;font-size:inherit;font-weight:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit}
a{color:inherit}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
::selection{background:rgba(212,175,55,.3)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* la stanza: solo la griglia e una luce ferma. Calma, niente scansioni. */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .grid{position:absolute;inset:-2px;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.5px);background-size:34px 34px;
  -webkit-mask-image:radial-gradient(110% 70% at 50% 0%,#000 20%,transparent 72%);mask-image:radial-gradient(110% 70% at 50% 0%,#000 20%,transparent 72%)}
.bg .aur{position:absolute;left:50%;top:-60vmax;width:120vmax;height:110vmax;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.085),transparent 60%);filter:blur(60px)}

/* ── testata ── */
header{position:sticky;top:0;z-index:60;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  background:rgba(5,5,6,.74);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line2)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--hh);padding:0 18px;max-width:1240px;margin:0 auto}
.hl{font-size:9px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:9px;justify-self:center;text-decoration:none}
.brand .mark{filter:drop-shadow(0 0 10px rgba(212,175,55,.35))}
.brand b{font-weight:300;letter-spacing:6px;font-size:13.5px;margin-right:-6px}
.hr{justify-self:end;display:flex;gap:4px;align-items:center}
.hbtn{min-height:44px;min-width:44px;padding:0 8px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);transition:color .25s}
.hbtn:hover{color:var(--gold)}
@media(max-width:379px){.hl{visibility:hidden}.hrow{padding:0 8px}.brand b{letter-spacing:4px;margin-right:-4px}.hbtn{padding:0 5px;letter-spacing:1.4px}}

/* vedi come (admin): la banda che non lascia dubbi su COSA stai guardando */
#adminband{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:55;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 18px;background:linear-gradient(180deg,rgba(212,175,55,.2),rgba(212,175,55,.1));border-bottom:1px solid rgba(212,175,55,.45);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:12.5px;line-height:1.5;color:var(--gold-light)}
#adminband span{flex:1 1 240px;min-width:0}
#adminband a{flex:none;min-height:36px;display:inline-flex;align-items:center;border:1px solid var(--line-gold);border-radius:100px;padding:0 14px;
  font-size:10px;letter-spacing:1.6px;text-transform:uppercase;text-decoration:none;color:var(--gold)}

main{position:relative;z-index:5;max-width:680px;margin:0 auto;padding:0 18px calc(64px + var(--safe))}

/* ── attesa: minima, niente spettacolo ── */
#load{display:grid;place-items:center;gap:14px;text-align:center;padding:120px 20px;color:var(--t3);font-size:12px;letter-spacing:.3px}
#load .mark{opacity:.75}

/* ── navigazione rapida ── */
.qnav{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:40;display:flex;gap:6px;overflow-x:auto;
  margin:0 -18px;padding:10px 18px 12px;scrollbar-width:none;
  background:rgba(5,5,6,.86);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line2)}
body.va .qnav{top:calc(var(--hh) + env(safe-area-inset-top,0px) + var(--band,58px))}
.qnav::-webkit-scrollbar{display:none}
.qnav a{flex:none;display:inline-flex;align-items:center;min-height:36px;border:1px solid var(--line);border-radius:100px;padding:0 14px;
  font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--t3);text-decoration:none;background:rgba(255,255,255,.02);transition:.25s}
.qnav a:hover{border-color:var(--line-gold);color:var(--gold)}
section,article,[data-contract-id]{scroll-margin-top:124px}
/* vedi come sul telefono: la banda dell'admin sta sopra la navigazione, quindi
   la ricerca e i punti d'arrivo dei link (#c= #p= e la navigazione rapida)
   scendono della sua altezza — prima il campo di ricerca finiva SOTTO la
   banda e non si poteva toccare. Il desktop ha la sua regola più sotto. */
body.va .search{top:calc(var(--hh) + env(safe-area-inset-top,0px) + var(--band,58px) + 58px)}
body.va section,body.va article,body.va [data-contract-id]{scroll-margin-top:calc(124px + var(--band,58px))}

/* ── i puntini di stato: la forma dice lo stato anche senza colore ── */
.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;vertical-align:middle;background:transparent;box-shadow:inset 0 0 0 1.5px var(--t4)}
.dot[data-dot="ok"]{background:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.55)}
.dot[data-dot="tu"]{box-shadow:inset 0 0 0 1.7px var(--gold)}
.dot[data-dot="osservo"]{background:var(--red);box-shadow:none}
.dot[data-dot="nonso"]{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.dot[data-dot="vuoto"]{box-shadow:inset 0 0 0 1.5px var(--t4)}
@media(prefers-reduced-motion:no-preference){
  .dot[data-dot="ok"]{animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 6px rgba(212,175,55,.35);opacity:.82}50%{box-shadow:0 0 16px rgba(212,175,55,.75);opacity:1}}
}

/* ── #hero: la risposta ── */
#hero{padding:22px 0 8px;transition:opacity .18s linear}
#hero.dim .verdict,#hero.dim .hfacts{opacity:.42}
#hero.fade{opacity:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:400}
.eyebrow .dot{width:10px;height:10px}
.verdict{font-weight:200;font-size:clamp(34px,9.4vw,52px);letter-spacing:-1.2px;line-height:1.06;margin:16px 0 0;overflow-wrap:break-word}
.verdict .rem{display:block;font-size:14px;letter-spacing:0;line-height:1.5;color:var(--t3);font-weight:300;margin-top:10px}
.verdict .verif{display:block;font-size:13px;letter-spacing:.2px;color:var(--t3);margin-top:12px;font-weight:300}
.sweep{height:1px;margin:22px 0 0;background:linear-gradient(90deg,var(--gold),rgba(212,175,55,.2) 55%,transparent);transform-origin:left;opacity:.55}
@media(prefers-reduced-motion:no-preference){.sweep.go{animation:sweep 1.1s var(--ease) both}@keyframes sweep{from{transform:scaleX(0);opacity:1}60%{opacity:1}to{transform:scaleX(1);opacity:.55}}}
.reasons{list-style:none;margin:16px 0 0;display:grid;gap:2px}
.reasons li{font-size:13.5px;line-height:1.55;color:var(--t2);padding-left:18px;position:relative}
.reasons li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.3px var(--t3)}
.reasons li.warn::before{box-shadow:inset 0 0 0 1.3px var(--amber)}
.reasons button{text-align:left;min-height:32px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.hfacts{list-style:none;margin:20px 0 0;border-top:1px solid var(--line2)}
.hfacts li{border-bottom:1px solid var(--line2)}
.hfact{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:56px;padding:13px 2px;transition:background .2s}
.hfact:hover{background:rgba(255,255,255,.015)}
.hfact .dot{margin-top:7px}
.hfact .tx{flex:1;min-width:0}
.hfact b{display:block;font-weight:400;font-size:14.5px;color:var(--t1);letter-spacing:.1px;overflow-wrap:anywhere}
.hfact small{display:block;font-size:12.5px;color:var(--t3);line-height:1.55;margin-top:2px}
.hfact .go{color:var(--t4);margin-top:3px;flex:none}
.hmore{display:inline-flex;align-items:center;min-height:44px;font-size:12px;color:var(--t3);text-decoration:none}
.hfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--t3)}
.hfoot .none{color:var(--t2)}
.hfoot time{color:var(--t3)}
.vcta{margin-top:18px;font-size:15px;color:var(--t2)}

/* ── pulsanti ── */
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:100px;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1a1407;font-weight:500;font-size:13px;letter-spacing:.2px;
  text-decoration:none;box-shadow:0 10px 30px rgba(212,175,55,.14);transition:filter .25s,transform .25s var(--ease)}
.gbtn:hover{filter:brightness(1.06)}
.obtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:100px;
  font-size:12.5px;color:var(--t1);text-decoration:none;background:rgba(255,255,255,.02);transition:.25s}
.obtn:hover{border-color:var(--line-gold);color:var(--gold)}
.obtn.wa{border-color:rgba(37,211,102,.4);color:var(--wa)}
.obtn[aria-busy="true"],.gbtn[aria-busy="true"]{opacity:.55;pointer-events:none}
/* una riga d'archivio, un gettone, l'icona condividi mentre il biglietto
   arriva: smorzati e col cursore d'attesa (il doppio tocco lo ferma openDoc) */
.arow-main[aria-busy="true"],.aside-b[aria-busy="true"],.docchip[aria-busy="true"]{opacity:.5;cursor:progress}
@media(prefers-reduced-motion:no-preference){
  .arow-main[aria-busy="true"] .ic,.aside-b[aria-busy="true"] svg,.docchip[aria-busy="true"] svg{animation:busy 1s ease-in-out infinite}
  @keyframes busy{50%{opacity:.35}}
}

/* ── sezioni ── */
.sec{margin-top:34px}
.sech{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--t3);font-weight:400}
.sech::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sech .n{font-family:var(--mono);font-size:10px;letter-spacing:0;color:var(--gold);border:1px solid var(--line-gold);border-radius:6px;padding:1px 7px;background:var(--gold-faint)}

/* ── #todo ── */
.todo{list-style:none;border:1px solid var(--line-gold);border-radius:var(--r);background:linear-gradient(180deg,rgba(212,175,55,.06),rgba(212,175,55,.015));overflow:hidden}
.todo>li{padding:18px 18px 18px;border-top:1px solid rgba(212,175,55,.14)}
.todo>li:first-child{border-top:none}
.todo h3{font-size:16px;font-weight:400;letter-spacing:.1px;line-height:1.4;overflow-wrap:anywhere}
.todo p{font-size:13px;color:var(--t2);margin-top:4px;line-height:1.55}
.todo .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--t3);margin-top:6px}
.todo .meta .lr{font-family:var(--mono);font-size:11px;color:var(--t3)}
.todo .late{color:var(--red)}
.todo .act{margin-top:14px}
.todo .hid{font-size:12px;color:var(--t3);font-style:italic}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pills span{font-size:11.5px;color:var(--t2);border:1px solid var(--line);border-radius:100px;padding:3px 10px;line-height:1.5}

/* ── #case ── */
.house{position:relative;margin-top:18px;padding:22px 20px 20px;border:1px solid var(--line2);border-radius:22px;
  background:linear-gradient(180deg,rgba(255,252,240,.028),rgba(255,255,255,.012));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden;overflow:clip}
.house::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.55),rgba(212,175,55,.1),transparent 75%)}
.house.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 1px rgba(212,175,55,.6)}100%{box-shadow:0 0 0 1px rgba(212,175,55,0)}}
@media(prefers-reduced-motion:reduce){.house.flash{animation:none}}
.h-st{display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t3)}
.h-name{font-weight:300;font-size:clamp(23px,6vw,28px);letter-spacing:-.5px;line-height:1.15;margin-top:10px;overflow-wrap:anywhere}
.h-addr{font-size:13px;color:var(--t3);margin-top:3px;overflow-wrap:anywhere}
.h-cat{font-family:var(--mono);font-size:11px;color:var(--t3);margin-top:6px;letter-spacing:.2px;overflow-wrap:anywhere}
.h-cat.miss{font-family:var(--sans);font-style:italic}
.facts{list-style:none;margin-top:14px;display:grid;gap:1px}
.facts li{font-size:13.5px;color:var(--t2);line-height:1.5}
.facts button{display:flex;align-items:center;gap:8px;min-height:36px;width:100%;text-align:left}
.facts button::after{content:"›";color:var(--t4);margin-left:auto}
.sub{margin-top:24px;padding-top:18px;border-top:1px solid var(--line2)}
.subh{font-size:9.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--t3);margin-bottom:12px;font-weight:400}

/* un contratto */
.ct{container-type:inline-size}
.ct+.ct{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
.ct-title{font-size:16.5px;font-weight:400;line-height:1.4;letter-spacing:.1px;overflow-wrap:anywhere}
.ct-title .co{color:var(--t3);font-weight:300}
.ct-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);border:1px solid var(--line);border-radius:100px;padding:3px 10px;line-height:1.5}
.tag.gold{color:var(--gold);border-color:var(--line-gold);background:var(--gold-faint)}
.tag.amber{color:var(--amber);border-color:rgba(242,181,88,.4)}
.kv{list-style:none;margin-top:12px;display:grid;gap:4px}
.kv li{font-size:13.5px;color:var(--t2);line-height:1.5}
.kv li.q{color:var(--t3);font-size:12.5px}

/* LA LINEA — la rotta di /casa (tratteggio e aereo sulla prima tappa non
   compiuta), in verticale dove lo spazio è stretto e in orizzontale dove
   la riga ci sta. Ogni tappa è un FATTO del contratto: una tappa che non si
   applica non c'è; una che non si sa, dice che non si sa. */
.linea{list-style:none;position:relative;margin:18px 0 4px;padding:0}
.linea>li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:12px;padding:0 0 16px}
.linea>li::before{content:"";position:absolute;left:10px;top:14px;bottom:-2px;width:1px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.24) 0 4px,transparent 4px 8px)}
.linea>li:last-child::before{display:none}
.linea>li.done::before{background:linear-gradient(180deg,rgba(212,175,55,.55),rgba(212,175,55,.3))}
.rc-m{position:relative;z-index:1;width:22px;height:22px;display:grid;place-items:center}
.rc-m i{width:10px;height:10px;border-radius:50%;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--t4)}
.done .rc-m i{background:var(--gold);box-shadow:0 0 9px rgba(212,175,55,.45)}
.conflict .rc-m i{background:rgba(242,181,88,.15);box-shadow:inset 0 0 0 1.5px var(--amber)}
.unknown .rc-m i{box-shadow:none;border:1.5px dashed rgba(255,255,255,.35)}
.rc-aereo{width:18px;height:18px;color:var(--gold);filter:drop-shadow(0 0 8px rgba(212,175,55,.55));transform:rotate(180deg)}
.rc-b{min-width:0;padding-top:1px}
.rc-b b{display:block;font-size:13.5px;font-weight:400;color:var(--t2);line-height:1.4}
.done .rc-b b,.now .rc-b b{color:var(--t1)}
.next .rc-b b{color:var(--t3)}
.rc-b b a{color:inherit;text-underline-offset:4px;text-decoration-color:var(--line-gold)}
.rc-d{display:block;font-size:12px;color:var(--t3);margin-top:1px}
.rc-d .ds{display:none}
.rc-n{display:block;font-size:12px;color:var(--t3);font-style:italic;margin-top:1px}
.conflict .rc-n,.unknown .rc-n{color:var(--amber);font-style:normal}
.rc-docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.docchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;max-width:100%;padding:0 12px;border:1px solid var(--line-gold);border-radius:100px;
  font-size:11.5px;color:var(--gold-light);background:var(--gold-faint);transition:.2s}
.docchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docchip:hover{background:var(--gold-muted)}
@container (min-width:560px){
  .linea{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin-top:22px}
  .linea>li{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 3px}
  .linea>li::before{left:50%;right:-50%;top:10px;bottom:auto;width:auto;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 4px,transparent 4px 8px)}
  .linea>li.done::before{background:linear-gradient(90deg,rgba(212,175,55,.55),rgba(212,175,55,.3))}
  .rc-aereo{transform:rotate(90deg)}
  .rc-b{padding-top:8px;max-width:100%}
  .rc-b b{font-size:11.5px;line-height:1.3;overflow-wrap:anywhere}
  .rc-d,.rc-n{font-size:10.5px;line-height:1.4;margin-top:3px}
  .rc-d .dl{display:none}.rc-d .ds{display:inline}
  /* in riga le tappe sono strette: i documenti diventano gettoni con
     l'icona (il titolo resta per il lettore di schermo e al passaggio) */
  .rc-docs{justify-content:center;gap:5px}
  .linea .docchip{width:32px;height:32px;min-height:32px;padding:0;justify-content:center;border-radius:50%}
  .linea .docchip span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}
@media(prefers-reduced-motion:no-preference){.now .rc-aereo{animation:glide 2.8s ease-in-out infinite}@keyframes glide{50%{opacity:.6}}}

/* IL NASTRO — dodici mesi. Lo stato si legge dalla FORMA oltre che dal
   colore: pieno = pagata · anello = in scadenza · barrato = in ritardo ·
   metà = segnalata/in elaborazione · tratteggio = non registrato ·
   anello tratteggiato = nessuna rata a sistema · punto = fuori contratto. */
.nastro{margin:6px -20px 0;position:relative}
.nastro::before,.nastro::after{content:"";position:absolute;top:0;bottom:0;width:22px;z-index:2;pointer-events:none}
.nastro::before{left:0;background:linear-gradient(90deg,rgba(10,10,11,1),rgba(10,10,11,0))}
.nastro::after{right:0;background:linear-gradient(270deg,rgba(10,10,11,1),rgba(10,10,11,0))}
.ribbon{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 20px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ribbon::-webkit-scrollbar{display:none}
.rb{position:relative;flex:1 0 48px;width:48px;min-height:66px;display:grid;justify-items:center;align-content:start;gap:7px;padding:6px 0 4px;border-radius:12px;scroll-snap-align:center;transition:background .2s}
.rb:hover{background:rgba(255,255,255,.03)}
.rb .ml{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);line-height:1}
.rb .yl{position:absolute;bottom:-3px;font-size:8.5px;color:var(--t3);letter-spacing:.5px;font-family:var(--mono)}
.rb.cur .ml{color:var(--gold);font-weight:500}
.rb.cur::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.rb .s{position:relative;width:26px;height:26px;border-radius:50%;overflow:hidden}
.rb[data-state="paid"] .s{background:linear-gradient(180deg,var(--gold-light),var(--gold));box-shadow:0 0 12px rgba(212,175,55,.28)}
.rb[data-state="due"] .s{box-shadow:inset 0 0 0 1.7px var(--gold)}
.rb[data-state="overdue"] .s{background:rgba(255,138,112,.16);box-shadow:inset 0 0 0 1.7px var(--red)}
.rb[data-state="overdue"] .s::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.7px;background:var(--red);transform:rotate(45deg)}
.rb[data-state="reported"] .s,.rb[data-state="processing"] .s{background:linear-gradient(90deg,var(--gold) 50%,transparent 50%);box-shadow:inset 0 0 0 1.7px var(--gold)}
.rb[data-state="unknown"] .s{background:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.rb[data-state="empty"] .s{border:1.5px dashed rgba(255,255,255,.3)}
.rb[data-state="cancelled"] .s{box-shadow:inset 0 0 0 1.5px var(--t4)}
.rb[data-state="cancelled"] .s::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:1.5px;background:var(--t4)}
.rb[data-state="fuori"] .s{width:26px;height:26px;background:radial-gradient(circle,rgba(255,255,255,.2) 0 2.5px,transparent 3px)}
.rb .cnt{position:absolute;top:2px;right:6px;min-width:15px;height:15px;border-radius:8px;padding:0 4px;background:#1a1a1c;border:1px solid var(--line);font-family:var(--mono);font-size:9px;line-height:13px;color:var(--t2);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:11px;color:var(--t3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

.yline{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;margin-top:14px;padding:14px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--panel);transition:border-color .2s}
.yline:hover{border-color:var(--line-gold)}
.yline .yk{font-size:12.5px;color:var(--t3);line-height:1.4}
.yline .yv{font-size:clamp(19px,5vw,23px);font-weight:200;letter-spacing:-.3px;text-align:right;line-height:1.25}
.yline .yv small{display:block;font-size:11.5px;letter-spacing:0;color:var(--t3);font-weight:300}
.note{font-size:12px;color:var(--t3);line-height:1.6;margin-top:10px}
.olines{list-style:none;margin-top:12px}
.olines li{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line2);font-size:13px;color:var(--t2)}
.olines li:first-child{border-top:none}
.olines .a{color:var(--t1);font-weight:400}
.olines small{flex-basis:100%;font-size:12px;color:var(--t3)}

.mlist{list-style:none}
.mlist li{padding:11px 0;border-top:1px solid var(--line2);font-size:13.5px;color:var(--t2);line-height:1.5}
.mlist li:first-child{border-top:none}
.mlist b{font-weight:400;color:var(--t1)}
.mlist small{display:block;font-size:12px;color:var(--t3);margin-top:2px}
.mlist .urg{color:var(--red)}
.linkbtn{display:inline-flex;align-items:center;min-height:40px;font-size:12px;color:var(--gold-light);text-decoration:underline;text-decoration-color:var(--line-gold);text-underline-offset:4px}
details.past{margin-top:20px;border-top:1px solid var(--line2);padding-top:6px}
details.past summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;color:var(--t3)}
details.past summary::-webkit-details-marker{display:none}
details.past summary::before{content:"›";display:inline-block;transition:transform .2s;color:var(--t4)}
details.past[open] summary::before{transform:rotate(90deg)}

/* ── #archivio ── */
.search{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 58px);z-index:30;margin:0 -18px;padding:8px 18px 10px;background:rgba(5,5,6,.9);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.sbox{position:relative}
.sbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--t4);pointer-events:none}
#q{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:#0f0f11;color:var(--t1);font:inherit;font-size:16px;font-weight:300;padding:0 44px 0 42px;transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--t3)}
#q:focus{outline:none;border-color:var(--line-gold);background:#131315}
.sbox kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;color:var(--t3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
@media(pointer:coarse){.sbox kbd{display:none}}
.newchip{display:inline-flex;align-items:center;gap:8px;margin-top:10px;min-height:34px;padding:0 14px;border:1px solid var(--line-gold);border-radius:100px;font-size:12px;color:var(--gold-light);background:var(--gold-faint)}
.newchip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.newchip[aria-pressed="true"]{background:var(--gold-muted);border-color:var(--gold)}
.agroup{margin-top:14px}
.agroup>h3{font-size:14px;font-weight:400;color:var(--t1);letter-spacing:.1px;margin:18px 0 2px;overflow-wrap:anywhere}
.afold{font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t3);margin:16px 0 4px;font-weight:400}
.alist{list-style:none}
.arow{display:flex;align-items:stretch;border-top:1px solid var(--line2)}
.alist>.arow:first-child{border-top:none}
.arow-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;min-height:56px;padding:11px 2px;transition:color .2s}
.arow-main:hover .at{color:var(--gold-light)}
.ic{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line-gold);background:var(--gold-faint);display:grid;place-items:center;color:var(--gold)}
.arow.nofile .ic{border-color:var(--line);background:transparent;color:var(--t3)}
.ab{flex:1;min-width:0}
.at{display:block;font-size:14px;color:var(--t1);line-height:1.4;overflow-wrap:anywhere;transition:color .2s}
.as{display:block;font-size:11.5px;color:var(--t3);line-height:1.5;margin-top:2px}
.as .st{color:var(--gold);letter-spacing:.2px}
.nu{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:7px;vertical-align:middle;box-shadow:0 0 8px rgba(212,175,55,.7)}
.aside-b{flex:none;width:44px;min-height:44px;display:grid;place-items:center;color:var(--t3);border-radius:10px;transition:color .2s}
.aside-b:hover{color:var(--gold)}
.arow.ghost .arow-main{cursor:default}
.arow.ghost .ic{border:1px dashed rgba(255,255,255,.25);background:transparent;color:var(--t4)}
.arow.ghost .at{color:var(--t3)}
.arow.inv .arow-main{cursor:default}
.path{display:block;font-size:11px;color:var(--t3);margin-top:2px;overflow-wrap:anywhere}
.aempty{font-size:13.5px;color:var(--t3);line-height:1.65;padding:18px 0}

/* ── #contatto ── */
.advisor{display:flex;flex-wrap:wrap;gap:14px;align-items:center;border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:18px}
.advisor .av{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-gold);background:var(--gold-faint);display:grid;place-items:center;flex:none}
.advisor .who{flex:1 1 150px;min-width:0}
.advisor .who small{display:block;font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--t3)}
.advisor .who b{display:block;font-size:15px;font-weight:400;margin-top:2px}
.advisor .acts{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 100%}
.advisor .acts a{flex:1 1 140px}
.intro{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;font-size:12.5px;color:var(--t3);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.intro:hover{color:var(--gold)}
.legal{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);text-align:center;margin-top:34px;line-height:1.8}

/* ── la card d'errore: mai un loader appeso ── */
.errcard{margin-top:40px;padding:28px 22px;border:1px solid var(--line);border-radius:22px;background:var(--panel);text-align:center}
.errcard h2{font-weight:200;font-size:26px;letter-spacing:-.4px;line-height:1.2}
.errcard .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* ── dialog#sheet: il foglio unico delle prove ── */
#sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:560px;max-height:min(86vh,760px);padding:0;border:1px solid var(--line);border-bottom:none;
  border-radius:22px 22px 0 0;background:#0d0d0f;color:var(--t1);box-shadow:0 -20px 60px rgba(0,0,0,.6);overflow:hidden;display:none;flex-direction:column}
#sheet[open]{display:flex}
#sheet::backdrop{background:rgba(0,0,0,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media(prefers-reduced-motion:no-preference){
  #sheet[open]{animation:shUp .32s var(--ease)}
  @keyframes shUp{from{transform:translateY(100%)}to{transform:none}}
  #sheet.closing{transform:translateY(105%)!important;transition:transform .22s ease-in}
  #sheet[open]::backdrop{animation:bdIn .3s ease}
  @keyframes bdIn{from{opacity:0}}
}
.sh-top{flex:none;padding:10px 20px 0;cursor:grab;touch-action:none}
.sh-grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 12px}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-head .tx{flex:1;min-width:0}
.sh-eb{font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold)}
#sheetTitle{font-weight:300;font-size:21px;letter-spacing:-.3px;line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.sh-x{flex:none;width:44px;height:44px;margin:-6px -10px 0 0;border-radius:50%;display:grid;place-items:center;color:var(--t3);font-size:22px;line-height:1}
.sh-x:hover{color:var(--t1)}
#sheetBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 20px calc(24px + var(--safe))}
.srow{padding:13px 0;border-top:1px solid var(--line2)}
.srow:first-child{border-top:none}
.sr-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sr-top b{font-weight:400;font-size:14.5px}
.sr-top .amt{font-size:17px;font-weight:300;letter-spacing:-.2px;white-space:nowrap}
.srow p{font-size:13px;color:var(--t2);margin-top:3px;line-height:1.5}
.srow p.q{color:var(--t3);font-size:12px}
.srow p.late{color:var(--red)}
.stot{display:flex;justify-content:space-between;gap:12px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.stot b{font-weight:400}
.ssec{font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t3);margin:20px 0 6px}
.sacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.sacts>*{flex:1 1 180px}
.pline{font-size:13.5px;color:var(--t2);line-height:1.6;padding:9px 0;border-top:1px solid var(--line2)}
.pline:first-child{border-top:none}
.pline small{display:block;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:2px}
.smsg{font-size:14px;color:var(--t2);line-height:1.6}
.smsg.err{color:var(--gold-light)}

/* ═══ DESKTOP ≥1120px: due colonne — la risposta e le case a sinistra,
   l'archivio a destra con la ricerca che resta in vista. ═══ */
.cols{display:contents}
.col{display:contents}
@media(min-width:1120px){
  .hrow{padding:0 34px}
  .search{margin:0;padding:14px 0 14px;background:linear-gradient(180deg,rgba(5,5,6,.95) 70%,rgba(5,5,6,0));-webkit-backdrop-filter:none;backdrop-filter:none}
  main{max-width:1240px;padding:34px 34px calc(90px + var(--safe))}
  .qnav{display:none}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0 56px;align-items:start}
  .col{display:block;min-width:0}
  .col.side{position:relative}
  .verdict{font-size:58px;letter-spacing:-1.6px}
  .search{top:var(--hh);padding-top:14px}
  body.va .search{top:calc(var(--hh) + var(--band,48px))}
  #archivio{margin-top:22px}
  .house{padding:28px 30px 26px}
  .nastro{margin:6px -30px 0}
  .ribbon{padding-left:30px;padding-right:30px}
  #sheet{bottom:24px;border-radius:22px;border-bottom:1px solid var(--line)}
  #sheetBody{padding-bottom:26px}
}
@media(max-width:380px){
  main{padding-left:14px;padding-right:14px}
  .qnav{margin:0 -14px;padding-left:14px;padding-right:14px}
  .search{margin:0 -14px;padding-left:14px;padding-right:14px}
  .house{padding:20px 16px 18px}
  .nastro{margin:6px -16px 0}
  .ribbon{padding-left:16px;padding-right:16px}
  .rb{flex-basis:44px;width:44px}
}
@media print{.bg,header,.qnav,#adminband,.search,.aside-b{display:none!important}body{background:#fff;color:#000}}
</style>

/* ════════════════ LA RISPOSTA ════════════════ */
function reasonsOf(c){return (A.verdict.reasons||[]).filter(function(r){return r.code===c})}
function verdictSentence(){
  var v=A.verdict,st=v.state,f=reasonsOf;
  if(st==='ok')return {s:t('verdict.ok')};
  if(st==='vuoto')return {s:t('verdict.vuoto')};
  if(st==='nonso')return {s:t('verdict.nonso')};
  if(st==='tu'){
    if(f('sign_needed').length)return {s:t('verdict.tu.sign'),used:'sign_needed'};
    var sc=f('scheda_needed')[0];if(sc)return {s:t('verdict.tu.scheda',{n:sc.n}),used:'scheda_needed'};
    var ds=f('deadline_soon')[0];if(ds)return {s:t('verdict.tu.deadline',{date:D(ds.date)}),used:'deadline_soon'};
    var dov=f('deadline_overdue')[0];if(dov)return {s:t('verdict.tu.deadline_overdue',{date:D(dov.date)}),used:'deadline_overdue'};
    return {s:t('dot.tu')};
  }
  if(st==='osservo'){
    var od=f('rent_overdue');
    if(od.length){
      var rem=od.length===1&&od[0].reminderLast?t('verdict.reminder',{date:D(od[0].reminderLast)}):'';
      return {s:od.length===1?t('verdict.osservo.overdue',{n:1,days:od[0].days}):t('verdict.osservo.overdue',{n:od.length}),rem:rem,used:'rent_overdue'};
    }
    if(f('rent_reported').length)return {s:t('verdict.osservo.reported'),used:'rent_reported'};
    if(f('rent_processing_sepa').length)return {s:t('verdict.osservo.processing_sepa'),used:'rent_processing_sepa'};
    if(f('rent_processing').length)return {s:t('verdict.osservo.processing'),used:'rent_processing'};
    // Gli altri addebiti (saldo deposito, …) hanno la loro frase.
    var co=f('charge_overdue');
    if(co.length===1)return {s:t('verdict.osservo.charge_overdue',{what:whatOf(co[0]),days:co[0].days}),used:'charge_overdue'};
    if(co.length)return {s:t('verdict.osservo.overdue',{n:co.length}),used:'charge_overdue'};
    if(f('charge_reported').length)return {s:t('verdict.osservo.reported'),used:'charge_reported'};
    if(f('charge_processing').length)return {s:t('verdict.osservo.processing'),used:'charge_processing'};
    return {s:t('dot.osservo')};
  }
  return {s:t('dot.'+st)};
}
/* Le righe sotto la frase: ciò che non so e le scadenze passate, max 3. */
var SHOW_REASON=['deadline_overdue','rent_unlinked','rent_amount_missing','rent_state_unknown','rent_month_missing','installments_missing',
  'rented_without_contract','contract_expired_open','multiple_active_contracts','contract_date_conflict','read_partial','registration_unknown',
  'lease_unsigned','charges_after_termination','charge_overdue','charge_reported','charge_processing','charge_state_unknown','charge_amount_missing',
  'signature_unrecorded'];
function whatOf(r){return r&&r.what==='deposit-balance'?t('money.deposit_balance'):t('money.other_charge')}
/* Le stanze: «Interno A · Anna Verdi» — interno e nome come sul contratto. */
function whoOf(x){var b=[];if(x&&x.unit)b.push(t('ui.unit',{unit:x.unit}));if(x&&x.tenantName)b.push(x.tenantName);return b.join(' · ')}
function reasonLines(used){
  var seen={},out=[];
  (A.verdict.reasons||[]).forEach(function(r){
    if(out.length>=3||r.code===used||SHOW_REASON.indexOf(r.code)<0)return;
    var key=r.code+'|'+(r.propertyId||'');if(seen[key])return;seen[key]=1;
    var p={date:r.date?D(r.date):'',month:r.month?M(r.month):'',days:r.days,n:r.n,what:whatOf(r)};
    // Un cessato senza data di cessazione: la frase senza «del {date}».
    var txt=t('reason.'+r.code+(r.code==='charges_after_termination'&&!r.date?'_undated':''),p);
    if(r.code.indexOf('charge_')===0)txt=cap(txt);
    out.push('<li class="'+(r.code==='deadline_overdue'||r.code==='read_partial'?'warn':'')+'">'
      +(r.propertyId&&PROP[r.propertyId]&&A.properties.length>1?'<button type="button" data-goto="p='+esc(r.propertyId)+'">'+esc(txt)+'</button>':esc(txt))+'</li>');
  });
  return out.length?'<ul class="reasons">'+out.join('')+'</ul>':'';
}
function factText(f){
  switch(f.k){
    case 'lease':
      if(f.n>1)return t('facts.leases',{n:f.n});
      // «firma non registrata a sistema» non si incastra in «Contratto … fino al»
      if(f.status==='unrecorded'&&f.to)return t('facts.lease_unrecorded',{date:D(f.to)});
      return f.to?t('facts.lease',{status:t('status.'+f.status),date:D(f.to)}):cap(t('status.'+f.status));
    case 'vacant':return t('facts.vacant');
    case 'no_lease':return t('facts.no_lease');
    case 'month':
      var k='facts.month.'+(f.state==='paid'&&!f.via?'paid_novia':f.state);
      var s=has(k)?t(k,{month:M(f.month),date:f.date?D(f.date):'',days:f.days}):cap(M(f.month))+': '+t('ribbon.'+f.state);
      var who=whoOf(f);
      return who?s+' · '+who:s;
    case 'no_rows':return t('facts.no_rows',{month:M(f.month)});
    case 'deadlines':return t('facts.deadlines',{n:f.n30});
  }
  return '';
}
function heroHtml(){
  var v=A.verdict,st=v.state,vs=verdictSentence(),h='';
  h+='<div class="eyebrow"><span class="dot" data-dot="'+esc(st)+'"></span><span>'+esc(t('ui.eyebrow',{date:D(A.today)}))+'</span></div>';
  h+='<h1 class="verdict" id="verdictTx">'+esc(vs.s)+(vs.rem?'<span class="rem">'+esc(cap(vs.rem.replace(/^·\s*/,'')))+'</span>':'')+'</h1>';
  h+='<div class="sweep" id="sweep"></div>';
  if(st==='vuoto'){
    h+='<p class="vcta">'+esc(t('verdict.vuoto.cta'))+'</p><p style="margin-top:16px"><a class="obtn wa" href="'+esc(wa(''))+'" target="_blank" rel="noopener">'+esc(t('ui.whatsapp'))+'</a></p>';
    h+='<div class="hfoot"><time>'+esc(t('ui.updated',{time:A.updated.time}))+'</time></div>';
    return h;
  }
  h+=reasonLines(vs.used);
  var lines=v.lines||[],shown=lines.slice(0,3);
  if(shown.length){
    h+='<ul class="hfacts">'+shown.map(function(l){
      var p=PROP[l.propertyId]||{};
      var tx=(l.facts||[]).map(factText).filter(Boolean).join(' · ');
      return '<li><button type="button" class="hfact" data-goto="p='+esc(l.propertyId)+'"><span class="dot" data-dot="'+esc(l.dot)+'" title="'+esc(t('dot.'+l.dot))+'"></span>'
        +'<span class="tx"><b>'+esc(p.label||'')+'</b><small>'+esc(tx)+'</small></span><span class="go">'+I_GO+'</span></button></li>';
    }).join('')+'</ul>';
    if(lines.length>3)h+='<a class="hmore" href="#case">'+esc(t('ui.more_houses',{n:lines.length-3}))+'</a>';
  }
  h+='<div class="hfoot">'+(A.todo.length?'':'<span class="none">'+esc(t('todo.none'))+'</span>')
    +'<time>'+esc(t('ui.updated',{time:A.updated.time}))+'</time></div>';
  return h;
}

/* ════════════════ DA FARE ════════════════ */
function todoHtml(){
  if(!A.todo.length)return '';
  var items=A.todo.map(function(it){
    var p=PROP[it.propertyId]||{},addr=p.label||p.address||'';
    if(it.kind==='sign'){
      return '<li><h3>'+esc(t('todo.sign',{address:addr}))+'</h3>'
        +(it.url?'<div class="act"><a class="gbtn" href="'+esc(it.url)+'" rel="noopener">'+esc(t('todo.sign.cta'))+' '+I_GO+'</a></div>'
               :'<p class="hid">'+esc(t('todo.viewas_hidden'))+'</p>')+'</li>';
    }
    if(it.kind==='scheda'){
      var miss=it.missing||[];
      var lbl=function(m){return (m.label&&(m.label[LANG]||m.label.it))||m.key};
      var head=it.docsOnly
        ? miss.map(function(m){return t('todo.docs',{doc:lbl(m)})}).join(' · ')
        : t('todo.scheda',{n:miss.length,list:''}).replace(/[:\s]+$/,'');
      return '<li><h3>'+esc(head)+'</h3><p>'+esc(addr)+'</p>'
        +(it.docsOnly?'':'<div class="pills">'+miss.map(function(m){return '<span>'+esc(lbl(m))+'</span>'}).join('')+'</div>')
        +(it.url?'<div class="act"><a class="obtn" href="'+esc(it.url)+'" rel="noopener">'+esc(t('todo.scheda.cta'))+' '+I_GO+'</a></div>'
               :'<p class="hid" style="margin-top:10px">'+esc(t('todo.viewas_hidden'))+'</p>')+'</li>';
    }
    if(it.kind==='deadline'){
      return '<li><h3>'+esc(it.title)+'</h3><div class="meta">'
        +(it.overdue?'<span class="late">'+esc(t('todo.overdue',{date:D(it.date)}))+'</span>':'<span>'+esc(D(it.date))+'</span>')
        +(it.legalRef?'<span class="lr">'+esc(it.legalRef)+'</span>':'')+(addr?'<span>'+esc(addr)+'</span>':'')+'</div>'
        +'<p>'+esc(t('todo.outcome'))+'</p></li>';
    }
    return '';
  }).join('');
  return '<section class="sec" id="todo" aria-labelledby="todoH"><h2 class="sech" id="todoH">'+esc(t('qnav.todo'))+' <span class="n">'+A.todo.length+'</span></h2><ol class="todo">'+items+'</ol></section>';
}

/* ════════════════ LE CASE ════════════════ */
function rowSentence(r){
  if(r.afterEnd)return t('row.after_end',{date:D(r.afterEnd)});
  if(r.afterTermination)return t('row.after_end_undated');
  switch(r.state){
    case 'paid':return r.paidDate?(r.via?t('row.paid',{date:D(r.paidDate),via:t('via.'+r.via)}):t('row.paid_novia',{date:D(r.paidDate)})):cap(t('ribbon.paid'));
    case 'due':return t('row.due',{date:D(r.dueDate)});
    case 'overdue':return t('row.overdue',{days:r.overdueDays,date:D(r.dueDate)});
    case 'reported':return t('row.reported',{date:D(r.reportedDate)});
    case 'processing':return t(r.sepa?'row.processing_sepa':'row.processing');
    case 'cancelled':return t('row.cancelled');
  }
  return t('row.unknown');
}
function docChip(ref){
  var it=ITEM[ref];if(!it)return '';
  var tt=it.title[LANG]||it.title.it;
  return '<button type="button" class="docchip" data-ref="'+esc(ref)+'" title="'+esc(tt)+'">'+ICON[it.folder||'contratto']+'<span>'+esc(it.title[LANG]||it.title.it)+'</span></button>';
}
function lineaHtml(c){
  var st=c.stages||[];if(!st.length)return '';
  return '<ol class="linea" style="--n:'+st.length+'">'+st.map(function(s){
    var label=esc(t('stage.'+s.key));
    if(s.key==='rinnovo'&&c.renewedToId)label='<a href="#c='+esc(encodeURIComponent(c.renewedToId))+'">'+label+'</a>';
    var sub='';
    // Due forme della stessa data: lunga in verticale, corta («1 feb 2026»)
    // quando la linea è orizzontale e le colonne sono strette. La nascosta è
    // display:none, quindi un lettore di schermo ne legge una sola.
    if(s.date)sub+='<span class="rc-d"><span class="dl">'+esc(D(s.date))+'</span><span class="ds">'+esc(O.dateShort(s.date,LANG)+' '+String(s.date).slice(0,4))+'</span></span>';
    if(s.note)sub+='<span class="rc-n">'+esc(t('note.'+s.note))+'</span>';
    else if(s.state==='unknown'||s.state==='conflict')sub+='<span class="rc-n">'+esc(t('stagestate.'+s.state))+'</span>';
    var chips=(s.refs||[]).map(docChip).join('');
    return '<li class="'+esc(s.state)+'"><span class="rc-m">'+(s.state==='now'?PLANE:'<i></i>')+'</span>'
      +'<div class="rc-b"><b>'+label+'</b>'+sub+(chips?'<div class="rc-docs">'+chips+'</div>':'')+'</div></li>';
  }).join('')+'</ol>';
}
function contractHtml(c){
  var type=c.type?t('type.'+c.type):'';
  var title=cap(t('ui.contract_line',{type:type,name:c.tenantName||'—'}).replace(/\s{2,}/g,' ').trim());
  var co=(c.coTenantNames||[]).length?' <span class="co">'+esc(t('ui.cotenants',{n:c.coTenantNames.length}))+'</span>':'';
  var chips='<span class="tag'+(c.status==='signed'||c.status==='signed_paper'?' gold':'')+'">'+esc(t('status.'+c.status))+'</span>';
  if(!c.type)chips+='<span class="tag">'+esc(t('type.none'))+'</span>';
  if(c.unit)chips+='<span class="tag">'+esc(t('ui.unit',{unit:c.unit}))+'</span>';
  var kv=[];
  // Un cessato finisce alla cessazione (la tappa «Cessato» ne porta la data),
  // non alla fine scritta sul contratto: prima diceva «mancano 131 giorni».
  var cess=c.status==='terminated'?(c.stages||[]).filter(function(s){return s.key==='cessazione'&&s.date})[0]:null;
  var to=cess&&(!c.endDate||cess.date<c.endDate)?cess.date:c.endDate;
  if(c.startDate&&to){
    kv.push(c.daysToEnd!=null&&c.daysToEnd>0
      ?t('ui.lease_dates',{from:D(c.startDate),to:D(to),n:c.daysToEnd})
      :t('ui.lease_dates_only',{from:D(c.startDate),to:D(to)}));
  }
  kv.push(c.rent!=null?t('ui.rent_line',{amount:E(c.rent),cadence:t('cadence.'+(c.installmentMonths||'none'))}):t('ui.rent_missing'));
  kv.push(c.cedolare===true?t('ui.cedolare.yes'):c.cedolare===false?t('ui.cedolare.no'):t('ui.cedolare.null'));
  var q=[];
  if(c.certificate==='present')q.push(t('fact.certificate'));
  if(c.sealed&&c.sealed.tsr)q.push(t('fact.tsr'));
  return '<div class="ct" data-contract-id="'+esc(c.id)+'" id="c-'+esc(c.id)+'">'

function archiveGroups(){
  var props=A.properties,one=props.length===1,groups=[],gen={id:null,label:t('ui.rendiconti'),items:[],inv:[]},byP={};

  A.archive.forEach(function(it){
    if(ONLY_NEW&&!isNew(it))return;
    var g=it.propertyId&&byP[it.propertyId]?byP[it.propertyId]:(one?byP[props[0].id]:gen);g.items.push(it);
  });
  if(!ONLY_NEW)(A.invoices||[]).forEach(function(v){var g=v.propertyId&&byP[v.propertyId]?byP[v.propertyId]:(one?byP[props[0].id]:gen);g.inv.push(v)});
  if(gen.items.length||gen.inv.length)groups.push(gen);
  props.forEach(function(p){groups.push(byP[p.id])});
  return groups.filter(function(g){return g.items.length||g.inv.length});

/* ── la risposta che si conferma da sola: l'ultimo verdetto (niente importi,
   niente nomi) si dipinge smorzato mentre il server risponde ── */
function cacheKey(){return 'boom:proprietario:v1:'+USER.uid}
function paintCached(){
  if(AS)return;
  var c=null;try{c=JSON.parse(lsGet(cacheKey())||'null')}catch(e){c=null}
  if(!c||!c.state||!c.at||Date.now()-Date.parse(c.at)>864e5)return;
  LAST_STATE=c.state;
  var s=c.state==='ok'?t('verdict.ok'):c.state==='nonso'?t('verdict.nonso'):c.state==='vuoto'?t('verdict.vuoto')
    :(c.state==='tu'&&(c.reasonCodes||[]).indexOf('sign_needed')>=0)?t('verdict.tu.sign'):t('dot.'+c.state);
  APP.innerHTML='<div class="cols"><div class="col main"><section id="hero" class="dim" data-state="cached">'
    +'<div class="eyebrow"><span class="dot" data-dot="'+(c.state==='ok'?'nonso':esc(c.state))+'"></span><span>'+esc(t('ui.title'))+'</span></div>'
    +'<h1 class="verdict">'+esc(s)+'<span class="verif">'+esc(t('ui.verifying'))+'</span></h1></section></div></div>';
  $('load').hidden=true;APP.hidden=false;
}
function saveCache(){
  if(AS||!A||!A.verdict)return;
  lsSet(cacheKey(),JSON.stringify({state:A.verdict.state,reasonCodes:(A.verdict.reasons||[]).map(function(r){return r.code}),at:new Date().toISOString()}));
}
function seenKey(){return 'boom:proprietario:seen:'+USER.uid}

/* ════════════════ IL CARICAMENTO ════════════════ */
function showError(){
  $('load').hidden=true;APP.hidden=false;
  APP.innerHTML='<div class="errcard" role="alert"><svg viewBox="0 0 1024 1024" width="36" height="36" aria-hidden="true" style="opacity:.8"><use href="#boomMark"/></svg>'
    +'<h2 style="margin-top:14px">'+esc(t('ui.error'))+'</h2><div class="acts"><button type="button" class="gbtn" id="retry">'+esc(t('ui.retry'))+'</button>'
    +'<a class="obtn wa" href="'+esc(wa(''))+'" target="_blank" rel="noopener">'+esc(t('ui.whatsapp'))+'</a></div></div>';
  // Senza motore, senza BoomPortal o senza utente non c'è niente da
  // rileggere: «Riprova» ricarica la pagina (prima restava spento, busy).
  $('retry').onclick=function(){
    if(!O||!window.BoomPortal||!USER){location.reload();return}
    this.setAttribute('aria-busy','true');load();
  };
}
function token(){return USER.getIdToken()}
function load(){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort()},20000);
  return Promise.resolve().then(token).then(function(tok){
    return fetch('/api/owner/archivio'+(AS?'?as='+encodeURIComponent(AS):''),{headers:{Authorization:'Bearer '+tok},cache:'no-store',signal:ctl?ctl.signal:undefined});
  }).then(function(r){
    return r.json().catch(function(){return null}).then(function(j){return {status:r.status,j:j}});
  }).then(function(x){
    clearTimeout(timer);
    if(x.status!==200||!x.j||!x.j.ok||!x.j.archive||!x.j.archive.verdict)throw new Error('archivio_'+x.status);
    A=x.j.archive;
    var prevState=LAST_STATE;
    if(!AS){SEEN=lsGet(seenKey());if(SEEN&&!/^\d{4}-\d{2}-\d{2}$/.test(SEEN))SEEN=null}
    var hero=$('hero'),crossfade=!!(hero&&hero.classList.contains('dim'));
    var paint=function(){
      render();
      if(crossfade){var nh=$('hero');if(nh&&!matchMedia('(prefers-reduced-motion: reduce)').matches){nh.classList.add('fade');
        requestAnimationFrame(function(){requestAnimationFrame(function(){nh.classList.remove('fade')})})}}
      var sw=$('sweep');
      if(prevState&&prevState!==A.verdict.state&&sw){sw.classList.add('go')}
      LAST_STATE=A.verdict.state;
      if(!AS){saveCache();lsSet(seenKey(),A.today)}
      applyHash();
    };
    if(crossfade&&!matchMedia('(prefers-reduced-motion: reduce)').matches){hero.classList.add('fade');setTimeout(paint,180)}
    else paint();
  }).catch(function(e){
    clearTimeout(timer);
    try{console.warn('[proprietario] lettura non riuscita:',e&&e.message)}catch(_){}
    showError();
  });
}

function closeSheet(){
  if(!SHEET.open)return;
  var done=function(){SHEET.classList.remove('closing');SHEET.style.transform='';SHEET.style.transition='';
    if(typeof SHEET.close==='function')SHEET.close();else SHEET.removeAttribute('open');
    if(TRIG&&document.contains(TRIG)){try{TRIG.focus({preventScroll:true})}catch(e){}}TRIG=null};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}
  SHEET.classList.add('closing');setTimeout(done,220);
}
SHEET.addEventListener('cancel',function(e){e.preventDefault();closeSheet()});

/* trascina giù per chiudere: distanza O velocità, come un foglio di iOS */
(function(){
  var top=$('sheetTop'),y0=0,t0=0,dy=0,drag=false;
  top.addEventListener('pointerdown',function(e){if(e.target.closest('.sh-x'))return;drag=true;y0=e.clientY;t0=performance.now();dy=0;SHEET.style.transition='none';try{top.setPointerCapture(e.pointerId)}catch(_){}});
  top.addEventListener('pointermove',function(e){if(!drag)return;dy=Math.max(0,e.clientY-y0);SHEET.style.transform='translateY('+dy+'px)'});
  var end=function(){if(!drag)return;drag=false;var v=dy/Math.max(1,performance.now()-t0);SHEET.style.transition='';
    if(dy>110||(v>.55&&dy>24))closeSheet();else SHEET.style.transform=''};
  top.addEventListener('pointerup',end);top.addEventListener('pointercancel',end);
})();

  return '<div class="srow"><div class="sr-top"><b>'+esc(cap(M(r.month||String(r.dueDate||'').slice(0,7))))+'</b><span class="amt">'+esc(r.amount!=null?E(r.amount):t('row.no_amount'))+'</span></div>'
    +(whoOf(r)?'<p class="q who">'+esc(whoOf(r))+'</p>':'')
    +'<p'+cls+'>'+esc(rowSentence(r))+'</p>'
    +(r.dueDate&&r.state!=='overdue'&&r.state!=='due'?'<p class="q">'+esc(cap(t('sheet.due',{date:D(r.dueDate)})))+'</p>':'')
    +(r.reminders&&r.reminders.count?'<p class="q">'+esc(cap(t('row.reminders',{n:r.reminders.count,date:D(r.reminders.last)})))+'</p>':'')+'</div>';
}
function statementFor(ym){

function monthSheet(pid,ym,trig){

function yearSheet(pid,trig){

  var rows=(y.rowIds||[]).map(function(id){return ROWS[pid+'|'+id]}).filter(Boolean);

function infoSheet(ref,trig,msg){
  var it=ITEM[ref];if(!it)return;

  if(it.date)lines.push(D(it.date));
  if(it.provenance)lines.push(t('prov.'+it.provenance.event)+' · '+t('by.'+it.provenance.by));

    b+='<div class="sacts"><button type="button" class="gbtn" data-open="'+esc(ref)+'">'+esc(t('ui.open'))+'</button>'
      +'<button type="button" class="obtn" data-share="'+esc(ref)+'">'+I_SHARE+' <span>'+esc(t('ui.share'))+'</span></button></div>';
  }

/* ════════════════ UN TOCCO, IL PDF ════════════════
   POST /api/owner/file → biglietto da 60 secondi. Sul telefono si naviga
   (il visore nativo di iOS); sul desktop la finestra si apre DENTRO il
   click, prima di qualunque attesa, o il blocco popup la mangia. */
function fileErrorMsg(code,j){
  if(code==='too_large'){
    var mb=j&&j.size?(LANG==='en'?O.enNum(j.size/1e6,1):O.itNum(j.size/1e6,1)):'';
    return esc(t('file.too_large',{mb:mb}))+'<br><a class="obtn wa" style="margin-top:14px" href="'+esc(wa(''))+'" target="_blank" rel="noopener">'+esc(t('ui.whatsapp'))+'</a>';
  }
  return esc(t('file.error'));
}
function postFile(ref){
  return token().then(function(tok){
    return fetch('/api/owner/file',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify(AS?{ref:ref,as:AS}:{ref:ref})});
  }).then(function(r){return r.json().catch(function(){return null}).then(function(j){return {status:r.status,j:j||{}}})});
}
function openDoc(ref,trig){
  var it=ITEM[ref];
  if(!it||!it.file){infoSheet(ref,trig);return}
  // Un biglietto per volta per documento: il secondo tocco (o il doppio clic
  // sul desktop, che apriva DUE schede) mentre il primo è in volo non fa
  // niente. La chiave è il ref, non il bottone: col bottone smorzato il clic
  // può arrivare alla riga che lo contiene.
  if(BUSY[ref]||(trig&&trig.getAttribute('aria-busy')==='true'))return;
  BUSY[ref]=1;
  var coarse=matchMedia('(pointer: coarse)').matches;
  var w=null;
  if(!coarse){try{w=window.open('','_blank')}catch(e){w=null}}
  if(trig)trig.setAttribute('aria-busy','true');
  var done=function(){delete BUSY[ref];if(trig)trig.removeAttribute('aria-busy')};
  postFile(ref).then(function(x){
    done();
    if(x.status===200&&x.j.ok&&x.j.url){
      var url=new URL(x.j.url,location.origin).href;
      if(w){try{w.location=url;return}catch(e){}}
      location.assign(url);return;
    }
    if(w){try{w.close()}catch(e){}}
    infoSheet(ref,trig,fileErrorMsg(x.j.error,x.j));
  }).catch(function(){
    done();
    if(w){try{w.close()}catch(e){}}
    infoSheet(ref,trig,esc(t('file.error')));
  });
}
/* «Invia al commercialista»: il file arriva col Bearer, poi il foglio di
   condivisione del telefono. Se iOS ha perso il gesto durante l'attesa,
   il secondo tocco condivide il file già pronto (niente seconda lettura). */
function shareDoc(ref,btn){
  var ready=btn._file||FILES[ref];
  if(ready){doShare(ready,btn);return}
  if(btn.getAttribute('aria-busy')==='true')return;
  var lab=btn.querySelector('span');
  btn.setAttribute('aria-busy','true');if(lab)lab.textContent=t('share.preparing');
  token().then(function(tok){
    return fetch('/api/owner/file?ref='+encodeURIComponent(ref)+(AS?'&as='+encodeURIComponent(AS):''),{headers:{Authorization:'Bearer '+tok}});
  }).then(function(r){
    if(!r.ok)return r.json().catch(function(){return {}}).then(function(j){throw {code:j.error,j:j}});
    var cd=r.headers.get('Content-Disposition')||'',m=/filename="([^"]+)"/.exec(cd);
    var name=m?m[1]:'BOOM_documento.pdf',type=(r.headers.get('Content-Type')||'application/pdf').split(';')[0];
    return r.blob().then(function(b){return new File([b],name,{type:type})});
  }).then(function(file){
    btn.removeAttribute('aria-busy');btn._file=file;FILES[ref]=file;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(function(){if(lab)lab.textContent=t('ui.share')}).catch(function(e){
        if(!(e&&e.name==='NotAllowedError')){if(lab)lab.textContent=t('ui.share');return}
        // iOS ha perso il gesto durante l'attesa: il file è pronto, serve un
        // tocco nuovo. Col bottone etichettato lo dice l'etichetta; l'icona
        // della riga non ne ha, quindi si apre il foglio del documento col
        // messaggio e il suo «Invia al commercialista» (già pronto, niente
        // seconda lettura). Prima il primo tocco non diceva niente.
        if(lab)lab.textContent=t('share.tap');
        else infoSheet(ref,btn,esc(t('share.tap')));
      });
    }else{download(file);if(lab)lab.textContent=t('ui.share')}
  }).catch(function(e){
    btn.removeAttribute('aria-busy');if(lab)lab.textContent=t('ui.share');
    infoSheet(ref,SHEET.open?TRIG:btn,fileErrorMsg(e&&e.code,e&&e.j));
  });
}
function doShare(file,btn){
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file]}).catch(function(){});
  else download(file);
}
function download(file){
  var u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},4000);
}

/* ════════════════ I LINK PROFONDI ════════════════
   #p= casa · #c= contratto · #r=AAAA-MM rendiconto · #doc= documento · #q= ricerca */
function scrollToEl(el){
  if(!el)return;
  var d=el.closest('details');if(d)d.open=true;
  // Si scorre la FINESTRA, non scrollIntoView: la casa ha overflow nascosto
  // (è un contenitore di scorrimento) e scrollIntoView scorreva anche lei,
  // tagliandone la testa — col margine alto del «vedi come» il contratto
  // atterrava sotto la banda. Il margine è quello del CSS (scroll-margin-top).
  var sm=parseFloat(getComputedStyle(el).scrollMarginTop)||0;
  window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+(window.pageYOffset||0)-sm),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  var h=el.closest('.house');if(h){h.classList.remove('flash');void h.offsetWidth;h.classList.add('flash')}
}
function applyHash(){
  if(!A)return;
  var h=location.hash.replace(/^#/,'');if(!h)return;
  var i=h.indexOf('='),k=i>0?h.slice(0,i):h,v='';
  try{v=decodeURIComponent(i>0?h.slice(i+1):'')}catch(e){v=''}
  if(k==='p')scrollToEl(document.querySelector('[data-property-id="'+cssEsc(v)+'"]'));
  else if(k==='c')scrollToEl(document.querySelector('[data-contract-id="'+cssEsc(v)+'"]'));
  else if(k==='r'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(v)){
    var st=statementFor(v)[0];
    if(st)infoSheet(st.ref,null);
    else{var pid=Object.keys(PROP).filter(function(id){return (PROP[id].ribbon.months||[]).some(function(m){return m.ym===v})})[0];if(pid)monthSheet(pid,v,null)}
  }
  else if(k==='doc'&&ITEM[v])infoSheet(v,null);
  else if(k==='q'&&$('q')){$('q').value=v;runSearch();scrollToEl($('archivio'))}
}
function cssEsc(s){return window.CSS&&CSS.escape?CSS.escape(s):String(s).replace(/["\\]/g,'\\$&')}
window.addEventListener('hashchange',applyHash);

/* ════════════════ I GESTI (delega unica) ════════════════ */
function onClick(e){
  var el;
  if((el=e.target.closest('[data-goto]'))){e.preventDefault();var g=el.getAttribute('data-goto');
    if(location.hash==='#'+g)applyHash();else location.hash=g;return}
  if((el=e.target.closest('[data-open]'))){openDoc(el.getAttribute('data-open'),el);return}
  if((el=e.target.closest('[data-share]'))){shareDoc(el.getAttribute('data-share'),el);return}
  if((el=e.target.closest('[data-info]'))){infoSheet(el.getAttribute('data-info'),el);return}
  if((el=e.target.closest('[data-ym]'))){monthSheet(el.getAttribute('data-pid'),el.getAttribute('data-ym'),el);return}
  if((el=e.target.closest('[data-year]'))){yearSheet(el.getAttribute('data-year'),el);return}
  if((el=e.target.closest('[data-ref]'))){var b=e.target.closest('button')||el;openDoc(el.getAttribute('data-ref'),b);return}
  if(e.target.closest('#newchip')){ONLY_NEW=!ONLY_NEW;$('newchip').setAttribute('aria-pressed',ONLY_NEW?'true':'false');if($('q'))$('q').value='';runSearch();return}
}
