<!--
  L'ARCHIVIO DEL PROPRIETARIO (/proprietario) — la faccia.

  Un'app a tre stanze (24/09/2026 — «troppo basilare, identico all'altro»:
  la pagina era vestita coi token di /casa, e il proprietario non è chi ci
  abita). OGGI: la risposta in una frase, ciò che deve fare LUI, tre numeri
  veri (pagato quest'anno · prossima rata · fine del contratto), cosa è
  arrivato. CASE: una carta per casa (il portafoglio), poi la casa come un
  pass — l'anello dei giorni del contratto, la sua vita in verticale coi
  documenti attaccati, i canoni come capsule, interventi, immobile. ARCHIVIO:
  quattro cartelle e la linea del tempo per mese, la ricerca, i buchi
  dichiarati. Ogni numero apre la sua prova, ogni documento dice da dove
  viene, e ciò che il sistema non sa esce come «non lo so». L'indirizzo
  segue la stanza (#oggi · #case · #p= · #archivio), «indietro» funziona.

  REGOLE DURE DI QUESTA PAGINA
   1. I dati arrivano SOLO da GET /api/owner/archivio (la proiezione già
      pulita dal server, assertClean) e i file SOLO da /api/owner/file con
      un biglietto da 60 secondi. Nessuna lettura Firestore dal browser:
      le regole la negano comunque al proprietario (22/09/2026).
   2. Il token viene dall'utente che BoomPortal.requireAuth consegna, a
      ogni chiamata (dura un'ora e si rinnova da solo).
   3. Nessuna formattazione della macchina: importi e date passano dai
      formattatori deterministici del motore (window.BOOM_OWNER), le parole
      dal suo STRINGS — una copia sola per pagina, email e test.
   4. Nessuna analytics: l'indirizzo in modalità «vedi come» porta l'uid
      del proprietario, e non deve uscire di casa.
   5. Il puntino d'oro «respira» SOLO su un «in ordine» verificato; tutto il
      movimento sta dentro prefers-reduced-motion: no-preference.
  Test: node tests/owner/ui.mjs · node tests/safari/boot.mjs
-->
<style>
/* ════════════════════════════════════════════════════════════════════════
   TITANIO — la faccia del PROPRIETARIO (24/09/2026).
   /casa è la casa di chi ci abita: nero assoluto, oro, pagina lunga. Questo
   è il patrimonio di chi la possiede: un'app a tre stanze (Oggi · Case ·
   Archivio), grafite e platino, l'oro SOLO dove dice uno stato. Mai gli
   stessi token di /casa (tests/owner/ui.mjs lo controlla).
   ════════════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090B;--raise:#121215;--raise2:#18181C;
  --card:linear-gradient(180deg,rgba(255,255,255,.058),rgba(255,255,255,.028));
  --fill:rgba(118,118,128,.18);--fill2:rgba(118,118,128,.28);
  --hair:rgba(255,255,255,.085);--hair2:rgba(255,255,255,.05);
  --ink:#F5F5F7;--ink2:rgba(235,235,245,.76);--ink3:rgba(235,235,245,.52);--ink4:rgba(235,235,245,.3);
  --gold:#D4AF37;--gold-hi:#F2DB93;--gold-soft:rgba(212,175,55,.13);--gold-line:rgba(212,175,55,.36);
  --red:#FF6A5C;--red-soft:rgba(255,106,92,.14);--amber:#F2B558;--wa:#30D158;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.36,.64,1);
  --r:22px;--rs:14px;--bar:54px;--tab:60px;--rail:244px;
  --top:calc(var(--bar) + env(safe-area-inset-top,0px));--safe:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:tabular-nums;min-height:100vh;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit}
a{color:inherit}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
::selection{background:rgba(212,175,55,.32)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* la luce: una sola, fredda, dall'alto — il titanio, non l'aurora d'oro di /casa */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .lt{position:absolute;left:50%;top:-38vmax;width:130vmax;height:80vmax;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(190,200,220,.085),rgba(190,200,220,.02) 55%,transparent);filter:blur(30px)}
.bg .gl{position:absolute;right:-20vmax;top:-10vmax;width:60vmax;height:60vmax;border-radius:50%;
  background:radial-gradient(closest-side,rgba(212,175,55,.06),transparent);filter:blur(40px)}

/* ── la barra ── */
header{position:sticky;top:0;z-index:60;height:var(--top);padding-top:env(safe-area-inset-top,0px);
  background:rgba(9,9,11,.72);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid transparent;transition:border-color .25s}
header.lined{border-bottom-color:var(--hair2)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--bar);padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;justify-self:start}
.brand .mark{filter:drop-shadow(0 0 8px rgba(212,175,55,.3))}
.brand b{font-weight:600;font-size:13px;letter-spacing:3.2px}
.hl{font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;
  opacity:0;transform:translateY(4px);transition:opacity .2s,transform .25s var(--ease)}
header.lined .hl,body:not(.ready) .hl{opacity:1;transform:none}
.hr{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.hbtn{min-height:40px;min-width:40px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:500;color:var(--ink3)}
.hbtn:hover{color:var(--ink)}

/* ── la banda del «vedi come» ── */
#adminband{position:sticky;top:var(--top);z-index:55;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 16px;background:rgba(40,32,10,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--gold-line);font-size:12.5px;line-height:1.45;color:var(--gold-hi)}
#adminband span{flex:1 1 240px;min-width:0}
#adminband a{flex:none;min-height:34px;display:inline-flex;align-items:center;border:1px solid var(--gold-line);border-radius:100px;padding:0 14px;
  font-size:12px;font-weight:600;text-decoration:none;color:var(--gold)}

/* ── le stanze: barra in basso sul telefono, colonna a sinistra sul desktop ── */
.tabs{position:fixed;z-index:58;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);
  height:calc(var(--tab) + var(--safe));padding:0 8px var(--safe);
  background:rgba(14,14,17,.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
  border-top:1px solid var(--hair2)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;
  font-size:10.5px;font-weight:500;letter-spacing:.1px;color:var(--ink4);transition:color .2s}
.tab svg{width:25px;height:25px;transition:transform .35s var(--spring)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--gold)}
.tab:active svg{transform:scale(.88)}
.tab .bd{position:absolute;top:6px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--gold);
  color:#1a1405;font-size:10.5px;font-weight:700;line-height:17px;text-align:center}
.tab .bd.red{background:var(--red);color:#fff}
main{position:relative;z-index:1;padding-bottom:calc(var(--tab) + var(--safe) + 28px)}
@media(min-width:1024px){
  .tabs{top:calc(var(--top) + var(--band0,0px));bottom:auto;right:auto;width:var(--rail);height:auto;grid-template-columns:1fr;gap:2px;
    padding:28px 14px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:none}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;font-size:15px;color:var(--ink3)}
  .tab svg{width:21px;height:21px}
  .tab:hover{background:rgba(255,255,255,.04);color:var(--ink)}
  .tab[aria-current="page"]{background:rgba(255,255,255,.075)}
  .tab .bd{position:static;margin-left:auto}
  main{padding-left:var(--rail);padding-bottom:64px}
  .hl{max-width:40vw}
}

/* ── carico, errore ── */
#load{display:grid;place-items:center;gap:16px;text-align:center;padding:130px 20px;color:var(--ink3);font-size:13px}
@media(prefers-reduced-motion:no-preference){#load .mark{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}}
.errcard{max-width:520px;margin:48px auto 0;padding:30px 22px;border:1px solid var(--hair);border-radius:var(--r);background:var(--card);text-align:center}
.errcard h2{font-weight:600;font-size:22px;letter-spacing:-.4px;line-height:1.25}
.errcard .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* ── la stanza ── */
.view{max-width:820px;margin:0 auto;padding:10px 20px 20px}
@media(min-width:1024px){.view{padding:34px 48px 20px}}
.ltitle{font-size:34px;font-weight:700;letter-spacing:-.9px;line-height:1.1;margin:6px 0 4px}
.lsub{font-size:15px;color:var(--ink3);margin-bottom:6px}
@media(prefers-reduced-motion:no-preference){.view.in{animation:vin .42s var(--ease) both}@keyframes vin{from{opacity:0;transform:translateY(8px)}}}
.sec{margin-top:34px}
.sech{display:flex;align-items:baseline;gap:10px;font-size:21px;font-weight:700;letter-spacing:-.45px;margin-bottom:12px}
.sech .n{font-size:13px;font-weight:600;color:var(--ink3)}
.sech a,.sech button.more{margin-left:auto;font-size:14px;font-weight:500;color:var(--gold);text-decoration:none}
.card{background:var(--card);border:1px solid var(--hair2);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.note{font-size:13px;line-height:1.5;color:var(--ink3);margin-top:12px}
section,article,[data-contract-id],.hsec{scroll-margin-top:calc(var(--top) + 72px)}
body.va section,body.va article,body.va [data-contract-id],body.va .hsec{scroll-margin-top:calc(var(--top) + 72px + var(--band,58px))}

/* i puntini: lo stato, mai decorazione. Respira SOLO l'«in ordine». */
.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;vertical-align:middle;background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink4)}
.dot[data-dot="ok"]{background:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.55)}
.dot[data-dot="tu"]{box-shadow:inset 0 0 0 1.8px var(--gold)}
.dot[data-dot="osservo"]{background:var(--red);box-shadow:0 0 10px rgba(255,106,92,.45)}
.dot[data-dot="nonso"]{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.dot[data-dot="vuoto"]{box-shadow:inset 0 0 0 1.5px var(--ink4)}
@media(prefers-reduced-motion:no-preference){
  .dot[data-dot="ok"]{animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 6px rgba(212,175,55,.35);opacity:.82}50%{box-shadow:0 0 16px rgba(212,175,55,.75);opacity:1}}
}

/* ════ OGGI ════ */
#hero{position:relative;padding-top:8px}
#hero.dim{opacity:.55}
@media(prefers-reduced-motion:no-preference){#hero.fade{opacity:0;transition:opacity .18s}#hero{transition:opacity .3s}}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.eyebrow .dot{width:10px;height:10px}
.verdict{font-size:clamp(36px,9.6vw,58px);font-weight:700;letter-spacing:-.045em;line-height:1.04;margin-top:14px;overflow-wrap:anywhere}
#hero[data-state="ok"] .verdict{background:linear-gradient(180deg,#FFFFFF 30%,var(--gold-hi) 135%);-webkit-background-clip:text;background-clip:text;color:transparent}
.verdict .rem{display:block;font-size:17px;font-weight:500;letter-spacing:-.2px;line-height:1.4;color:var(--ink2);margin-top:12px;
  -webkit-text-fill-color:var(--ink2)}
.verdict .verif{display:block;font-size:14px;font-weight:500;color:var(--ink3);margin-top:10px}
.vcta{font-size:16px;line-height:1.55;color:var(--ink2);margin-top:14px;max-width:520px}
.sweep{height:1px;margin:22px 0 0;background:linear-gradient(90deg,var(--gold),rgba(212,175,55,.18) 55%,transparent);transform-origin:left;opacity:.5}
@media(prefers-reduced-motion:no-preference){.sweep.go{animation:sweep 1.1s var(--ease) both}@keyframes sweep{from{transform:scaleX(0);opacity:1}60%{opacity:1}to{transform:scaleX(1);opacity:.5}}}
.reasons{list-style:none;margin-top:16px;display:grid;gap:8px}
.reasons li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.45;color:var(--ink2)}
.reasons li::before{content:'';position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--ink4)}
.reasons li.warn::before{background:var(--amber)}
.reasons button{text-align:left;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
/* l'elenco raggruppato di iOS */
.group{list-style:none;margin-top:20px;background:var(--card);border:1px solid var(--hair2);border-radius:18px;overflow:hidden}
.group>li+li{border-top:1px solid var(--hair2)}
.hfact{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px;min-height:58px}
.hfact:active,.frow:active,.arow-main:active{background:rgba(255,255,255,.04)}
.hfact .dot{margin-top:6px}
.hfact .tx{flex:1;min-width:0}
.hfact b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px}
.hfact small{display:block;font-size:13px;line-height:1.45;color:var(--ink3);margin-top:2px}
.go{flex:none;color:var(--ink4);margin-top:3px}
.hmore{display:inline-block;margin-top:10px;font-size:14px;font-weight:500;color:var(--gold);text-decoration:none}
.hfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--ink3)}
.hfoot .none{color:var(--ink2);font-weight:500}
/* il polso: tre numeri veri */
.pulse{display:grid;grid-template-columns:1fr;gap:10px;margin-top:26px}
@media(min-width:620px){.pulse{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--hair2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);text-align:left;min-width:0}
button.tile{transition:transform .25s var(--spring),border-color .2s}
button.tile:hover{border-color:var(--hair)}
button.tile:active{transform:scale(.975)}
.tile .k{font-size:12.5px;font-weight:600;color:var(--ink3);line-height:1.3}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.7px;line-height:1.1;white-space:nowrap}
.tile .v.sm{font-size:16px;font-weight:500;letter-spacing:-.1px;color:var(--ink2);white-space:normal}
@media(max-width:619px){.tile{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 14px}.tile .k{grid-column:1}.tile .v{grid-column:2;grid-row:1/3;text-align:right;font-size:24px}.tile .v.sm{font-size:14px}.tile .s{grid-column:1}}
.tile .s{font-size:12.5px;color:var(--ink3);line-height:1.35}
.tile .v.gold{color:var(--gold-hi)}
.tile .v.red{color:var(--red)}
/* da fare */
.todo{list-style:none;display:grid;gap:10px}
.todo>li{padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--gold-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.todo h3{font-size:17px;font-weight:600;letter-spacing:-.3px;line-height:1.3}
.todo p{font-size:13.5px;color:var(--ink3);margin-top:5px;line-height:1.5}
.todo .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:13px;color:var(--ink3)}
.todo .late{color:var(--red);font-weight:500}
.todo .lr{font-family:var(--mono);font-size:11.5px}
.todo .act{margin-top:14px}
.todo .hid{font-size:12.5px;color:var(--amber);margin-top:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pills span{font-size:12px;padding:5px 10px;border-radius:100px;background:var(--fill);color:var(--ink2)}
/* bottoni */
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:100px;
  background:linear-gradient(180deg,#E7C865,var(--gold));color:#1A1405;font-size:15px;font-weight:600;text-decoration:none;
  box-shadow:0 6px 20px -8px rgba(212,175,55,.7),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s var(--spring),filter .2s}
.gbtn:hover{filter:brightness(1.05)}
.gbtn:active{transform:scale(.97)}
.obtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:100px;
  background:var(--fill);color:var(--ink);font-size:15px;font-weight:500;text-decoration:none;transition:background .2s,transform .25s var(--spring)}
.obtn:hover{background:var(--fill2)}
.obtn:active{transform:scale(.97)}
.obtn.wa{color:var(--wa)}
.obtn[aria-busy="true"],.gbtn[aria-busy="true"]{opacity:.55;pointer-events:none}
/* il feed: cosa è arrivato */
.frow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:60px}
.frow .tx{flex:1;min-width:0}
.frow b{display:block;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow small{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .nu,.arow .nu{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:7px;vertical-align:middle;box-shadow:0 0 8px rgba(212,175,55,.7)}
/* le icone dei documenti: il colore dice la cartella */
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--gold-hi);
  background:linear-gradient(160deg,rgba(212,175,55,.22),rgba(212,175,55,.07));box-shadow:inset 0 0 0 1px rgba(212,175,55,.22)}
.ic[data-f="consegna"]{color:#9FD5C9;background:linear-gradient(160deg,rgba(120,200,185,.22),rgba(120,200,185,.07));box-shadow:inset 0 0 0 1px rgba(120,200,185,.22)}
.ic[data-f="soldi"]{color:#B9D59A;background:linear-gradient(160deg,rgba(150,200,110,.2),rgba(150,200,110,.06));box-shadow:inset 0 0 0 1px rgba(150,200,110,.2)}
.ic[data-f="immobile"]{color:#C6C3E6;background:linear-gradient(160deg,rgba(170,165,230,.2),rgba(170,165,230,.06));box-shadow:inset 0 0 0 1px rgba(170,165,230,.2)}
/* il riferimento */
.advisor{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px}
.advisor .av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#000;box-shadow:inset 0 0 0 1px var(--gold-line)}
.advisor .who{flex:1 1 150px;min-width:0}
.advisor small{display:block;font-size:12.5px;color:var(--ink3)}
.advisor b{display:block;font-size:17px;font-weight:600;letter-spacing:-.3px}
.advisor .acts{display:flex;gap:8px;flex:1 1 220px}
.advisor .acts>*{flex:1}
.intro{display:inline-block;margin-top:14px;font-size:14px;font-weight:500;color:var(--gold);text-decoration:none}
.legal{font-size:11.5px;line-height:1.7;color:var(--ink4);margin-top:22px}

/* ════ CASE ════ */
.wallet{display:grid;gap:14px;margin-top:18px}
@media(min-width:760px){.wallet{grid-template-columns:1fr 1fr}}
.pcard{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:196px;padding:20px;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(212,175,55,.18),transparent 55%),linear-gradient(155deg,#26262B,#141417 60%,#0E0E10);
  border:1px solid var(--hair);box-shadow:0 18px 40px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.1);text-align:left;transition:transform .35s var(--spring)}
.pcard::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.07) 48%,transparent 60%);
  transform:translateX(-60%);transition:transform .9s var(--ease);pointer-events:none}
.pcard:hover::after{transform:translateX(60%)}
.pcard:active{transform:scale(.985)}
.pcard .top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.pcard .top span{display:flex;align-items:center;gap:8px}
.pcard h3{font-size:25px;font-weight:700;letter-spacing:-.6px;line-height:1.15}
.pcard p{font-size:13.5px;color:var(--ink2);margin-top:4px}
.mini{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px}
.mini i{height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
.mini i[data-s="paid"]{background:var(--gold)}
.mini i[data-s="overdue"]{background:var(--red)}
.mini i[data-s="due"],.mini i[data-s="reported"],.mini i[data-s="processing"]{background:rgba(212,175,55,.45)}
.mini i[data-s="fuori"]{background:rgba(255,255,255,.04)}
.hback{text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:40px;margin:2px 0 0 -6px;padding:0 6px;font-size:16px;color:var(--gold)}
/* la casa */
.house{margin-top:14px;border-radius:26px}
.house.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 1px rgba(212,175,55,.6)}100%{box-shadow:0 0 0 1px rgba(212,175,55,0)}}
@media(prefers-reduced-motion:reduce){.house.flash{animation:none}}
.hpass{position:relative;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:22px;border-radius:26px;overflow:hidden;
  background:radial-gradient(110% 100% at 100% 0%,rgba(212,175,55,.16),transparent 55%),linear-gradient(160deg,#232328,#131316 65%);
  border:1px solid var(--hair);box-shadow:0 24px 50px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.09)}
.hpass .hp-tx{flex:1 1 220px;min-width:0}
.h-st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.h-name{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin-top:10px;overflow-wrap:anywhere}
.h-addr{font-size:14.5px;color:var(--ink2);margin-top:4px}
.h-cat{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:10px;letter-spacing:0}
.h-cat.miss{font-family:var(--font);color:var(--amber);font-size:13px}
.facts{list-style:none;margin-top:12px;display:grid;gap:4px;font-size:13.5px;color:var(--ink2)}
.facts button{text-align:left;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
/* l'anello: dove sei nella vita del contratto */
.ring{position:relative;flex:none;width:124px;height:124px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
.ring .pg{fill:none;stroke:url(#ringGold);stroke-width:9;stroke-linecap:round}
@media(prefers-reduced-motion:no-preference){.ring .pg{transition:stroke-dashoffset 1.2s var(--ease)}}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1}
.ring .c small{font-size:10px;font-weight:600;color:var(--ink3);margin:4px auto 0;line-height:1.2;max-width:70px}
.ring-cap{font-size:12px;color:var(--ink3);text-align:center;margin-top:6px}
/* il salto fra le parti della casa */
.jump{position:sticky;top:calc(var(--top) + 8px);z-index:20;display:flex;gap:6px;margin:16px -4px 0;padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none;
  background:rgba(22,22,26,.82);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--hair2)}
.jump::-webkit-scrollbar{display:none}
body.va .jump{top:calc(var(--top) + 8px + var(--band,58px))}
.jump button{flex:1 0 auto;min-height:36px;padding:0 11px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink3);white-space:nowrap;transition:background .25s,color .25s}
.jump button[aria-current="true"]{background:rgba(255,255,255,.12);color:var(--ink)}
.hsec{margin-top:30px}
.hsec>h4{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-bottom:12px}
.hsec>h4 small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:6px;letter-spacing:0}
/* il contratto */
.ct{padding:20px;margin-top:10px}
.ct:first-of-type{margin-top:0}
.ct-title{font-size:18px;font-weight:650;letter-spacing:-.35px;line-height:1.3}
.ct-title .co{font-weight:500;color:var(--ink3);font-size:15px}
.ct-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:100px;background:var(--fill);font-size:12px;font-weight:600;color:var(--ink2)}
.tag.gold{background:var(--gold-soft);color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold-line)}
.tag.amber{background:rgba(242,181,88,.16);color:var(--amber)}
.kv{list-style:none;margin-top:14px;display:grid;gap:6px;font-size:14.5px;color:var(--ink2);line-height:1.45}
.kv .q{font-size:12.5px;color:var(--ink3)}
/* la vita del contratto: una linea verticale, l'oro fin dove sei arrivato */
.jt{font-size:12.5px;font-weight:600;color:var(--ink3);margin:22px 0 4px}
.linea{list-style:none;position:relative}
.linea li{position:relative;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0}
.linea li::before{content:'';position:absolute;left:14px;top:26px;bottom:-12px;width:2px;border-radius:1px;background:var(--hair)}
.linea li:last-child::before{display:none}
.linea li.done::before{background:linear-gradient(180deg,var(--gold),rgba(212,175,55,.55))}
.rc-m{display:grid;place-items:center;width:30px;height:30px}
.rc-m i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink4);background:var(--bg)}
.done .rc-m i{background:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
.unknown .rc-m i,.conflict .rc-m i{box-shadow:inset 0 0 0 2px var(--amber)}
.skipped .rc-m i{box-shadow:inset 0 0 0 2px var(--ink4);opacity:.5}
.rc-aereo{width:22px;height:22px;color:var(--gold);transform:rotate(180deg);filter:drop-shadow(0 0 8px rgba(212,175,55,.6))}
@media(prefers-reduced-motion:no-preference){.now .rc-aereo{animation:glide 2.8s ease-in-out infinite}@keyframes glide{50%{opacity:.6}}}
.rc-b{min-width:0;padding-top:4px}
.rc-b>b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px}
.rc-b>b a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold-line)}
.todo .rc-b>b,.now .rc-b>b{color:var(--ink)}
.linea li:not(.done):not(.now) .rc-b>b{color:var(--ink2);font-weight:500}
.rc-d{display:block;font-size:13px;color:var(--ink3);margin-top:1px}
.rc-d .ds{display:none}
.rc-n{display:block;font-size:12.5px;color:var(--amber);margin-top:2px}
.rc-docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.docchip{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-height:34px;padding:0 12px 0 9px;border-radius:100px;background:var(--fill);
  font-size:13px;font-weight:500;color:var(--ink);transition:background .2s,transform .25s var(--spring)}
.docchip svg{flex:none;color:var(--gold-hi)}
.docchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docchip:hover{background:var(--fill2)}
.docchip:active{transform:scale(.96)}
.arow-main[aria-busy="true"],.aside-b[aria-busy="true"],.docchip[aria-busy="true"],.frow[aria-busy="true"]{opacity:.5;cursor:progress}
@media(prefers-reduced-motion:no-preference){
  .arow-main[aria-busy="true"] .ic,.aside-b[aria-busy="true"] svg,.docchip[aria-busy="true"] svg,.frow[aria-busy="true"] .ic{animation:busy 1s ease-in-out infinite}
  @keyframes busy{50%{opacity:.35}}
}
/* i soldi */
.yline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%;padding:20px;text-align:left;transition:transform .25s var(--spring)}
.yline:active{transform:scale(.985)}
.yk{font-size:13.5px;font-weight:600;color:var(--ink3)}
.yv{display:flex;flex-direction:column;align-items:flex-end;font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.05}
.yv small{font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--ink3);margin-top:5px}
.months{padding:18px 16px 14px;margin-top:10px}
.months .mt{font-size:12.5px;font-weight:600;color:var(--ink3);margin:0 4px 12px}
.nastro{overflow-x:auto;scrollbar-width:none}
.nastro::-webkit-scrollbar{display:none}
.ribbon{display:grid;grid-template-columns:repeat(12,minmax(22px,1fr));gap:5px;min-width:100%}
.rb{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 0 16px;border-radius:10px;min-height:44px}
.rb .ml{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.2px}
.rb .mi{display:none;font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase}
.rb.cur .mi{color:var(--gold-hi)}
@media(max-width:560px){.rb .ml{display:none}.rb .mi{display:block}}
.rb.cur .ml{color:var(--gold-hi)}
.rb .s{width:100%;max-width:26px;height:54px;border-radius:9px;background:rgba(255,255,255,.05);transition:transform .25s var(--spring)}
.rb:active .s{transform:scale(.92)}
.rb[data-state="paid"] .s{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#A8862A);box-shadow:0 6px 16px -8px rgba(212,175,55,.8)}
.rb[data-state="due"] .s{background:none;box-shadow:inset 0 0 0 1.8px var(--gold)}
.rb[data-state="overdue"] .s{background:linear-gradient(180deg,#FF8A7E,var(--red));box-shadow:0 6px 16px -8px rgba(255,106,92,.8)}
.rb[data-state="reported"] .s,.rb[data-state="processing"] .s{background:linear-gradient(0deg,var(--gold) 50%,transparent 50%);box-shadow:inset 0 0 0 1.8px var(--gold)}
.rb[data-state="unknown"] .s{background:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.rb[data-state="empty"] .s{background:none;border:1.5px dashed rgba(255,255,255,.28)}
.rb[data-state="fuori"] .s{background:rgba(255,255,255,.025);height:54px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.rb.cur::after{content:'';position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.rb .cnt{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:#1A1405}
.rb .yl{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--ink4)}
.rb.cur .yl{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 4px 0;font-size:11.5px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px}
.olines{list-style:none;margin-top:10px}
.olines li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 18px;border-top:1px solid var(--hair2);font-size:14.5px}
.olines li:first-child{border-top:none}
.olines .a{font-weight:600}
.olines small{grid-column:1/-1;font-size:12.5px;color:var(--ink3)}
/* interventi */
.mlist{list-style:none}
.mlist li{padding:14px 18px;border-top:1px solid var(--hair2);font-size:14.5px}
.mlist li:first-child{border-top:none}
.mlist b{font-weight:600}
.mlist small{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px}
.past{margin-top:16px}
.past>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;font-size:14px;font-weight:500;color:var(--gold)}
.past>summary::-webkit-details-marker{display:none}
.past>summary::after{content:'›';transition:transform .25s}
.past[open]>summary::after{transform:rotate(90deg)}
.valrow{padding:18px;font-size:14.5px;color:var(--ink2)}

/* ════ ARCHIVIO ════ */
.search{position:sticky;top:calc(var(--top) + 6px);z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding:6px 0;
  background:linear-gradient(180deg,var(--bg) 70%,transparent)}
body.va .search{top:calc(var(--top) + 6px + var(--band,58px))}
.sbox{flex:1 1 260px;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;background:var(--fill);color:var(--ink3)}
.sbox:focus-within{box-shadow:0 0 0 2px var(--gold-line)}
.sbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:17px;letter-spacing:-.2px}
.sbox input::placeholder{color:var(--ink3)}
.sbox input::-webkit-search-cancel-button{filter:invert(1) opacity(.5)}
.sbox kbd{font-family:var(--mono);font-size:11px;color:var(--ink4);border:1px solid var(--hair);border-radius:6px;padding:1px 6px}
@media(pointer:coarse){.sbox kbd{display:none}}
.newchip{min-height:36px;padding:0 14px;border-radius:100px;background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold-line);font-size:13px;font-weight:600;color:var(--gold-hi)}
.newchip[aria-pressed="true"]{background:var(--gold);color:#1A1405}
.folders{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:700px){.folders{grid-template-columns:repeat(4,1fr)}}
.fold{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--hair2);text-align:left;min-width:0;
  transition:transform .25s var(--spring),border-color .2s}
.fold:active{transform:scale(.97)}
.fold[aria-pressed="true"]{border-color:var(--gold-line);box-shadow:inset 0 0 0 1px var(--gold-line)}
.fold b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px}
.fold small{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.fold .ic{width:38px;height:38px;border-radius:11px}
.fclear{display:inline-flex;align-items:center;gap:6px;min-height:34px;margin-top:12px;padding:0 12px;border-radius:100px;background:var(--fill);font-size:13px;font-weight:500}
.agroup{margin-top:24px}
.agroup>h3{font-size:13px;font-weight:600;color:var(--ink3);margin:0 4px 8px;text-transform:uppercase;letter-spacing:.5px}
.alist{list-style:none;background:var(--card);border:1px solid var(--hair2);border-radius:18px;overflow:hidden}
#sheetBody .alist{background:none;border:none;border-radius:0}
.arow{display:flex;align-items:center;gap:2px;padding-right:6px}
.arow+.arow{border-top:1px solid var(--hair2)}
.arow-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;min-height:62px;text-align:left}
.ab{flex:1;min-width:0}
.at{display:block;font-size:15px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.as{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.as .st{color:var(--gold-hi)}
.path{display:block;font-size:11.5px;color:var(--ink4);margin-top:2px}
.aside-b{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.aside-b:hover{background:var(--fill);color:var(--ink)}
.arow.nofile .ic{opacity:.55}
.arow.ghost{opacity:.85}
.arow.ghost .ic{background:none;box-shadow:inset 0 0 0 1.5px var(--ink4);color:var(--ink4)}
.arow.ghost .arow-main{cursor:default}
.missing .alist{background:none;border:1.5px dashed var(--hair)}
.aempty{margin-top:20px;padding:24px 18px;border-radius:18px;background:var(--card);border:1px solid var(--hair2);font-size:14.5px;color:var(--ink2);line-height:1.55}
.secure{display:flex;gap:10px;align-items:flex-start;margin-top:26px;font-size:12.5px;line-height:1.5;color:var(--ink3)}
.secure svg{flex:none;margin-top:1px;color:var(--ink4)}

/* ── dialog#sheet: il foglio unico delle prove ── */
#sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:560px;max-height:min(86vh,760px);padding:0;border:1px solid var(--hair);border-bottom:none;
  border-radius:26px 26px 0 0;background:#161619;color:var(--ink);display:none;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
#sheet[open]{display:flex}
#sheet::backdrop{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@media(prefers-reduced-motion:no-preference){
  #sheet[open]{animation:shUp .34s var(--ease)}
  @keyframes shUp{from{transform:translateY(100%)}to{transform:none}}
  #sheet.closing{transform:translateY(105%)!important;transition:transform .22s ease-in}
  #sheet[open]::backdrop{animation:bdIn .3s ease}
  @keyframes bdIn{from{opacity:0}}
}
@media(min-width:700px){#sheet{inset:0;margin:auto;border-radius:26px;border-bottom:1px solid var(--hair);max-height:min(80vh,720px)}}
.sh-top{flex:none;padding:10px 20px 0;cursor:grab;touch-action:none}
.sh-grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 12px}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-head .tx{flex:1;min-width:0}
.sh-eb{font-size:12.5px;font-weight:600;color:var(--ink3)}
#sheetTitle{font-weight:700;font-size:21px;letter-spacing:-.4px;line-height:1.25;margin-top:3px;overflow-wrap:anywhere}
.sh-x{flex:none;width:34px;height:34px;margin:-2px -6px 0 0;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink2);font-size:20px;line-height:1}
.sh-x:hover{color:var(--ink)}
#sheetBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 20px calc(24px + var(--safe))}
.srow{padding:13px 0;border-top:1px solid var(--hair2)}
.srow:first-child{border-top:none}
.sr-top{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sr-top b{font-weight:600}
.sr-top .amt{font-weight:600}
.srow p{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.5}
.srow p.q{color:var(--ink3);font-size:12.5px}
.srow p.late{color:var(--red)}
.stot{display:flex;justify-content:space-between;gap:12px;margin-top:6px;padding-top:14px;border-top:1px solid var(--hair);font-size:15px}
.stot b{font-weight:600}
.stot span{font-weight:700}
.ssec{font-size:12.5px;font-weight:600;color:var(--ink3);margin:20px 0 6px}
.sacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.sacts>*{flex:1 1 180px}
.pline{font-size:14px;color:var(--ink2);line-height:1.55;padding:10px 0;border-top:1px solid var(--hair2)}
.pline:first-child{border-top:none}
.smsg{font-size:14.5px;color:var(--ink2);line-height:1.6}
.smsg.err{color:var(--gold-hi)}

@media(max-width:360px){
  .verdict{font-size:33px}
  .h-name{font-size:26px}
  .ring{width:100px;height:100px}
  .ring .c b{font-size:24px}
  .yv{font-size:29px}
  .hpass,.ct{padding:18px}
}
@media print{header,.tabs,#adminband,.bg,.jump{display:none!important}main{padding:0}}
</style>

<script>
(function(){
'use strict';
var O=window.BOOM_OWNER;
var $=function(id){return document.getElementById(id)};
var APP=$('app');

/* ── Lingua: italiano di default, MAI dedotta dal browser. ?lang=en o il
   bottone, ricordata per questo browser (try/catch: Safari privato lancia). ── */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var QS=new URLSearchParams(location.search);
var LANG=(function(){var q=QS.get('lang');if(q==='en'||q==='it'){lsSet('boom:proprietario:lang',q);return q}
  var s=lsGet('boom:proprietario:lang');return s==='en'?'en':'it'})();
var AS=QS.get('as')||null;

/* La carta NFC porta ?via=carta: è un indirizzo, non una credenziale. Lo
   togliamo subito, così non finisce in un link copiato o nel ritorno. */
if(QS.has('via')){QS.delete('via');var qs=QS.toString();
  try{history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash)}catch(e){}}

/* Ogni parola della pagina viene dal motore (STRINGS it/en): nessuna
   tabella locale, così la pagina non può dire una cosa diversa. L'UNICA
   eccezione è la cornice d'errore: se il motore stesso non arriva (rete del
   telefono, un 404 a cavallo di un deploy) la pagina deve comunque dire che
   non riesce, in italiano o in inglese, e offrire WhatsApp — prima restava
   nera con «UI.TITLE». Test di parità: queste frasi e il numero sono quelli
   del motore (tests/owner/ui.mjs). */
var WA_NUMBER='393313251961';
var FALLBACK={
  it:{'ui.title':'Il tuo archivio','ui.exit':'Esci','ui.lang':'English','ui.loading':'Apro il tuo archivio…','ui.close':'Chiudi',
    'ui.error':'Non riesco a leggere il tuo archivio adesso.','ui.retry':'Riprova','ui.whatsapp':'Scrivi su WhatsApp'},
  en:{'ui.title':'Your archive','ui.exit':'Sign out','ui.lang':'Italiano','ui.loading':'Opening your archive…','ui.close':'Close',
    'ui.error':'I can’t read your archive right now.','ui.retry':'Try again','ui.whatsapp':'Write on WhatsApp'}

function t(k,p){if(O)return O.t(k,LANG,p);var f=FALLBACK[LANG][k];return f!=null?f:(FALLBACK.it[k]!=null?FALLBACK.it[k]:'')}
function has(k){return !!(O&&(O.STRINGS[LANG][k]!=null||O.STRINGS.it[k]!=null))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
function D(ymd){return O.dateLong(ymd,LANG)}
function M(ym){return O.monthLabel(ym,LANG)}
function E(n){return O.eur(n,{lang:LANG}).replace('€ ','€\u00a0')}
function monAbbr(ym){var s=O.dateShort(ym+'-01',LANG);return s.split(' ')[1]||''}
function wa(text){return 'https://wa.me/'+(O?O.CONTACT.wa:WA_NUMBER)+(text?'?text='+encodeURIComponent(text):'')}
function mailto(){return 'mailto:'+O.CONTACT.email}

var USER=null,PROFILE=null,A=null,PROP={},ITEM={},ROWS={},INV={},FILES={},BUSY={},SEEN=null,ONLY_NEW=false,LAST_STATE=null;
var ICON={

};

function chrome(){
  document.documentElement.lang=LANG;
  $('hl').textContent=t('ui.title');
  $('lang').textContent=LANG==='it'?'EN':'IT';
  $('lang').setAttribute('aria-label',t('ui.lang'));

  document.title=t('ui.title')+' — BOOM Roma';
}

/* ════════════════ LA RISPOSTA ════════════════ */
function reasonsOf(c){return (A.verdict.reasons||[]).filter(function(r){return r.code===c})}
function verdictSentence(){
  var v=A.verdict,st=v.state,f=reasonsOf;
  if(st==='ok')return {s:t('verdict.ok')};
  if(st==='vuoto')return {s:t('verdict.vuoto')};
  if(st==='nonso')return {s:t('verdict.nonso')};
  if(st==='tu'){
    if(f('sign_needed').length)return {s:t('verdict.tu.sign'),used:'sign_needed'};
    var sc=f('scheda_needed')[0];if(sc)return {s:t('verdict.tu.scheda',{n:sc.n}),used:'scheda_needed'};
    var ds=f('deadline_soon')[0];if(ds)return {s:t('verdict.tu.deadline',{date:D(ds.date)}),used:'deadline_soon'};
    var dov=f('deadline_overdue')[0];if(dov)return {s:t('verdict.tu.deadline_overdue',{date:D(dov.date)}),used:'deadline_overdue'};
    return {s:t('dot.tu')};
  }
  if(st==='osservo'){
    var od=f('rent_overdue');
    if(od.length){
      var rem=od.length===1&&od[0].reminderLast?t('verdict.reminder',{date:D(od[0].reminderLast)}):'';
      return {s:od.length===1?t('verdict.osservo.overdue',{n:1,days:od[0].days}):t('verdict.osservo.overdue',{n:od.length}),rem:rem,used:'rent_overdue'};
    }
    if(f('rent_reported').length)return {s:t('verdict.osservo.reported'),used:'rent_reported'};
    if(f('rent_processing_sepa').length)return {s:t('verdict.osservo.processing_sepa'),used:'rent_processing_sepa'};
    if(f('rent_processing').length)return {s:t('verdict.osservo.processing'),used:'rent_processing'};
    // Gli altri addebiti (saldo deposito, …) hanno la loro frase.
    var co=f('charge_overdue');
    if(co.length===1)return {s:t('verdict.osservo.charge_overdue',{what:whatOf(co[0]),days:co[0].days}),used:'charge_overdue'};
    if(co.length)return {s:t('verdict.osservo.overdue',{n:co.length}),used:'charge_overdue'};
    if(f('charge_reported').length)return {s:t('verdict.osservo.reported'),used:'charge_reported'};
    if(f('charge_processing').length)return {s:t('verdict.osservo.processing'),used:'charge_processing'};
    return {s:t('dot.osservo')};
  }
  return {s:t('dot.'+st)};
}
/* Le righe sotto la frase: ciò che non so e le scadenze passate, max 3. */
var SHOW_REASON=['deadline_overdue','rent_unlinked','rent_amount_missing','rent_state_unknown','rent_month_missing','installments_missing',
  'rented_without_contract','contract_expired_open','multiple_active_contracts','contract_date_conflict','read_partial','registration_unknown',
  'lease_unsigned','charges_after_termination','charge_overdue','charge_reported','charge_processing','charge_state_unknown','charge_amount_missing',
  'signature_unrecorded'];
function whatOf(r){return r&&r.what==='deposit-balance'?t('money.deposit_balance'):t('money.other_charge')}
/* Le stanze: «Interno A · Anna Verdi» — interno e nome come sul contratto. */
function whoOf(x){var b=[];if(x&&x.unit)b.push(t('ui.unit',{unit:x.unit}));if(x&&x.tenantName)b.push(x.tenantName);return b.join(' · ')}
function reasonLines(used){
  var seen={},out=[];
  (A.verdict.reasons||[]).forEach(function(r){
    if(out.length>=3||r.code===used||SHOW_REASON.indexOf(r.code)<0)return;
    var key=r.code+'|'+(r.propertyId||'');if(seen[key])return;seen[key]=1;
    var p={date:r.date?D(r.date):'',month:r.month?M(r.month):'',days:r.days,n:r.n,what:whatOf(r)};
    // Un cessato senza data di cessazione: la frase senza «del {date}».
    var txt=t('reason.'+r.code+(r.code==='charges_after_termination'&&!r.date?'_undated':''),p);
    if(r.code.indexOf('charge_')===0)txt=cap(txt);
    out.push('<li class="'+(r.code==='deadline_overdue'||r.code==='read_partial'?'warn':'')+'">'
      +(r.propertyId&&PROP[r.propertyId]&&A.properties.length>1?'<button type="button" data-goto="p='+esc(r.propertyId)+'">'+esc(txt)+'</button>':esc(txt))+'</li>');
  });
  return out.length?'<ul class="reasons">'+out.join('')+'</ul>':'';
}
function factText(f){
  switch(f.k){
    case 'lease':
      if(f.n>1)return t('facts.leases',{n:f.n});
      // «firma non registrata a sistema» non si incastra in «Contratto … fino al»
      if(f.status==='unrecorded'&&f.to)return t('facts.lease_unrecorded',{date:D(f.to)});
      return f.to?t('facts.lease',{status:t('status.'+f.status),date:D(f.to)}):cap(t('status.'+f.status));
    case 'vacant':return t('facts.vacant');
    case 'no_lease':return t('facts.no_lease');
    case 'month':
      var k='facts.month.'+(f.state==='paid'&&!f.via?'paid_novia':f.state);
      var s=has(k)?t(k,{month:M(f.month),date:f.date?D(f.date):'',days:f.days}):cap(M(f.month))+': '+t('ribbon.'+f.state);
      var who=whoOf(f);
      return who?s+' · '+who:s;
    case 'no_rows':return t('facts.no_rows',{month:M(f.month)});
    case 'deadlines':return t('facts.deadlines',{n:f.n30});
  }
  return '';
}
function heroHtml(){
  var v=A.verdict,st=v.state,vs=verdictSentence(),h='';
  h+='<div class="eyebrow"><span class="dot" data-dot="'+esc(st)+'"></span><span>'+esc(t('ui.eyebrow',{date:D(A.today)}))+'</span></div>';
  h+='<h1 class="verdict" id="verdictTx">'+esc(vs.s)+(vs.rem?'<span class="rem">'+esc(cap(vs.rem.replace(/^·\s*/,'')))+'</span>':'')+'</h1>';
  h+='<div class="sweep" id="sweep"></div>';
  if(st==='vuoto'){
    h+='<p class="vcta">'+esc(t('verdict.vuoto.cta'))+'</p><p style="margin-top:18px"><a class="obtn wa" href="'+esc(wa(''))+'" target="_blank" rel="noopener">'+esc(t('ui.whatsapp'))+'</a></p>';
    h+='<div class="hfoot"><time>'+esc(t('ui.updated',{time:A.updated.time}))+'</time></div>';
    return h;
  }
  h+=reasonLines(vs.used);
  var lines=v.lines||[],shown=lines.slice(0,3);
  if(shown.length){
    h+='<ul class="group hfacts">'+shown.map(function(l){
      var p=PROP[l.propertyId]||{};
      var tx=(l.facts||[]).map(factText).filter(Boolean).join(' · ');
      return '<li><button type="button" class="hfact" data-goto="p='+esc(l.propertyId)+'"><span class="dot" data-dot="'+esc(l.dot)+'" title="'+esc(t('dot.'+l.dot))+'"></span>'
        +'<span class="tx"><b>'+esc(p.label||'')+'</b><small>'+esc(tx)+'</small></span><span class="go">'+I_GO+'</span></button></li>';
    }).join('')+'</ul>';
    if(lines.length>3)h+='<a class="hmore" href="#case">'+esc(t('ui.more_houses',{n:lines.length-3}))+'</a>';
  }
  h+='<div class="hfoot">'+(A.todo.length?'':'<span class="none">'+esc(t('todo.none'))+'</span>')
    +'<time>'+esc(t('ui.updated',{time:A.updated.time}))+'</time></div>';
  return h;
}

/* ════════════════ IL POLSO: tre numeri, tutti dalla proiezione ════════════════ */
function endOf(c){
  var cess=c.status==='terminated'?(c.stages||[]).filter(function(s){return s.key==='cessazione'&&s.date})[0]:null;
  return cess&&(!c.endDate||cess.date<c.endDate)?cess.date:c.endDate;
}
function dayNum(ymd){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd||''));return m?Math.round(Date.UTC(+m[1],+m[2]-1,+m[3])/864e5):null}
function num(n){return LANG==='en'?O.enNum(n,0):O.itNum(n,0)}
function pulseHtml(){
  var ps=A.properties,tiles=[];
  // 1 · pagato dal conduttore quest'anno (la somma che il nastro prova)
  var yr=null,sum=0,cnt=0,allVia=true,with1=[];
  ps.forEach(function(p){var y=p.year;if(y&&(y.paidCount||y.unknownAmountCount)){yr=y.year;sum+=y.paid||0;cnt+=y.paidCount||0;if(!yearAllVia(y,p))allVia=false;with1.push(p)}});
  if(yr){
    var at=with1.length===1?'data-year="'+esc(with1[0].id)+'"':'data-goto="case"';
    tiles.push('<button type="button" class="tile" '+at+'><span class="k">'+esc(allVia?t('money.year',{year:yr}):t('money.year_registered',{year:yr}))+'</span>'
      +'<span class="v gold">'+esc(E(sum))+'</span><span class="s">'+esc(t('money.year_count',{paid:'',n:cnt}).replace(/^\s+/,''))+'</span></button>');
  }
  // 2 · la prossima rata: prima una in ritardo, poi la prima in scadenza
  var late=null,next=null;
  ps.forEach(function(p){(p.rows||[]).forEach(function(r){
    if(r.state==='overdue'&&(!late||r.dueDate<late.r.dueDate))late={p:p,r:r};
    if(r.state==='due'&&(!next||r.dueDate<next.r.dueDate))next={p:p,r:r};
  })});
  var pick=late||next;
  if(pick){
    var r=pick.r,who=ps.length>1?' · '+pick.p.label:'';

  }
  // 3 · la fine più vicina di un contratto in corso
  var near=null;
  ps.forEach(function(p){((p.contracts&&p.contracts.current)||[]).forEach(function(c){var to=endOf(c);if(to&&(!near||to<near.to))near={p:p,c:c,to:to}})});

function rowSentence(r){
  if(r.afterEnd)return t('row.after_end',{date:D(r.afterEnd)});
  if(r.afterTermination)return t('row.after_end_undated');
  switch(r.state){
    case 'paid':return r.paidDate?(r.via?t('row.paid',{date:D(r.paidDate),via:t('via.'+r.via)}):t('row.paid_novia',{date:D(r.paidDate)})):cap(t('ribbon.paid'));
    case 'due':return t('row.due',{date:D(r.dueDate)});
    case 'overdue':return t('row.overdue',{days:r.overdueDays,date:D(r.dueDate)});
    case 'reported':return t('row.reported',{date:D(r.reportedDate)});
    case 'processing':return t(r.sepa?'row.processing_sepa':'row.processing');
    case 'cancelled':return t('row.cancelled');
  }
  return t('row.unknown');
}
function docChip(ref){
  var it=ITEM[ref];if(!it)return '';

function ringHtml(c){
  if(!c||!c.startDate)return '';
  var to=endOf(c),s=dayNum(c.startDate),e=dayNum(to),n=dayNum(A.today);
  if(s==null||e==null||n==null||e<s||n>e)return '';
  var total=e-s+1,d=Math.min(total,Math.max(0,n-s+1));
  var left=c.daysToEnd!=null?c.daysToEnd:e-n;
  var R=50,C=+(2*Math.PI*R).toFixed(2),off=+(C*(1-d/total)).toFixed(2);
  return '<div class="ringw"><div class="ring" role="img" aria-label="'+esc(num(left)+' '+t('ring.left',{n:left})+' · '+(n<s?t('ring.before',{date:D(c.startDate)}):t('ring.day',{d:num(d),total:num(total)})))+'">'
    +'<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tr" cx="60" cy="60" r="'+R+'"/><circle class="pg" cx="60" cy="60" r="'+R+'" style="stroke-dasharray:'+C+';stroke-dashoffset:'+off+'" data-c="'+C+'" data-off="'+off+'"/></svg>'
    +'<div class="c"><b>'+esc(num(left))+'</b><small>'+esc(t('ring.left',{n:left}))+'</small></div></div>'
    +'<div class="ring-cap">'+esc(n<s?t('ring.before',{date:D(c.startDate)}):t('ring.day',{d:num(d),total:num(total)}))+'</div></div>';
}

/* ── la risposta che si conferma da sola: l'ultimo verdetto (niente importi,
   niente nomi) si dipinge smorzato mentre il server risponde ── */
function cacheKey(){return 'boom:proprietario:v1:'+USER.uid}
function paintCached(){
  if(AS)return;
  var c=null;try{c=JSON.parse(lsGet(cacheKey())||'null')}catch(e){c=null}
  if(!c||!c.state||!c.at||Date.now()-Date.parse(c.at)>864e5)return;
  LAST_STATE=c.state;
  var s=c.state==='ok'?t('verdict.ok'):c.state==='nonso'?t('verdict.nonso'):c.state==='vuoto'?t('verdict.vuoto')
    :(c.state==='tu'&&(c.reasonCodes||[]).indexOf('sign_needed')>=0)?t('verdict.tu.sign'):t('dot.'+c.state);
  APP.innerHTML='<section class="view" data-view="oggi"><section id="hero" class="dim" data-state="cached">'
    +'<div class="eyebrow"><span class="dot" data-dot="'+(c.state==='ok'?'nonso':esc(c.state))+'"></span><span>'+esc(t('ui.title'))+'</span></div>'
    +'<h1 class="verdict">'+esc(s)+'<span class="verif">'+esc(t('ui.verifying'))+'</span></h1></section></section>';
  $('load').hidden=true;APP.hidden=false;
}
function saveCache(){
  if(AS||!A||!A.verdict)return;
  lsSet(cacheKey(),JSON.stringify({state:A.verdict.state,reasonCodes:(A.verdict.reasons||[]).map(function(r){return r.code}),at:new Date().toISOString()}));
}
function seenKey(){return 'boom:proprietario:seen:'+USER.uid}

/* ════════════════ IL CARICAMENTO ════════════════ */
function showError(){
  $('load').hidden=true;APP.hidden=false;
  APP.innerHTML='<div class="errcard" role="alert"><svg viewBox="0 0 1024 1024" width="36" height="36" aria-hidden="true" style="opacity:.8"><use href="#boomMark"/></svg>'
    +'<h2 style="margin-top:14px">'+esc(t('ui.error'))+'</h2><div class="acts"><button type="button" class="gbtn" id="retry">'+esc(t('ui.retry'))+'</button>'
    +'<a class="obtn wa" href="'+esc(wa(''))+'" target="_blank" rel="noopener">'+esc(t('ui.whatsapp'))+'</a></div></div>';
  // Senza motore, senza BoomPortal o senza utente non c'è niente da
  // rileggere: «Riprova» ricarica la pagina (prima restava spento, busy).
  $('retry').onclick=function(){
    if(!O||!window.BoomPortal||!USER){location.reload();return}
    this.setAttribute('aria-busy','true');load();
  };
}
function token(){return USER.getIdToken()}
function load(){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort()},20000);
  return Promise.resolve().then(token).then(function(tok){
    return fetch('/api/owner/archivio'+(AS?'?as='+encodeURIComponent(AS):''),{headers:{Authorization:'Bearer '+tok},cache:'no-store',signal:ctl?ctl.signal:undefined});
  }).then(function(r){
    return r.json().catch(function(){return null}).then(function(j){return {status:r.status,j:j}});
  }).then(function(x){
    clearTimeout(timer);
    if(x.status!==200||!x.j||!x.j.ok||!x.j.archive||!x.j.archive.verdict)throw new Error('archivio_'+x.status);
    A=x.j.archive;
    var prevState=LAST_STATE;
    if(!AS){SEEN=lsGet(seenKey());if(SEEN&&!/^\d{4}-\d{2}-\d{2}$/.test(SEEN))SEEN=null}
    var hero=$('hero'),crossfade=!!(hero&&hero.classList.contains('dim'));
    var paint=function(){
      render();
      if(crossfade){var nh=$('hero');if(nh&&!matchMedia('(prefers-reduced-motion: reduce)').matches){nh.classList.add('fade');
        requestAnimationFrame(function(){requestAnimationFrame(function(){nh.classList.remove('fade')})})}}
      var sw=$('sweep');
      if(prevState&&prevState!==A.verdict.state&&sw){sw.classList.add('go')}
      LAST_STATE=A.verdict.state;
      if(!AS){saveCache();lsSet(seenKey(),A.today)}
      applyHash();
    };
    if(crossfade&&!matchMedia('(prefers-reduced-motion: reduce)').matches){hero.classList.add('fade');setTimeout(paint,180)}
    else paint();
  }).catch(function(e){
    clearTimeout(timer);
    try{console.warn('[proprietario] lettura non riuscita:',e&&e.message)}catch(_){}
    showError();
  });
}

var SHEET=$('sheet'),TRIG=null;
function openSheet(eb,title,body,trig){
  // il foglio già aperto si RIUSA: il fuoco deve tornare a chi l'ha aperto per primo

  $('sheetEb').textContent=eb||'';$('sheetTitle').textContent=title||'';$('sheetBody').innerHTML=body||'';
  $('sheetBody').scrollTop=0;
  SHEET.classList.remove('closing');SHEET.style.transform='';

    else{SHEET.setAttribute('open','');try{$('sheetX').focus({preventScroll:true})}catch(e){}}}
}
function closeSheet(){
  if(!SHEET.open)return;
  var done=function(){SHEET.classList.remove('closing');SHEET.style.transform='';SHEET.style.transition='';
    if(typeof SHEET.close==='function')SHEET.close();else SHEET.removeAttribute('open');
    if(TRIG&&document.contains(TRIG)){try{TRIG.focus({preventScroll:true})}catch(e){}}TRIG=null};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}
  SHEET.classList.add('closing');setTimeout(done,220);
}
SHEET.addEventListener('cancel',function(e){e.preventDefault();closeSheet()});
// Safari < 15.4 non ha showModal: il foglio si apre come attributo e Esc lo
// chiudiamo noi (con showModal ci pensa l'evento cancel qui sopra).
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&SHEET.open&&typeof SHEET.showModal!=='function'){e.preventDefault();closeSheet()}});
SHEET.addEventListener('click',function(e){if(e.target===SHEET)closeSheet()});

/* trascina giù per chiudere: distanza O velocità, come un foglio di iOS */
(function(){
  var top=$('sheetTop'),y0=0,t0=0,dy=0,drag=false;
  top.addEventListener('pointerdown',function(e){if(e.target.closest('.sh-x'))return;drag=true;y0=e.clientY;t0=performance.now();dy=0;SHEET.style.transition='none';try{top.setPointerCapture(e.pointerId)}catch(_){}});
  top.addEventListener('pointermove',function(e){if(!drag)return;dy=Math.max(0,e.clientY-y0);SHEET.style.transform='translateY('+dy+'px)'});
  var end=function(){if(!drag)return;drag=false;var v=dy/Math.max(1,performance.now()-t0);SHEET.style.transition='';
    if(dy>110||(v>.55&&dy>24))closeSheet();else SHEET.style.transform=''};
  top.addEventListener('pointerup',end);top.addEventListener('pointercancel',end);
})();

    +(whoOf(r)?'<p class="q who">'+esc(whoOf(r))+'</p>':'')
    +'<p'+cls+'>'+esc(rowSentence(r))+'</p>'
    +(r.dueDate&&r.state!=='overdue'&&r.state!=='due'?'<p class="q">'+esc(cap(t('sheet.due',{date:D(r.dueDate)})))+'</p>':'')
    +(r.reminders&&r.reminders.count?'<p class="q">'+esc(cap(t('row.reminders',{n:r.reminders.count,date:D(r.reminders.last)})))+'</p>':'')+'</div>';
}
function statementFor(ym){
  return A.archive.filter(function(it){return it.kind==='rendiconto'&&it.ref&&it.ref.slice(-7)===ym});
}
function monthSheet(pid,ym,trig){
  var p=PROP[pid];if(!p)return;
  var cell=((p.ribbon||{}).months||[]).filter(function(m){return m.ym===ym})[0];
  var rows=(cell&&cell.rowIds&&cell.rowIds.length?cell.rowIds.map(function(id){return ROWS[pid+'|'+id]}):(p.rows||[]).filter(function(r){return r.month===ym})).filter(Boolean);
  var b='';
  if(rows.length){b+='<div class="ssec">'+esc(t('sheet.rows'))+'</div>'+rows.map(rowBlock).join('')}
  else b+='<p class="smsg">'+esc(cap(t('ribbon.'+(cell?cell.state:'empty'))))+'</p>';
  var st=statementFor(ym);
  if(st.length)b+='<div class="ssec">'+esc(t('sheet.statement'))+'</div><ul class="alist">'+st.map(function(it){return arowHtml(it)}).join('')+'</ul>';
  openSheet(t('sheet.proof'),cap(M(ym))+' · '+p.label,b,trig);
}
function yearSheet(pid,trig){
  var p=PROP[pid];if(!p||!p.year)return;var y=p.year;
  var rows=(y.rowIds||[]).map(function(id){return ROWS[pid+'|'+id]}).filter(Boolean);
  var lab=yearAllVia(y,p)?t('money.year',{year:y.year}):t('money.year_registered',{year:y.year});
  var b='<div class="ssec">'+esc(t('sheet.rows'))+'</div>'+rows.map(rowBlock).join('')
    +'<div class="stot"><b>'+esc(lab)+'</b><span>'+esc(E(y.paid))+'</span></div>'
    +(y.unknownAmountCount?'<p class="note">'+esc(cap(t('money.unknown_amount',{n:y.unknownAmountCount})))+'</p>':'')
    +'<p class="note">'+esc(t('money.payout_note'))+'</p>';
  openSheet(t('sheet.proof'),lab+' · '+p.label,b,trig);
}
function infoSheet(ref,trig,msg){
  var it=ITEM[ref];if(!it)return;
  var p=PROP[it.propertyId],lines=[];
  if(it.date)lines.push(D(it.date));
  if(it.provenance)lines.push(t('prov.'+it.provenance.event)+' · '+t('by.'+it.provenance.by));
  if(it.state)lines.push(cap(t('state.'+it.state)));
  var where=[];if(p)where.push(p.label);where.push(t('folder.'+it.folder));
  var b=(msg?'<p class="smsg err" role="alert">'+msg+'</p>':'')
    +(it.note?'<p class="smsg">'+esc(t('file.'+it.note))+'</p>':'')
    +'<div style="margin-top:6px">'+lines.map(function(l){return '<div class="pline">'+esc(l)+'</div>'}).join('')
    +'<div class="pline">'+esc(where.join(' › '))+'</div></div>';
  if(it.file){
    b+='<div class="sacts"><button type="button" class="gbtn" data-open="'+esc(ref)+'">'+esc(t('ui.open'))+'</button>'
      +'<button type="button" class="obtn" data-share="'+esc(ref)+'">'+I_SHARE+' <span>'+esc(t('ui.share'))+'</span></button></div>';
  }
  openSheet(t('sheet.provenance'),it.title[LANG]||it.title.it,b,trig);
}

/* ════════════════ UN TOCCO, IL PDF ════════════════
   POST /api/owner/file → biglietto da 60 secondi. Sul telefono si naviga
   (il visore nativo di iOS); sul desktop la finestra si apre DENTRO il
   click, prima di qualunque attesa, o il blocco popup la mangia. */
function fileErrorMsg(code,j){
  if(code==='too_large'){
    var mb=j&&j.size?(LANG==='en'?O.enNum(j.size/1e6,1):O.itNum(j.size/1e6,1)):'';
    return esc(t('file.too_large',{mb:mb}))+'<br><a class="obtn wa" style="margin-top:14px" href="'+esc(wa(''))+'" target="_blank" rel="noopener">'+esc(t('ui.whatsapp'))+'</a>';
  }
  return esc(t('file.error'));
}
function postFile(ref){
  return token().then(function(tok){
    return fetch('/api/owner/file',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify(AS?{ref:ref,as:AS}:{ref:ref})});
  }).then(function(r){return r.json().catch(function(){return null}).then(function(j){return {status:r.status,j:j||{}}})});
}
function openDoc(ref,trig){
  var it=ITEM[ref];
  if(!it||!it.file){infoSheet(ref,trig);return}
  // Un biglietto per volta per documento: il secondo tocco (o il doppio clic
  // sul desktop, che apriva DUE schede) mentre il primo è in volo non fa
  // niente. La chiave è il ref, non il bottone: col bottone smorzato il clic
  // può arrivare alla riga che lo contiene.
  if(BUSY[ref]||(trig&&trig.getAttribute('aria-busy')==='true'))return;
  BUSY[ref]=1;
  var coarse=matchMedia('(pointer: coarse)').matches;
  var w=null;
  if(!coarse){try{w=window.open('','_blank')}catch(e){w=null}}
  if(trig)trig.setAttribute('aria-busy','true');
  var done=function(){delete BUSY[ref];if(trig)trig.removeAttribute('aria-busy')};
  postFile(ref).then(function(x){
    done();
    if(x.status===200&&x.j.ok&&x.j.url){
      var url=new URL(x.j.url,location.origin).href;
      if(w){try{w.location=url;return}catch(e){}}
      location.assign(url);return;
    }
    if(w){try{w.close()}catch(e){}}
    infoSheet(ref,trig,fileErrorMsg(x.j.error,x.j));
  }).catch(function(){
    done();
    if(w){try{w.close()}catch(e){}}
    infoSheet(ref,trig,esc(t('file.error')));
  });
}
/* «Invia al commercialista»: il file arriva col Bearer, poi il foglio di
   condivisione del telefono. Se iOS ha perso il gesto durante l'attesa,
   il secondo tocco condivide il file già pronto (niente seconda lettura). */
function shareDoc(ref,btn){
  var ready=btn._file||FILES[ref];
  if(ready){doShare(ready,btn);return}
  if(btn.getAttribute('aria-busy')==='true')return;
  var lab=btn.querySelector('span');
  btn.setAttribute('aria-busy','true');if(lab)lab.textContent=t('share.preparing');
  token().then(function(tok){
    return fetch('/api/owner/file?ref='+encodeURIComponent(ref)+(AS?'&as='+encodeURIComponent(AS):''),{headers:{Authorization:'Bearer '+tok}});
  }).then(function(r){
    if(!r.ok)return r.json().catch(function(){return {}}).then(function(j){throw {code:j.error,j:j}});
    var cd=r.headers.get('Content-Disposition')||'',m=/filename="([^"]+)"/.exec(cd);
    var name=m?m[1]:'BOOM_documento.pdf',type=(r.headers.get('Content-Type')||'application/pdf').split(';')[0];
    return r.blob().then(function(b){return new File([b],name,{type:type})});
  }).then(function(file){
    btn.removeAttribute('aria-busy');btn._file=file;FILES[ref]=file;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(function(){if(lab)lab.textContent=t('ui.share')}).catch(function(e){
        if(!(e&&e.name==='NotAllowedError')){if(lab)lab.textContent=t('ui.share');return}
        // iOS ha perso il gesto durante l'attesa: il file è pronto, serve un
        // tocco nuovo. Col bottone etichettato lo dice l'etichetta; l'icona
        // della riga non ne ha, quindi si apre il foglio del documento col
        // messaggio e il suo «Invia al commercialista» (già pronto, niente
        // seconda lettura). Prima il primo tocco non diceva niente.
        if(lab)lab.textContent=t('share.tap');
        else infoSheet(ref,btn,esc(t('share.tap')));
      });
    }else{download(file);if(lab)lab.textContent=t('ui.share')}
  }).catch(function(e){
    btn.removeAttribute('aria-busy');if(lab)lab.textContent=t('ui.share');
    infoSheet(ref,SHEET.open?TRIG:btn,fileErrorMsg(e&&e.code,e&&e.j));
  });
}
function doShare(file,btn){
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file]}).catch(function(){});
  else download(file);
}
function download(file){
  var u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},4000);
}

/* ════════════════ I LINK PROFONDI ════════════════
   #oggi · #case · #archivio (le stanze) · #p= casa · #c= contratto ·
   #r=AAAA-MM rendiconto · #doc= documento · #q= ricerca · #f= cartella */
function scrollToEl(el){
  if(!el)return;
  var d=el.closest('details');if(d)d.open=true;
  // Si scorre la FINESTRA, non scrollIntoView: la casa ha overflow nascosto
  // (è un contenitore di scorrimento) e scrollIntoView scorreva anche lei,
  // tagliandone la testa — col margine alto del «vedi come» il contratto
  // atterrava sotto la banda. Il margine è quello del CSS (scroll-margin-top).
  var sm=parseFloat(getComputedStyle(el).scrollMarginTop)||0;
  window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+(window.pageYOffset||0)-sm),behavior:reduced()?'auto':'smooth'});
  var h=el.closest('.house');if(h){h.classList.remove('flash');void h.offsetWidth;h.classList.add('flash')}
}
function applyHash(){
  if(!A)return;
  var h=location.hash.replace(/^#/,'');
  var i=h.indexOf('='),k=i>0?h.slice(0,i):h,v='';
  try{v=decodeURIComponent(i>0?h.slice(i+1):'')}catch(e){v=''}
  if(!h||k==='oggi'){setView('oggi');return}
  if(k==='case'){SEL=null;setView('case',{top:true});syncCase();return}
  if(k==='archivio'){setView('archivio');return}
  if(k==='p'&&PROP[v]){SEL=v;setView('case',{keep:true});syncCase();window.scrollTo(0,0);
    var art=document.querySelector('[data-property-id="'+cssEsc(v)+'"]');if(art){art.classList.remove('flash');void art.offsetWidth;art.classList.add('flash')}return}
  if(k==='c'){
    var ce=document.querySelector('[data-contract-id="'+cssEsc(v)+'"]'),ha=ce&&ce.closest('[data-property-id]');
    if(ce&&ha){SEL=ha.getAttribute('data-property-id');setView('case',{keep:true});syncCase();scrollToEl(ce)}
    return;
  }
  if(k==='r'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(v)){
    var st=statementFor(v)[0];
    if(st)infoSheet(st.ref,null);
    else{var pid=Object.keys(PROP).filter(function(id){return (PROP[id].ribbon.months||[]).some(function(m){return m.ym===v})})[0];if(pid)monthSheet(pid,v,null)}
    return;
  }
  if(k==='doc'&&ITEM[v]){infoSheet(v,null);return}
  if(k==='q'&&$('q')){setView('archivio',{keep:true});$('q').value=v;runSearch();scrollToEl($('archivio'));return}
  if(k==='f'&&FOLDERS.indexOf(v)>=0&&$('afold')){setView('archivio');FOLD=null;setFolder(v)}
}
function cssEsc(s){return window.CSS&&CSS.escape?CSS.escape(s):String(s).replace(/["\\]/g,'\\$&')}
window.addEventListener('hashchange',applyHash);
function go(hash){if(location.hash==='#'+hash)applyHash();else location.hash=hash}

/* ════════════════ I GESTI (delega unica) ════════════════ */
function onClick(e){
  var el;
  if((el=e.target.closest('[data-tab]'))){var k=el.getAttribute('data-tab');
    // toccare la stanza in cui sei riporta in cima (e dalla casa alle case), come su iOS
    if(k===VIEW&&!(k==='case'&&SEL&&A.properties.length>1)){window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});return}
    go(k);return}
  if((el=e.target.closest('[data-goto]'))){e.preventDefault();go(el.getAttribute('data-goto'));return}
  if((el=e.target.closest('[data-jump]'))){scrollToEl($(el.getAttribute('data-jump')));return}
  if((el=e.target.closest('[data-folder]'))){setFolder(el.getAttribute('data-folder'));return}
  if((el=e.target.closest('[data-open]'))){openDoc(el.getAttribute('data-open'),el);return}
  if((el=e.target.closest('[data-share]'))){shareDoc(el.getAttribute('data-share'),el);return}
  if((el=e.target.closest('[data-info]'))){infoSheet(el.getAttribute('data-info'),el);return}
  if((el=e.target.closest('[data-ym]'))){monthSheet(el.getAttribute('data-pid'),el.getAttribute('data-ym'),el);return}
  if((el=e.target.closest('[data-year]'))){yearSheet(el.getAttribute('data-year'),el);return}
  if((el=e.target.closest('[data-ref]'))){var b=e.target.closest('button')||el;openDoc(el.getAttribute('data-ref'),b);return}
  if(e.target.closest('#newchip')){ONLY_NEW=!ONLY_NEW;$('newchip').setAttribute('aria-pressed',ONLY_NEW?'true':'false');if($('q'))$('q').value='';runSearch();return}
}
APP.addEventListener('click',onClick);
$('tabs').addEventListener('click',onClick);
$('sheetBody').addEventListener('click',onClick);
APP.addEventListener('input',function(e){if(e.target.id==='q')runSearch()});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')&&!SHEET.open&&$('q')){
    e.preventDefault();
    if(VIEW!=='archivio'){setView('archivio');try{history.replaceState(null,'','#archivio')}catch(_){}}
    $('q').focus();
  }
});

chrome();

$('logout').addEventListener('click',function(){
  // Il proprietario esce verso la porta del proprietario (/login?next=
  // /proprietario parla italiano e ha «Primo accesso?»); prima finiva sul

  var dest=PROFILE&&PROFILE.role==='admin'?'/portal':'/login?next=%2Fproprietario';
  try{firebase.auth().signOut().then(function(){location.href=dest},function(){location.href=dest})}catch(e){location.href=dest}

if(!O||!window.BoomPortal){showError();return}
BoomPortal.requireAuth(['landlord','admin'],{loginUrl:'/login'}).then(function(res){
  USER=res.user;PROFILE=res.profile||{};
  // Il proprietario vede SEMPRE il suo archivio (?as ignorato anche dal

  if(PROFILE.role!=='admin')AS=null;
