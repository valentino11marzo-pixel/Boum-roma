/* ═══════════════════════════════════════════════════════════════════
   LA TUA CASA BOOM — the tenant's home, digital. Same identity as the
   signing experience: Helvetica Neue 300, #D4AF37, blueprint room,
   hairline discipline. Everything REAL: the actual contract, the actual
   installments (payable by card in one tap), the actual documents.
   Linked from the Wallet passes and every journey email. Served at /casa.
   ═══════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --void:#050506;--panel:rgba(255,255,255,.022);
  --gold:#D4AF37;--gold-light:#F1DFA0;--gold-deep:#8A6D1D;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.05);--line-gold:rgba(212,175,55,.32);
  --gold-muted:rgba(212,175,55,.12);--gold-faint:rgba(212,175,55,.05);
  --t1:#FFF;--t2:rgba(255,255,255,.72);--t3:rgba(255,255,255,.45);--t4:rgba(255,255,255,.25);
  --green:#4ADE9E;--green-muted:rgba(74,222,158,.12);--wa:#25D366;--red:#FF8A70;
  --sans:'Helvetica Neue',Helvetica,'Inter',-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);--safe:env(safe-area-inset-bottom,0px);--r:18px}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--void);color:var(--t1);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(212,175,55,.3)}

/* the room */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .grid{position:absolute;inset:-2px;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:34px 34px;-webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%);mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%)}
.bg .aur{position:absolute;width:120vmax;height:120vmax;border-radius:50%;filter:blur(90px);opacity:.45}
.bg .aur.a{left:-46vmax;top:-72vmax;background:radial-gradient(circle,rgba(212,175,55,.10),transparent 58%)}
.bg .aur.b{right:-58vmax;bottom:-74vmax;background:radial-gradient(circle,rgba(90,110,150,.10),transparent 58%)}
.bg .scan{position:absolute;left:0;right:0;top:-12%;height:26vh;opacity:0;background:linear-gradient(180deg,transparent,rgba(212,175,55,.03) 45%,rgba(212,175,55,.06) 50%,rgba(212,175,55,.03) 55%,transparent)}
.bg .vign{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 34%,transparent 50%,rgba(0,0,0,.62) 100%)}
@media(prefers-reduced-motion:no-preference){
  .bg .aur.a{animation:aurA 46s var(--ease) infinite alternate}
  .bg .aur.b{animation:aurB 58s var(--ease) infinite alternate}
  @keyframes aurA{to{transform:translate(9vmax,7vmax) scale(1.12)}}
  @keyframes aurB{to{transform:translate(-8vmax,-6vmax) scale(1.08)}}
  .bg .scan{animation:scan 26s linear infinite}
  @keyframes scan{0%,78%{top:-28%;opacity:0}80%{opacity:1}95%{opacity:1}100%{top:112%;opacity:0}}
}

header{position:sticky;top:0;z-index:50;background:rgba(5,5,6,.72);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line2)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:13px 20px;max-width:720px;margin:0 auto}
.hl{font-size:9px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t4)}
.brand{display:flex;align-items:center;gap:10px;justify-self:center;color:inherit;text-decoration:none}
.brand .mark{filter:drop-shadow(0 0 10px rgba(212,175,55,.35))}
.brand b{font-weight:300;letter-spacing:6px;font-size:14px}
.hout{justify-self:end;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);transition:.25s}
.hout:hover{color:var(--gold)}

main{position:relative;z-index:5;max-width:680px;margin:0 auto;padding:26px 18px calc(60px + var(--safe))}
.load{text-align:center;padding:110px 20px;color:var(--t3)}
.load .mark{color:var(--gold)}
@media(prefers-reduced-motion:no-preference){.load svg{animation:breath 2.6s var(--ease) infinite}@keyframes breath{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1}}}

.eyebrow{font-size:10px;letter-spacing:3.2px;text-transform:uppercase;color:var(--gold);font-weight:400}
h1.big{font-weight:200;font-size:clamp(27px,6vw,38px);letter-spacing:-.6px;line-height:1.12;margin:10px 0 6px}
h1.big em{font-style:normal;color:var(--gold);font-weight:300}
.subline{color:var(--t3);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:1px solid var(--line-gold);background:var(--gold-faint);border-radius:100px;padding:7px 15px;font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.8)}

.tiles{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:22px 0 4px;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tiles::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--gold),rgba(212,175,55,.25),transparent 80%)}
.tile{padding:17px 16px 14px}
.tile:nth-child(2n){border-left:1px solid var(--line2)}
.tile:nth-child(n+3){border-top:1px solid var(--line2)}
.tile .k{font-size:8.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--t4)}
.tile .v{font-size:clamp(19px,4.6vw,25px);font-weight:200;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.4px;line-height:1.15}
.tile .v small{font-size:11.5px;color:var(--t3);letter-spacing:.3px}
.tile.hero .v{background:linear-gradient(180deg,#FFF3C4,var(--gold-light) 30%,var(--gold) 78%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.card{margin-top:16px;padding:20px;border:1px solid var(--line2);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,252,240,.03),rgba(255,255,255,.015));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.5),rgba(212,175,55,.12),transparent 75%)}
.card h2{display:flex;align-items:baseline;gap:11px;margin-bottom:14px}
.card h2 .no{font-family:var(--mono);font-size:9px;color:var(--gold);border:1px solid var(--line-gold);border-radius:6px;padding:3px 7px;background:var(--gold-faint)}
.card h2 .tt{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--t2);font-weight:300}
.card h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);transform:translateY(-3px)}

/* next payment — the money moment */
.paycard{border:1px solid var(--line-gold);background:linear-gradient(180deg,var(--gold-faint),transparent 70%)}
.paycard .pm{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.paycard .pm .lab{font-size:13px;color:var(--t2)}
.paycard .pm .lab b{display:block;font-size:16px;font-weight:400;color:var(--t1);letter-spacing:.2px;margin-top:2px}
.paycard .amt{font-size:clamp(30px,7vw,40px);font-weight:200;letter-spacing:-.8px;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#FFF3C4,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.due{font-size:11.5px;color:var(--t3);margin-top:2px;text-align:right}
.due.late{color:var(--red)}
.paybtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:16px;background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1a1407;font-weight:500;border-radius:100px;padding:15px;font-size:12px;letter-spacing:2px;text-transform:uppercase;transition:.3s var(--ease);box-shadow:0 10px 30px rgba(212,175,55,.16)}
.paybtn:not(:disabled):hover{filter:brightness(1.06);transform:translateY(-1px)}
.paybtn:disabled{opacity:.5}
.payfoot{font-size:11px;color:var(--t3);text-align:center;margin-top:10px;line-height:1.7}
/* ── Bonifico: la corsia gratuita. Deliberatamente più quieta del bottone
   carta — non è un secondo invito a pagare, è la strada per chi non vuole
   pagare commissioni. Monospaziato sui dati, perché IBAN e causale si
   leggono a cifre, non a parole. */
.bfx{margin-top:18px;padding-top:18px;border-top:1px solid var(--line2)}
.bfh{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--t2)}
.bffree{font-size:9.5px;letter-spacing:1.4px;color:#1a1407;background:var(--gold);border-radius:100px;padding:3px 9px;font-weight:600}
.bfp{font-size:12.5px;color:var(--t3);line-height:1.7;margin:9px 0 14px}
.bfr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.bfk{flex:0 0 34%;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t4)}
.bfv{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  color:var(--t1);word-break:break-all;line-height:1.5}
.bfc{flex:none;border:1px solid var(--line);background:transparent;color:var(--t2);border-radius:100px;
  padding:5px 11px;font-size:10.5px;letter-spacing:.6px;cursor:pointer;transition:.2s var(--ease);font-family:inherit}
.bfc:hover{border-color:var(--gold);color:var(--gold)}
.bfc.ok{border-color:var(--gold);color:var(--gold)}
.bfall{width:100%;margin-top:14px;border:1px solid var(--line);background:transparent;color:var(--t2);
  border-radius:100px;padding:12px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  cursor:pointer;transition:.2s var(--ease);font-family:inherit}
.bfall:hover{border-color:var(--gold);color:var(--gold)}
.bfn{font-size:11px;color:var(--t4);line-height:1.7;margin-top:12px}
@media(max-width:460px){.bfr{flex-wrap:wrap}.bfk{flex:0 0 100%}.bfv{flex:1 1 auto}}
.payfoot .lock{color:var(--green)}
.paidband{border:1px solid rgba(74,222,158,.3);background:var(--green-muted);border-radius:14px;padding:13px 16px;font-size:13px;color:var(--green);text-align:center;margin-top:16px}

/* rows */
.rowlist{display:grid}
.prow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line2);font-size:13.5px}
.prow:first-child{border-top:none}
.prow .mo{flex:1;color:var(--t2)}
.prow .mo small{display:block;font-size:10.5px;color:var(--t4)}
.prow .st{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;border-radius:100px;padding:4px 10px;flex:none}
.prow .st.paid{color:var(--green);border:1px solid rgba(74,222,158,.35)}
.prow .st.pending{color:var(--t3);border:1px solid var(--line)}
.prow .st.late{color:var(--red);border:1px solid rgba(255,138,112,.4)}
.prow .amt2{font-variant-numeric:tabular-nums;font-weight:400;flex:none}
.prow a{color:var(--gold-light);text-decoration:none;font-size:11px;flex:none}
.morebtn{width:100%;text-align:center;color:var(--t3);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;padding:10px 0 2px;transition:.25s}
.morebtn:hover{color:var(--gold)}

/* docs + services */
.dlink{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line2);font-size:13.5px;color:var(--t2);text-decoration:none;transition:.2s}
.dlink:first-of-type{border-top:none}
.dlink:hover{color:var(--gold)}
.dlink .ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-gold);background:var(--gold-faint);display:grid;place-items:center;flex:none;font-size:15px}
.dlink small{display:block;font-size:10.5px;color:var(--t4)}
.dlink .go{margin-left:auto;color:var(--t4)}
.svc{display:grid;gap:10px}
.svcard{display:flex;gap:13px;align-items:center;border:1px solid var(--line2);border-radius:14px;padding:14px 15px;background:var(--panel);text-decoration:none;color:inherit;transition:.25s}
.svcard:hover{border-color:var(--line-gold)}
.svcard .em{font-size:20px;flex:none}
.svcard b{display:block;font-size:14px;font-weight:400;letter-spacing:.2px}
.svcard span span{font-size:11.5px;color:var(--t3);line-height:1.5;display:block;margin-top:2px}
.svcard .pr{margin-left:auto;flex:none;font-size:13px;color:var(--gold);font-weight:400;white-space:nowrap}

/* maintenance */
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.fld select,.fld textarea{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:11px;color:var(--t1);font-family:inherit;font-size:14px;font-weight:300;padding:11px 12px;resize:vertical;transition:border-color .25s}
.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--line-gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.obtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:100px;padding:12px 20px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.02);transition:.25s;color:var(--t1);text-decoration:none;margin-top:6px}
.obtn:hover{border-color:var(--line-gold);color:var(--gold)}
.obtn.wa{border-color:rgba(37,211,102,.4);color:var(--wa)}
.mrow{display:flex;gap:10px;align-items:baseline;padding:10px 2px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--t2)}
.mrow .st{margin-left:auto;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);border:1px solid var(--line);border-radius:100px;padding:3px 9px;flex:none}
.mrow .st.done{color:var(--green);border-color:rgba(74,222,158,.35)}
.ok{display:none;color:var(--green);font-size:12.5px;margin-top:10px}
.err{display:none;color:var(--gold-light);font-size:12.5px;margin-top:10px}

.advisor{display:flex;gap:14px;align-items:center;border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:16px 18px;margin-top:16px}
.advisor .av{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-gold);background:var(--gold-faint);display:grid;place-items:center;color:var(--gold);flex:none}
.advisor b{display:block;font-size:14px;font-weight:400}
.advisor span{font-size:11.5px;color:var(--t3)}
.advisor a{margin-left:auto;flex:none;border:1px solid rgba(37,211,102,.4);color:var(--wa);border-radius:100px;padding:9px 16px;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;text-decoration:none;transition:.25s}
.advisor a:hover{background:rgba(37,211,102,.08)}
.foot{color:var(--t4);font-size:9px;text-align:center;margin-top:30px;letter-spacing:2.2px;text-transform:uppercase}

/* sticky quick-nav: one thumb-reach jump to any section of the home */
.qnav{position:sticky;top:57px;z-index:40;display:flex;gap:7px;overflow-x:auto;padding:12px 0 10px;margin:6px -18px 0;padding-left:18px;padding-right:18px;scrollbar-width:none;background:linear-gradient(180deg,rgba(5,5,6,.92) 70%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.qnav::-webkit-scrollbar{display:none}
.qnav a{flex:none;border:1px solid var(--line);border-radius:100px;padding:8px 14px;font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--t3);text-decoration:none;transition:.25s;background:rgba(255,255,255,.02)}
.qnav a:hover{border-color:var(--line-gold);color:var(--gold)}
.card{scroll-margin-top:118px}
/* the payment ceremony — green appears only around money */
.payov{position:fixed;inset:0;z-index:210;display:none;place-items:center;background:rgba(4,5,4,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);text-align:center}
.payov.on{display:grid}
.payov .amt{font-size:clamp(38px,10vw,54px);font-weight:200;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.payov .cap{font-size:10px;letter-spacing:3.4px;text-transform:uppercase;color:var(--green);margin-top:14px}
.payov .sub{font-size:12px;color:var(--t3);margin-top:8px}
.payov .ring{width:72px;height:72px;border-radius:50%;border:1px solid rgba(74,222,158,.5);margin:0 auto 22px;display:grid;place-items:center;color:var(--green);position:relative}
.payov .ring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(74,222,158,.25)}
@media(prefers-reduced-motion:no-preference){.payov.on .ring{animation:payPulse 1.2s var(--ease) infinite alternate}@keyframes payPulse{from{box-shadow:0 0 0 rgba(74,222,158,0)}to{box-shadow:0 0 34px rgba(74,222,158,.35)}}}
.wifiqr{display:flex;gap:14px;align-items:center;margin:6px 0 4px;padding:12px 2px;border-top:1px solid var(--line2)}
.wifiqr img{width:92px;height:92px;border-radius:12px;border:1px solid var(--line);padding:6px;background:#fff;flex:none}

function countUp(scope){
  try{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    [].slice.call(scope.querySelectorAll('[data-roll]')).forEach(function(el,ix){
      var target=el.getAttribute('data-roll'),mm=target.match(/([\d.,]+)/);if(!mm)return;
      var num=parseFloat(mm[1].replace(/,/g,''));if(!isFinite(num))return;
      var t0=performance.now(),D=850+ix*110;
      (function tick(now){
        var p=Math.min(1,(now-t0)/D),e2=1-Math.pow(1-p,4);
        el.textContent=p<1?target.replace(mm[1],Math.round(num*e2).toLocaleString('en-US')):target;
        if(p<1)requestAnimationFrame(tick);
      })(t0);
    });
  }catch(e){}
}
/* Il QR del Wi-Fi arriva da un CDN. L'<img> nasceva senza src — cioè un
   rettangolo bianco vuoto — e se il CDN è lento, bloccato o giù restava così
   per sempre, senza che nulla lo spiegasse. Ora il contenitore è nascosto
   finché il codice non c'è, e se non arriva sparisce: la password del Wi-Fi
   con il suo bottone di copia resta comunque lì sopra, che è ciò che serve. */
function wifiQr(name,pass){
  var host=document.getElementById('wifiQrImg');if(!host)return;
  var box=host.closest?host.closest('.wifiqr'):null;
  if(box)box.style.display='none';
  var payload='WIFI:T:WPA;S:'+String(name).replace(/([\\;,:"])/g,'\\$1')+';P:'+String(pass).replace(/([\\;,:"])/g,'\\$1')+';;';
  var give=function(){if(box&&box.parentNode)box.parentNode.removeChild(box)};
  var go=function(){
    try{
      window.QRCode.toDataURL(payload,{margin:0,width:368,color:{dark:'#111111',light:'#ffffff'}},function(err,durl){
        if(err||!durl)return give();
        host.src=durl;
        if(box)box.style.display='';
      });
    }catch(e){give()}
  };
  if(window.QRCode&&window.QRCode.toDataURL)return go();
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
  s.onload=go; s.onerror=give;
  /* CDN che non risponde mai (né load né error): dopo 6s si rinuncia. */
  setTimeout(function(){if(!host.src)give()},6000);
  document.head.appendChild(s);
}

          if(pa)pa.textContent=eur(j.total||next.amount);
          if(ps)ps.innerHTML=t('redirect');
          if(po&&!matchMedia('(prefers-reduced-motion: reduce)').matches){po.classList.add('on');setTimeout(function(){location.href=j.checkoutUrl;},1100);}
          else location.href=j.checkoutUrl;
          return;
        }
        throw new Error((j&&j.error)||'failed');
      }).catch(function(){
        pb.disabled=false;pb.textContent=t('payRetry');
      });
    };
  }
  var mb=$('moreBtn');
  if(mb){mb.onclick=function(){$('histRows').innerHTML=hist.map(payRow).join('');mb.style.display='none';};}
  var ms=$('mSend');
  if(ms){
    ms.onclick=function(){
      var desc=($('mDesc').value||'').trim();
      var ok=$('mOk'),err=$('mErr');ok.style.display='none';err.style.display='none';
      if(desc.length<8){err.textContent=t('mShort');err.style.display='inline';return;}
      ms.disabled=true;ms.textContent='…';
      var doc={userId:USER.uid,tenantId:USER.uid,tenantName:(PROFILE&&PROFILE.name)||USER.email||'',
        propertyId:(CONTRACT&&CONTRACT.propertyId)||(PROFILE&&PROFILE.propertyId)||'',
        propertyName:(PROPERTY&&(PROPERTY.name||PROPERTY.address))||'',
        category:$('mCat').value,priority:$('mPri').value,description:desc.slice(0,800),
        status:'pending',createdAt:new Date().toISOString()};
      firebase.firestore().collection('maintenance').add(doc).then(function(){
        ok.style.display='inline';$('mDesc').value='';
        ms.disabled=false;ms.textContent=t('mSend');
        MAINT.unshift(doc);
        $('mList').innerHTML=maintRows();
        try{fetch('/api/agent/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'maintenance.opened',summary:'🔧 '+doc.category+' ('+doc.priority+') — '+(doc.propertyName||doc.tenantName),detail:desc.slice(0,300)})});}catch(e){}
      }).catch(function(){
        ms.disabled=false;ms.textContent=t('mSend');
        err.textContent=t('mFail');err.style.display='inline';
      });
    };
  }
}

function reveal(){
  try{
    var els=[].slice.call(document.querySelectorAll('.rv'));
    els.forEach(function(e,i){e.style.transitionDelay=((i%5)*55)+'ms'});
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return;}
    var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}})},{threshold:.1});
    els.forEach(function(e){io.observe(e)});
    setTimeout(function(){els.forEach(function(e){var r=e.getBoundingClientRect();if(r.top<innerHeight)e.classList.add('in')})},60);
  }catch(e){[].slice.call(document.querySelectorAll('.rv')).forEach(function(e){e.classList.add('in')});}
}

/* ── boot: everything REAL, from the tenant's own documents ── */
BoomPortal.requireAuth(['tenant'],{loginUrl:'/login'}).then(function(res){
  USER=res.user;PROFILE=res.profile||{};
  var db=firebase.firestore();
  $('logout').onclick=function(){firebase.auth().signOut().then(function(){location.href='/login'})};
  $('logout').textContent=t('logout');
  $('langBtn').onclick=function(){setLang(LANG==='en'?'it':'en')};
  syncLangBtn();

  // Ogni lettura ha un watchdog: su Safari desktop una get() può restare
  // sospesa per sempre (IndexedDB/WebChannel) e la Promise.all qui sotto
  // non si risolverebbe mai → loader eterno. Meglio una sezione vuota che
  // una pagina bloccata.
  var T=function(p){return BoomPortal.withTimeout(p,9000)};
  var qContracts=T(db.collection('contracts').where('tenantId','==',USER.uid).limit(10).get())
    .then(function(s){var rows=[];s.forEach(function(d){var v=d.data();v.id=d.id;rows.push(v)});
      rows.sort(function(a,b){return String(b.startDate||'').localeCompare(String(a.startDate||''))});
      CONTRACT=rows.filter(function(c){return c.status==='active'})[0]||rows[0]||null;})
    .catch(function(){});
  var qPays=T(db.collection('payments').where('tenantId','==',USER.uid).limit(120).get())
    .then(function(s){PAYMENTS=[];s.forEach(function(d){var v=d.data();v.id=d.id;PAYMENTS.push(v)});})
    .catch(function(){});
  // Dati per il bonifico, impostati una volta in settings/payout. Se il doc
  // non c'è, il blocco bonifico semplicemente non compare.
  var qPayout=T(db.collection('settings').doc('payout').get())
    .then(function(d){if(d&&d.exists)PAYOUT=d.data()}).catch(function(){});
  var qMaint=T(db.collection('maintenance').where('userId','==',USER.uid).limit(20).get())
    .then(function(s){MAINT=[];s.forEach(function(d){MAINT.push(d.data())});
      MAINT.sort(function(a,b){return String(b.createdAt||'').localeCompare(String(a.createdAt||''))});})
    .catch(function(){});

  Promise.all([qContracts,qPays,qMaint,qPayout]).then(function(){
    var pid=(CONTRACT&&CONTRACT.propertyId)||PROFILE.propertyId||null;
    return pid?T(db.collection('properties').doc(pid).get()).then(function(d){if(d.exists)PROPERTY=d.data();}).catch(function(){}):null;
  }).then(function(){
    $('load').style.display='none';$('app').style.display='';$('foot').style.display='';
    document.title='La tua casa — '+((PROPERTY&&PROPERTY.address)||'BOOM Roma');
    render();
    renderBonifico();
  });
}).catch(function(){/* requireAuth redirects */});
})();
</script>
