name: CI

# Rete di sicurezza pre-deploy: valida la sintassi di tutti gli script del
# sito e fa girare lo smoke test del flusso di autenticazione in un browser
# reale. Vercel deploya comunque a prescindere (advisory): se un check è
# rosso, il commit è già live — ma lo sai subito e fai revert in un minuto.

on:
  push:
    branches: [main]
  pull_request:
  # Avvio manuale: quando GitHub perde l'evento di una push (succede, e senza
  # questo non esiste alcun modo di far girare i test su quel commit — niente
  # run da ri-lanciare, nessuna verifica) la CI si riavvia da Actions → CI →
  # "Run workflow", oppure via API.
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintassi inline JS + js/*.js + sw.js + vercel.json
        run: node scripts/check-pages.mjs
      - name: Sintassi moduli ESM api/
        run: |
          set -e
          for f in $(find api -name '*.js'); do
            cp "$f" /tmp/esmcheck.mjs
            node --check /tmp/esmcheck.mjs || { echo "FAIL $f"; exit 1; }
          done
          echo "api/: OK"
      - name: Test percorsi soldi (checkout + webhook + convert, tutto mockato)
        run: node tests/money/run.mjs
      - name: Test motori puri (fiscal + taxpack + dataops)
        run: |
          node tests/fiscal/test.mjs
          node tests/taxpack/test.mjs
          node tests/dataops/test.mjs

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # firebase-tools (non pinnato) da fine luglio 2026 rifiuta Java < 21
      # per l'emulatore Firestore; il default del runner è più vecchio →
      # il job era rosso su OGNI branch, main compreso, senza alcuna
      # modifica al repo.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installa firebase-tools + deps test
        run: |
          npm install --no-save firebase-tools >/dev/null
          cd tests/rules && npm install >/dev/null
      - name: Test firestore.rules contro emulatore
        run: |
          cd tests/rules
          cp ../../firestore.rules ./firestore.rules
          npx firebase emulators:exec --only firestore --project demo-boom-rules 'node runner.mjs'

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium
      - name: Smoke test flusso auth
        run: node tests/smoke.mjs

  # LA BATTERIA COMPLETA. Fino al 19 agosto 2026 la CI faceva girare 6 suite
  # su 61: money, fiscal, taxpack, dataops, rules, smoke. Tutto il resto —
  # viewings, dispo, geo, scheda, notify, richiamo, miniera, publisher,
  # mobile, desktop, actions, backup… — esisteva, era verde in locale, e
  # NON proteggeva niente: nessun automatismo l'ha mai eseguito su un PR.
  # Una suite che nessuno lancia è documentazione, non una rete.
  #
  # Le suite che hanno bisogno di qualcosa di assente (playwright-core) si
  # auto-dichiarano SKIP e non fanno mai fallire il giro — qui Chromium c'è,
  # quindi girano davvero anche le due suite browser dei layer mobile/desktop.
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dipendenze runtime (sharp, pdf-lib, jspdf, nodemailer…)
        run: npm ci --omit=optional || npm install
      - name: Playwright + Chromium (per le suite browser)
        run: |
          npm install --no-save playwright-core playwright >/dev/null
          npx playwright install --with-deps chromium
      - name: npm test — tutte le suite
        run: npm test

  # Le rules di sicurezza si applicano solo quando qualcuno le DEPLOYA:
  # nell'agosto 2026 il repo era avanti di settimane rispetto a Firebase e il
  # lucchetto immobile (propertyLocks) falliva in produzione da giorni, in
  # silenzio (audit 2026-08). Questo job chiude la classe di guasto: ogni
  # push su main che tocca le rules le pubblica. Richiede il secret
  # FIREBASE_TOKEN (una volta: `npx firebase-tools login:ci` → Settings →
  # Secrets → FIREBASE_TOKEN); finché il secret non c'è, il job si dichiara
  # e salta con un avviso, senza mai rompere la CI.
  deploy-rules:
    # Anche su avvio manuale (Actions → CI → Run workflow su main): serve la
    # PRIMA volta che una credenziale viene impostata — senza, per far
    # partire il deploy bisognerebbe inventare un commit vuoto su main.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy firestore.rules + storage.rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # `set -o pipefail` NON e' un dettaglio di stile: lo stato d'uscita
          # di una pipeline e' quello dell'ULTIMO comando, cioe' `tee`, che
          # riesce sempre. Senza, `if ! deploy | tee` non puo' fallire MAI —
          # il 31/08 il deploy falliva per token scaduto e il job usciva
          # VERDE: il guardiano che tace e' peggio dell'assenza di guardiano.
          # Trovato il 01/09 misurando la produzione, non i log.
          set -o pipefail
          # LA CREDENZIALE, in ordine di solidita'. I token di `login:ci`
          # sono refresh token OAuth che Google revoca da solo — TRE morti in
          # due settimane (20/08, 31/08, 05/09), ogni volta con le regole del
          # repo ferme fuori dalla produzione. La service account NON scade:
          # Firebase console → ⚙ Impostazioni progetto → Account di servizio
          # → "Genera nuova chiave privata" → contenuto del JSON nel secret
          # FIREBASE_SERVICE_ACCOUNT. Il token resta come ripiego finche' la
          # chiave non c'e'.
          AUTH=()
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            umask 077
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            CRED_KIND=sa
          elif [ -n "$FIREBASE_TOKEN" ]; then
            AUTH=(--token "$FIREBASE_TOKEN")
            CRED_KIND=token
            echo "::warning::Deploy col token login:ci (deprecato, scade da solo) — imposta il secret FIREBASE_SERVICE_ACCOUNT per chiudere la classe."
          else
            echo "::warning::Nessuna credenziale (ne' FIREBASE_SERVICE_ACCOUNT ne' FIREBASE_TOKEN) — rules NON deployate. Genera la chiave della service account dalla console Firebase e salvala nel secret FIREBASE_SERVICE_ACCOUNT."
            exit 0
          fi
          npm install --no-save firebase-tools >/dev/null
          if ! npx firebase-tools deploy --only firestore:rules,storage \
                 --project boom-property-dashboards "${AUTH[@]}" \
                 --non-interactive 2>&1 | tee /tmp/fb.log; then
            if grep -qi "credentials are no longer valid\|Authentication Error\|invalid_grant\|PERMISSION_DENIED" /tmp/fb.log; then
              if [ "$CRED_KIND" = sa ]; then
                echo "::error::La SERVICE ACCOUNT e' stata rifiutata — le regole NON sono in produzione. Controlla che il secret FIREBASE_SERVICE_ACCOUNT contenga il JSON intero della chiave e che l'account porti un ruolo sufficiente (quello di 'Account di servizio' della console Firebase basta; in IAM: Firebase Admin o Editor)."
              else
                echo "::error::FIREBASE_TOKEN SCADUTO — le regole NON sono in produzione. Fix duraturo: secret FIREBASE_SERVICE_ACCOUNT (chiave JSON dalla console Firebase). Tampone: rigenera con 'npx firebase-tools login:ci' e aggiorna FIREBASE_TOKEN."
              fi
            else
              echo "::error::Deploy delle regole fallito — vedi il log sopra. Le regole del repo NON sono in produzione."
            fi
            exit 1
          fi
          # Cintura e bretelle: il successo si dimostra, non si presume.
          # Se il log non porta la riga di conferma del CLI, il job fallisce
          # anche con exit status 0.
          if ! grep -q "Deploy complete" /tmp/fb.log; then
            echo "::error::Il CLI e' uscito 0 ma il log NON dice 'Deploy complete' — le regole potrebbero NON essere in produzione. Vedi il log sopra."
            exit 1
          fi
