<script>
// ── Firebase finto: solo la superficie che il modulo attraversa. ──
(function () {
  var noop = function () { return Promise.resolve(); };
  function coll() {
    return {
      doc: function () {
        return {
          get: function () { return Promise.resolve({ exists: false, data: function () { return {}; } }); },
          set: noop, update: noop,
        };
      },
      add: function () { return Promise.resolve({ id: 'fake' }); },
      get: function () { return Promise.resolve({ docs: [] }); },
      limit: function () { return coll(); },
      where: function () { return coll(); },
      orderBy: function () { return coll(); },
      onSnapshot: function () { return function () {}; },
    };
  }
  window.firebase = {
    apps: [], initializeApp: function () {}, auth: function () { return { currentUser: null, onAuthStateChanged: function () {} }; },
    firestore: Object.assign(function () { return { collection: coll, enablePersistence: noop }; },
      { FieldValue: { serverTimestamp: function () { return '<ts>'; } } }),
    storage: function () { return { ref: function () { return { put: noop }; } }; },
  };
  window.db = { collection: coll };
  window.storage = window.firebase.storage();
  window.auth = window.firebase.auth();
})();
</script>
